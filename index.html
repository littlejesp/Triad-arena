     particles) as a modest, readable count rather than a literal hundreds
     of DOM nodes -- 2 small shard sparkles per enemy, riding an invisible
     rotated "rail" positioned+angled with the exact same trig as Seraphine's
     Silver Judgment beams (angleAndLength via aspect-ratio-normalized
     atan2). The rail itself stays opacity:0 (no visible beam line) so this
     doesn't just read as a blue reskin of her Ultimate -- only the two
     small diamond-shaped sparkles per rail are visible, deliberately
     staggered so they don't travel in lockstep.
   - "ett par större kristallfragment som kortvarigt slår ner i spelplanen
     runt korten" (a few larger fragments briefly striking the board around
     the cards) reuses Infernal Pact's fixed-nth-child pixel-offset
     particle technique (8 static offsets from center, cast-phase only)
     rather than the enemyIndices-positioned technique, since this beat is
     explicitly "around the cards" in general, not aimed at any specific
     enemy. */
.diamond-storm-fx{
  position:absolute; z-index:8; pointer-events:none;
  top:26.7%; left:17%; right:17%; aspect-ratio:5/7;
}
.diamond-storm-rail{
  position:absolute; height:0; transform-origin:0 50%; pointer-events:none;
  opacity:0;
}
.diamond-storm-shard{
  position:absolute; top:-3px; left:0%; width:6px; height:6px;
  background:linear-gradient(135deg, #ffffff, #7ec8f2);
  transform:rotate(45deg) scale(0.3);
  box-shadow:0 0 8px 2px rgba(126,200,242,0.85);
  opacity:0;
}
/* Travels via `left` (0% -> 100% OF THE RAIL, which has its own explicit
   inline width in %), not a transform:translate -- a percentage transform
   is relative to the SHARD's own tiny box, not its parent, so it couldn't
   span an arbitrary rail length; `left` is relative to the containing
   block (the rail) and needs no per-element custom property, same
   technique as silver-judgment-sparkle above. */
.diamond-storm-fx.phase-impact .diamond-storm-shard{ animation: diamondStormShardFly 0.4s ease-out both; }
@keyframes diamondStormShardFly{
  0%{ opacity:0; left:0%; transform:rotate(45deg) scale(0.3); }
  15%{ opacity:1; }
  100%{ opacity:0; left:100%; transform:rotate(45deg) scale(1); }
}
/* Lands right as its rail's shards arrive -- clear per-enemy crystal
   impact, same variable-count/inline-position technique as the other
   AOE cards' *-hit elements, icy palette here. */
.diamond-storm-hit{
  position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(126,200,242,0.7) 50%, transparent 78%);
  opacity:0;
}
.diamond-storm-fx.phase-impact .diamond-storm-hit{ animation: diamondStormHit 0.5s ease-out both; }
@keyframes diamondStormHit{
  0%{ opacity:0; transform:scale(0.3); }
  35%{ opacity:1; transform:scale(1.5); }
  100%{ opacity:0; transform:scale(2); }
}
.diamond-storm-fragment{
  position:absolute; left:var(--ds-x,50%); top:var(--ds-y,50%);
  width:5px; height:5px; background:#eaf6ff;
  transform:rotate(45deg); box-shadow:0 0 8px 2px rgba(126,200,242,0.8);
  opacity:0;
}
.diamond-storm-fx.phase-cast .diamond-storm-fragment{ animation: diamondStormFragmentStrike 0.8s ease-in both; }
@keyframes diamondStormFragmentStrike{
  0%{ opacity:0; transform:translate(var(--px),var(--py)) rotate(45deg) scale(1.6); }
  30%{ opacity:1; }
  100%{ opacity:0; transform:translate(0,0) rotate(45deg) scale(0.3); }
}
.diamond-storm-fragment-0{ --px:-75px; --py:-25px; animation-delay:0s;   }
.diamond-storm-fragment-1{ --px:65px;  --py:-40px; animation-delay:.05s; }
.diamond-storm-fragment-2{ --px:85px;  --py:25px;  animation-delay:.1s;  }
.diamond-storm-fragment-3{ --px:35px;  --py:65px;  animation-delay:.15s; }
.diamond-storm-fragment-4{ --px:-55px; --py:60px;  animation-delay:.03s; }
.diamond-storm-fragment-5{ --px:-85px; --py:5px;   animation-delay:.08s; }
.diamond-storm-fragment-6{ --px:5px;   --py:-75px; animation-delay:.13s; }
.diamond-storm-fragment-7{ --px:15px;  --py:75px;  animation-delay:.18s; }
/* "En stor, vacker kristall-flash/våg när allt slår in" -- same expanding-
   ring technique as void-crack/hellfire-blast/silver-judgment-wave, icy
   white/blue here, delayed until after the shards/hits have landed. */
.diamond-storm-wave{
  position:absolute; left:var(--ds-x,50%); top:var(--ds-y,50%);
  width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.95);
  box-shadow:0 0 30px 10px rgba(126,200,242,0.6), inset 0 0 18px rgba(255,255,255,0.7);
  opacity:0;
}
.diamond-storm-fx.phase-impact .diamond-storm-wave{ animation: diamondStormWaveExpand 0.6s cubic-bezier(.15,.8,.3,1) 0.5s both; }
@keyframes diamondStormWaveExpand{
  0%{ opacity:0.9; transform:scale(0.4); }
  60%{ opacity:0.45; transform:scale(9); }
  100%{ opacity:0; transform:scale(13); }
}
/* "Kvarvarande glittrande kristallpartiklar" -- a handful of small
   twinkling glints that fade in late and linger through the tail end of
   the impact/cleanup window (up to ULTIMATE_CLEANUP_MS after impact
   starts), rather than landing/traveling like the shards/fragments above
   -- a slow simple opacity/scale twinkle, not a burst. */
.diamond-storm-glitter{
  position:absolute; left:var(--ds-x,50%); top:var(--ds-y,50%);
  width:4px; height:4px; border-radius:50%;
  background:#ffffff; box-shadow:0 0 6px 2px rgba(200,235,255,0.9);
  opacity:0;
}
.diamond-storm-fx.phase-impact .diamond-storm-glitter{ animation: diamondStormGlitterTwinkle 0.9s ease-in-out both; }
@keyframes diamondStormGlitterTwinkle{
  0%{ opacity:0; transform:translate(var(--gx),var(--gy)) scale(0.4); }
  40%{ opacity:0.9; transform:translate(var(--gx),var(--gy)) scale(1.1); }
  100%{ opacity:0; transform:translate(var(--gx),var(--gy)) scale(0.6); }
}
.diamond-storm-glitter-0{ --gx:-60px; --gy:-50px; animation-delay:.55s; }
.diamond-storm-glitter-1{ --gx:70px;  --gy:-30px; animation-delay:.65s; }
.diamond-storm-glitter-2{ --gx:50px;  --gy:55px;  animation-delay:.7s;  }
.diamond-storm-glitter-3{ --gx:-45px; --gy:60px;  animation-delay:.6s;  }
.diamond-storm-glitter-4{ --gx:0px;   --gy:-70px; animation-delay:.75s; }
.diamond-storm-glitter-5{ --gx:-10px; --gy:70px;  animation-delay:.5s;  }
/* "Kort screen shake vid den stora impacten, men mindre aggressiv än
   Omega Weapons" -- reuses the exact same chain-shake amplitude as every
   other card (never softened, see the note on Silver Judgment's flash
   above), so the gentler feel comes entirely from this flash being a
   single soft icy wash (closer to Silver Judgment's soft flash than
   Omega Protocol's punchy white/orange double-tone one) plus no
   pre-impact rumble. */
.diamond-storm-flash{
  position:absolute; inset:0; z-index:9; pointer-events:none; border-radius:inherit;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0.55) 0%, rgba(126,200,242,0.2) 45%, rgba(126,200,242,0) 72%);
  opacity:0;
}
.diamond-storm-flash.phase-impact{ animation: diamondStormFlash 0.5s ease-out 0.45s both; }
@keyframes diamondStormFlash{
  0%{ opacity:0; }
  30%{ opacity:1; }
  100%{ opacity:0; }
}

/* Bahamut's Megaflare — a seventh one-off identity VFX (see the user's
   Megaflare VFX request), blue/white/gold astral light. Same
   .board-matching wrapper as the others, but the brief's "en enorm
   energistråle som skjuts över hela brädet, strålen sveper igenom
   fiendekorten" (a huge beam shot across the whole board, the beam
   SWEEPING through enemy cards) describes something none of the earlier
   directional beams do: it isn't aimed at any one target (Silver
   Judgment/this-card-doesn't-have-one) or one fixed origin point (Omega
   Protocol's single blast) -- it needs to visually cover the ENTIRE
   board width regardless of how many enemies there are or where they
   sit. Solved with a full-width bar whose `transform-origin` is pinned to
   Bahamut's own column (`${originX}% 50%`) and which scales out from
   scaleX(0) to scaleX(1) -- since the bar's un-scaled box already spans
   100% of the wrapper, growing from that pinned origin point reads as
   the sweep visibly emanating from him and washing outward in both
   directions until it covers every column, no per-enemy angle math
   needed for the beam itself (unlike Silver Judgment/Diamond Storm's
   rails, which each need their own angle). */
.megaflare-fx{
  position:absolute; z-index:8; pointer-events:none;
  top:26.7%; left:17%; right:17%; aspect-ratio:5/7;
}
/* "Energi koncentreras kraftigt framför Bahamut när han laddar" -- a
   bright core swelling at his own cell during the CAST phase, before the
   sweep fires at impact. */
.megaflare-charge{
  position:absolute; left:var(--mf-x,50%); top:var(--mf-y,50%);
  width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(130,180,255,0.75) 55%, transparent 78%);
  opacity:0;
}
.megaflare-fx.phase-cast .megaflare-charge{ animation: megaflareChargeSwell 0.9s ease-in both; }
@keyframes megaflareChargeSwell{
  0%{ opacity:0; transform:scale(0.3); }
  100%{ opacity:1; transform:scale(2.4); }
}
.megaflare-sweep{
  position:absolute; left:0; top:6%; width:100%; height:88%;
  background:linear-gradient(90deg,
    transparent, rgba(255,255,255,0.85) 42%, rgba(130,180,255,0.95) 50%,
    rgba(240,225,180,0.85) 58%, transparent);
  box-shadow:0 0 40px 14px rgba(130,180,255,0.55);
  transform:scaleX(0);
  opacity:0;
}
.megaflare-fx.phase-impact .megaflare-sweep{ animation: megaflareSweepExpand 0.55s cubic-bezier(.1,.85,.25,1) both; }
@keyframes megaflareSweepExpand{
  0%{ opacity:0; transform:scaleX(0); }
  20%{ opacity:1; }
  65%{ opacity:0.85; transform:scaleX(1); }
  100%{ opacity:0; transform:scaleX(1); }
}
/* One impact per enemy actually present at cast time, same variable-
   count/inline-position technique as every other AOE card's *-hit
   elements -- delayed roughly by how far each enemy sits from Bahamut's
   column, so they read as being caught in sequence as the sweep passes
   through them rather than all flashing at once (computed in
   renderBattle(), see megaflareHits). */
.megaflare-hit{
  position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(130,180,255,0.8) 45%, rgba(240,225,180,0.5) 70%, transparent 82%);
  opacity:0;
}
.megaflare-fx.phase-impact .megaflare-hit{ animation: megaflareHit 0.55s ease-out both; }
@keyframes megaflareHit{
  0%{ opacity:0; transform:scale(0.3); }
  30%{ opacity:1; transform:scale(1.7); }
  100%{ opacity:0; transform:scale(2.3); }
}
/* "En stor kosmisk explosion/ljusvåg" once the sweep has passed --
   centered on the WHOLE board (50%/50%), not Bahamut's own cell like
   every other card's wave/blast, since this is meant to read as the
   entire battlefield erupting rather than an effect radiating from one
   corner of it. */
.megaflare-wave{
  position:absolute; left:50%; top:50%;
  width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.95);
  box-shadow:0 0 40px 14px rgba(130,180,255,0.7), inset 0 0 24px rgba(255,240,210,0.7);
  opacity:0;
}
.megaflare-fx.phase-impact .megaflare-wave{ animation: megaflareWaveExpand 0.7s cubic-bezier(.15,.8,.3,1) 0.5s both; }
@keyframes megaflareWaveExpand{
  0%{ opacity:1; transform:scale(0.3); border-color:rgba(255,255,255,0.98); }
  50%{ opacity:0.6; transform:scale(12); border-color:rgba(130,180,255,0.75); }
  100%{ opacity:0; transform:scale(16); border-color:rgba(240,225,180,0); }
}
/* "Subtila stjärnpartiklar och astral energi som tonar ut efteråt" --
   same lingering-twinkle technique as Diamond Storm's glitter, gold/
   white here, fading in late and lasting through the impact/cleanup
   tail. */
.megaflare-star{
  position:absolute; left:50%; top:50%;
  width:4px; height:4px; border-radius:50%;
  background:#fff8e6; box-shadow:0 0 7px 2px rgba(240,225,180,0.9);
  opacity:0;
}
.megaflare-fx.phase-impact .megaflare-star{ animation: megaflareStarFade 1s ease-in-out both; }
@keyframes megaflareStarFade{
  0%{ opacity:0; transform:translate(var(--mx),var(--my)) scale(0.4); }
  40%{ opacity:0.85; transform:translate(var(--mx),var(--my)) scale(1.1); }
  100%{ opacity:0; transform:translate(var(--mx),var(--my)) scale(0.5); }
}
.megaflare-star-0{ --mx:-90px; --my:-60px; animation-delay:.6s; }
.megaflare-star-1{ --mx:100px; --my:-40px; animation-delay:.7s; }
.megaflare-star-2{ --mx:70px;  --my:65px;  animation-delay:.75s; }
.megaflare-star-3{ --mx:-70px; --my:70px;  animation-delay:.65s; }
.megaflare-star-4{ --mx:0px;   --my:-90px; animation-delay:.8s; }
.megaflare-star-5{ --mx:-10px; --my:90px;  animation-delay:.55s; }
/* "Kort men KRAFTFULL screen shake vid den slutliga impacten" -- reuses
   the exact same chain-shake amplitude as every other card (never
   softened), paired with the brightest/punchiest full-frame flash in the
   roster so far (higher peak opacity than Omega Protocol's), matching
   "gudomlig, majestätisk och enorm" -- this is meant to feel like the
   biggest Ultimate yet, not a gentle one like Silver Judgment/Diamond
   Storm. */
.megaflare-flash{
  position:absolute; inset:0; z-index:9; pointer-events:none; border-radius:inherit;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0.9) 0%, rgba(130,180,255,0.35) 45%, rgba(240,225,180,0) 74%);
  opacity:0;
}
.megaflare-flash.phase-impact{ animation: megaflareFlash 0.45s ease-out 0.45s both; }
@keyframes megaflareFlash{
  0%{ opacity:0; }
  35%{ opacity:1; }
  100%{ opacity:0; }
}

/* ---------- Fas 8 (design review #2, VFX expansion): shared Ultimate
   identity VFX primitives ----------
   The 7 cards above each hand-built their own ring/hit/particle/flash --
   real, working, ~80% identical code each time (flagged by the design
   review as a "consolidate on next touch" candidate). Rather than risk
   re-touching 7 already-shipped, already-tuned effects for a purely
   internal cleanup with zero player-visible upside, these primitives are
   a clean NEW shared toolkit that every card added FROM HERE ON draws
   from -- color/size/delay are CSS custom properties instead of
   hardcoded per-selector rgba() values, so a new card's VFX is "pick a
   wrapper class + set --vfx-* properties + choose which pieces", not
   "re-derive four keyframe blocks". Each new card still gets its own
   `.cardname-fx` wrapper div (for its own bespoke pieces, if any) but
   ALSO the shared `.ultimate-vfx` marker class, which is what these
   selectors key off -- so one rule here covers every card that opts in,
   present and future.
   Same .board-matching wrapper positioning as every existing *-fx above. */
.ultimate-vfx{
  position:absolute; z-index:8; pointer-events:none;
  top:26.7%; left:17%; right:17%; aspect-ratio:5/7;
}
/* A generic expanding ring/wave/blast -- the single most-repeated shape
   across all 7 existing cards (void-crack/hellfire-blast/infernal-pact-
   wave/silver-judgment-wave/omega-protocol-blast/diamond-storm-wave/
   megaflare-wave were all this exact shape, just recolored). Color flows
   through --vfx-ring-color/--vfx-glow-color/--vfx-ring-soft (each with a
   neutral white/grey fallback so a card that forgets to set one still
   renders something reasonable rather than invisible). */
.vfx-ring{
  position:absolute; left:var(--vfx-x,50%); top:var(--vfx-y,50%);
  width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
  border:2px solid var(--vfx-ring-color, rgba(255,255,255,0.95));
  box-shadow:0 0 28px 9px var(--vfx-glow-color, rgba(160,160,160,0.6)), inset 0 0 18px var(--vfx-ring-soft, rgba(255,255,255,0.6));
  opacity:0;
}
.ultimate-vfx.phase-impact .vfx-ring{ animation: vfxRingExpand 0.65s cubic-bezier(.15,.8,.3,1) var(--vfx-ring-delay,0s) both; }
@keyframes vfxRingExpand{
  0%{ opacity:0.9; transform:scale(0.4); }
  55%{ opacity:0.5; transform:scale(10); }
  100%{ opacity:0; transform:scale(14); }
}
/* A per-target impact flash -- reused as hellfire-target-hit/infernal-
   pact-hit/silver-judgment-hit/omega-protocol-hit/diamond-storm-hit/
   megaflare-hit all were. Positioned via inline left/top per cell
   (variable count, 0-8 enemies), same as those. */
.vfx-hit{
  position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%;
  background:radial-gradient(circle, var(--vfx-hit-color, rgba(255,255,255,0.95)) 0%, var(--vfx-hit-color-mid, rgba(190,190,190,0.65)) 50%, transparent 78%);
  opacity:0;
}
.ultimate-vfx.phase-impact .vfx-hit{ animation: vfxHitPop 0.55s ease-out both; }
@keyframes vfxHitPop{
  0%{ opacity:0; transform:scale(0.3); }
  35%{ opacity:1; transform:scale(1.6); }
  100%{ opacity:0; transform:scale(2.2); }
}
/* A full-frame color wash, same soft-pulse shape as silver-judgment-
   flash/omega-protocol-flash/diamond-storm-flash/megaflare-flash --
   sibling of .board (not .ultimate-vfx), needs to wash the WHOLE
   arena-frame like those did. */
.vfx-flash{
  position:absolute; inset:0; z-index:9; pointer-events:none; border-radius:inherit;
  background:radial-gradient(circle at 50% 45%, var(--vfx-flash-color, rgba(255,255,255,0.6)) 0%, transparent 70%);
  opacity:0;
}
.vfx-flash.phase-impact{ animation: vfxFlashPulse 0.45s ease-out var(--vfx-flash-delay,0.3s) both; }
@keyframes vfxFlashPulse{
  0%{ opacity:0; }
  30%{ opacity:1; }
  100%{ opacity:0; }
}
/* 8 fixed-offset particles pulled INTO the origin during cast (windup) --
   the same shape/8 offsets infernal-pact-particle and diamond-storm-
   fragment each already independently hardcoded. Color via --vfx-
   particle-color/--vfx-glow-color. */
.vfx-particle{
  position:absolute; left:var(--vfx-x,50%); top:var(--vfx-y,50%);
  width:4px; height:4px; border-radius:50%;
  background:var(--vfx-particle-color, #ffffff); box-shadow:0 0 8px 2px var(--vfx-glow-color, rgba(255,255,255,0.8));
  opacity:0;
}
.ultimate-vfx.phase-cast .vfx-particle{ animation: vfxParticlePull 0.85s ease-in both; }
@keyframes vfxParticlePull{
  0%{ opacity:0; transform:translate(var(--px),var(--py)) scale(1); }
  22%{ opacity:0.9; }
  100%{ opacity:0; transform:translate(0,0) scale(0.2); }
}
.vfx-particle-0{ --px:-70px; --py:-30px; animation-delay:0s;   }
.vfx-particle-1{ --px:60px;  --py:-45px; animation-delay:.04s; }
.vfx-particle-2{ --px:80px;  --py:20px;  animation-delay:.08s; }
.vfx-particle-3{ --px:40px;  --py:60px;  animation-delay:.12s; }
.vfx-particle-4{ --px:-50px; --py:55px;  animation-delay:.02s; }
.vfx-particle-5{ --px:-80px; --py:10px;  animation-delay:.06s; }
.vfx-particle-6{ --px:0px;   --py:-70px; animation-delay:.10s; }
.vfx-particle-7{ --px:10px;  --py:70px;  animation-delay:.14s; }
/* A handful of lingering twinkles that fade in late and last through the
   impact/cleanup tail -- same shape diamond-storm-glitter/megaflare-star
   each already independently hardcoded (6 fixed offsets). Positioned
   from --vfx-x/--vfx-y like .vfx-particle, since twinkles radiate from
   the same origin point as everything else for a given card. */
.vfx-twinkle{
  position:absolute; left:var(--vfx-x,50%); top:var(--vfx-y,50%);
  width:4px; height:4px; border-radius:50%;
  background:var(--vfx-twinkle-color, #ffffff); box-shadow:0 0 6px 2px var(--vfx-glow-color, rgba(255,255,255,0.8));
  opacity:0;
}
.ultimate-vfx.phase-impact .vfx-twinkle{ animation: vfxTwinkleFade 0.9s ease-in-out both; }
@keyframes vfxTwinkleFade{
  0%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0.4); }
  40%{ opacity:0.85; transform:translate(var(--tx),var(--ty)) scale(1.1); }
  100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0.5); }
}
.vfx-twinkle-0{ --tx:-60px; --ty:-50px; animation-delay:.4s;  }
.vfx-twinkle-1{ --tx:70px;  --ty:-30px; animation-delay:.5s;  }
.vfx-twinkle-2{ --tx:50px;  --ty:55px;  animation-delay:.55s; }
.vfx-twinkle-3{ --tx:-45px; --ty:60px;  animation-delay:.45s; }
.vfx-twinkle-4{ --tx:0px;   --ty:-70px; animation-delay:.6s;  }
.vfx-twinkle-5{ --tx:-10px; --ty:70px;  animation-delay:.35s; }

/* Odin's normal-attack Slash VFX (see the user's brief) — NOT an Ultimate
   effect like every *-fx block above (no state.ultimateBanner, no cast/
   impact phase split): it rides state.odinSlashes instead, a plain array
   of { sourceIndex, targetIndex, delay } pairs populated in
   battleNeighbors/placeCard for every ordinary attack Odin makes, win or
   lose, same scope as the generic .slash-fx every card already gets.
   White-blue lightning trail (reusing Silver Judgment's angle/length
   rail technique) + a brief golden impact + a few scattering sparks.
   Deliberately timed to finish within ~0.48s, not the requested "0.6-1
   second" -- placeCard's own 500ms justPlaced re-render would otherwise
   restart this mid-flight (every *-fx element restarts on re-render, see
   the .stage-ambient/.arena-ambient notes elsewhere in this file), which
   would look like the slash visibly replaying/stuttering instead of
   playing once. Compressing it to land safely under that render keeps
   the "extremely fast, brief" feel the brief actually asked for; see
   PROJECT.md for the tradeoff written out in full. Reuses the shared
   chainShake mechanism for "brief moderate screen shake" (see placeCard),
   same never-forked amplitude as every other card's shake. */
.odin-slash-fx{
  position:absolute; z-index:8; pointer-events:none;
  top:26.7%; left:17%; right:17%; aspect-ratio:5/7;
}
.odin-slash-rail{
  position:absolute; height:0; transform-origin:0 50%; pointer-events:none;
}
.odin-slash-trail{
  position:absolute; left:0; top:-1px; width:100%; height:2px;
  background:linear-gradient(90deg, rgba(191,230,255,0.1), rgba(191,230,255,0.98) 55%, rgba(255,255,255,1));
  box-shadow:0 0 10px 3px rgba(80,170,255,0.85);
  transform-origin:0 50%; transform:scaleX(0); opacity:0;
}

@keyframes resultFade{ 0%{ opacity:0; } 78%{ opacity:0; } 100%{ opacity:1; } }
@keyframes coinFadeOut{ to{ opacity:0; transform:scale(0.94); } }
.cell{
  position:relative; aspect-ratio:5/7; border-radius:9px; overflow:hidden;
  background:
    radial-gradient(circle at 50% 26%, rgba(255,255,255,0.05), transparent 55%),
    linear-gradient(160deg, #2c2722, #16130f 72%);
  border:1px solid rgba(0,0,0,0.55);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.06),
    inset 0 -4px 8px rgba(0,0,0,0.6),
    inset 0 0 0 1px rgba(201,162,39,0.07);
  display:flex; align-items:center; justify-content:center;
  transition:box-shadow .2s ease, border-color .2s ease;
}
/* Game-feel phase 1: a soft acknowledgment that the board responds to the
   cursor even outside an actual valid-target moment. Excludes .targetable
   so it never competes with that stronger, meaningful gold pulse -- this is
   just ambient liveliness, not a signal. Pure CSS (no JS/state), so it costs
   nothing and can't affect click handling either way. */
.cell:hover:not(.targetable){
  border-color:rgba(201,162,39,0.28);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.6),
    0 0 0 1px rgba(201,162,39,0.22),
    0 0 10px rgba(201,162,39,0.18);
}
.cell::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(94,200,242,0.14), transparent 65%);
  opacity:0.3; animation:cellPulse 3.8s ease-in-out infinite;
}
@keyframes cellPulse{ 0%,100%{ opacity:0.18; } 50%{ opacity:0.42; } }
.cell.targetable{
  cursor:pointer; border-color:rgba(201,162,39,0.6);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(201,162,39,0.55),
    0 0 8px rgba(201,162,39,0.45);
}
.cell.targetable::before{
  background:radial-gradient(circle at 50% 50%, rgba(240,216,121,0.4), transparent 65%);
  animation:cellPulseGold 1.2s ease-in-out infinite;
}
@keyframes cellPulseGold{ 0%,100%{ opacity:0.45; transform:scale(1);} 50%{ opacity:0.9; transform:scale(1.07);} }
/* Live capture preview (see computeCapturePreview) -- an empty targetable
   cell that would actually flip at least one enemy card gets a distinct
   green-gold treatment layered on top of .targetable's own gold pulse,
   plus a small badge (below) showing exactly how many. Border-color is a
   static value change (cheap), and the ::after pulse only animates
   opacity/transform -- same compositor-only pattern as the other
   already-fixed ambient effects in this file, deliberately not another
   animated-box-shadow/filter instance. */
.cell.targetable.would-capture{
  border-color:rgba(143,209,90,0.75);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(143,209,90,0.7),
    0 0 10px rgba(143,209,90,0.5);
}
.cell.targetable.would-capture::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:1;
  background:radial-gradient(circle at 50% 50%, rgba(143,209,90,0.35), transparent 65%);
  animation:cellPulseGold 1.2s ease-in-out infinite;
}
.capture-badge{
  position:absolute; top:5px; right:5px; z-index:5; pointer-events:none;
  display:flex; align-items:center; gap:2px;
  padding:2px 7px; border-radius:999px;
  background:rgba(10,20,6,0.85); border:1px solid rgba(143,209,90,0.75);
  color:#c8f2a0; font-family:'Cinzel',serif; font-weight:700; font-size:11px;
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}
/* An enemy card that at least ONE currently-empty cell would capture right
   now, using the currently-selected hand card -- a static ring (no
   animation at all, cheapest possible option) so the player can spot every
   vulnerable card on the board at a glance without hunting cell by cell. */
.cell.preview-vulnerable{
  box-shadow:0 0 0 2px rgba(224,80,30,0.75), 0 0 14px rgba(224,80,30,0.5);
}
.cell .card{ position:absolute; inset:0; width:100%; height:100%; cursor:default; }
.cell .card.placing{ animation: cardLand calc(.48s * var(--fx-speed,1)) cubic-bezier(.22,1.6,.4,1); }
@keyframes cardLand{
  0%{ transform:translateY(-28px) scale(0.84); opacity:0; filter:brightness(1.9); }
  60%{ transform:translateY(4px) scale(1.03); opacity:1; }
  100%{ transform:translateY(0) scale(1); filter:brightness(1); }
}
/* Game-feel phase 2: a brief impact flash right as the card touches down,
   timed to cardLand's own 60% "landing" mark above. A ::after pseudo-element
   rather than a new template element -- pure CSS, no JS/markup change, so
   this is trivially reversible. Confined to .cell's existing overflow:hidden
   (already true of every other in-cell effect, e.g. cellPulse below), so
   the scale(1.4) endpoint just crops naturally at the cell edge instead of
   spilling into neighboring cells -- reads as a starburst, not a bug. */
.cell .card.placing::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9), rgba(240,216,121,0.4) 40%, transparent 70%);
  opacity:0; animation:placeImpact .48s cubic-bezier(.22,1.6,.4,1);
}
@keyframes placeImpact{
  0%,50%{ opacity:0; transform:scale(0.4); }
  62%{ opacity:0.85; transform:scale(1.15); }
  100%{ opacity:0; transform:scale(1.4); }
}
.cell .card.flipping{ animation:flip calc(.55s * var(--fx-speed,1)) ease var(--fx-delay,0ms) both; }
.cell .card.owner-blue.flipping{ animation:flip calc(.55s * var(--fx-speed,1)) ease var(--fx-delay,0ms) both, captureRingBlue calc(.55s * var(--fx-speed,1)) ease var(--fx-delay,0ms) both; }
.cell .card.owner-red.flipping{ animation:flip calc(.55s * var(--fx-speed,1)) ease var(--fx-delay,0ms) both, captureRingRed calc(.55s * var(--fx-speed,1)) ease var(--fx-delay,0ms) both; }
@keyframes flip{
  0%{ transform:rotateY(0deg) scale(1); filter:brightness(1);}
  45%{ transform:rotateY(90deg) scale(1.07); filter:brightness(1.7);}
  55%{ transform:rotateY(90deg) scale(1.07); filter:brightness(1.7);}
  100%{ transform:rotateY(0deg) scale(1); filter:brightness(1);}
}
/* A quick "sword flash" spark right at the flip's edge-on midpoint (45-55%,
   matching flip's own rotateY(90deg) hold above) -- same --fx-delay so it
   stays in sync with staggered Same/Plus/Combo chain flips. */
.cell .card.flipping::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95), transparent 70%);
  opacity:0; animation:flipSpark .55s ease var(--fx-delay,0ms) both;
}
/* Game-feel phase 3: all three scale with --fx-step (see cardFace's
   fxDelayStyle) so a flip further into a Same/Plus/Combo chain hits
   visibly harder than the first one -- "first flip creates an impact,
   subsequent flips propagate... the final flip can have a stronger
   finishing impact" falls out naturally from a continuous per-step
   escalation, no separate "is this the last flip" bookkeeping needed.
   Defaults to 0 (calc(0.6 + 0) etc) for any flip outside a chain, so a
   single ordinary capture looks exactly as it did before this phase. */
@keyframes flipSpark{
  0%,40%{ opacity:0; }
  48%,52%{ opacity:calc(0.6 + var(--fx-step, 0) * 0.07); }
  60%,100%{ opacity:0; }
}
@keyframes captureRingBlue{
  0%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 0 rgba(63,111,209,0); }
  50%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 0 calc(12px + var(--fx-step, 0) * 3px) rgba(63,111,209,0.5); }
  100%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 calc(26px + var(--fx-step, 0) * 4px) rgba(63,111,209,0); }
}
@keyframes captureRingRed{
  0%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 0 rgba(184,69,46,0); }
  50%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 0 calc(12px + var(--fx-step, 0) * 3px) rgba(184,69,46,0.5); }
  100%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 calc(26px + var(--fx-step, 0) * 4px) rgba(184,69,46,0); }
}

.card.shield-flash{ animation: shieldRing 0.9s ease; }
@keyframes shieldRing{
  0%{ box-shadow:0 0 0 0 rgba(201,162,39,0.9); }
  60%{ box-shadow:0 0 0 16px rgba(201,162,39,0); }

/* The debuff counterpart of .skill-pop.bonus — same popup, red instead of
   green, used whenever bonusAmount is negative (see cardFace()). Lets any
   effect that lowers a card's Power via SpecialVerbs (debuff/
   debuffThisRound/stealPower/directionalBoost, now flashed generically —
   see flashStatChange) show it just as clearly as a positive bonus does,
   including on AOE/direction targets that previously got no per-card
   feedback at all. */

  box-shadow:0 0 16px rgba(184,69,46,0.5);

}
@keyframes popFade{
  0%{ opacity:0; transform:translate(-50%,-15%) scale(0.55); }
  18%{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
  32%{ transform:translate(-50%,-50%) scale(1); }
  78%{ opacity:1; }
  100%{ opacity:0; transform:translate(-50%,-85%) scale(0.92); }
}

/* Attack slash — a quick double blade-sweep flashed over any card that
   was just battled, win or lose, shielded or not (see .attackFlash on the
   board entry). Lives on its own child element rather than as an
   animation on .card itself, so it never fights with .flipping's own
   transform/filter animation when both play at once on a captured card. */
.slash-fx{ position:absolute; inset:0; z-index:7; pointer-events:none; overflow:hidden; }
.slash-line{
  position:absolute; left:-15%; width:130%; height:7%;
  background:linear-gradient(90deg, transparent 0%, #fff 40%, #fff 60%, transparent 100%);
  box-shadow:0 0 8px 2px rgba(255,255,255,0.85), 0 0 18px 5px rgba(255,255,255,0.4);
  transform-origin:left center;
  opacity:0;
}
.slash-line.line1{ top:28%; animation:slashSweep 0.4s cubic-bezier(.2,.85,.3,1) var(--fx-delay,0ms) both; }
.slash-line.line2{ top:58%; animation:slashSweep 0.4s cubic-bezier(.2,.85,.3,1) calc(var(--fx-delay,0ms) + 0.06s) both; }
@keyframes slashSweep{
  0%{ transform:rotate(-26deg) scaleX(0); opacity:0; }
  22%{ opacity:1; }
  55%{ transform:rotate(-26deg) scaleX(1); opacity:1; }
  100%{ transform:rotate(-26deg) scaleX(1); opacity:0; }
}

/* destroy-ghost: a brief fading remnant of a card an AOE/direction effect
   just destroyed (state.destroyGhosts, see destroyCard()) — the cell is
   already empty in state.board by the time this renders, so this is
   purely a visual echo, not an interactive card (no click, no info
   button — cardFace() is called with noInfo:true for it). Without this,
   a multi-target destroy special just made cards vanish with no telegraph
   at all beyond the one summary line in the log. */
.card.destroy-ghost{
  pointer-events:none;
  animation: cardShatter 1.2s cubic-bezier(.4,0,.6,1) forwards;
}
.card.destroy-ghost .card-art,
.card.destroy-ghost .card-glow{ filter:saturate(0.3) brightness(0.6); }
@keyframes cardShatter{
  0%{ opacity:1; transform:scale(1) rotate(0deg); filter:brightness(1); }
  15%{ opacity:1; transform:scale(1.04) rotate(-1deg); filter:brightness(1.3) sepia(0.3) hue-rotate(-20deg); }
  100%{ opacity:0; transform:scale(0.85) rotate(4deg); filter:brightness(0.6); }
}

/* Card-info modal, side-by-side on screens with room for it: the skills
   panel sits directly beside the art instead of underneath it, so reading
   the skills no longer means scrolling down PAST the poster first — the
   stacked layout above (art on top, skills below, one shared scrollbar)
   is kept as the narrow-viewport fallback where there's no room for two
   columns. Same DOM either way (renderModal()'s markup doesn't change),
   this only repositions it. */
@media (min-width:700px){
  .modal-poster{
    max-width:780px; max-height:88vh;
    display:flex; align-items:stretch; overflow:hidden;
  }
  .modal-poster > .poster-art-full,
  .modal-poster > .poster-art{
    flex:0 0 320px; width:320px; aspect-ratio:auto;
  }
  .modal-poster > .poster-art-full{ overflow:hidden; background:var(--void-2); }
  .modal-poster > .poster-art-full img{ width:100%; height:100%; object-fit:contain; display:block; }
  .modal-poster .poster-skills{
    flex:1 1 auto; max-height:88vh; overflow-y:auto;
  }
}

/* ---------- rulebook modal: a paged image viewer, one illustrated page
   per rule topic (art generated to match the real rules — see RULEBOOK_PAGES) ---------- */
.rulebook-pager-img{ width:100%; display:block; border-radius:16px 16px 0 0; }
.rulebook-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; gap:12px;
}
.rulebook-nav-btn{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:8px 16px; font-family:'Cinzel',serif; font-size:12px;
  letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
}
.rulebook-nav-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
.rulebook-nav-btn:disabled{ opacity:0.35; cursor:default; }
.rulebook-dots{ display:flex; gap:6px; }
.rulebook-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
.rulebook-dot.active{ background:var(--gold); }

/* ---------- special-attack choice picker: for ultimates that need an
   extra choice beyond (or instead of) a board target — e.g. Pallis picks
   an element, Tiamat picks a power after picking her target. ---------- */
.choice-picker-overlay{
  position:fixed; inset:0; z-index:55;
  background:rgba(4,3,9,0.86); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.choice-picker{
  width:100%; max-width:340px; background:var(--void-2); border:1px solid var(--gold);
  border-radius:16px; box-shadow:0 20px 70px rgba(0,0,0,0.85); padding:22px 20px;
  text-align:center;
}
.choice-picker h3{
  font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--gold); margin:0 0 16px;
}
.choice-picker-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:16px; }
.choice-picker-btn{
  flex:1 1 auto; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
  color:var(--text-dim); font-family:'Spectral',serif; font-size:11px; font-weight:600; cursor:pointer;
  transition:all .15s ease;
}
.choice-picker-icon{ font-size:22px; line-height:1; }
.choice-picker-btn:hover{
  border-color:var(--gold); color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.choice-picker-cancel{ width:100%; }

/* ---------- "How to Play" entry point + guided tutorial overlay ---------- */
/* Fas 5 (design review, UI/UX polish): this used to inherit .ghost's
   muted, transparent-background styling -- a first-time player could
   easily skip right past it on the way to Random Draft, exactly the
   audience it exists for. Given its own real gold-bordered, tinted
   treatment (the same visual language .mode-btn.active already uses for
   "this matters, tap it") instead of competing for attention as an
   afterthought below the rules text. */
.how-to-play-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; margin:0 0 20px; padding:13px;
  border-radius:10px; border:1px solid var(--gold);
  background:linear-gradient(180deg, rgba(201,162,39,0.2), rgba(201,162,39,0.05));
  color:var(--gold-bright); font-family:'Cinzel',serif; font-weight:700; font-size:13px;
  letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; transition:all .15s ease;
}
.how-to-play-btn:not(:disabled):hover{
  background:linear-gradient(180deg, rgba(201,162,39,0.3), rgba(201,162,39,0.1));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.how-to-play-btn:disabled{ opacity:0.4; cursor:default; }

.tutorial-overlay{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex; justify-content:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.tutorial-panel{
  pointer-events:auto;
  width:100%; max-width:460px; background:var(--void-2); border:1px solid var(--gold);
  border-radius:16px; box-shadow:0 20px 70px rgba(0,0,0,0.85); padding:16px 18px;
  text-align:center;
}
.tutorial-step-label{
  font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--gold); margin-bottom:6px;
}
.tutorial-text{ font-family:'Spectral',serif; font-size:13px; color:var(--text); margin:0 0 12px; line-height:1.4; }
.tutorial-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:12px; }
.tutorial-actions{ display:flex; gap:10px; justify-content:center; }
.tutorial-actions button{ flex:1 1 auto; max-width:180px; }

/* ---------- curated beginner 5-card presets in "Choose Your Five" ---------- */
.beginner-deck-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
.beginner-deck-btn{
  flex:1 1 220px; text-align:left; padding:10px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer;
  transition:all .15s ease;
}
.beginner-deck-btn:hover{
  border-color:var(--gold); background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.beginner-deck-name{ font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.05em; color:var(--gold-bright); margin-bottom:4px; }
.beginner-deck-desc{ font-family:'Spectral',serif; font-size:11px; color:var(--text-dim); line-height:1.35; }

/* ---------- mobile battle layout: board becomes the hero, hands become
   horizontal strips above/below it instead of squeezed side columns ---------- */
@media (max-width:640px){
  .wrap{ padding:8px 8px 10px; }

  .masthead.compact{ margin:0 0 5px; }
  .masthead.compact .rune{ width:18px; height:18px; margin:0 auto 2px; font-size:9px; }
  .masthead.compact h1{ font-size:17px; }
  .masthead.compact .sub{ font-size:8px; }
  .masthead.compact .sound-toggle,
  .masthead.compact .music-toggle{ width:18px; height:18px; font-size:9px; }

  .scoreboard{ padding:5px 12px; margin-bottom:5px; }
  .score-num{ font-size:15px; }
  .turn-indicator{ font-size:11px; padding:3px 9px; }
  .score-flame{ width:22px; height:22px; }

  .battle-row{
    flex-direction:column;
    align-items:stretch;
    gap:4px;
  }

  .side-hand.hand-row{
    width:100%;
    flex-direction:row;
    gap:5px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:1px 1px 2px;
  }
  .side-hand.hand-row .card{
    width:44px;
    flex:0 0 auto;
  }
  /* At 44px, the 4 edge-mounted stat badges (each with a 17px floor,
     since clamp()'s cqw term is already tiny here) collide with each
     other and with the corner badges (info button, level stars) — none
     of those have room left to sit at their own normal floor size too.
     Shrink everything that competes for the rim, and drop the star
     rating entirely (same call as .hand-row.enemy already makes for
     .card-role — least essential info goes first when space runs out). */
  .side-hand.hand-row .stat-n{
    width:12px; height:12px; font-size:7.5px; border-width:1px;
  }
  .side-hand.hand-row .stat-n.n-top{ top:1px; }
  .side-hand.hand-row .stat-n.n-bottom{ bottom:1px; }
  .side-hand.hand-row .stat-n.n-left{ left:1px; }
  .side-hand.hand-row .stat-n.n-right{ right:1px; }
  /* Fas 5 (design review, UI/UX polish): the visible badge stays tiny
     (44px cards have no room for a bigger one without colliding with the
     stat/element badges, see the comment above), but its real tappable
     area is expanded to a touch-friendly ~25x25px via a transparent
     ::before overlay -- a click anywhere on that invisible area still
     counts as a click on the button itself (it's the button's own
     rendered content, not a sibling), so this needs no JS changes. */
  .side-hand.hand-row .info-btn{ width:13px; height:13px; font-size:7px; top:2px; right:2px; }
  .side-hand.hand-row .info-btn::before{ content:''; position:absolute; inset:-6px; }
  .side-hand.hand-row .level-stars{ display:none; }
  .side-hand.hand-row .element-badge{ width:10px; height:10px; font-size:6px; }
  .side-hand.hand-row .card-top{ padding-top:12px; }
  .hand-label.side{
    text-align:left;
    margin:0 0 1px 2px;
    font-size:9px;
  }

  .arena-frame{
    max-width:none;
    width:100%;
    aspect-ratio:1086/1180;
  }
  .board{
    top:9%; left:14%; right:14%; bottom:auto;
    gap:3px;
  }

  .log{ margin:4px 0; font-size:12px; }
  button.ghost{ padding:7px; margin-top:4px; }
}

/* ---------- large desktop: same left / center / right layout, just
   moderately scaled up to use more of the available screen space. Also
   caps .stage to the viewport's own height (instead of just a min-height)
   and makes .wrap the scroll container that fills it, so .battle-row can
   flex to fill whatever's left after the masthead/scoreboard/log/buttons
   and the arena sizes itself to that — the battle screen fits one screen
   instead of the whole page growing past the fold on an ordinary desktop
   browser window (not just true fullscreen). Screens too short for
   everything still scroll, just inside the framed panel. ---------- */
@media (min-width:900px){
  /* Widened per user feedback ("ganska mycket död yta... skulle man kunna
     göra det lite bredare") -- the panel was leaving visible margin on
     wide monitors even outside true fullscreen. .scoreboard/.wins-row get
     the same max-width+auto-margin treatment the fullscreen tier below
     already uses, so the top bar's width tracks the arena instead of
     stretching edge-to-edge of the now-wider hand-row-to-hand-row span. */
  .stage{ max-width:1600px; height:100dvh; overflow:hidden; }
  .wrap{
    padding:14px 26px 16px;
    height:100%;
    display:flex; flex-direction:column;
    overflow-y:auto;
  }

  .battle-row{ gap:28px; flex:1 1 auto; min-height:0; justify-content:center; }

  /* .arena-frame's own width is derived from AVAILABLE HEIGHT (aspect-
     ratio:1086/1448, height:100%, width:auto below), so on an ordinary
     landscape monitor it's height-bound, not width-bound -- widening its
     own max-width above doesn't actually make it bigger there. .hand-row
     is the column that CAN use freed-up horizontal space (its cards are
     purely width-driven, see .hand-row .card{width:100%}), so this is the
     more effective lever for "för det är ganska mycket död yta" on a
     typical 1920x1080-ish screen. */
  .hand-row{ width:210px; gap:12px; height:100%; overflow-y:auto; }
  .hand-label.side{ font-size:13px; margin-bottom:8px; }

  .board{ gap:11px; }
  .arena-frame{
    max-width:960px;
    height:100%; width:auto;
    flex:0 1 auto;
  }

  .scoreboard{ padding:8px 20px; margin-bottom:8px; max-width:960px; margin-left:auto; margin-right:auto; }
  .wins-row{ max-width:960px; margin-left:auto; margin-right:auto; margin:2px auto 6px; }
  .score-num{ font-size:21px; }
  .turn-indicator{ font-size:13px; }
  .score-flame{ width:44px; height:44px; }

  /* Reclaims vertical space for .battle-row/.arena-frame above (see its
     own comment -- height-bound, so every pixel freed from the masthead/
     scoreboard/log/buttons directly grows the board). User feedback:
     "jag vill ha mitten delen större" -- on a wide-but-not-very-tall
     desktop window, the masthead+scoreboard+log+buttons chrome was eating
     roughly half the available height, leaving the board a small square
     in the middle of a lot of horizontal space. Pure spacing trims here,
     no font-size/element changes, so nothing gets harder to read. */
  .masthead{ margin:2px 0 8px; }
  .log{ margin-bottom:4px; }
  button.end-turn{ margin-top:6px; }
  button.ghost{ margin-top:6px; }
}

/* ---------- true browser fullscreen (the ⛶ button): the game fills the
   whole physical screen, so stop capping it at plain desktop's width and
   let it use the extra room — bigger board, bigger hands, more breathing
   room. The viewport-fit mechanics (.stage bounded to 100dvh, .wrap
   scrolling, .battle-row/.hand-row/.arena-frame flexing to fill it)
   already come from the plain desktop rule above; this block only widens
   the caps further (re-widened alongside that tier's own widening -- see
   its comment -- so fullscreen stays bigger than plain desktop, not
   smaller). Only kicks in alongside the desktop breakpoint so a phone in
   fullscreen keeps its normal narrow layout. ---------- */
@media (min-width:900px){
  html:fullscreen .stage,
  html:-webkit-full-screen .stage{
    max-width:1900px;
  }
  html:fullscreen .wrap,
  html:-webkit-full-screen .wrap{
    padding:28px 40px 36px;
  }
  html:fullscreen .battle-row,
  html:-webkit-full-screen .battle-row{
    gap:30px;
  }
  html:fullscreen .hand-row,
  html:-webkit-full-screen .hand-row{
    width:240px; gap:14px;
  }
  html:fullscreen .hand-label.side,
  html:-webkit-full-screen .hand-label.side{
    font-size:14px;
  }
  html:fullscreen .board,
  html:-webkit-full-screen .board{
    gap:16px;
  }
  html:fullscreen .arena-frame,
  html:-webkit-full-screen .arena-frame{
    max-width:1100px;
  }
  html:fullscreen .scoreboard,
  html:-webkit-full-screen .scoreboard{
    max-width:1100px; margin-left:auto; margin-right:auto;
  }
  html:fullscreen .wins-row,
  html:-webkit-full-screen .wins-row{
    max-width:1100px; margin-left:auto; margin-right:auto;
  }
  html:fullscreen .score-num,
  html:-webkit-full-screen .score-num{
    font-size:26px;
  }
  html:fullscreen .turn-indicator,
  html:-webkit-full-screen .turn-indicator{
    font-size:15px;
  }
}
</style>
</head>
<body>
<audio id="bgm" loop preload="auto">
  <source src="ancient-mysteries.mp3" type="audio/mpeg">
</audio>
<div class="stage">
  <div class="stage-ambient" aria-hidden="true">
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <span class="stage-mote"></span>
    <svg class="soul-stream" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="soulGradA-stage" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#eafff0" stop-opacity="0"/>
          <stop offset="50%" stop-color="#8bffb0" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#eafff0" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="soulGradB-stage" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#d8fff0" stop-opacity="0"/>
          <stop offset="50%" stop-color="#5fe6a8" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#d8fff0" stop-opacity="0"/>
        </linearGradient>
        <!-- Soft glow via a radial fill, not a blur filter (see the note
             on this file's lag fix above -- filters are expensive on a
             continuously-animating element, a gradient fill is not). -->
        <radialGradient id="soulParticleGrad-stage">
          <stop offset="0%" stop-color="#f2fff8" stop-opacity="1"/>
          <stop offset="55%" stop-color="#7ef2b8" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#7ef2b8" stop-opacity="0"/>
        </radialGradient>
        <!-- Tapered-fragment gradient (user feedback: "looked too much
             like small worms" -- see the redesign note below). Default
             gradientUnits (objectBoundingBox) means this ONE definition
             auto-tapers to transparent at both ends of ANY fragment's own
             bounding box, whatever its length/position/angle, so every
             wisp fragment below can share it instead of needing its own
             gradient. */ -->
        <linearGradient id="soulFragGrad-stage" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#8bffb0" stop-opacity="0"/>
          <stop offset="50%" stop-color="#8bffb0" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#8bffb0" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- REDESIGNED per user feedback: the previous single dashed line
           per lane, flowing along an S-curved path, read as "small
           worms" (uniform segmented dashes + a sinuous snake-like curve).
           Two things changed:
           1. soulPathA/B/C-stage below are now nearly straight (a single
              gentle bow, not a multi-bend S) AND fully invisible (no
              class, no visible stroke) -- they exist ONLY as motion
              guides for the wisp-riding particles' animateMotion/mpath
              further down, so "keep their existing movement and speed"
              holds exactly for those particles.
           2. The VISIBLE energy is now a handful of short, individually
              tapered .soul-wisp-fragment lines (not one continuous
              stroke) drifting slowly upward near each lane, each fading
              to transparent at both ends via soulFragGrad-stage above,
              with deliberately varied length/width/opacity so some
              "almost disappear into the background" -- no dasharray, no
              uniform segments, no S-curve, per the brief. Particles (see
              further down) get a small brightness boost so they read as
              the most recognizable element, with these fragments staying
              subtle background texture behind them. */ -->
      <path id="soulPathA-stage" d="M20,110 Q18,50 20,-10" fill="none" stroke="none"/>
      <path id="soulPathC-stage" d="M80,105 Q82,45 80,-15" fill="none" stroke="none"/>
      <path id="soulPathB-stage" d="M50,108 Q52,48 50,-12" fill="none" stroke="none"/>
      <g class="soul-wisp-fragment-group">
        <line class="soul-wisp-fragment" x1="19" y1="98" x2="21" y2="82" stroke-width="0.22" opacity="0.4">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-55; 0,-115" keyTimes="0;0.5;1" dur="14s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.1;0.85;1" dur="14s" repeatCount="indefinite"/>
        </line>
        <line class="soul-wisp-fragment" x1="20" y1="63" x2="19" y2="49" stroke-width="0.16" opacity="0.22">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-55; 0,-115" keyTimes="0;0.5;1" dur="17s" repeatCount="indefinite" begin="-5s"/>
          <animate attributeName="opacity" values="0;0.22;0.22;0" keyTimes="0;0.1;0.85;1" dur="17s" repeatCount="indefinite" begin="-5s"/>
        </line>
        <line class="soul-wisp-fragment" x1="21" y1="32" x2="20" y2="19" stroke-width="0.14" opacity="0.14">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-55; 0,-115" keyTimes="0;0.5;1" dur="20s" repeatCount="indefinite" begin="-11s"/>
          <animate attributeName="opacity" values="0;0.14;0.14;0" keyTimes="0;0.1;0.85;1" dur="20s" repeatCount="indefinite" begin="-11s"/>
        </line>
        <line class="soul-wisp-fragment" x1="49" y1="101" x2="51" y2="84" stroke-width="0.25" opacity="0.45">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-58; 0,-118" keyTimes="0;0.5;1" dur="13s" repeatCount="indefinite" begin="-3s"/>
          <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.1;0.85;1" dur="13s" repeatCount="indefinite" begin="-3s"/>
        </line>
        <line class="soul-wisp-fragment" x1="50" y1="66" x2="49" y2="53" stroke-width="0.17" opacity="0.24">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-58; 0,-118" keyTimes="0;0.5;1" dur="16s" repeatCount="indefinite" begin="-8s"/>
          <animate attributeName="opacity" values="0;0.24;0.24;0" keyTimes="0;0.1;0.85;1" dur="16s" repeatCount="indefinite" begin="-8s"/>
        </line>
        <line class="soul-wisp-fragment" x1="51" y1="34" x2="50" y2="21" stroke-width="0.13" opacity="0.15">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-58; 0,-118" keyTimes="0;0.5;1" dur="19s" repeatCount="indefinite" begin="-14s"/>
          <animate attributeName="opacity" values="0;0.15;0.15;0" keyTimes="0;0.1;0.85;1" dur="19s" repeatCount="indefinite" begin="-14s"/>
        </line>
        <line class="soul-wisp-fragment" x1="79" y1="96" x2="81" y2="81" stroke-width="0.2" opacity="0.35">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-52; 0,-112" keyTimes="0;0.5;1" dur="15s" repeatCount="indefinite" begin="-7s"/>
          <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.1;0.85;1" dur="15s" repeatCount="indefinite" begin="-7s"/>
        </line>
        <line class="soul-wisp-fragment" x1="80" y1="58" x2="79" y2="45" stroke-width="0.15" opacity="0.2">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-52; 0,-112" keyTimes="0;0.5;1" dur="18s" repeatCount="indefinite" begin="-2s"/>
          <animate attributeName="opacity" values="0;0.2;0.2;0" keyTimes="0;0.1;0.85;1" dur="18s" repeatCount="indefinite" begin="-2s"/>
        </line>
        <line class="soul-wisp-fragment" x1="81" y1="27" x2="80" y2="13" stroke-width="0.12" opacity="0.13">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-52; 0,-112" keyTimes="0;0.5;1" dur="21s" repeatCount="indefinite" begin="-16s"/>
          <animate attributeName="opacity" values="0;0.13;0.13;0" keyTimes="0;0.1;0.85;1" dur="21s" repeatCount="indefinite" begin="-16s"/>
        </line>
      </g>
      <!-- "Some particles should follow the flowing energy wisps" -- tiny
           glowing dots riding the exact same curves as the ribbons above
           via SMIL's animateMotion+mpath, which references the path by
           id rather than duplicating its `d` string, and animates in the
           SVG's own user-unit space (unlike a CSS transform on an SVG
           element, which would need extra care to stay in sync with the
           viewBox's scaling). Note: mpath follows the PATH ELEMENT'S

// Curated 5-card presets for new players (user feedback: "man fattar inte
// hur spelet fungerar... 5 kort i en bra combo version") — a one-tap
// shortcut in "Choose Your Five" that fills state.selected with a
// deliberately synergistic, beginner-legible hand, rather than the player
// having to already understand the whole roster to pick well. Each deck
// leans on ONE clear, explainable idea rather than stacking several at
// once:
// - Bonded Guardians: Darien/Elara's own built-in `pairPresence` bonus
//   (each gets +2 Power on all sides while the other is anywhere on the
//   board) is the single most legible "these two cards work together"
//   mechanic already in the game -- pointing straight at it teaches the
//   concept without inventing a new one. Rounded out with three other
//   simple, cheap (cost:2 or no-special-at-all) cards with strong flat
//   stats, so nothing else in the deck needs its own explanation.
// - Windswept Vanguard: three WIND cards (Zaevir/Sylvarion/Aurelian) to
//   demonstrate the optional Elemental Clash rule's "same-side favorable
//   matchups" idea if the player turns it on, plus two simple flat-stat
//   fillers (Sarah's even 10/10/10/10 line, The Hollow Crown's single
//   passive and total lack of a Special Attack) to keep the rest of the
//   hand easy to reason about.
const BEGINNER_DECKS = [
  { id:'bonded', name:'Bonded Guardians', desc:"Darien and Elara boost each other just by both being on your board — a simple taste of card synergy.", cardIds:['darien','elara','sarah','zaevir','vayra'] },
  { id:'windswept', name:'Windswept Vanguard', desc:'Three Wind champions team up — turn on Elemental Clash to see them fight with an edge.', cardIds:['zaevir','sylvarion','aurelian','sarah','shadowking'] },
];

// Guided "How to Play" walkthrough (user feedback: "man måste göra en bra
// tutorial så nya spelare förstår spelets mening... dom gissar sig fram").
// A real, playable board rather than a slideshow: startTutorial() below
// sets up a fixed player hand and ONE deliberately weak dummy enemy card
// already on the board (1 Power every side, so literally any of the
// player's real champions is guaranteed to beat it), so the very first
// placement the player makes is guaranteed to demonstrate a capture no
// matter which card/adjacent cell they choose. Each step's `text` is
// shown in a banner over the real battle screen (see renderBattle()); a
// step can optionally auto-advance early when the player actually performs
// the real action it describes (see checkTutorialAutoAdvance()), but
// "Next" is ALWAYS clickable too so nobody can get stuck waiting on a
// detection edge case.
const TUTORIAL_STEPS = [
  { text: "Welcome to Triad Arena! You'll place five champions on this 3×3 board. When every square is full, whoever holds the most squares wins the duel. Let's learn how a single move works." },
  { text: 'Tap one of your champions in your hand below to select it.', autoAdvanceIf: () => !!state.pendingCard },
  { text: 'Now tap the square right next to the enemy card to place your champion there.', autoAdvanceIf: () => state.board.filter(Boolean).length > 1 },
  { text: "Look at that — your champion's edge number beat the enemy's facing edge, so it flipped to your side! That's the whole core of the game: win the number comparison on a touching side, capture the square." },
  { text: 'Once you\'ve won enough squares, a card with a Special Attack ready shows a glowing diamond — tap it to unleash a powerful one-time ability.' },
  { text: 'Back on the setup screen you\'ll find optional rules like Same, Plus, and Elemental Clash — turn them on later for extra strategic depth once you\'re comfortable.' },
  { text: "That's everything you need to start! Head back and try Random Draft, Choose Your Five, or the Campaign. Good luck out there!", isLast: true },
];

function startTutorial(){
  const deck = BEGINNER_DECKS[0];
  state.selected = deck.cardIds.slice();
  state.playerHand = deck.cardIds.map(id => HEROES.find(h => h.id === id)).filter(Boolean);
  state.enemyHand = [];
  state.board = Array(9).fill(null);
  state.board[4] = { card: { id:'tutorialfoe', name:'Weakling', top:1, right:1, bottom:1, left:1, hue:'linear-gradient(160deg,#3a1414,#1a0d0d 60%)', accent:'#c04b4b', icon:'👺' }, owner:'red', shieldUsed:false, grantedShield:false, captureBonus:0, justPlaced:false, turnsStanding:0, turnsStandingOwner:'red', turnsStandingCell:4 };
  state.pendingCard = null;
  state.turn = 'blue';
  state.placedThisTurn = false;
  state.wins = { blue:0, red:0 };
  state.specialUsed = {};
  state.specialMode = null;
  state.log = 'Place a champion to claim the first square.';
  state.phase = 'battle';
  state.tutorialActive = true;
  state.tutorialStep = 0;
  render();
}

function endTutorial(){
  state.tutorialActive = false;
  state.tutorialStep = 0;
  resetGame();
}

// Called after every render() while the tutorial is active -- lets a step
// move itself forward the instant its real in-game action happens,
// without any click-handler ever needing to know about the tutorial.
function checkTutorialAutoAdvance(){
  if(!state.tutorialActive) return;
  const step = TUTORIAL_STEPS[state.tutorialStep];
  if(step && step.autoAdvanceIf && step.autoAdvanceIf()){
    state.tutorialStep++;
    render();
  }
}

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req) req.call(el);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
}

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt=>{

    render();
  });
});
let musicStarted = false;
let actx = null;

function getBgm(){ return document.getElementById('bgm'); }

function tryStartMusic(){
  if(musicStarted || !musicOn) return;
  const bgm = getBgm();
  if(!bgm) return;
  bgm.volume = 0.35;
  bgm.play().then(()=>{ musicStarted = true; }).catch(()=>{ /* wait for a later gesture */ });
}

function toggleMusic(){
  musicOn = !musicOn;
  const bgm = getBgm();
  if(bgm){
    if(musicOn){ musicStarted = false; tryStartMusic(); }
    else { bgm.pause(); }
  }
  render();
}

function getCtx(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}

function tone({freq, start=0, dur=0.2, type='sine', gain=0.18, glideTo=null}){
  if(!soundOn) return;
  const ctx = getCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  const t0 = ctx.currentTime + start;
  osc.frequency.setValueAtTime(freq, t0);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

const SFX = {
  select(){ tone({ freq:720, dur:0.07, type:'triangle', gain:0.10 }); },
  deselect(){ tone({ freq:480, dur:0.07, type:'triangle', gain:0.08 }); },
  begin(){
    [440,660,880].forEach((f,i)=> tone({ freq:f, start:i*0.07, dur:0.22, type:'triangle', gain:0.14 }));
  },
  place(owner){
    const base = owner === 'blue' ? 150 : 120;
    tone({ freq:base, dur:0.16, type:'sine', gain:0.20, glideTo:base*0.7 });
    tone({ freq:base*2.2, start:0.01, dur:0.1, type:'triangle', gain:0.08 });
  },
  flip(n){
    const notes = [1046,1318,1568,1760];
    for(let i=0;i<n;i++){
      tone({ freq:notes[i % notes.length], start:i*0.08, dur:0.18, type:'sine', gain:0.14 });
    }
  },
  win(){
    [523,659,784,1046].forEach((f,i)=> tone({ freq:f, start:i*0.12, dur:0.4, type:'triangle', gain:0.16 }));
  },
  lose(){
    [392,349,294].forEach((f,i)=> tone({ freq:f, start:i*0.16, dur:0.45, type:'sine', gain:0.14 }));
  },
  draw(){
    [440,440].forEach((f,i)=> tone({ freq:f, start:i*0.18, dur:0.2, type:'sine', gain:0.12 }));
  },
  shield(){
    tone({ freq:660, dur:0.22, type:'triangle', gain:0.16 });
    tone({ freq:990, start:0.05, dur:0.28, type:'sine', gain:0.13 });
    tone({ freq:220, start:0, dur:0.3, type:'sine', gain:0.10 });
  },
  bonus(){
    [880,1174,1568].forEach((f,i)=> tone({ freq:f, start:i*0.05, dur:0.16, type:'triangle', gain:0.11 }));
  },
};

  fastMode: false, // shortens routine flip/turn/banner timing for repeat players — see fxTime()/toggleFastMode(); overwritten from localStorage below, once loadFastMode() is defined
};

function uid(card, owner){ return owner + ':' + card.id; }

function findCardById(id){
  return HEROES.find(h => h.id === id) || FOREST_FOES.find(f => f.id === id) || null;
}

function openCardModal(id){
  const card = findCardById(id);
  if(card){ state.viewingCard = card; state.showRulebook = false; render(); }
}

function closeCardModal(){
  state.viewingCard = null;
  render();
}

function openRulebook(){
  state.showRulebook = true;
  state.viewingCard = null;
  state.rulebookPage = 0;
  render();
}

function closeRulebook(){
  state.showRulebook = false;
  render();
}

function rulebookGo(delta){
  const next = state.rulebookPage + delta;
  if(next < 0 || next >= RULEBOOK_PAGES.length) return;
  state.rulebookPage = next;
  render();
}

/* ---------------- rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  let html = state.phase === 'draft' ? renderDraft() : (state.phase === 'coinflip' ? renderCoinflip() : renderBattle());
  html += renderModal();
  html += renderRulebookModal();
  html += renderGraveyardModal();
  html += renderChoicePicker();
  html += renderTutorialOverlay();
  app.innerHTML = html;
  attachHandlers();
  checkTutorialAutoAdvance();
}

// Per-side effective numbers for the persistent stat display: only the
// STORED modifiers (captureBonus, applied to all sides; sideBonus, per
// side) are shown here — the same two fields flashStatChange already
// flashes transiently. Live, matchup-dependent bonuses (vsStrongerTotalPowerBoost,
// pairPresence, etc., computed by fullEffectiveValue only at actual battle
// time against a specific opponent) are deliberately excluded, since
// there's no single "current" value for those outside of a real battle —
// showing one here could show a number that's wrong against whichever
// neighbor is actually attacked.
// Design-review finding (Fas 1, "korrekt siffervisning"): the number printed
// on a card only ever included captureBonus/sideBonus -- every other live
// modifier in fullEffectiveValue (pairPresence, sisterAura, board-lead,
// adjacency auras, rivalry, ...) was invisible, so the printed number could
// silently understate what a card ALREADY on the board is really worth.
// This folds in every bonus that is both (a) not conditional on which
// specific opponent/side is attacking (so a single flat number is honestly
// representable at all) and (b) not role-gated to attack-only or
// defense-only (so it's true at rest, not just mid-battle) -- i.e. exactly
// the "standing aura" bonuses, live and recomputed every render off the
// real board, same primitives fullEffectiveValue itself uses. Deliberately
// excludes attack-only bonuses (flatAttackBonus, axisBonus, most
// adjacentEnemiesBoost variants, vsStrongerTotalPowerBoost, ...), Elemental
// Clash, and weakVsElement -- those only mean something against a specific
// opponent/role and are exactly what the live capture preview (see
// computeCapturePreview) already shows correctly, per matchup, instead of
// pretending they collapse into one static number.
function staticLiveBonusFor(card, cellIndex, owner){
  if(cellIndex == null || !owner) return 0;
  let bonus = 0;
  bonus += rivalryBonusAt(card.id, cellIndex, owner);
  bonus += lastStandBonus(owner);
  if(card.active && card.active.pairPresence && typeof card.active.pairPresence.amount === 'number'){
    const pp = card.active.pairPresence;
    if(state.board.some(e => e && e.owner === owner && e.card.id === pp.partner)) bonus += pp.amount;
  }
  if(card.active && card.active.sisterAura){
    const sa = card.active.sisterAura;
    const count = sistersPresentCount(card.id, owner);
    if(sa.bonusByCount[count]) bonus += sa.bonusByCount[count];
  }
  if(card.active && card.active.boardLeadBonus){
    const bl = card.active.boardLeadBonus;
    const mine = state.board.filter(e => e && e.owner === owner).length;
    const theirs = state.board.filter(e => e && e.owner !== owner).length;
    const meetsThreshold = bl.tieOnly ? mine === theirs : (bl.orEqual ? mine >= theirs : mine > theirs);
    if(meetsThreshold) bonus += bl.amount;
  }
  const row = Math.floor(cellIndex/3), col = cellIndex%3;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  if(card.active && card.active.adjacentAlliesBoost){
    const ab = card.active.adjacentAlliesBoost;
    let allyNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner === owner) allyNeighbors++;
    });
    if(allyNeighbors >= ab.minCount) bonus += ab.amount;
  }
  if(card.active && card.active.adjacentEnemyAuraThisRound){
    const cfg = card.active.adjacentEnemyAuraThisRound;
    let enemyNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== owner) enemyNeighbors++;
    });
    if(enemyNeighbors >= cfg.minCount) bonus += cfg.amount;
  }
  if(card.active && card.active.auraPerPetrifiedEnemy){
    const cfg = card.active.auraPerPetrifiedEnemy;
    const petrifiedEnemies = state.board.filter(e => e && e.owner !== owner && e.petrifiedUntilTurnCount > state.turnCount).length;
    bonus += Math.min(petrifiedEnemies, cfg.max) * cfg.amount;
  }
  if(card.active && card.active.auraPerFrostmarkedEnemy){
    const cfg = card.active.auraPerFrostmarkedEnemy;
    const frostmarkedEnemies = state.board.filter(e => e && e.owner !== owner && e.frostmarked).length;
    bonus += Math.min(frostmarkedEnemies, cfg.max) * cfg.amount;
  }
  return bonus;
}

function effectiveStatFor(card, side, opts){
  const base = card[side];
  const bonus = (opts.captureBonus || 0) + ((opts.sideBonus && opts.sideBonus[side]) || 0) + staticLiveBonusFor(card, opts.cellIndex, opts.owner);
  return { value: base + bonus, bonus };
}

function statNumHtml(card, side, opts){
  const { value, bonus } = effectiveStatFor(card, side, opts);
  const cls = bonus > 0 ? 'buffed' : (bonus < 0 ? 'debuffed' : '');
  return `<div class="stat-n n-${side} ${cls}">${value}</div>`;
}

function cardFace(card, opts={}){
  const ownerClass = opts.owner ? 'owner-' + opts.owner : '';
  const selClass = opts.selected ? 'selected' : '';
  const disClass = opts.disabled ? 'disabled' : '';
  const inplayClass = opts.inplay ? 'inplay' : '';
  const flipClass = opts.flipping ? 'flipping' : '';
  const placeClass = opts.placing ? 'placing' : '';
  const clickable = opts.clickable ? 'selectable' : '';
  const shieldClass = opts.shieldFlash ? 'shield-flash' : '';
  const bonusClass = opts.bonusFlash ? 'bonus-flash' : '';
  const specialActiveClass = opts.specialActive ? 'special-active' : '';
  const specialReadyClass = (opts.specialInfo && opts.specialInfo.ready) ? 'special-ready' : '';
  const destroyedClass = opts.destroyed ? 'destroy-ghost' : '';
  // Fas 4 (design review, progression pilot): a purely cosmetic gold ring
  // for champions unlocked via campaign stage clears (campaignProgress.
  // unlocked) — story-earned pride, never a gameplay gate (that gating was
  // explicitly removed on the user's own prior request, see campaignPool()).
  // Static box-shadow value, no animation, so it costs nothing and layers
  // cleanly under .selected's own pulsing glow when both apply at once.
  const unlockedClass = opts.unlocked ? 'champion-unlocked' : '';
  // Game feel phase 4: the Ultimate windup glow — distinct from
  // special-active (which only lights up during TARGET SELECTION, before
  // runSpecialResolution even runs) since state.specialMode is already
  // cleared by the time this fires. See playUltimateSequence.
  const ultimateCastingClass = opts.ultimateCasting ? 'ultimate-casting' : '';
  // Nyxara's Void Dominion identity VFX (see the void-dominion-* CSS
  // block) — added ALONGSIDE ultimate-casting above (both classes present
  // together), not instead of it, so every other Ultimate keeps its
  // existing generic windup glow untouched.
  const voidDominionCastingClass = (opts.ultimateCasting && card.id === 'nyxara') ? 'void-dominion-casting' : '';
  // Ifrit's Hellfire identity VFX (see the hellfire-* CSS block) — same
  // additive pattern as void-dominion-casting above.
  const hellfireCastingClass = (opts.ultimateCasting && card.id === 'ifrit') ? 'hellfire-casting' : '';
  // Vaelira's Infernal Pact identity VFX (see the infernal-pact-* CSS
  // block) — same additive pattern as void-dominion-casting above.
  const infernalPactCastingClass = (opts.ultimateCasting && card.id === 'vaelira') ? 'infernal-pact-casting' : '';
  // Seraphine's Silver Judgment identity VFX (see the silver-judgment-*
  // CSS block) — same additive pattern as void-dominion-casting above.
  const silverJudgmentCastingClass = (opts.ultimateCasting && card.id === 'seraphine') ? 'silver-judgment-casting' : '';
  // Omega Weapon's Omega Protocol identity VFX (see the omega-protocol-*
  // CSS block) — same additive pattern as void-dominion-casting above.
  const omegaProtocolCastingClass = (opts.ultimateCasting && card.id === 'omegaweapon') ? 'omega-protocol-casting' : '';
  // Shiva's Diamond Storm identity VFX (see the diamond-storm-* CSS
  // block) — same additive pattern as void-dominion-casting above.
  const diamondStormCastingClass = (opts.ultimateCasting && card.id === 'shiva') ? 'diamond-storm-casting' : '';
  // Bahamut's Megaflare identity VFX (see the megaflare-* CSS block) —
  // same additive pattern as void-dominion-casting above.
  const megaflareCastingClass = (opts.ultimateCasting && card.id === 'bahamut') ? 'megaflare-casting' : '';
  const cardTitle = (opts.specialInfo && opts.specialInfo.ready) ? ` title="${opts.specialInfo.title} — tap to unleash"` : '';
  // Game-feel phase 3: --fx-step (capped to a sane max so a very long chain
  // doesn't produce an absurdly huge flash) drives per-flip escalating
  // impact intensity in CSS (see flipSpark/captureRingBlue/captureRingRed) —
  // a separate concern from --fx-delay's timing-only stagger above.
  const fxStyleParts = [];
  if(opts.fxDelay) fxStyleParts.push(`--fx-delay:${opts.fxDelay}ms`);
  if(opts.fxStep) fxStyleParts.push(`--fx-step:${Math.min(opts.fxStep, 6)}`);
  const fxDelayStyle = fxStyleParts.length ? ` style="${fxStyleParts.join(';')}"` : '';
  return `
    <div class="card ${ownerClass} ${selClass} ${disClass} ${inplayClass} ${flipClass} ${placeClass} ${clickable} ${shieldClass} ${bonusClass} ${specialActiveClass} ${specialReadyClass} ${destroyedClass} ${unlockedClass} ${ultimateCastingClass} ${voidDominionCastingClass} ${hellfireCastingClass} ${infernalPactCastingClass} ${silverJudgmentCastingClass} ${omegaProtocolCastingClass} ${diamondStormCastingClass} ${megaflareCastingClass}" data-cardid="${card.id}"${cardTitle}${fxDelayStyle} ${opts.dataAttr||''}>
      ${CARD_IMAGES[card.id]
        ? `<div class="card-art" style="background-image:url('${CARD_IMAGES[card.id]}')"></div>`
        : `<div class="card-glow" style="background:${card.hue}">${card.icon ? `<div class="foe-icon">${card.icon}</div>` : ''}</div>`}
      ${opts.owner ? `<div class="owner-tint tint-${opts.owner}"></div>` : ''}
      <div class="level-stars">${'★'.repeat(cardLevel(card))}</div>
      ${card.element ? `<div class="element-badge" title="${card.element}${ELEMENT_BEATS[card.element] ? '' : ' (outside the Elemental Clash cycle)'}">${ELEMENT_ICONS[card.element]}</div>` : ''}
      ${opts.petrified ? `<div class="petrified-badge" title="Petrified — can't use its Special Attack">🗿</div>` : ''}
      ${opts.noInfo ? '' : `<button class="info-btn" data-info="${card.id}" title="View card skills">i</button>`}
      ${opts.specialInfo ? `<div class="special-diamond ${opts.specialInfo.ready ? 'ready' : 'locked'}" title="${opts.specialInfo.title}${opts.specialInfo.ready ? ' — tap to unleash' : ' (not enough wins yet)'}"></div>` : ''}
      ${opts.shieldFlash ? `<div class="skill-pop shield">🛡 Shield!</div>` : ''}
      ${opts.bonusFlash ? `<div class="skill-pop bonus ${(opts.bonusAmount||0) < 0 ? 'bonus-negative' : ''}">${(opts.bonusAmount||0) >= 0 ? '+' : ''}${opts.bonusAmount||1} Power</div>` : ''}
      ${opts.attackFlash ? `<div class="slash-fx"><div class="slash-line line1"></div><div class="slash-line line2"></div></div>` : ''}
      ${opts.destroyed ? `<div class="skill-pop destroy">💥 Destroyed!</div>` : ''}
      <div class="card-inner">
        <div class="card-top">
          <div>
            <div class="card-name">${card.name}</div>
            <div class="card-role">${card.role}</div>
          </div>
        </div>
      </div>
      <div class="stat-cluster">
        ${statNumHtml(card, 'top', opts)}
        ${statNumHtml(card, 'left', opts)}
        ${statNumHtml(card, 'right', opts)}
        ${statNumHtml(card, 'bottom', opts)}
      </div>
    </div>`;
}

function mysteryCard(){
  return `<div class="card card-back-mini"></div>`;

function cardLevel(card){
  const sum = card.top + card.right + card.bottom + card.left;
  return Math.min(5, Math.max(1, Math.round(sum / 8)));
}
