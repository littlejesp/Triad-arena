function boardCellHtml(cell, i, previewVulnerable){
  let specialInfo = null;
  if(cell && cell.owner === 'blue' && cell.card.special){
    const key = 'blue:' + cell.card.id;
    if(!(cell.card.special.once && state.specialUsed[key])){
      const ready = state.turn === 'blue' && state.phase === 'battle' && !state.ultimateBanner && specialUsable(cell.card, 'blue', cell);
      specialInfo = { cellIndex:i, ready, title: `${cell.card.special.name} — costs ${cell.card.special.cost} wins` };
    }
  }
  const placeTargetable = !cell && state.pendingCard && state.turn==='blue' && state.phase==='battle' && !state.placedThisTurn && !state.ultimateBanner;
  const specialSrcEntry = state.specialMode && state.board[state.specialMode.sourceIndex];
  const specialTargetable = state.specialMode && !state.specialMode.choices && cell && cell.owner === 'red'
    && !(specialSrcEntry && specialSrcEntry.card.id === 'deathblade' && !sharesLine(state.specialMode.sourceIndex, i));
  // Live capture preview (see computeCapturePreview/getPreviewCaptureTargets):
  // an empty legal cell gets a would-capture badge showing exactly how many
  // enemy neighbors the selected card would flip there, and any enemy card
  // that's capturable from AT LEAST ONE currently-empty cell gets its own
  // "vulnerable" ring — both computed from the real engine's own comparison
  // logic, never a guess.
  const capturePreview = placeTargetable ? computeCapturePreview(state.pendingCard, i, 'blue') : null;
  const isVulnerable = !!(cell && cell.owner === 'red' && previewVulnerable && previewVulnerable.has(i));
  const cellClass = `${placeTargetable ? 'targetable':''} ${capturePreview && capturePreview.captures > 0 ? 'would-capture':''} ${specialTargetable ? 'special-target':''} ${isVulnerable ? 'preview-vulnerable':''}`;
  const ghost = !cell && state.destroyGhosts.find(g => g.index === i);
  return `
    <div class="cell ${cellClass}" data-cell="${i}">
      ${cell ? cardFace(cell.card, {
          owner:cell.owner, flipping:cell.justFlipped, placing:cell.justPlaced,
          shieldFlash:cell.shieldFlash, bonusFlash:cell.bonusFlash, bonusAmount:cell.bonusAmount,
          attackFlash:cell.attackFlash, fxDelay:cell.fxDelay, fxStep:cell.fxStep, ultimateCasting:cell.ultimateCasting,
          petrified: cell.petrifiedUntilTurnCount > state.turnCount,
          captureBonus: cell.captureBonus, sideBonus: cell.sideBonus, cellIndex: i,
          specialInfo, specialActive: !!(state.specialMode && state.specialMode.sourceIndex === i)
        }) : (ghost ? cardFace(ghost.card, { owner:ghost.owner, destroyed:true, noInfo:true }) : '')}
      ${capturePreview && capturePreview.captures > 0 ? `<div class="capture-badge">⚔ ${capturePreview.captures}</div>` : ''}
    </div>
  `;
}

// Fas 8 (design review #2, VFX expansion): the two pieces of geometry
// every per-card Ultimate identity VFX derivation below needs -- a
// cell's center as a percentage of the board (for --*-x/--*-y origin/
// target custom properties) and, for anything that visually points at a
// target (a beam, a rail, Odin's own normal-attack slash trail), the
// angle+length between two such points, normalized for the board
// wrapper's 5/7 (not square) aspect ratio before the atan2 -- a straight
// percentage delta would point every beam at the wrong angle otherwise.
// Previously re-derived inline at every call site (a Silver Judgment
// comment even already referred to this as "angleAndLengthPercent()" as
// if it existed); extracted here, verbatim same math, so adding a new
// card's VFX is "call these two", not "re-copy this block again".
function cellCenterPercent(cellIndex){
  return { x: ((cellIndex % 3) + 0.5) / 3 * 100, y: (Math.floor(cellIndex / 3) + 0.5) / 3 * 100 };
}
function angleAndLengthPercent(originX, originY, targetX, targetY){
  const dxUnits = (targetX - originX) / 100;
  const dyUnits = (targetY - originY) / 100 * (7/5);
  return { angleDeg: Math.atan2(dyUnits, dxUnits) * (180/Math.PI), lengthPercent: Math.sqrt(dxUnits*dxUnits + dyUnits*dyUnits) * 100 };
}

function renderBattle(){
  const blueCount = state.board.filter(c => c && c.owner === 'blue').length;
  const redCount = state.board.filter(c => c && c.owner === 'red').length;
  const previewVulnerable = getPreviewCaptureTargets();

  // Nyxara's Void Dominion identity VFX -- gated purely by the Ultimate's
  // NAME (not a new state field) so it rides state.ultimateBanner's
  // existing cast/impact lifecycle exactly like the banner itself does.
  // --void-x/--void-y are computed from her cell index so the crack/
  // particles originate from her actual board position, not a fixed spot.
  const voidDominionActive = state.ultimateBanner && state.ultimateBanner.name === 'Void Dominion';
  let voidOriginX = 50, voidOriginY = 50;
  if(voidDominionActive){
    ({ x: voidOriginX, y: voidOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
  }

  // Ifrit's Hellfire identity VFX -- same derivation pattern as Void
  // Dominion above, but also needs the TARGET cell's position (Hellfire is
  // single-target, unlike Nyxara's AOE) for the target-hit flash.
  const hellfireActive = state.ultimateBanner && state.ultimateBanner.name === 'Hellfire';
  let hellfireOriginX = 50, hellfireOriginY = 50, hellfireTargetX = 50, hellfireTargetY = 50;
  if(hellfireActive){
    ({ x: hellfireOriginX, y: hellfireOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    const tIdx = state.ultimateBanner.targetIndex;
    if(tIdx != null){
      ({ x: hellfireTargetX, y: hellfireTargetY } = cellCenterPercent(tIdx));
    }
  }

  // Vaelira's Infernal Pact identity VFX -- same derivation pattern as
  // Void Dominion, but also needs the FULL LIST of enemy cell positions
  // (her special, like Nyxara's, destroys every enemy) rather than one
  // target -- see enemyIndices captured in playUltimateSequence.
  const infernalPactActive = state.ultimateBanner && state.ultimateBanner.name === 'Infernal Pact';
  let infernalPactOriginX = 50, infernalPactOriginY = 50, infernalPactHitPositions = [];
  if(infernalPactActive){
    ({ x: infernalPactOriginX, y: infernalPactOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    infernalPactHitPositions = (state.ultimateBanner.enemyIndices || []).map((i, n) => ({
      ...cellCenterPercent(i),
      delay: 0.1 + n * 0.05,
    }));
  }

  // Seraphine's Silver Judgment identity VFX -- same enemyIndices-based
  // derivation as Infernal Pact above, but her beams also need an ANGLE
  // and LENGTH toward each enemy (not just a position), since a beam is a
  // directional line rather than a radial ring/wave. --pact-x/y-style
  // percentages can't feed atan2 directly: the wrapper's aspect-ratio is
  // 5/7 (not square), so 1% of width and 1% of height are different
  // numbers of real pixels -- normalize the vertical delta by that ratio
  // first, or every beam would point at the wrong angle.
  const silverJudgmentActive = state.ultimateBanner && state.ultimateBanner.name === 'Silver Judgment';
  let silverJudgmentOriginX = 50, silverJudgmentOriginY = 50, silverJudgmentBeams = [];
  if(silverJudgmentActive){
    ({ x: silverJudgmentOriginX, y: silverJudgmentOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    silverJudgmentBeams = (state.ultimateBanner.enemyIndices || []).map((i, n) => {
      const { x: targetX, y: targetY } = cellCenterPercent(i);
      const { angleDeg, lengthPercent } = angleAndLengthPercent(silverJudgmentOriginX, silverJudgmentOriginY, targetX, targetY);
      return { targetX, targetY, angleDeg, lengthPercent, beamDelay: n * 0.03, hitDelay: 0.3 + n * 0.04 };
    });
  }

  // Omega Weapon's Omega Protocol identity VFX -- same enemyIndices-based
  // derivation as Infernal Pact/Silver Judgment above, but needs target
  // positions for the cast-phase targeting reticles too (not just the
  // impact-phase hits), since the brief wants a visible "lock-on" beat.
  const omegaProtocolActive = state.ultimateBanner && state.ultimateBanner.name === 'Omega Protocol';
  let omegaProtocolOriginX = 50, omegaProtocolOriginY = 50, omegaProtocolTargets = [];
  if(omegaProtocolActive){
    ({ x: omegaProtocolOriginX, y: omegaProtocolOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    omegaProtocolTargets = (state.ultimateBanner.enemyIndices || []).map((i, n) => ({
      ...cellCenterPercent(i),
      lockDelay: n * 0.05,
      hitDelay: 0.25 + n * 0.04,
    }));
  }

  // Shiva's Diamond Storm identity VFX -- same enemyIndices + angle/length
  // trig as Silver Judgment above (each enemy gets its own invisible
  // "rail" so the shard sparkles can travel to it at the right angle),
  // but the rail itself is never rendered visibly (opacity:0 in CSS) and
  // two shards per rail ride it instead of one, for a denser "storm" of
  // small crystals rather than a single beam per target.
  const diamondStormActive = state.ultimateBanner && state.ultimateBanner.name === 'Diamond Storm';
  let diamondStormOriginX = 50, diamondStormOriginY = 50, diamondStormRails = [];
  if(diamondStormActive){
    ({ x: diamondStormOriginX, y: diamondStormOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    diamondStormRails = (state.ultimateBanner.enemyIndices || []).map((i, n) => {
      const { x: targetX, y: targetY } = cellCenterPercent(i);
      const { angleDeg, lengthPercent } = angleAndLengthPercent(diamondStormOriginX, diamondStormOriginY, targetX, targetY);
      return { targetX, targetY, angleDeg, lengthPercent, shard1Delay: n * 0.03, shard2Delay: 0.06 + n * 0.03, hitDelay: 0.3 + n * 0.05 };
    });
  }

  // Bahamut's Megaflare identity VFX -- same enemyIndices-based derivation
  // as the destroy-based AOE cards above (Void Dominion/Infernal
  // Pact/Omega Protocol), but no angle math is needed for the sweep
  // itself (see the megaflare-sweep CSS comment) -- only each hit's
  // DELAY is derived here, staggered by horizontal distance from
  // Bahamut's own column so the impacts read as being caught in sequence
  // as the sweep washes outward from him, not all at once.
  const megaflareActive = state.ultimateBanner && state.ultimateBanner.name === 'Megaflare';
  let megaflareOriginX = 50, megaflareOriginY = 50, megaflareHits = [];
  if(megaflareActive){
    ({ x: megaflareOriginX, y: megaflareOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    megaflareHits = (state.ultimateBanner.enemyIndices || []).map((i, n) => {
      const { x, y } = cellCenterPercent(i);
      const horizFraction = Math.min(1, Math.abs(x - megaflareOriginX) / 100 * 1.5);
      return { x, y, hitDelay: 0.15 + horizFraction * 0.3 + n * 0.02 };
    });
  }

  // Fas 8 (design review #2, VFX expansion): the first three cards built
  // on the shared .ultimate-vfx/.vfx-* toolkit above instead of a bespoke
  // *-fx block each. All three still derive origin/target positions the
  // same way every existing card does (state.ultimateBanner's
  // sourceIndex/targetIndex/enemyIndices) -- only the CSS pieces they
  // compose are shared now, not re-invented.

  // Odin's Zantetsuken -- "seven lightning-fast strikes" against one
  // target: 7 staggered .vfx-hit flashes at the SAME target position
  // (delay set per-strike below, read inline in the markup) followed by
  // one .vfx-ring as the finishing blow. Single-target, so no
  // enemyIndices needed.
  const zantetsukenActive = state.ultimateBanner && state.ultimateBanner.name === 'Zantetsuken';
  let zantetsukenOriginX = 50, zantetsukenOriginY = 50, zantetsukenTargetX = 50, zantetsukenTargetY = 50, zantetsukenStrikes = [];
  if(zantetsukenActive){
    ({ x: zantetsukenOriginX, y: zantetsukenOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    const tIdx = state.ultimateBanner.targetIndex;
    if(tIdx != null){
      ({ x: zantetsukenTargetX, y: zantetsukenTargetY } = cellCenterPercent(tIdx));
      zantetsukenStrikes = [0,1,2,3,4,5,6].map(n => ({ delay: n * 0.07 }));
    }
  }

  // Tiamat's The Fivefold Apocalypse -- all five of her powers (fire/ice/
  // storm/void/nature) manifest together as five differently-colored
  // rings converging on the target in rapid sequence, regardless of which
  // one the player actually chose (SPECIAL_HANDLERS.tiamat's own choice
  // only affects the mechanical outcome) -- "Fivefold" reads as the whole
  // group of powers appearing at once, not just the picked one, and
  // avoids needing to thread the extra.power choice through
  // state.ultimateBanner just for this.
  const fivefoldActive = state.ultimateBanner && state.ultimateBanner.name === 'The Fivefold Apocalypse';
  let fivefoldTargetX = 50, fivefoldTargetY = 50;
  const FIVEFOLD_COLORS = [
    { ring:'rgba(255,140,60,0.95)', glow:'rgba(224,80,20,0.65)' },   // fire
    { ring:'rgba(170,225,255,0.95)', glow:'rgba(100,180,230,0.6)' }, // ice
    { ring:'rgba(220,180,255,0.95)', glow:'rgba(150,100,220,0.6)' }, // storm
    { ring:'rgba(150,90,220,0.95)', glow:'rgba(60,20,90,0.7)' },     // void
    { ring:'rgba(150,220,120,0.95)', glow:'rgba(70,140,50,0.6)' },   // nature
  ];
  if(fivefoldActive){
    const tIdx = state.ultimateBanner.targetIndex;
    if(tIdx != null){
      ({ x: fivefoldTargetX, y: fivefoldTargetY } = cellCenterPercent(tIdx));
    }
  }

  // Ancient Wyrmking's Conquests Witnessed -- a draconic roar/shockwave:
  // one big earthy .vfx-ring from his own cell plus a .vfx-hit per enemy
  // present at cast (true AOE, added to the aoeEnemyIndicesAtCast list in
  // playUltimateSequence), with a few lingering dust .vfx-twinkle
  // particles settling afterward.
  const wyrmkingActive = state.ultimateBanner && state.ultimateBanner.name === 'Conquests Witnessed';
  let wyrmkingOriginX = 50, wyrmkingOriginY = 50, wyrmkingHitPositions = [];
  if(wyrmkingActive){
    ({ x: wyrmkingOriginX, y: wyrmkingOriginY } = cellCenterPercent(state.ultimateBanner.sourceIndex));
    wyrmkingHitPositions = (state.ultimateBanner.enemyIndices || []).map((i, n) => ({
      ...cellCenterPercent(i),
      delay: 0.15 + n * 0.05,
    }));
  }

  // Odin's normal-attack Slash VFX -- unlike every derivation above, this
  // one is NOT gated on state.ultimateBanner at all (no cast/impact phase,
  // it's a plain one-shot triggered by an ordinary attack). Reads
  // state.odinSlashes directly (see battleNeighbors/placeCard) and reuses
  // Silver Judgment's aspect-ratio-normalized angle/length trig so the
  // trail correctly points from his cell at whichever cell he actually
  // attacked, however many pairs fired this placement.
  const odinSlashPairs = (state.odinSlashes || []).map(s => {
    const { x: sx, y: sy } = cellCenterPercent(s.sourceIndex);
    const { x: tx, y: ty } = cellCenterPercent(s.targetIndex);
    const { angleDeg, lengthPercent } = angleAndLengthPercent(sx, sy, tx, ty);
    return { sx, sy, tx, ty, angleDeg, lengthPercent, delay: (s.delay || 0) / 1000 };
  });

  let turnText;
  if(state.phase === 'result'){
    turnText = '';
  } else {
    turnText = state.turn === 'blue' ? 'Your move — choose a champion, then a square' : "The forest's move...";
  }

  let resultHtml = '';
  if(state.phase === 'result'){
    let title, sub;
    if(state.winner === 'blue'){ title = 'Victory'; sub = 'Your banner holds the field.'; }
    else if(state.winner === 'red'){ title = 'Defeat'; sub = 'The forest claims the board.'; }
    else { title = 'A Standstill'; sub = 'Neither banner could break the other.'; }

    if(state.draftMode === 'campaign' && state.winner === 'blue'){
      const unlockedNames = (state.campaignUnlocked||[]).map(id => (HEROES.find(h=>h.id===id)||{}).name).filter(Boolean);
      const complete = !currentCampaignStage();
      resultHtml = `
        <div class="result-banner">
          <h2>${complete ? 'Campaign Complete!' : 'Stage Cleared!'}</h2>
          <p>${sub}${unlockedNames.length ? ` ${unlockedNames.join(' and ')} join${unlockedNames.length===1?'s':''} your banner!` : ''}</p>
        </div>
        <button class="cta" id="campaign-next-btn">${complete ? 'Return to Campaign' : 'Next Stage'}</button>
      `;
    } else if(state.draftMode === 'campaign'){
      resultHtml = `
        <div class="result-banner">
          <h2>Stage Failed</h2>
          <p>${sub}</p>
        </div>
        <button class="cta" id="campaign-retry-btn">Retry Stage</button>
      `;
    } else {
      // Fas 6 (design review #2): matchStats (Fas 4) was only ever shown
      // pre-match in the "Your record" panel -- a fresh win streak or a
      // new best-streak record was invisible right at the moment it
      // actually happened. Non-campaign only, matching recordMatchResult's
      // own no-op-in-campaign gating above.
      const isNewBestStreak = state.winner === 'blue' && matchStats.currentStreak >= 2 && matchStats.currentStreak === matchStats.bestStreak;
      const favorite = favoriteCardInfo();
      const statsLines = [];
      if(state.winner === 'blue' && matchStats.currentStreak >= 2){
        statsLines.push(`🔥 ${matchStats.currentStreak}-win streak${isNewBestStreak ? ' — new best!' : ''}`);
      }
      if(favorite){
        statsLines.push(`⭐ Favorite champion: ${favorite.name} (${favorite.wins} win${favorite.wins>1?'s':''})`);
      }
      // Fas 7 (design review #2, "meta layer" tier): a newly unlocked
      // achievement is exactly the kind of payoff that belongs right here,
      // same principle as the streak/favorite lines above.
      (state.newAchievements || []).forEach(id => {
        const ach = ACHIEVEMENTS.find(a => a.id === id);
        if(ach) statsLines.push(`🏅 Achievement unlocked: ${ach.name}`);
      });
      resultHtml = `

          <h2>${title}</h2>
          <p>${sub}</p>
          ${statsLines.length ? `<div class="result-stats">${statsLines.map(l=>`<div>${l}</div>`).join('')}</div>` : ''}
        </div>
        <button class="cta" id="rematch-btn">Draft Again</button>
      `;
    }
  }

  return `

/* ---------------- interaction ---------------- */
function attachHandlers(){
  const soundBtn = document.getElementById('sound-toggle');
  if(soundBtn) soundBtn.addEventListener('click', toggleSound);
  const musicBtn = document.getElementById('music-toggle');
  if(musicBtn) musicBtn.addEventListener('click', toggleMusic);
  const fsBtn = document.getElementById('fullscreen-toggle');
  if(fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
  const fastBtn = document.getElementById('fast-toggle');
  if(fastBtn) fastBtn.addEventListener('click', toggleFastMode);
  const bookBtn = document.getElementById('book-toggle');
  if(bookBtn) bookBtn.addEventListener('click', openRulebook);

  const howToPlayBtn = document.getElementById('how-to-play-btn');
  if(howToPlayBtn) howToPlayBtn.addEventListener('click', startTutorial);
  const tutorialNext = document.getElementById('tutorial-next');
  if(tutorialNext) tutorialNext.addEventListener('click', ()=>{
    state.tutorialStep++;
    render();
  });
  const tutorialSkip = document.getElementById('tutorial-skip');
  if(tutorialSkip) tutorialSkip.addEventListener('click', endTutorial);
  const tutorialFinish = document.getElementById('tutorial-finish');
  if(tutorialFinish) tutorialFinish.addEventListener('click', endTutorial);
  document.querySelectorAll('.beginner-deck-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const deck = BEGINNER_DECKS.find(d => d.id === btn.dataset.deck);
      if(!deck) return;
      state.selected = deck.cardIds.slice();
      render();
    });
  });
  document.querySelectorAll('.difficulty-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.aiDifficulty = btn.dataset.difficulty;
      saveAIDifficulty(state.aiDifficulty);
      render();
    });
  });

  document.querySelectorAll('.info-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openCardModal(btn.dataset.info);
    });
  });

  // The diamond badge (.special-diamond) has pointer-events:none and no
  // listener of its own — it's a pure indicator. Clicks pass straight
  // through to the .cell handler below, which activates the special once
  // it's ready (see boardCellHtml's specialInfo / the .cell click handler).

  const overlay = document.getElementById('modal-overlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{
      if(e.target.id === 'modal-overlay') closeCardModal();
    });
  }
  const modalClose = document.getElementById('modal-close');
  if(modalClose) modalClose.addEventListener('click', closeCardModal);

  const rulebookOverlay = document.getElementById('rulebook-overlay');
  if(rulebookOverlay){
    rulebookOverlay.addEventListener('click', (e)=>{
      if(e.target.id === 'rulebook-overlay') closeRulebook();
    });
  }
  const rulebookClose = document.getElementById('rulebook-close');
  if(rulebookClose) rulebookClose.addEventListener('click', closeRulebook);
  const rulebookPrev = document.getElementById('rulebook-prev');
  if(rulebookPrev) rulebookPrev.addEventListener('click', ()=> rulebookGo(-1));
  const rulebookNext = document.getElementById('rulebook-next');
  if(rulebookNext) rulebookNext.addEventListener('click', ()=> rulebookGo(1));

  const graveyardToggle = document.getElementById('graveyard-toggle');
  if(graveyardToggle) graveyardToggle.addEventListener('click', ()=>{
    state.showGraveyard = true;
    render();
  });
  const graveyardOverlay = document.getElementById('graveyard-overlay');
  if(graveyardOverlay){
    graveyardOverlay.addEventListener('click', (e)=>{
      if(e.target.id === 'graveyard-overlay') { state.showGraveyard = false; render(); }
    });
  }
  const graveyardClose = document.getElementById('graveyard-close');
  if(graveyardClose) graveyardClose.addEventListener('click', ()=>{
    state.showGraveyard = false;
    render();
  });

  const choicePickerOverlay = document.getElementById('choice-picker-overlay');
  if(choicePickerOverlay){
    choicePickerOverlay.addEventListener('click', (e)=>{
      if(e.target.id === 'choice-picker-overlay') cancelSpecial();
    });
  }
  const choicePickerCancel = document.getElementById('choice-picker-cancel');
  if(choicePickerCancel) choicePickerCancel.addEventListener('click', cancelSpecial);
  document.querySelectorAll('.choice-picker-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> resolveSpecialChoice(btn.dataset.choice));
  });

  if(state.phase === 'draft'){
    const modeRandom = document.getElementById('mode-random');
    if(modeRandom) modeRandom.addEventListener('click', ()=>{
      if(state.draftMode === 'random') return;
      state.draftMode = 'random';
      SFX.select();
      render();
    });
    const modeManual = document.getElementById('mode-manual');
    if(modeManual) modeManual.addEventListener('click', ()=>{
      if(state.draftMode === 'manual') return;
      state.draftMode = 'manual';
      SFX.select();
      render();
    });
    const modeCampaign = document.getElementById('mode-campaign');
    if(modeCampaign) modeCampaign.addEventListener('click', ()=>{
      if(state.draftMode === 'campaign') return;
      state.draftMode = 'campaign';
      state.selected = campaignProgress.stageIndex === 0 ? CAMPAIGN_STARTERS.slice() : [];
      SFX.select();
      render();
    });

    const drawPile = document.getElementById('draw-pile-btn');
    if(drawPile && !drawPile.classList.contains('disabled')){
      drawPile.addEventListener('click', ()=>{
        SFX.begin();
        state.revealing = true;
        render();
        setTimeout(()=>{ drawRandomFive(); }, 450);
      });
    }

    if(state.draftMode === 'manual'){
      document.querySelectorAll('.draft-grid .card').forEach(el=>{
        el.addEventListener('click', ()=>{
          const id = el.dataset.cardid;
          const idx = state.selected.indexOf(id);
          if(idx >= 0){ state.selected.splice(idx,1); SFX.deselect(); }
          else if(state.selected.length < 5){ state.selected.push(id); SFX.select(); }
          render();
        });
      });
      const beginManual = document.getElementById('begin-btn-manual');
      if(beginManual) beginManual.addEventListener('click', ()=>{ SFX.begin(); startBattle(); });
    }

    if(state.draftMode === 'campaign'){
      if(campaignProgress.stageIndex > 0){
        document.querySelectorAll('.draft-grid .card.selectable').forEach(el=>{
          el.addEventListener('click', ()=>{
            const id = el.dataset.cardid;
            const idx = state.selected.indexOf(id);
            if(idx >= 0){ state.selected.splice(idx,1); SFX.deselect(); }
            else if(state.selected.length < 5){ state.selected.push(id); SFX.select(); }
            render();
          });
        });
      }
      const campaignBegin = document.getElementById('campaign-begin-btn');
      if(campaignBegin) campaignBegin.addEventListener('click', ()=>{ SFX.begin(); startCampaignBattle(); });
      const sisterLoreToggle = document.getElementById('sister-lore-toggle');
      if(sisterLoreToggle) sisterLoreToggle.addEventListener('click', ()=>{
        state.showSisterLore = !state.showSisterLore;
        render();
      });
      const campaignNgPlus = document.getElementById('campaign-ngplus-btn');
      if(campaignNgPlus) campaignNgPlus.addEventListener('click', ()=>{
        campaignProgress = { stageIndex:0, unlocked:campaignProgress.unlocked, ngPlus:campaignProgress.ngPlus+1 };
        saveCampaignProgress();
        state.selected = CAMPAIGN_STARTERS.slice();
        SFX.begin();
        render();
      });
      const campaignReset = document.getElementById('campaign-reset-btn');
      if(campaignReset) campaignReset.addEventListener('click', ()=>{
        if(!confirm('Reset all campaign progress? This cannot be undone.')) return;
        campaignProgress = { stageIndex:0, unlocked:[], ngPlus:0 };
        saveCampaignProgress();
        state.selected = CAMPAIGN_STARTERS.slice();
        render();
      });
    }

    const sameBox = document.getElementById('rule-same');
    if(sameBox) sameBox.addEventListener('change', ()=>{
      state.rules.same = sameBox.checked;
      if(!state.rules.same && !state.rules.plus) state.rules.combo = false;
      render();
    });
    const plusBox = document.getElementById('rule-plus');
    if(plusBox) plusBox.addEventListener('change', ()=>{
      state.rules.plus = plusBox.checked;
      if(!state.rules.same && !state.rules.plus) state.rules.combo = false;
      render();
    });
    const comboBox = document.getElementById('rule-combo');
    if(comboBox) comboBox.addEventListener('change', ()=>{
      state.rules.combo = comboBox.checked;
      render();
    });
    const elementalBox = document.getElementById('rule-elemental');
    if(elementalBox) elementalBox.addEventListener('change', ()=>{
      state.rules.elemental = elementalBox.checked;
      render();
    });
    const graveyardBox = document.getElementById('rule-graveyard');
    if(graveyardBox) graveyardBox.addEventListener('change', ()=>{
      state.rules.graveyard = graveyardBox.checked;
      render();
    });
  } else {
    document.querySelectorAll('.hand-row:not(.enemy) .card').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(state.turn!=='blue' || state.phase!=='battle' || state.placedThisTurn || state.ultimateBanner) return;
        const id = el.dataset.cardid;
        const opening = state.pendingCard !== id;
        state.pendingCard = opening ? id : null;
        state.specialMode = null;
        opening ? SFX.select() : SFX.deselect();
        render();
      });
    });
    document.querySelectorAll('.cell').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = parseInt(el.dataset.cell,10);
        if(state.specialMode && !state.specialMode.choices){
          resolveSpecialTarget(i);
          return;
        }
        // A pulsing (ready-special) card is a tap target in its own right —
        // tap it to activate, tap it again to cancel while targeting.
        const entry = state.board[i];
        if(entry && entry.owner==='blue' && entry.card.special){
          const ready = state.turn==='blue' && state.phase==='battle' && !state.ultimateBanner && specialUsable(entry.card, 'blue', entry);
          if(ready){ executeSpecial(i); return; }
        }
        if(state.turn!=='blue' || state.phase!=='battle' || !state.pendingCard || state.placedThisTurn || state.ultimateBanner) return;
        if(state.board[i]) return;
        placeCard(i, state.pendingCard, 'blue');
      });
    });
    const endTurnBtn = document.getElementById('end-turn-btn');
    if(endTurnBtn) endTurnBtn.addEventListener('click', endPlayerTurn);
    const rematch = document.getElementById('rematch-btn');
    if(rematch) rematch.addEventListener('click', resetGame);
    const concede = document.getElementById('concede-btn');
    if(concede) concede.addEventListener('click', resetGame);
    const campaignNext = document.getElementById('campaign-next-btn');
    if(campaignNext) campaignNext.addEventListener('click', resetGame);
    const campaignRetry = document.getElementById('campaign-retry-btn');
    if(campaignRetry) campaignRetry.addEventListener('click', resetGame);
  }
}

function drawRandomFive(){
  if(HEROES.length === 0) return;
  const pool = shuffle(HEROES.slice());
  state.selected = pool.slice(0, Math.min(5, pool.length)).map(h => h.id);
  startBattle();
}

function startCampaignBattle(){
  const stage = currentCampaignStage();
  if(!stage) return;
  // Stage 1 always fields the fixed starter five — state.selected may not
  // already hold them (e.g. returning here via resetGame() after a retry,
  // which always clears selected), so force it rather than trusting
  // whatever the picker last left behind.
  if(campaignProgress.stageIndex === 0) state.selected = CAMPAIGN_STARTERS.slice();
  if(state.selected.length !== 5) return;
  state.rules = { ...stage.rules };
  startBattle();
}

// New Game+: the same 16 stages, but the forest's champions hit harder —
// a flat +2 Power per NG+ cycle on all 4 sides, capped at 3 cycles (+6)
// so repeated NG+ runs don't spiral into absurd numbers. Returns a
// shallow copy so the shared FOREST_FOES objects (reused by every battle,
// including plain Random Draft/Choose Your Five matches) are never mutated.
function ngPlusBoostCard(card, ngPlus){
  if(!ngPlus) return card;
  const boost = Math.min(ngPlus, 3) * 2;
  return { ...card, top: card.top+boost, right: card.right+boost, bottom: card.bottom+boost, left: card.left+boost };
}

// Fas 7 (design review #2): a stage's own flat statBoost (see
// CAMPAIGN_STAGES, stages 9-16) -- same shallow-copy shape as
// ngPlusBoostCard above but a SEPARATE, uncapped amount that isn't folded
// into the NG+ cycle math, so a late stage's own escalation and a real
// New Game+ replay stack additively instead of one silently capping the
// other.
function campaignStatBoost(card, amount){
  if(!amount) return card;
  return { ...card, top: card.top+amount, right: card.right+amount, bottom: card.bottom+amount, left: card.left+amount };
}

function startBattle(){
  const chosenHeroes = HEROES.filter(h => state.selected.includes(h.id));
  state.playerHand = shuffle(chosenHeroes.slice());
  const campaignStage = state.draftMode === 'campaign' ? currentCampaignStage() : null;
  state.enemyHand = campaignStage
    ? campaignStage.enemyIds.map(id => FOREST_FOES.find(f=>f.id===id)).filter(Boolean).map(c => campaignStatBoost(ngPlusBoostCard(c, campaignProgress.ngPlus), campaignStage.statBoost))
    : drawEnemyHand();
  state.board = Array(9).fill(null);
  state.pendingCard = null;
  state.log = 'Place a champion to claim the first square.';

  const startingTurn = Math.random() < 0.5 ? 'blue' : 'red';
  state.turn = startingTurn;
  state.coinTurn = startingTurn;
  state.placedThisTurn = false;
  state.phase = 'coinflip';
  render();

  setTimeout(()=>{
    state.phase = 'battle';
    render();
    if(state.turn === 'red'){ setTimeout(enemyTurn, 700); }
  }, 2700);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const ELEMENT_BEATS = { fire:'wind', wind:'earth', earth:'water', water:'fire' };
// fire/wind/earth/water are the only elements the classic Elemental board
// rule (ELEMENT_BEATS above) understands; light/dark/shadow/magic/ice only
// ever matter for a specific card's own active.weakVsElement clause, never
// for that rule — but every element still needs an icon here, since
// cardFace()'s badge renders ELEMENT_ICONS[card.element] unconditionally
// whenever card.element is set (Naline/Umbrael/Nexzoth/Morvath's badges
// were silently printing the literal text "undefined" before this fix —
// a pre-existing gap from whenever those cards' elements were added,
// noticed and fixed in passing while giving Shiva her own 'ice').
const ELEMENT_ICONS = { fire:'🔥', wind:'🌪️', earth:'🌍', water:'💧', ice:'❄️', light:'✨', dark:'🌑', shadow:'🖤', magic:'🔮' };
function elementBeats(a, b){ return a && b && ELEMENT_BEATS[a] === b; }

// Choice sets for specials whose targets:'element' or two-step flow needs
// an extra pick beyond (or instead of) a board target — rendered by
// renderChoicePicker(), resolved by resolveSpecialChoice().
const ELEMENT_CHOICES = ['fire','wind','earth','water'].map(el => ({ value: el, icon: ELEMENT_ICONS[el], label: el[0].toUpperCase()+el.slice(1) }));
// Each of the five powers resolves differently now (see
// SPECIAL_HANDLERS.tiamat) — Fire/Ice/Storm/Void/Nature are real mechanical
// choices, not just flavor labels on an identical effect.
const TIAMAT_POWER_CHOICES = [
  { value:'fire', icon:'🔥', label:'Fire' },
  { value:'ice', icon:'❄️', label:'Ice' },
  { value:'storm', icon:'⚡', label:'Storm' },
  { value:'void', icon:'🌀', label:'Void' },
  { value:'nature', icon:'🌿', label:'Nature' },
];
const DIRECTION_CHOICES = [
  { value:'up', icon:'⬆️', label:'Up' },
  { value:'right', icon:'➡️', label:'Right' },
  { value:'down', icon:'⬇️', label:'Down' },
  { value:'left', icon:'⬅️', label:'Left' },
];

// Shared by every "line in a chosen direction" effect (The Celestial
// Judgment's Eternal Verdict, The Infinite Seraph's All Possibilities, The
// Eclipse Fenrir's on-place passive and Ragnarök, Vorgrath's The Falling
// World) —
// every enemy card strictly beyond `index` in that direction, not the whole
// row/column. Returns {index, entry} pairs (not bare entries) since
// board-mutating callers like Judgment's destroy branch need the index too.
function enemiesInDirection(index, direction, owner){
  const row = Math.floor(index / 3), col = index % 3;
  const targets = [];
  for(let i = 0; i < 9; i++){
    const r = Math.floor(i / 3), c = i % 3;
    if(direction === 'up' && c === col && r < row) targets.push(i);
    else if(direction === 'down' && c === col && r > row) targets.push(i);
    else if(direction === 'left' && r === row && c < col) targets.push(i);
    else if(direction === 'right' && r === row && c > col) targets.push(i);
  }
  return targets
    .map(i => ({ index: i, entry: state.board[i] }))
    .filter(p => p.entry && p.entry.owner !== owner);
}

// The Infinite Seraph's Eternal Presence: "no cards can be removed,
// destroyed, or swapped by opponent's effects" while she's on the board —
// read as protecting her WHOLE side, not just herself. Checked directly by
// the handful of handlers that actually destroy or swap cards (Vaelira,
// Nyxara, Deathblade) rather than as a blanket engine-wide guard.
function protectedByInfiniteSeraph(owner){
  return state.board.some(e => e && e.owner === owner && e.card.id === 'infiniteseraph');
}

// Naline's Sanctuary: "your cards can't be removed from the board by the
// opponent's effects — EXCEPT Ultimate effects." Written as a real,
// generalizable whole-side guard (parallel to protectedByInfiniteSeraph
// above) even though nothing calls it yet: every destroy-capable effect in
// the game today is an Ultimate (SPECIAL_HANDLERS), which the card's own
// text explicitly carves out — so wiring this into any of those sites
// would contradict the card, and there's currently no non-Ultimate destroy
// effect for it to protect against. Reserved for a future on-place/passive
// destroy effect, same "dormant until relevant content exists" shape as
// weakVsElement before Naline/Umbrael gave it live triggers.
function protectedBySanctuary(owner){
  return state.board.some(e => e && e.owner === owner && e.card.id === 'naline');
}

// Shared adjacency lookup: the live board entries (with their index)
// orthogonally next to cellIndex. fullEffectiveValue's own adjacency checks
// (adjacentEnemiesBoost/adjacentAlliesBoost/etc.) only ever need a COUNT and
// inline their own row/col math for that; this is for on-place/on-capture
// hooks that need the actual ENTRIES to act on (Shiva/Leviathan's Frost
// Aura, Chocobo King's King's Command), so it's a proper standalone helper.
function adjacentEntries(cellIndex){
  const row = Math.floor(cellIndex/3), col = cellIndex%3;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const out = [];
  dirs.forEach(([dr,dc])=>{
    const r = row+dr, c = col+dc;
    if(r<0||r>2||c<0||c>2) return;
    const idx = r*3+c;
    const entry = state.board[idx];
    if(entry) out.push({ index: idx, entry });
  });
  return out;
}

// Shared destruction path for every Special that removes a card from the
// board outright (as opposed to a normal flip/capture). When the Graveyard
// optional rule is on, the destroyed card is recorded in its owner's
// Graveyard instead of simply vanishing.
function destroyCard(index, opts){
  const entry = state.board[index];
  if(!entry) return;
  // Zlaizer's Light of Forgiveness: "50% chance to place it in your
  // Graveyard instead" — a per-side safety net independent of the global
  // Graveyard rule. If the rule is already on, recording happens
  // unconditionally as normal; if it's off, Zlaizer still gives his OWN
  // side a coin-flip chance to record anyway (never the opponent's side).
  // Nexzoth's World Shatter/The Ending are explicitly "cannot be revived"
  // (unlike every other destroy effect, which is fine going to the
  // Graveyard like normal) — opts.noRevive skips the recording entirely,
  // even with the Graveyard rule on.
  const zlaizer = state.board.some(e => e && e.owner === entry.owner && e.card.active && e.card.active.chanceToGraveyardIfRuleOff);
  if(!(opts && opts.noRevive) && (state.rules.graveyard || (zlaizer && Math.random() < 0.5))){
    state.graveyard[entry.owner].push(entry.card);
  }
  state.board[index] = null;
  // Multi-target destroy effects (Vaelira's Infernal Pact, Nexzoth's The
  // Ending, etc.) previously left the emptied cell with zero visual
  // feedback the instant the special resolved — the card just vanished,
  // no different from an ordinary empty square. destroyGhosts keeps a
  // short-lived record of what stood here so boardCellHtml can render a
  // fading "shattered" version of it in the same cell; cleared by the same
  // 1300ms timeouts that already clear attackFlash/bonusFlash elsewhere.
  state.destroyGhosts.push({ index, card: entry.card, owner: entry.owner });
  // Morvath's King of the Depths: "+1 Power every time an enemy card is
  // removed from the board" — read as a generic hook on the shared destroy
  // path itself rather than duplicating the check into every handler that
  // calls destroyCard, so it fires no matter which effect (his own Abyssal
  // Grasp/Ultimate included) did the destroying.
  const beneficiaryOwner = entry.owner === 'blue' ? 'red' : 'blue';
  const morvath = state.board.find(e => e && e.owner === beneficiaryOwner && e.card.active && e.card.active.buffOnEnemyDestroyed);
  if(morvath) SpecialVerbs.attackBoost(morvath, 1);
  // Omega Weapon's Destroyer Protocol: the same "+1 per enemy destroyed this
  // match" hook as King of the Depths above, but CAPPED (his card text says
  // "max +3", Morvath's doesn't) — tracked via a running stack counter
  // instead of reusing onWinDebuffOnce's simple used-once boolean shape,
  // since this can fire more than once but not unboundedly.
  const omega = state.board.find(e => e && e.owner === beneficiaryOwner && e.card.active && e.card.active.buffOnEnemyDestroyedCapped);
  if(omega){
    const cfg = omega.card.active.buffOnEnemyDestroyedCapped;
    omega.buffOnEnemyDestroyedStacks = omega.buffOnEnemyDestroyedStacks || 0;
    if(omega.buffOnEnemyDestroyedStacks < cfg.max){
      SpecialVerbs.attackBoost(omega, cfg.amount);
      omega.buffOnEnemyDestroyedStacks += cfg.amount;
    }
  }
}

// Generalizes the permanent card-level active.destroyImmune (Three Head
// Dragon) into also covering a temporary PER-ENTRY window — Naline's Rise
// Again ultimate revives graveyard cards that "can't be removed by the
// opponent's effects this round" (entry.destroyImmuneUntilTurnCount, same
// "+2" one-round convention as every other round-clock flag). Every
// destroy-capable handler now calls this instead of reading
// entry.card.active.destroyImmune directly.
function isDestroyImmune(entry){
  if(!entry) return false;
  if(entry.card.active && entry.card.active.destroyImmune) return true;
  if(entry.destroyImmuneUntilTurnCount > state.turnCount) return true;
  return false;
}

function effectiveValue(card, edgeKey, opponentCard){
  let v = card[edgeKey];
  const a = card.active;
  if(a){
    if(a.bonus && a.bonus.dir === edgeKey) v += a.bonus.amount;
    if(a.underdogBonus && opponentCard){
      const mySum = card.top + card.right + card.bottom + card.left;
      const oppSum = opponentCard.top + opponentCard.right + opponentCard.bottom + opponentCard.left;
      if(mySum < oppSum) v += a.underdogBonus;
    }
  }
  if(state.rules.elemental && opponentCard && elementBeats(card.element, opponentCard.element)){
    v += 1;
  }
  return v;
}

/* ---------------- Rivalry Pairs ---------------- */
// Lore-linked champions that reward standing side by side.
const RIVALRY_PAIRS = [
  ['darien', 'elara'],       // The Shadowarden & the Light's Grace
  ['pallis', 'pallispell'],  // Reunited with Pell's pack
];
// Naline's two "Order of the Radiance" rivalries (with Ragnar and
// Deathblade) were dropped when she was fully redesigned into The Soul
// Healer — a standalone angelic reviver with no remaining tie to that
// group's flavor.

function isRivalryPair(idA, idB){
  return RIVALRY_PAIRS.some(([a,b]) => (a===idA && b===idB) || (a===idB && b===idA));
}

/* ---------------- Triple Triad Sisters (boss trio) ---------------- */
// Vaelira/Seraphine/Nyxara share a count-based aura (see card.active.sisterAura)
// and a uniform "Broken Focus" weakness: recapturing one of them back to her
// own side after the enemy took her costs her -3 Power that round. Both are
// generic, id-keyed additions rather than one-off hacks, so any future boss
// trio could reuse the same fields.
const SISTER_IDS = ['vaelira', 'seraphine', 'nyxara'];
function sistersPresentCount(selfId, owner){
  return SISTER_IDS.filter(id => id !== selfId && state.board.some(e => e && e.owner === owner && e.card.id === id)).length;
}
// Called right after any code path sets `entry.owner = owner` — flags a
// sister as "captured" the moment she leaves her home side, then applies
// the Weakness penalty the moment she's won back to it.
function checkSisterFlip(entry){
  if(!entry || !SISTER_IDS.includes(entry.card.id)) return;
  if(entry.owner !== entry.sisterHomeOwner){
    entry.sisterWasCaptured = true;
  } else if(entry.sisterWasCaptured){
    SpecialVerbs.debuff(entry, 3);
    entry.sisterWasCaptured = false;
  }
}

// Called from battleNeighbors right after a normal (non-special) attack
// wins, alongside checkSisterFlip above — additive, once-per-match passives
// that key off "the side used in a winning attack": Tiamat's Queen of
// Dragons and The Eclipse Fenrir's Moon's Shadow (permanent self-buff on
// that side) and The Celestial Judgment's Judgment Strike (permanent debuff
// to the loser instead, on the card's very first win of the match,
// regardless of which side). Both flags live on the winning entry so they
// reset naturally with a fresh placement.
// winnerIndex/winnerVal are only needed by the newer hooks below (Kaeldryx's
// Execution, Nexzoth/Morvath's line-destroys) — every existing caller only
// ever passed the first four args, so both are optional.
function checkOnWinBonuses(winnerEntry, myEdge, loserEntry, loserIndex, winnerIndex, winnerVal){
  // Fas 7 (design review #2): Ifrit's "Rage of the Beast" ("when Ifrit
  // loses control of a card, he gets +2 on all sides next round") was
  // flavor-only for an unresolved reading -- himself being captured, or
  // his SIDE losing a different card he'd previously captured. Read as
  // the latter (a reactive team-loss trigger fits "Rage" better than a
  // self-capture clause, and this function already hands us the loser's
  // owner for free): whenever ANY card on the loser's side goes down in a
  // normal battle, if Ifrit is on that same losing side, he rages. Checked
  // BEFORE the `if(!a) return` guard below -- unlike every other hook in
  // this function, this one is keyed off the LOSER's side having Ifrit,
  // not the winning card's own active flags, so it must not be skipped
  // just because the WINNING card happens to have no active object at
  // all (e.g. a plain filler card). Like every hook here, this only sees
  // normal directional captures, not Same/Plus/Combo.
  if(loserEntry){
    // loserEntry.owner has ALREADY been flipped to the winner's owner by
    // the time this runs (see battleNeighbors, which sets target.owner
    // before calling this) -- the loser's ORIGINAL side is the opposite
    // of winnerEntry's, not loserEntry's own (now-stale) owner field.
    const losingSide = winnerEntry.owner === 'blue' ? 'red' : 'blue';
    const ragingIfrit = state.board.find(e => e && e.owner === losingSide && e.card.active && e.card.active.rageOfTheBeast);
    if(ragingIfrit) SpecialVerbs.buffThisRound(ragingIfrit, 2);
  }
  const a = winnerEntry.card.active;
  if(!a) return;
  if(a.onWinDirectionalBoost && !winnerEntry.onWinDirectionalBoostUsed){
    SpecialVerbs.directionalBoost(winnerEntry, [myEdge], a.onWinDirectionalBoost);
    winnerEntry.onWinDirectionalBoostUsed = true;
  }
  if(a.onWinDebuffOnce && !winnerEntry.onWinDebuffOnceUsed){
    SpecialVerbs.debuff(loserEntry, a.onWinDebuffOnce);
    winnerEntry.onWinDebuffOnceUsed = true;
  }
  // Tilda's Umbral Step: "change one of her directions by +1 for the next
  // turn" — no direction-choice UI exists, so a random side is picked
  // each win (same simplification as Fenrir/Zalazar's own directional
  // picks), replacing whichever side was previously chosen. Modeled as a
  // live, self-expiring read in fullEffectiveValue (entry.umbralStepSide +
  // entry.umbralStepUntilTurnCount) rather than a permanent
  // SpecialVerbs.directionalBoost call or a captureBonus/tempEffects
  // route like buffThisRound — same "compute live off two plain runtime
  // fields, nothing to reverse" shape as the boardLeadBonus/pairPresence
  // checks in fullEffectiveValue, gated by the same state.turnCount+4
  // round-clock window Medusa's Stone Gaze (petrifiedUntilTurnCount)
  // already uses for "this round"/"next turn" effects.
  if(a.onWinRandomDirectionalBoost){
    const sides = ['top','right','bottom','left'];
    winnerEntry.umbralStepSide = sides[Math.floor(Math.random()*sides.length)];
    winnerEntry.umbralStepUntilTurnCount = state.turnCount + 4;
  }
  // Tahabata's Soul Petrification: "that card can't be won back during the
  // next battle" — a plain SpecialVerbs.grantShield() call (same primitive
  // Pallis's Wave of Loyalty already uses), fired once per individual
  // capture since checkOnWinBonuses already runs per-flip.
  if(a.onCaptureGrantShield){
    SpecialVerbs.grantShield(loserEntry);
  }
  // Tahabata's Wrath Eruption: "-1 Power on the side facing him, this
  // round" to every adjacent ENEMY card after he wins — same
  // opposite-side-facing computation as Templaren's Holy Aura, but
  // triggered on win (around the WINNER's own cell, winnerIndex — not the
  // just-captured cell) instead of on placement, debuffing instead of
  // buffing, and temporary instead of permanent. directionalBoost() is
  // always permanent (checked — every other caller uses it that way), so
  // this uses the same live, self-expiring entry.xUntilTurnCount idiom
  // Umbral Step above already established, just applied to each affected
  // neighbor's OWN entry instead of the caster's. Read unconditionally in
  // fullEffectiveValue (not gated by that neighbor's own active.*, since
  // the flag lives on the victim, not the source) — same as
  // entry.sideBonus is already read unconditionally there.
  if(a.onWinAdjacentEnemyDebuff && winnerIndex != null){
    const row = Math.floor(winnerIndex/3), col = winnerIndex%3;
    const dirs = [[-1,0,'bottom'],[1,0,'top'],[0,-1,'right'],[0,1,'left']];
    dirs.forEach(([dr,dc,side])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== winnerEntry.owner && !isDebuffImmuneNow(n.card)){
        n.wrathEruptionSide = side;
        n.wrathEruptionUntilTurnCount = state.turnCount + 4;
      }
    });
  }
  // Pallis's Chain of Loyalty: "choose an adjacent enemy card — if Pallis
  // has higher strength facing it, take control of it directly." No
  // target-choice UI, so a random adjacent enemy is picked (same
  // simplification as every other "choose 1" ability). "Strength facing
  // it" read as the specific directional side value (matching every other
  // "facing" comparison in this game), reusing the already-existing
  // effectiveStatFor() helper (built for the board's live stat display)
  // to fold in captureBonus/sideBonus on both sides fairly — entries
  // already carry captureBonus/sideBonus directly, so they can be passed
  // as effectiveStatFor's opts as-is. Respects shields via the same
  // specialBlockedByShield() every single-target Ultimate already uses
  // (which also means it respects Protective Aura's capture-immunity
  // window above, for free).
  if(a.onWinChainCapture && winnerIndex != null){
    const row = Math.floor(winnerIndex/3), col = winnerIndex%3;
    const dirs = [[-1,0,'top','bottom'],[1,0,'bottom','top'],[0,-1,'left','right'],[0,1,'right','left']];
    const candidates = [];
    dirs.forEach(([dr,dc,mySide,theirSide])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== winnerEntry.owner) candidates.push({ entry:n, index:r*3+c, mySide, theirSide });
    });
    if(candidates.length > 0){
      const pick = candidates[Math.floor(Math.random()*candidates.length)];
      const myVal = effectiveStatFor(winnerEntry.card, pick.mySide, winnerEntry).value;
      const theirVal = effectiveStatFor(pick.entry.card, pick.theirSide, pick.entry).value;
      if(myVal > theirVal && !specialBlockedByShield(pick.entry, pick.index)){
        pick.entry.owner = winnerEntry.owner;
        pick.entry.justFlipped = true;
        checkSisterFlip(pick.entry);
      }
    }
  }
  // Three Head Dragon's Fire's Wrath: every enemy card orthogonally around
  // the just-captured square also gets hit — no "once per match" cap in
  // the source text, unlike the two hooks above, so this fires on every win.
  if(a.onWinAreaDebuff && loserIndex != null){
    const row = Math.floor(loserIndex/3), col = loserIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== winnerEntry.owner) SpecialVerbs.debuff(n, a.onWinAreaDebuff);
    });
  }
  // Kaeldryx's Execution: "wins a round with 10+ Power, destroy that enemy
  // card outright" — no "once per match" cap in the source text either, so
  // this can trigger on every qualifying win, same as onWinAreaDebuff above.
  if(a.onWinPowerThresholdDestroy && loserIndex != null && winnerVal != null && winnerVal >= a.onWinPowerThresholdDestroy){
    if(!isDestroyImmune(loserEntry)) destroyCard(loserIndex);
  }
  // Deathblade's Executioner: mirror of the hook above, but checks the
  // LOSER's total power instead of the winner's effective power for that
  // battle — "wins against a 6-or-lower card" rather than "wins with 10+".
  if(a.onWinDestroyIfLoserWeak && loserIndex != null && totalPower(loserEntry) <= a.onWinDestroyIfLoserWeak.maxTotal){
    if(!isDestroyImmune(loserEntry)) destroyCard(loserIndex, { noRevive: !!a.onWinDestroyIfLoserWeak.noRevive });
  }
  // Nyxara's Shadow Rend: "a devastating void strike that shreds the
  // weakest [enemy card]" — previously Flavor only for lacking a generic
  // "destroy the weakest enemy anywhere on the board" hook. Scans every
  // remaining enemy card (post-flip, so the card she just captured is
  // already hers and never a candidate) for the lowest totalPower and
  // destroys it, respecting isDestroyImmune.
  // BALANCE (not a text-fidelity simplification — a deliberate deviation,
  // same reasoning as onWinLineDestroy below): capped to once per match via
  // onWinDestroyWeakestUsed. An uncapped "destroy the weakest enemy on every
  // win" stacked on Nyxara's own already-high stats and sisterAura scaling
  // would be a snowball with no real counterplay.
  if(a.onWinDestroyWeakestEnemy && !winnerEntry.onWinDestroyWeakestUsed){
    let weakestIndex = null, weakestPower = Infinity;
    state.board.forEach((e, i) => {
      if(!e || e.owner === winnerEntry.owner || isDestroyImmune(e)) return;
      const p = totalPower(e);
      if(p < weakestPower){ weakestPower = p; weakestIndex = i; }
    });
    if(weakestIndex != null){
      destroyCard(weakestIndex);
      winnerEntry.onWinDestroyWeakestUsed = true;
    }
  }
  // Nexzoth's World Shatter / Morvath's Abyssal Grasp: "destroy every card
  // further along the line the just-won battle happened on" — read as the
  // same enemiesInDirection() line-scan every directional ultimate already
  // uses, with the direction derived from which edge just won (myEdge:'top'
  // means the loser was above the winner, i.e. direction 'up', etc.). Only
  // ever hits enemy cards (enemiesInDirection filters by owner), same as
  // every other directional AOE — including the just-flipped loser's own
  // cell would be redundant since its owner already flipped to the winner's
  // side by the time this runs.
  //
  // BALANCE (not a text-fidelity simplification — a deliberate deviation):
  // capped to once per match via onWinLineDestroyUsed, the same flag shape
  // as onWinDirectionalBoostUsed/onWinDebuffOnceUsed above. The printed
  // card text has no such cap ("whenever X wins a round..."), but an
  // uncapped permanent board-destroy on every win, stacked on top of
  // permanent active.debuffImmune (both Nexzoth and Morvath have it), is a
  // genuine snowball risk with no counterplay once the card lands one
  // favorable trade — nothing in the roster before this session paired
  // "can't be weakened" with "wins compound by permanently destroying more
  // of the board", so there's no precedent to defer to here. Revisit if
  // playtesting shows this cap is too harsh.
  if(a.onWinLineDestroy && winnerIndex != null && !winnerEntry.onWinLineDestroyUsed){
    const edgeToDir = { top:'up', bottom:'down', left:'left', right:'right' };
    enemiesInDirection(winnerIndex, edgeToDir[myEdge], winnerEntry.owner).forEach(p => destroyCard(p.index));
    winnerEntry.onWinLineDestroyUsed = true;
  }
  // Nexzoth's World Shatter, simplified per the approved art: no longer a
  // line-AOE (that stays exclusive to Morvath's Abyssal Grasp via
  // onWinLineDestroy above) — every win outright destroys the direct
  // target instead of capturing it, uncapped, and skips the Graveyard
  // (noRevive) per the art's explicit "cannot be revived".
  if(a.onWinDestroyLoserAlways && loserIndex != null && !isDestroyImmune(loserEntry)){
    destroyCard(loserIndex, { noRevive: true });
  }
  // Vorgrath's Crushing Weight: "-1 Power to all opponent's cards next
  // round" — approximated as an immediate one-round debuff to every enemy
  // card on the board (same debuffThisRound primitive as everywhere else),
  // rather than a genuinely delayed-onset window, which would need a third
  // temporal state beyond the existing immediate active→expire model.
  if(a.onWinAllEnemiesDebuffThisRound){
    state.board.forEach(e => { if(e && e.owner !== winnerEntry.owner) SpecialVerbs.debuffThisRound(e, a.onWinAllEnemiesDebuffThisRound); });
  }
  // Morvath's Drowned Souls / Zalazar's World In Flames: place a card back
  // from the OPPONENT's graveyard onto the winner's own side. Only ever
  // finds anything if the Graveyard optional rule is on (otherwise the
  // graveyard is always empty) — see reviveFromGraveyard() below.
  if(a.onWinReviveFromGraveyard){
    const cfg = a.onWinReviveFromGraveyard;
    if(!cfg.minWinValue || (winnerVal != null && winnerVal >= cfg.minWinValue)){
      reviveFromGraveyard(winnerEntry.owner, cfg.count, cfg.powerPenalty);
    }
  }
  // Naline's Healing Radiance: "choose 1 card on your side — +1 Power,
  // clear all negative effects on it." Random ally (winnerEntry included,
  // same "no on-win target-choice UI" simplification as every other
  // "choose 1"-on-win ability). "Clear negative effects" reads as: zero out
  // a negative captureBonus and drop any pending round-scoped debuffs
  // (tempEffects) — a positive captureBonus/sideBonus is left untouched,
  // since those aren't "negative effects".
  if(a.onWinCleanseAlly){
    const allies = state.board.filter(e => e && e.owner === winnerEntry.owner);
    if(allies.length > 0){
      const target = allies[Math.floor(Math.random() * allies.length)];
      if(target.captureBonus < 0) target.captureBonus = 0;
      target.tempEffects = [];
      SpecialVerbs.attackBoost(target, 1);
    }
  }
  // Zlaizer's Second Dawn: place up to `count` cards back from the
  // winner's OWN Graveyard, each with a captureBonus penalty (same
  // "-N Power" shape as reviveFromGraveyard, just sourced from the
  // caster's own side instead of the opponent's — see
  // reviveFromOwnGraveyard() below).
  if(a.onWinReviveFromOwnGraveyard){
    const cfg = a.onWinReviveFromOwnGraveyard;
    reviveFromOwnGraveyard(winnerEntry.owner, cfg.count, cfg.powerPenalty);
  }
  // Medusa's Stone Gaze: "the defeated enemy card is Petrified until the
  // end of next round; a Petrified card can't use its Card Skills." Read
  // as "can't use its Special Attack" (specialUsable() checks
  // petrifiedUntilTurnCount below) — the same simplification Crimson
  // Allure's specialLockedUntilTurnCount already uses, kept as a
  // separate field rather than reusing that one so the two flavors of
  // lock (an enemy ability vs. a status condition read by Medusa's own
  // other skills, e.g. Serpent Queen counting Petrified enemies) stay
  // conceptually distinct even though both gate the same check. No
  // "once per match" cap — a mild status effect, not a board-destroying
  // one, so it doesn't need the guard the balance pass added elsewhere.
  if(a.onWinPetrify && loserIndex != null){
    loserEntry.petrifiedUntilTurnCount = state.turnCount + 4;
  }
  // Ferea's Frostmark: "the defeated enemy card becomes Frostmarked for the
  // rest of the match" — a permanent boolean status (unlike Medusa's
  // temporary petrifiedUntilTurnCount above), read by her own Queen's
  // Blessing aura via auraPerFrostmarkedEnemy below, same shape as
  // auraPerPetrifiedEnemy reads petrifiedUntilTurnCount.
  if(a.onWinFrostmark && loserIndex != null){
    loserEntry.frostmarked = true;
  }
  // Shiva's Diamond Dust / Leviathan's Crushing Tide / Omega Weapon's Hyper
  // Pulse: "the defeated card gets -N Power on all sides this round" — no
  // "once per match" cap in any of the three cards' text, and unlike
  // onWinLineDestroy's cap this is a mild, temporary debuff (same category
  // Vorgrath's already-uncapped onWinAllEnemiesDebuffThisRound sits in), so
  // it's left uncapped like that one rather than like onWinDebuffOnce.
  if(a.onWinDebuffLoserThisRound && loserIndex != null){
    SpecialVerbs.debuffThisRound(loserEntry, a.onWinDebuffLoserThisRound);
  }
  // Yojimbo's Daigoro's Hunt: "the defeated card gets -1 Power on all sides
  // for the REST OF THE MATCH" (permanent, unlike the this-round hooks
  // above) — no cap in the text either, same "mild uncapped stacking" call
  // as Ifrit's onCaptureBonus (already shipped, permanent, uncapped).
  if(a.onWinDebuffLoserPermanent && loserIndex != null){
    SpecialVerbs.debuff(loserEntry, a.onWinDebuffLoserPermanent);
  }
  // Vaelira's Crimson Surge: "+1 Power all sides per win, capped at 3
  // stacks" -- same capped-stacking idea as Omega Weapon's
  // buffOnEnemyDestroyedCapped, but keyed off ordinary wins instead of
  // enemy destroys, so it needs its own counter on the winner's entry.
  if(a.onWinCappedBoost && (winnerEntry.onWinCappedBoostCount||0) < a.onWinCappedBoost.max){
    SpecialVerbs.attackBoost(winnerEntry, a.onWinCappedBoost.amount);
    winnerEntry.onWinCappedBoostCount = (winnerEntry.onWinCappedBoostCount||0) + 1;
  }
  // Chocobo King's Feather Storm: "a RANDOM adjacent enemy card" (not
  // necessarily the loser of THIS battle) gets -N Power this round —
  // distinct from onWinAreaDebuff above (which hits ALL adjacent enemies,
  // unconditionally, every win) since this one picks only one, at random.
  if(a.onWinRandomAdjacentEnemyDebuffThisRound && winnerIndex != null){
    const candidates = adjacentEntries(winnerIndex).filter(p => p.entry.owner !== winnerEntry.owner);
    if(candidates.length > 0){
      const pick = candidates[Math.floor(Math.random()*candidates.length)];
      SpecialVerbs.debuffThisRound(pick.entry, a.onWinRandomAdjacentEnemyDebuffThisRound);
    }
  }
  // Shiva's Diamond Storm ultimate temporarily grants "destroy the loser if
  // ITS OWN printed total Power is <= threshold" for the rest of the round
  // the ultimate was cast in. Read from a live entry flag (set by
  // SPECIAL_HANDLERS.shiva) rather than card.active, since — unlike every
  // other checkOnWinBonuses hook above — this one isn't a permanent printed
  // passive, it only exists after the Ultimate fires.
  if(winnerEntry.executeWeakFoesUntilTurnCount > state.turnCount && loserIndex != null){
    const loserTotal = loserEntry.card.top + loserEntry.card.right + loserEntry.card.bottom + loserEntry.card.left;
    if(loserTotal <= winnerEntry.executeWeakFoesThreshold && !isDestroyImmune(loserEntry)) destroyCard(loserIndex);
  }
  // Leviathan's Abyssal Deluge ultimate: "if Leviathan wins a battle this
  // round after the Special Attack, he gains +1 Power permanently" — same
  // live-flag shape as Shiva's execute-weak-foes grant above, uncapped
  // within the round (the text has no "once" qualifier, and the grant
  // naturally expires with the round anyway).
  if(winnerEntry.onWinPermanentSelfBuffUntilTurnCount > state.turnCount){
    SpecialVerbs.attackBoost(winnerEntry, winnerEntry.onWinPermanentSelfBuffAmount);
  }
}

// Shared by Morvath's Ultimate/Drowned Souls and Zalazar's World In Flames:
// pulls up to `count` random cards out of the OPPONENT's graveyard and
// materializes them directly onto empty board cells under `owner`'s
// control, each permanently weakened by `powerPenalty` (a flat captureBonus,
// same mechanism as every other permanent stat penalty in the engine).
// Deliberately does NOT run them through placeCard/resolveFlips — a revived
// card just appears, it doesn't immediately battle its new neighbors —
// keeping this a pure board-state effect instead of recursively invoking
// the full placement pipeline. No-ops harmlessly if the graveyard is empty
// (Graveyard rule off) or the board is full.
function reviveFromGraveyard(owner, count, powerPenalty){
  const enemyOwner = owner === 'blue' ? 'red' : 'blue';
  const pool = state.graveyard[enemyOwner];
  for(let n = 0; n < count && pool.length > 0; n++){
    const emptyIdx = state.board.findIndex(c => !c);
    if(emptyIdx === -1) break;
    const pick = Math.floor(Math.random() * pool.length);
    const card = pool.splice(pick, 1)[0];
    state.board[emptyIdx] = { card, owner, shieldUsed:false, grantedShield:false, captureBonus:-powerPenalty };
  }
}

// Zlaizer's Second Dawn: a third revival shape, distinct from both
// reviveFromGraveyard (opponent's graveyard, -N Power) and
// reviveFromOwnGraveyardAtFixedPower (own graveyard, absolute Power) below
// — this one pulls from the caster's OWN graveyard but with a plain
// captureBonus PENALTY like the opponent-graveyard version, per Second
// Dawn's "-1 Power vardera" text (not an absolute value like Naline's
// "with 1 Power").
function reviveFromOwnGraveyard(owner, count, powerPenalty){
  const pool = state.graveyard[owner];
  for(let n = 0; n < count && pool.length > 0; n++){
    const emptyIdx = state.board.findIndex(c => !c);
    if(emptyIdx === -1) break;
    const pick = Math.floor(Math.random() * pool.length);
    const card = pool.splice(pick, 1)[0];
    state.board[emptyIdx] = { card, owner, shieldUsed:false, grantedShield:false, captureBonus:-powerPenalty };
  }
}

// Naline's Soul Revive / Rise Again: unlike reviveFromGraveyard above (which
// pulls from the OPPONENT's graveyard with a flat captureBonus penalty),
// these pull from the caster's OWN graveyard and the source text asks for
// an absolute "with 1 Power" rather than "-N Power" — impossible to express
// as a captureBonus subtraction against an arbitrary base card, so instead
// this clones the card with all four sides overridden to `fixedPower`. Rise
// Again's "can't be removed by the opponent's effects this round" clause is
// `immuneRounds` (0 for Soul Revive, 2 turnCount-ticks — one round — for
// Rise Again), read by isDestroyImmune() via entry.destroyImmuneUntilTurnCount.
function reviveFromOwnGraveyardAtFixedPower(owner, count, fixedPower, immuneRounds){
  const pool = state.graveyard[owner];
  for(let n = 0; n < count && pool.length > 0; n++){
    const emptyIdx = state.board.findIndex(c => !c);
    if(emptyIdx === -1) break;
    const pick = Math.floor(Math.random() * pool.length);
    const original = pool.splice(pick, 1)[0];
    const weakened = { ...original, top:fixedPower, right:fixedPower, bottom:fixedPower, left:fixedPower };
    const entry = { card: weakened, owner, shieldUsed:false, grantedShield:false, captureBonus:0 };
    if(immuneRounds) entry.destroyImmuneUntilTurnCount = state.turnCount + immuneRounds;
    state.board[emptyIdx] = entry;
  }
}

// Triune Desire's Void Embrace: unlike checkOnWinBonuses above (which only
// ever buffs the specific card that just won), this buffs the WHOLE side's
// board whenever ANY of that side's cards wins a battle — so it can't live
// on winnerEntry.card.active, it has to look for a Triune Desire anywhere
// on the winning side's board. Capped at 3 stacks total (tracked on Triune
// Desire's own entry), matching the source text's "(Max +3 Power)".
function checkTriuneTeamBoost(owner){
  const triune = state.board.find(e => e && e.owner === owner && e.card.active && e.card.active.onAnyWinTeamBoost);
  if(!triune) return;
  triune.teamBoostStacks = triune.teamBoostStacks || 0;
  if(triune.teamBoostStacks >= 3) return;
  triune.teamBoostStacks++;
  state.board.forEach(e => { if(e && e.owner === owner) SpecialVerbs.attackBoost(e, 1); });
}

function rivalryBonusAt(cardId, cellIndex, owner){
  const row = Math.floor(cellIndex/3), col = cellIndex%3;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  let bonus = 0;
  dirs.forEach(([dr,dc])=>{
    const r = row+dr, c = col+dc;
    if(r<0||r>2||c<0||c>2) return;
    const n = state.board[r*3+c];
    if(n && n.owner === owner && isRivalryPair(cardId, n.card.id)) bonus += 1;
  });
  return bonus;
}

// Fas 4 (design review, progression pilot): Random Draft/Choose Your Five
// had zero persistence at all — no record of wins, losses, streaks, or
// which champion actually carried you to victory. Campaign already has its
// own stage-progress tracking (campaignProgress above), so this is
// deliberately scoped to the other two modes only (see recordMatchResult's
// own guard). Same localStorage save/load shape as campaign progress.
const MATCH_STATS_SAVE_KEY = 'triadArenaMatchStats';
function loadMatchStats(){
  try{
    const raw = localStorage.getItem(MATCH_STATS_SAVE_KEY);
    if(!raw) return { matches:0, wins:0, losses:0, draws:0, currentStreak:0, bestStreak:0, cardWins:{} };
    const parsed = JSON.parse(raw);
    return {
      matches: parsed.matches||0, wins: parsed.wins||0, losses: parsed.losses||0, draws: parsed.draws||0,
      currentStreak: parsed.currentStreak||0, bestStreak: parsed.bestStreak||0,
      cardWins: (parsed.cardWins && typeof parsed.cardWins === 'object') ? parsed.cardWins : {},
    };
  }catch(e){

}

// Called from finishGame() for every Random Draft/Choose Your Five match.
// "Favorite champion" is tracked as wins-with-that-card-in-your-five, not
// wins-by-that-specific-card's-own-battles — simple, cheap (one counter per
// card id, incremented once per match won, not per capture), and matches
// how a player would naturally think of it ("the five I keep winning with").
function recordMatchResult(winner){
  if(state.draftMode === 'campaign') return;
  matchStats.matches++;
  if(winner === 'blue'){
    matchStats.wins++;
    matchStats.currentStreak++;
    if(matchStats.currentStreak > matchStats.bestStreak) matchStats.bestStreak = matchStats.currentStreak;
    state.selected.forEach(id => { matchStats.cardWins[id] = (matchStats.cardWins[id]||0) + 1; });
  } else if(winner === 'red'){
    matchStats.losses++;
    matchStats.currentStreak = 0;
  } else {
    matchStats.draws++;
    matchStats.currentStreak = 0;
  }
  saveMatchStats();
}
function favoriteCardInfo(){
  let bestId = null, bestCount = 0;
  Object.keys(matchStats.cardWins).forEach(id => {
    if(matchStats.cardWins[id] > bestCount){ bestCount = matchStats.cardWins[id]; bestId = id; }
  });
  if(!bestId) return null;
  const card = findCardById(bestId);
  return card ? { name: card.name, wins: bestCount } : null;
}

const ACHIEVEMENTS = [
  { id:'first-blood', name:'First Blood', desc:'Win your first duel.',
    check: (winner) => winner === 'blue' && matchStats.wins === 1 },
  { id:'total-domination', name:'Total Domination', desc:'Win by controlling all 9 squares.',
    check: (winner, blueCount) => winner === 'blue' && blueCount === 9 },
  { id:'hard-fought', name:'Hard-Fought Victory', desc:'Win a duel with the Forest AI set to Hard.',
    check: (winner) => winner === 'blue' && effectiveAIDifficulty() === 'hard' },
  { id:'on-a-roll', name:'On a Roll', desc:'Reach a 5-win streak.',
    check: () => matchStats.currentStreak >= 5 },
  { id:'veteran', name:'Veteran', desc:'Win 10 duels.',
    check: () => matchStats.wins >= 10 },
  { id:'purist', name:'Purist', desc:'Win a duel with every optional rule active (Same, Plus, Combo, Elemental).',
    check: (winner) => winner === 'blue' && state.rules.same && state.rules.plus && state.rules.combo && state.rules.elemental },
];
const ACHIEVEMENTS_SAVE_KEY = 'triadArenaAchievements';
function loadAchievements(){
  try{
    const raw = localStorage.getItem(ACHIEVEMENTS_SAVE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter(id => ACHIEVEMENTS.some(a => a.id === id)) : [];
  }catch(e){ return []; }
}

}

// Called from finishGame() right after recordMatchResult() (so
// matchStats already reflects THIS match) -- returns the ids newly
// unlocked this match, for the result screen to surface (see
// state.newAchievements), same "show the payoff right when it happens"
// principle as the streak/favorite-card result-screen addition above.
function checkAchievements(winner, blueCount){
  if(state.draftMode === 'campaign') return [];
  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if(unlockedAchievements.includes(a.id)) return;
    if(a.check(winner, blueCount)){ unlockedAchievements.push(a.id); newly.push(a.id); }
  });
  if(newly.length) saveAchievements();
  return newly;
}
