<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Triad Arena — Aetherion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --void:        #0a0812;
  --void-2:      #12101f;
  --panel:       #17142a;
  --line:        #2c2645;
  --gold:        #c9a227;
  --gold-bright: #f0d879;
  --ember:       #d9622b;
  --frost:       #5ec8f2;
  --arcane:      #8b6ef2;
  --text:        #ece7f7;
  --text-dim:    #9c93b8;
  --blue-side:   #3f6fd1;
  --red-side:    #b8452e;
  --earth:       #6fae4a;
  --stone:       #211d24;
  --stone-2:     #2b2530;
  --silver:      #b9b5c2;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  background:#050409;
  color:var(--text);
  font-family:'Spectral', serif;
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex; align-items:flex-start; justify-content:center;
  min-height:100vh; min-height:100dvh;
}
.stage{
  position:relative;
  width:100%;
  max-width:640px;
  min-height:100vh; min-height:100dvh;
  margin:0 auto;
  background:
    radial-gradient(ellipse 480px 420px at 0% 0%, rgba(217,98,43,0.16), transparent 60%),
    radial-gradient(ellipse 480px 420px at 100% 0%, rgba(139,110,242,0.14), transparent 60%),
    radial-gradient(ellipse 480px 420px at 0% 100%, rgba(111,174,74,0.14), transparent 60%),
    radial-gradient(ellipse 480px 420px at 100% 100%, rgba(94,200,242,0.16), transparent 60%),
    var(--void);
  border-radius:16px;
  box-shadow:0 24px 70px rgba(0,0,0,0.75), 0 0 0 1px var(--line);
}
.wrap{ padding:16px 14px 24px; }

h1,h2,.display{ font-family:'Cinzel', serif; letter-spacing:0.04em; }

.masthead{ text-align:center; margin:6px 0 20px; position:relative; }
.masthead.compact{ margin:2px 0 14px; }
.masthead.compact .rune{ width:26px; height:26px; margin:0 auto 5px; font-size:12px; }
.masthead.compact h1{ font-size:22px; }
.masthead.compact .sub{ font-size:10px; }
.corner-flame{
  position:absolute; top:-6px; width:46px; height:46px; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.corner-flame.left{ left:-10px; }
.corner-flame.right{ right:-10px; }
.corner-flame .flame-icon{
  font-size:38px; line-height:1; display:block;
  animation:flameFlicker 2.6s ease-in-out infinite;
}
.corner-flame.left .flame-icon{
  filter:saturate(1.3) drop-shadow(0 0 12px var(--red-side)) drop-shadow(0 0 22px rgba(184,69,46,0.55));
}
.corner-flame.right .flame-icon{
  filter:hue-rotate(190deg) saturate(1.5) drop-shadow(0 0 12px var(--blue-side)) drop-shadow(0 0 22px rgba(63,111,209,0.55));
}
.masthead.compact .corner-flame{ width:30px; height:30px; top:-3px; }
.masthead.compact .corner-flame.left{ left:-4px; }
.masthead.compact .corner-flame.right{ right:-4px; }
.masthead.compact .corner-flame .flame-icon{ font-size:24px; }
@keyframes flameFlicker{
  0%,100%{ transform:scale(1) rotate(-1deg); opacity:0.92; }
  35%{ transform:scale(1.08) rotate(1deg); opacity:1; }
  60%{ transform:scale(0.97) rotate(-2deg); opacity:0.88; }
}
.sound-toggle{
  position:absolute; top:0; right:0; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .sound-toggle{ width:24px; height:24px; font-size:11px; }
.sound-toggle.on{ color:var(--gold); border-color:var(--gold); }

.fullscreen-toggle{
  position:absolute; top:0; right:40px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer;
}
.masthead.compact .fullscreen-toggle{ width:24px; height:24px; font-size:10px; right:28px; }
.fullscreen-toggle.on{ color:var(--gold); border-color:var(--gold); }

.book-toggle{
  position:absolute; top:0; left:40px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .book-toggle{ width:24px; height:24px; font-size:11px; left:28px; }
.book-toggle:hover{ color:var(--gold); border-color:var(--gold); }

.music-toggle{
  position:absolute; top:0; left:0; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .music-toggle{ width:24px; height:24px; font-size:11px; }
.music-toggle.on{ color:var(--gold); border-color:var(--gold); }
.masthead .rune{
  width:34px; height:34px; margin:0 auto 8px;
  border:1px solid var(--gold); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold); font-size:15px; opacity:0.85;
  box-shadow:0 0 14px rgba(201,162,39,0.35);
}
.masthead h1{
  font-size:26px; font-weight:900; margin:0;
  background:linear-gradient(180deg,#f7ecc8, var(--gold) 60%, #8a6d1a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(201,162,39,0.25);
}
.masthead .sub{ font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-dim); margin-top:6px; }
.tester-badge{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:12px; padding:5px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel);
  color:var(--text-dim); font-size:11px; letter-spacing:0.03em;
}
.tester-badge .tester-icon{ font-size:12px; }
.tester-badge b{ color:var(--gold-bright); font-weight:700; }

/* ---------- rules ---------- */
.rules{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:20px; font-size:14px; line-height:1.55; color:var(--text-dim);
}
.rules b{ color:var(--text); }

.stage-banner{
  width:100%; max-width:420px; margin:0 auto 20px;
  border:1px solid var(--gold); box-shadow:0 12px 40px rgba(0,0,0,0.65); line-height:0;
}
.stage-banner img{ width:100%; display:block; border-radius:13px; }

.lore-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; margin:0 0 20px; max-height:420px; overflow-y:auto;
}
.lore-section{ margin-bottom:18px; }
.lore-section:last-child{ margin-bottom:0; }
.lore-title{
  font-family:'Cinzel',serif; font-weight:700; font-size:14px; letter-spacing:0.03em;
  color:var(--gold-bright); margin-bottom:8px;
}
.lore-section p{
  font-size:13px; line-height:1.6; color:var(--text-dim); margin:0 0 8px;
}
.lore-section p:last-child{ margin-bottom:0; }

.rules-toggle-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:12px 16px 14px; margin-bottom:20px;
}
.rules-toggle-panel .section-label{ margin-bottom:10px; }
.rule-toggle{
  display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; cursor:pointer;
  font-size:13px; line-height:1.5; color:var(--text-dim);
}
.rule-toggle:last-child{ margin-bottom:0; }
.rule-toggle input{ margin-top:3px; flex:0 0 auto; accent-color: var(--gold); width:16px; height:16px; cursor:pointer; }
.rule-toggle b{ color:var(--text); }
.rule-toggle.rule-disabled{ opacity:0.45; }
.rule-toggle.rule-disabled input{ cursor:not-allowed; }

.mode-toggle{ display:flex; gap:8px; margin-bottom:20px; }
.mode-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:12px 8px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-family:'Spectral',serif;
  font-size:12px; font-weight:600; cursor:pointer; transition:all .15s ease;
}
.mode-btn .mode-icon{ font-size:20px; line-height:1; }
.mode-btn.active{
  border-color:var(--gold); color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.mode-btn:disabled{ opacity:0.4; cursor:default; }

.draw-pile-wrap{ display:flex; justify-content:center; padding:10px 0 6px; }
.card-back{
  width:220px; cursor:pointer; transition:transform .15s ease;
}
.card-back:active{ transform:scale(0.97); }
.card-back.disabled{ cursor:default; opacity:0.5; }
.card-back-face{
  position:absolute; inset:0; border-radius:inherit; overflow:hidden;
  background-size:cover; background-position:center;
  border:2px solid var(--gold);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding:14px;
}
.card-back-hint{
  font-size:10px; color:var(--gold-bright); text-transform:uppercase; letter-spacing:0.1em;
  background:rgba(6,5,12,0.72); border:1px solid var(--gold); border-radius:6px;
  padding:4px 10px; text-shadow:0 1px 3px rgba(0,0,0,0.9);
}
.card-back.drawing .card-back-face{ animation: drawPulse 0.6s ease; }
@keyframes drawPulse{
  0%{ box-shadow:0 0 0 0 rgba(201,162,39,0.8); }
  100%{ box-shadow:0 0 0 40px rgba(201,162,39,0); }
}

/* ---------- draft screen ---------- */
.section-label{
  font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--gold); margin:0 0 10px 2px;
}
.draft-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
  gap:10px; margin-bottom:16px;
}
.card{
  position:relative; border-radius:10px; overflow:hidden; cursor:pointer;
  aspect-ratio:5/7; background:linear-gradient(160deg,#1c1832,#0d0b18);
  border:1.5px solid var(--line); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.card:active{ transform:scale(0.97); }
.card.selectable:hover{ border-color:var(--gold); }
.card.selected{
  border-color:var(--gold-bright);
  box-shadow:0 0 0 2px rgba(240,216,121,0.25), 0 0 18px rgba(240,216,121,0.35);
}
.card.disabled{ opacity:0.35; cursor:default; }
.card.inplay{ opacity:0.3; cursor:default; }

.card-glow{ position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.card-glow::before{ content:''; position:absolute; inset:0; background:inherit; opacity:0.55; }
.foe-icon{
  position:relative; z-index:1;
  font-size:clamp(28px, 46cqw, 64px); line-height:1;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.8));
}
.card-art{ position:absolute; inset:0; background-size:cover; background-position:center 15%; }
.card-art::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(6,5,12,0.75) 0%, rgba(6,5,12,0.05) 30%, rgba(6,5,12,0.05) 55%, rgba(6,5,12,0.85) 100%);
}
.card-inner{ position:absolute; inset:0; display:flex; flex-direction:column; }
.card-top{ flex:1; display:flex; align-items:flex-start; padding:clamp(24px,32cqw,38px) 7px 3px; }
.card-name{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(9px,13cqw,12px); line-height:1.2; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7); }
.card-role{ font-size:clamp(7px,9cqw,8.5px); color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,0.9); }
.hand-row.enemy .card-role{ display:none; }
/* In-play board cells are the smallest, most-often-seen card size, and the
   newer signature cards' longer roles ("Legendary Card — The Last Dragon
   Hunter") wrap to 2-3 lines there — past the card-art gradient's darkened
   zone (sized for name+role at the OLD, shorter role lengths) and straight
   onto bare character art, badly hurting legibility of both. Same "drop
   the least essential info first" call as .hand-row.enemy above: the full
   role is always one tap away via the info button, so it isn't needed
   here at all. */
.board .card-role{ display:none; }

.card{ container-type: inline-size; }

.level-stars{
  position:absolute; top:5px; left:6px; z-index:4;
  display:flex; gap:1px;
  font-size:clamp(6px, 7.5cqw, 9px); color:var(--gold-bright);
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}

.element-badge{
  position:absolute; bottom:4px; left:4px; z-index:6;
  width:clamp(14px,18cqw,20px); height:clamp(14px,18cqw,20px);
  border-radius:50%; background:rgba(4,3,9,0.75); border:1px solid rgba(255,255,255,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,11cqw,12px); line-height:1;
}

/* Medusa's Stone Gaze: a persistent badge (unlike the transient skill-pop
   flashes) for as long as entry.petrifiedUntilTurnCount hasn't expired —
   mirrors .element-badge's shape but sits bottom-right so the two never
   collide on a card that's both elemental and Petrified. */
.petrified-badge{
  position:absolute; bottom:4px; right:4px; z-index:6;
  width:clamp(14px,18cqw,20px); height:clamp(14px,18cqw,20px);
  border-radius:50%; background:rgba(4,3,9,0.75); border:1px solid #a568f2;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,11cqw,12px); line-height:1;
  box-shadow:0 0 6px rgba(165,104,242,0.5);
}

.info-btn{
  position:absolute; top:4px; right:4px; z-index:6;
  width:clamp(18px,22cqw,24px); height:clamp(18px,22cqw,24px);
  border-radius:50%; background:rgba(4,3,9,0.78); border:1px solid rgba(255,255,255,0.4);
  color:#fff; font-family:'Cinzel',serif; font-weight:700; font-style:italic;
  font-size:clamp(9px,12cqw,12px); display:flex; align-items:center; justify-content:center;
  cursor:pointer; line-height:1; padding:0; touch-action:manipulation;
}
.info-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

/* Special badge: shown on every card that has an unused ultimate, using the
   Triad Arena crest artwork. Pulses gently (dim, desaturated) while locked
   (can't afford it yet) and pulses hard through blue/violet/gold once it's
   affordable — the stronger, colorful pulse is the "go" signal. Purely a
   visual indicator (no click handler) — the whole card is the tap target
   once ready, handled by the .cell click logic. */
.special-diamond{
  position:absolute; bottom:4px; right:4px; z-index:6;
  width:clamp(18px,22cqw,26px); height:clamp(18px,22cqw,26px);
  background-image:url('special-badge.png');
  background-size:contain; background-repeat:no-repeat; background-position:center;
  pointer-events:none;
}
.special-diamond.locked{
  animation:badgePulseLocked 3.2s ease-in-out infinite;
}
.special-diamond.ready{
  animation:badgePulseReady 1.4s ease-in-out infinite;
}
@keyframes badgePulseLocked{
  0%, 100%{
    opacity:0.4; transform:scale(0.9);
    filter:saturate(0.35) brightness(0.8) drop-shadow(0 0 2px rgba(139,110,242,0.3));
  }
  50%{
    opacity:0.7; transform:scale(1);
    filter:saturate(0.6) brightness(1) drop-shadow(0 0 5px rgba(139,110,242,0.5));
  }
}
@keyframes badgePulseReady{
  0%, 100%{
    transform:scale(0.9);
    filter:saturate(1) brightness(1) drop-shadow(0 0 4px rgba(74,158,255,0.75)) drop-shadow(0 0 9px rgba(74,158,255,0.5));
  }
  33%{
    transform:scale(1.15);
    filter:saturate(1.2) brightness(1.15) drop-shadow(0 0 8px rgba(139,110,242,0.95)) drop-shadow(0 0 17px rgba(139,110,242,0.7));
  }
  66%{
    transform:scale(1.2);
    filter:saturate(1.2) brightness(1.2) drop-shadow(0 0 9px rgba(196,72,220,0.95)) drop-shadow(0 0 18px rgba(240,216,121,0.65));
  }
}
.card.special-active{
  border-color:var(--arcane) !important;
  box-shadow:0 0 0 2px rgba(139,110,242,0.35), 0 0 18px rgba(139,110,242,0.55) !important;
}
.card.special-ready{
  animation:specialReadyPulse 2.6s ease-in-out infinite;
}
@keyframes specialReadyPulse{
  0%, 100%{
    border-color:rgba(139,110,242,0.55);
    box-shadow:0 0 0 1px rgba(139,110,242,0.22), 0 0 10px rgba(139,110,242,0.24);
    filter:brightness(1);
  }
  50%{
    border-color:var(--arcane);
    box-shadow:0 0 0 2px rgba(139,110,242,0.7), 0 0 26px rgba(139,110,242,0.7), 0 0 46px rgba(240,216,121,0.3);
    filter:brightness(1.14);
  }
}
.cell.special-target{
  cursor:pointer; border-color:rgba(196,72,46,0.65);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(196,72,46,0.6),
    0 0 8px rgba(196,72,46,0.5);
}
.cell.special-target::before{
  background:radial-gradient(circle at 50% 50%, rgba(196,72,46,0.45), transparent 65%);
  animation:cellPulseGold 1.2s ease-in-out infinite;
}

.wins-row{
  position:relative;
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:2px 0 10px; font-size:11px; color:var(--text-dim); letter-spacing:0.03em;
}
.wins-chip{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
}
.wins-chip.blue{ color:var(--blue-side); border-color:rgba(63,111,209,0.5); }
.wins-chip.red{ color:var(--red-side); border-color:rgba(184,69,46,0.5); }
.wins-chip b{ color:inherit; }

.wins-toast{
  position:absolute; top:100%; left:50%; z-index:9;
  transform:translate(-50%,4px);
  font-family:'Cinzel',serif; font-weight:700; font-size:13px;
  letter-spacing:0.04em; white-space:nowrap; padding:6px 14px; border-radius:8px;
  pointer-events:none; opacity:0;
  animation: winsToastFade 1.6s ease forwards;
}
.wins-toast.blue{
  background:rgba(8,10,18,0.92); border:1px solid var(--blue-side); color:#bcd4ff;
  box-shadow:0 0 18px rgba(63,111,209,0.5);
}
.wins-toast.red{
  background:rgba(18,8,8,0.92); border:1px solid var(--red-side); color:#ffd0c0;
  box-shadow:0 0 18px rgba(184,69,46,0.5);
}
@keyframes winsToastFade{
  0%{ opacity:0; transform:translate(-50%,-4px) scale(0.85); }
  15%{ opacity:1; transform:translate(-50%,8px) scale(1.05); }
  25%{ transform:translate(-50%,8px) scale(1); }
  75%{ opacity:1; }
  100%{ opacity:0; transform:translate(-50%,-6px) scale(0.92); }
}

.graveyard-toggle{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:999px; border:1px solid rgba(180,170,150,0.4);
  background:var(--panel); color:var(--text-dim); font-size:11px; letter-spacing:0.03em;
  cursor:pointer;
}
.graveyard-toggle:hover{ border-color:var(--gold); color:var(--gold-bright); }
.graveyard-modal{ max-width:520px; padding:22px 20px 20px; }
.graveyard-modal h3{ font-family:'Cinzel',serif; color:var(--gold-bright); margin:0 0 6px; }
.graveyard-hint{ font-size:11.5px; color:var(--text-dim); line-height:1.5; margin:0 0 16px; }
.graveyard-columns{ display:flex; gap:16px; }
.graveyard-side{ flex:1; min-width:0; }
.graveyard-side-label{ font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:8px; }
.graveyard-side-label.blue{ color:var(--blue-side); }
.graveyard-side-label.red{ color:var(--red-side); }
.graveyard-cards{ display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow-y:auto; }
.graveyard-card{ display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:8px; background:rgba(255,255,255,0.03); }
.graveyard-card-art{ width:28px; height:28px; border-radius:6px; background-size:cover; background-position:center; flex-shrink:0; }
.graveyard-card span{ font-size:11.5px; color:var(--text-dim); }
.graveyard-empty{ font-size:11.5px; color:var(--text-dim); opacity:0.6; font-style:italic; }

/* Stat numbers sit right on the edge of the card they belong to — top
   number at the top edge, right number at the right edge, etc. — instead
   of a central cluster, so you can read "which side is strong" at the
   spot that actually matters without having to parse a cramped 4-in-one
   plus-shape first. .stat-cluster is just a full-card, click-through
   positioning layer; each .stat-n is its own small badge (same visual
   language as .info-btn/.element-badge) for contrast against the art. */
.stat-cluster{ position:absolute; inset:0; z-index:4; pointer-events:none; }
.stat-n{
  position:absolute;
  width:clamp(17px, 22cqw, 27px); height:clamp(17px, 22cqw, 27px);
  border-radius:50%;
  background:rgba(4,3,9,0.82); border:1px solid rgba(255,255,255,0.4);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-weight:700; color:#fff; line-height:1;
  font-size:clamp(10px, 13.5cqw, 16px);
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}
.stat-n.n-top{ top:3px; left:50%; transform:translateX(-50%); }
.stat-n.n-bottom{ bottom:4px; left:50%; transform:translateX(-50%); }
.stat-n.n-left{ left:3px; top:50%; transform:translateY(-50%); }
.stat-n.n-right{ right:3px; top:50%; transform:translateY(-50%); }
.card.owner-blue .stat-n{ border-color:var(--blue-side); }
.card.owner-red .stat-n{ border-color:var(--red-side); }

.card-badge{
  position:absolute; top:5px; right:5px; font-family:'Cinzel',serif; font-size:9px;
  padding:2px 5px; border-radius:4px; border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.4); letter-spacing:0.06em;
}

.card.owner-blue{
  box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 14px rgba(63,111,209,0.65);
  border-color: var(--blue-side);
}
.card.owner-red{
  box-shadow:0 0 0 3px var(--red-side) inset, 0 0 14px rgba(184,69,46,0.65);
  border-color: var(--red-side);
}
.card.owner-blue .stat-cluster::before{ background:radial-gradient(circle, rgba(20,32,64,0.75) 50%, transparent 78%); }
.card.owner-red .stat-cluster::before{ background:radial-gradient(circle, rgba(64,24,16,0.75) 50%, transparent 78%); }

.card-back-mini{
  position:relative; width:100%; aspect-ratio:5/7; border-radius:9px; cursor:default;
  background-image:url('card-back.jpg');
  background-size:cover; background-position:center;
  border:1.5px solid rgba(201,162,39,0.45);
  box-shadow:inset 0 0 0 1px rgba(139,110,242,0.2), inset 0 2px 6px rgba(0,0,0,0.5);
  overflow:hidden;
}
.owner-tint{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:normal; }
.owner-tint.tint-blue{ background:rgba(58,104,204,0.22); }
.owner-tint.tint-red{ background:rgba(196,72,46,0.22); }

.count-row{ display:flex; align-items:center; justify-content:space-between; margin:4px 2px 18px; }
.count-row span{ font-size:13px; color:var(--text-dim); }
.count-row b{ color:var(--gold-bright); }

button.cta{
  width:100%; padding:13px; border-radius:9px; border:1px solid var(--gold);
  background:linear-gradient(180deg, rgba(201,162,39,0.22), rgba(201,162,39,0.06));
  color:var(--gold-bright); font-family:'Cinzel',serif; font-weight:700; font-size:13px;
  letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; transition:all .15s ease;
}
button.cta:disabled{ opacity:0.35; cursor:default; }
button.cta:not(:disabled):hover{ background:linear-gradient(180deg, rgba(201,162,39,0.32), rgba(201,162,39,0.1)); }

button.ghost{
  width:100%; padding:11px; margin-top:12px; border-radius:9px; border:1px solid var(--line);
  background:transparent; color:var(--text-dim); font-family:'Spectral',serif; font-size:13px; cursor:pointer;
}
button.ghost:hover{ border-color:var(--text-dim); color:var(--text); }

button.end-turn{
  width:100%; padding:11px; margin-top:10px; border-radius:9px; border:1px solid var(--arcane);
  background:linear-gradient(180deg, rgba(139,110,242,0.18), rgba(139,110,242,0.05));
  color:var(--arcane); font-family:'Cinzel',serif; font-weight:700; font-size:12px;
  letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:all .15s ease;
}
button.end-turn:hover{ background:linear-gradient(180deg, rgba(139,110,242,0.3), rgba(139,110,242,0.1)); color:#c3b3ff; }

/* ---------- battle screen ---------- */
.scoreboard{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:10px 16px; margin-bottom:14px;
}
.score-side{ display:flex; align-items:center; gap:6px; }
.score-flame{ width:30px; height:30px; object-fit:contain; display:block; animation:flameFlicker 2.6s ease-in-out infinite; }
.score-flame.blue{ filter:drop-shadow(0 0 6px var(--blue-side)) drop-shadow(0 0 12px rgba(63,111,209,0.5)); }
.score-flame.red{ filter:drop-shadow(0 0 6px var(--red-side)) drop-shadow(0 0 12px rgba(184,69,46,0.5)); }
.score-num{ font-family:'Cinzel',serif; font-size:20px; font-weight:700; }
.score-num.blue{ color:var(--blue-side); text-shadow:0 0 10px rgba(63,111,209,0.6); }
.score-num.red{ color:var(--red-side); text-shadow:0 0 10px rgba(184,69,46,0.6); }
.score-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }
.turn-indicator{ font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); text-align:center; }

.battle-row{ display:flex; gap:6px; align-items:flex-start; justify-content:center; }

.hand-row{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; width:64px; }
.hand-row .card{ width:100%; }
.hand-row.enemy .card{ width:100%; }
.hand-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin:0 0 8px 2px; }
.hand-label.side{ text-align:center; margin:0 0 4px; }

.hand-row.bottom{
  flex-direction:row; width:100%; flex:0 0 auto;
  gap:8px; margin-top:10px; padding:2px 2px 6px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.hand-row.bottom .card{ width:68px; flex:0 0 auto; }
.hand-row.bottom .hand-label{ display:none; }

/* Positioned with inset percentages (against .arena-frame's own box, the
   nearest positioned ancestor) rather than padding percentages (which
   would resolve against .battle-row's width instead — a flex item's
   padding always resolves against its containing block, not its own
   resolved size, so at wide layouts .battle-row is far wider than
   .arena-frame's capped max-width and the padding used to balloon far
   past what the artwork's frame actually needs, crushing the board down
   to a sliver). This is the same technique .arena-rosette already uses.
   Deliberately no `bottom` inset: the frame artwork's inner area is
   roughly square, but a 3x3 grid of 5:7 cards is much taller than wide,
   so pinning both top AND bottom would force a height shorter than the
   grid actually needs — grid's default align-content (stretch, for grid
   containers "normal" computes to stretch) would then compress the row
   tracks to fit, while each .cell still renders at its full aspect-ratio
   height regardless, making rows visually overlap. Giving .board its own
   aspect-ratio (matching a single 5:7 cell, which a 3x3 grid of them
   also has) lets height derive correctly from the definite width instead. */
.board{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  position:absolute; z-index:1;
  top:26.7%; left:17%; right:17%;
  aspect-ratio:5/7;
  align-content:start;
}
.arena-frame{
  position:relative; flex:1 1 auto; max-width:520px;
  aspect-ratio:1086/1448;
  border-radius:4px;
  background-image:url('arena-bg.jpg');
  background-size:cover;
  background-position:center;
  box-shadow:
    -20px 0 36px -16px rgba(184,69,46,0.4),
    20px 0 36px -16px rgba(63,111,209,0.4);
}
.arena-rosette{ position:absolute; inset:12%; z-index:0; pointer-events:none; opacity:0.85; }

/* "Conquered!" banner — a bigger, one-off flourish on top of the routine
   attack slash. state.conquestPopup holds the owner ('blue'/'red') whose
   capture triggered it, and the <img>'s src picks the matching artwork —
   conquered-badge.png for the player, conquered-badge-red.png for the AI
   (see showConquestPopup()) — since each piece is written from that
   side's own perspective, not a generic "someone won" graphic. Centered
   on .arena-frame rather than anchored to the captured cell: Same/Plus/
   Combo can flip several cells in one placement, so a single
   card-anchored popup wouldn't have one obvious home anyway. */
.conquest-banner{
  position:absolute; z-index:20; top:50%; left:50%;
  width:62%; max-width:340px;
  transform:translate(-50%,-50%) scale(0.55);
  opacity:0; pointer-events:none;
  filter:drop-shadow(0 6px 22px rgba(0,0,0,0.65));
  animation: conquestPop 1.4s cubic-bezier(.2,.9,.25,1) forwards;
}
@keyframes conquestPop{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0.55) rotate(-4deg); }
  14%{ opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(1deg); }
  24%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  78%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(0.92) rotate(0deg); }
}

.coinflip-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 0 20px; animation:coinFadeOut .5s ease 2.3s forwards; }
.coinflip-frame{
  position:relative; width:180px; height:180px; border-radius:50%;
  background:
    radial-gradient(circle at 50% 40%, rgba(139,110,242,0.12), transparent 65%),
    radial-gradient(circle, var(--stone-2), var(--stone) 75%);
  border:1px solid rgba(139,110,242,0.35);
  box-shadow:
    inset 0 0 0 1px rgba(201,162,39,0.2),
    inset 0 2px 14px rgba(0,0,0,0.6),
    0 0 40px rgba(139,110,242,0.15);
  display:flex; align-items:center; justify-content:center;
}
.coinflip-frame .arena-rosette{ inset:8%; }
.coin-arrow{
  position:relative; z-index:1; width:64%; height:64%;
  animation: spinArrow 1.9s cubic-bezier(.17,.67,.16,1) forwards;
  filter:drop-shadow(0 0 8px rgba(240,216,121,0.5));
}
@keyframes spinArrow{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(var(--final-rot)); } }
.coinflip-label-stack{ position:relative; height:16px; margin-top:18px; width:220px; }
.coinflip-label{
  position:absolute; inset:0; font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--gold); text-align:center;
}
.label-rolling{ animation: rollingFade 1.9s ease forwards; }
@keyframes rollingFade{ 0%{ opacity:1; } 75%{ opacity:1; } 100%{ opacity:0; } }
.label-result{ opacity:0; color:var(--gold-bright); animation: resultFade 1.9s ease forwards; }
@keyframes resultFade{ 0%{ opacity:0; } 78%{ opacity:0; } 100%{ opacity:1; } }
@keyframes coinFadeOut{ to{ opacity:0; transform:scale(0.94); } }
.cell{
  position:relative; aspect-ratio:5/7; border-radius:9px; overflow:hidden;
  background:
    radial-gradient(circle at 50% 26%, rgba(255,255,255,0.05), transparent 55%),
    linear-gradient(160deg, #2c2722, #16130f 72%);
  border:1px solid rgba(0,0,0,0.55);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.06),
    inset 0 -4px 8px rgba(0,0,0,0.6),
    inset 0 0 0 1px rgba(201,162,39,0.07);
  display:flex; align-items:center; justify-content:center;
  transition:box-shadow .2s ease, border-color .2s ease;
}
.cell::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(94,200,242,0.14), transparent 65%);
  opacity:0.3; animation:cellPulse 3.8s ease-in-out infinite;
}
@keyframes cellPulse{ 0%,100%{ opacity:0.18; } 50%{ opacity:0.42; } }
.cell.targetable{
  cursor:pointer; border-color:rgba(201,162,39,0.6);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(201,162,39,0.55),
    0 0 8px rgba(201,162,39,0.45);
}
.cell.targetable::before{
  background:radial-gradient(circle at 50% 50%, rgba(240,216,121,0.4), transparent 65%);
  animation:cellPulseGold 1.2s ease-in-out infinite;
}
@keyframes cellPulseGold{ 0%,100%{ opacity:0.45; transform:scale(1);} 50%{ opacity:0.9; transform:scale(1.07);} }
.cell .card{ position:absolute; inset:0; width:100%; height:100%; cursor:default; }
.cell .card.placing{ animation: cardLand .48s cubic-bezier(.22,1.6,.4,1); }
@keyframes cardLand{
  0%{ transform:translateY(-28px) scale(0.84); opacity:0; filter:brightness(1.9); }
  60%{ transform:translateY(4px) scale(1.03); opacity:1; }
  100%{ transform:translateY(0) scale(1); filter:brightness(1); }
}
.cell .card.flipping{ animation:flip .55s ease var(--fx-delay,0ms) both; }
.cell .card.owner-blue.flipping{ animation:flip .55s ease var(--fx-delay,0ms) both, captureRingBlue .55s ease var(--fx-delay,0ms) both; }
.cell .card.owner-red.flipping{ animation:flip .55s ease var(--fx-delay,0ms) both, captureRingRed .55s ease var(--fx-delay,0ms) both; }
@keyframes flip{
  0%{ transform:rotateY(0deg) scale(1); filter:brightness(1);}
  45%{ transform:rotateY(90deg) scale(1.07); filter:brightness(1.7);}
  55%{ transform:rotateY(90deg) scale(1.07); filter:brightness(1.7);}
  100%{ transform:rotateY(0deg) scale(1); filter:brightness(1);}
}
@keyframes captureRingBlue{
  0%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 0 rgba(63,111,209,0); }
  50%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 0 12px rgba(63,111,209,0.5); }
  100%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 26px rgba(63,111,209,0); }
}
@keyframes captureRingRed{
  0%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 0 rgba(184,69,46,0); }
  50%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 0 12px rgba(184,69,46,0.5); }
  100%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 26px rgba(184,69,46,0); }
}

.card.shield-flash{ animation: shieldRing 0.9s ease; }
@keyframes shieldRing{
  0%{ box-shadow:0 0 0 0 rgba(201,162,39,0.9); }
  60%{ box-shadow:0 0 0 16px rgba(201,162,39,0); }
  100%{ box-shadow:0 0 0 0 rgba(201,162,39,0); }
}
.card.bonus-flash{ animation: bonusRing 0.9s ease; }
@keyframes bonusRing{
  0%{ box-shadow:0 0 0 0 rgba(143,209,90,0.85); }
  60%{ box-shadow:0 0 0 14px rgba(143,209,90,0); }
  100%{ box-shadow:0 0 0 0 rgba(143,209,90,0); }
}

.skill-pop{
  position:absolute; top:42%; left:50%; z-index:7;
  transform:translate(-50%,-30%) scale(0.6);
  font-family:'Cinzel',serif; font-weight:700; font-size:clamp(9px,13cqw,14px);
  letter-spacing:0.03em; white-space:nowrap; padding:5px 10px; border-radius:7px;
  pointer-events:none; opacity:0;
  animation: popFade 0.95s ease forwards;
}
.skill-pop.shield{
  background:rgba(10,8,4,0.88); border:1px solid var(--gold); color:var(--gold-bright);
  box-shadow:0 0 16px rgba(201,162,39,0.6);
}
.skill-pop.bonus{
  background:rgba(7,10,4,0.88); border:1px solid #8fd15a; color:#c8f2a0;
  box-shadow:0 0 16px rgba(143,209,90,0.5);
}
/* The debuff counterpart of .skill-pop.bonus — same popup, red instead of
   green, used whenever bonusAmount is negative (see cardFace()). Lets any
   effect that lowers a card's Power via SpecialVerbs (debuff/
   debuffThisRound/stealPower/directionalBoost, now flashed generically —
   see flashStatChange) show it just as clearly as a positive bonus does,
   including on AOE/direction targets that previously got no per-card
   feedback at all. */
.skill-pop.bonus-negative{
  background:rgba(12,5,4,0.88); border:1px solid var(--red-side); color:#ffb8a0;
  box-shadow:0 0 16px rgba(184,69,46,0.5);
}
.skill-pop.destroy{
  background:rgba(12,5,4,0.9); border:1px solid var(--red-side); color:#ffcfae;
  box-shadow:0 0 18px rgba(184,69,46,0.65);
}
@keyframes popFade{
  0%{ opacity:0; transform:translate(-50%,-15%) scale(0.55); }
  18%{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
  32%{ transform:translate(-50%,-50%) scale(1); }
  78%{ opacity:1; }
  100%{ opacity:0; transform:translate(-50%,-85%) scale(0.92); }
}

/* Attack slash — a quick double blade-sweep flashed over any card that
   was just battled, win or lose, shielded or not (see .attackFlash on the
   board entry). Lives on its own child element rather than as an
   animation on .card itself, so it never fights with .flipping's own
   transform/filter animation when both play at once on a captured card. */
.slash-fx{ position:absolute; inset:0; z-index:7; pointer-events:none; overflow:hidden; }
.slash-line{
  position:absolute; left:-15%; width:130%; height:7%;
  background:linear-gradient(90deg, transparent 0%, #fff 40%, #fff 60%, transparent 100%);
  box-shadow:0 0 8px 2px rgba(255,255,255,0.85), 0 0 18px 5px rgba(255,255,255,0.4);
  transform-origin:left center;
  opacity:0;
}
.slash-line.line1{ top:28%; animation:slashSweep 0.4s cubic-bezier(.2,.85,.3,1) var(--fx-delay,0ms) both; }
.slash-line.line2{ top:58%; animation:slashSweep 0.4s cubic-bezier(.2,.85,.3,1) calc(var(--fx-delay,0ms) + 0.06s) both; }
@keyframes slashSweep{
  0%{ transform:rotate(-26deg) scaleX(0); opacity:0; }
  22%{ opacity:1; }
  55%{ transform:rotate(-26deg) scaleX(1); opacity:1; }
  100%{ transform:rotate(-26deg) scaleX(1); opacity:0; }
}

/* destroy-ghost: a brief fading remnant of a card an AOE/direction effect
   just destroyed (state.destroyGhosts, see destroyCard()) — the cell is
   already empty in state.board by the time this renders, so this is
   purely a visual echo, not an interactive card (no click, no info
   button — cardFace() is called with noInfo:true for it). Without this,
   a multi-target destroy special just made cards vanish with no telegraph
   at all beyond the one summary line in the log. */
.card.destroy-ghost{
  pointer-events:none;
  animation: cardShatter 1.2s cubic-bezier(.4,0,.6,1) forwards;
}
.card.destroy-ghost .card-art,
.card.destroy-ghost .card-glow{ filter:saturate(0.3) brightness(0.6); }
@keyframes cardShatter{
  0%{ opacity:1; transform:scale(1) rotate(0deg); filter:brightness(1); }
  15%{ opacity:1; transform:scale(1.04) rotate(-1deg); filter:brightness(1.3) sepia(0.3) hue-rotate(-20deg); }
  100%{ opacity:0; transform:scale(0.85) rotate(4deg); filter:brightness(0.6); }
}

.log{
  font-size:13px; color:var(--text-dim); text-align:center; min-height:24px;
  display:flex; align-items:center; justify-content:center; padding:0 10px; margin-bottom:8px;
}

.result-banner{
  text-align:center; padding:16px 16px; border-radius:12px; margin-bottom:10px;
  border:1px solid var(--gold); background:linear-gradient(180deg, rgba(201,162,39,0.14), transparent);
}
.result-banner h2{ font-size:20px; margin:0 0 4px; color:var(--gold-bright); }
.result-banner p{ margin:0; font-size:12px; color:var(--text-dim); }

.footer-note{ text-align:center; font-size:11px; color:var(--text-dim); margin-top:26px; opacity:0.7; }

/* ---------- card detail modal (poster style) ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(4,3,9,0.86); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.modal-poster{
  width:100%; max-width:420px; max-height:92vh; overflow-y:auto;
  background:var(--void-2); border:1px solid var(--gold); border-radius:16px;
  box-shadow:0 20px 70px rgba(0,0,0,0.85); position:relative;
}
.modal-close{
  position:absolute; top:10px; right:10px; z-index:8;
  width:30px; height:30px; border-radius:50%;
  background:rgba(4,3,9,0.75); border:1px solid rgba(255,255,255,0.35); color:#fff;
  font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.modal-close:hover{ border-color:var(--gold); color:var(--gold-bright); }

.poster-art{
  position:relative; width:100%; aspect-ratio:3/4;
  background-size:cover; background-position:center 12%;
  border-radius:16px 16px 0 0; overflow:visible;
}
.poster-art-full{ width:100%; border-radius:16px 16px 0 0; overflow:hidden; line-height:0; }
.poster-art-full img{ width:100%; display:block; }
.poster-name-plain{ font-family:'Cinzel',serif; font-weight:700; font-size:22px; color:var(--gold-bright); }
.poster-role-plain{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-top:2px; }
.poster-stars-plain{ font-size:12px; color:var(--gold-bright); margin:5px 0 14px; }
.poster-fade{
  position:absolute; inset:0; border-radius:16px 16px 0 0;
  background:linear-gradient(180deg, rgba(6,5,12,0.75) 0%, rgba(6,5,12,0.05) 26%, rgba(6,5,12,0.1) 60%, rgba(6,5,12,0.55) 100%);
}
.poster-title-block{ position:absolute; top:14px; left:16px; right:70px; z-index:3; }
.poster-name{
  font-family:'Cinzel',serif; font-weight:700; font-size:26px; line-height:1.05;
  background:linear-gradient(180deg,#f7ecc8, var(--gold) 60%, #8a6d1a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 2px 10px rgba(0,0,0,0.6);

  clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  border:2px solid var(--gold); box-shadow:0 0 14px rgba(0,0,0,0.6), inset 0 0 10px rgba(201,162,39,0.15);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-weight:700; font-size:clamp(14px,5vw,19px); color:#fff;
}
.pd-label{
  margin-top:-4px; font-size:8px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--gold-bright); background:#0b0910; border:1px solid var(--gold);
  border-radius:3px; padding:1px 5px; white-space:nowrap;
}
.pd-top{ top:10px; left:50%; transform:translateX(-50%); }
.pd-bottom{ bottom:10px; left:50%; transform:translateX(-50%); }
.pd-left{ left:8px; top:50%; transform:translateY(-50%); }
.pd-right{ right:8px; top:50%; transform:translateY(-50%); }

.poster-skills{ padding:26px 20px 22px; }
.modal-skills-title{
  font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--gold); margin-bottom:12px;
}
.poster-skill{ display:flex; gap:10px; margin-bottom:14px; align-items:flex-start; }
.poster-skill:last-child{ margin-bottom:0; }
.poster-skill-icon{
  flex:0 0 auto; width:22px; height:22px; border-radius:50%; margin-top:1px;
  border:1px solid var(--gold); color:var(--gold-bright);
  display:flex; align-items:center; justify-content:center; font-size:11px;
}
.skill-name{ font-family:'Cinzel',serif; font-weight:700; font-size:13px; color:var(--gold-bright); margin-bottom:2px; }
.skill-desc{ font-size:13px; line-height:1.5; color:var(--text-dim); }
.skill-empty{ font-size:13px; color:var(--text-dim); font-style:italic; padding:0 20px 20px; }

/* ---------- rulebook modal: a paged image viewer, one illustrated page
   per rule topic (art generated to match the real rules — see RULEBOOK_PAGES) ---------- */
.rulebook-pager-img{ width:100%; display:block; border-radius:16px 16px 0 0; }
.rulebook-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; gap:12px;
}
.rulebook-nav-btn{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:8px 16px; font-family:'Cinzel',serif; font-size:12px;
  letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
}
.rulebook-nav-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
.rulebook-nav-btn:disabled{ opacity:0.35; cursor:default; }
.rulebook-dots{ display:flex; gap:6px; }
.rulebook-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
.rulebook-dot.active{ background:var(--gold); }

/* ---------- special-attack choice picker: for ultimates that need an
   extra choice beyond (or instead of) a board target — e.g. Pallis picks
   an element, Tiamat picks a power after picking her target. ---------- */
.choice-picker-overlay{
  position:fixed; inset:0; z-index:55;
  background:rgba(4,3,9,0.86); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.choice-picker{
  width:100%; max-width:340px; background:var(--void-2); border:1px solid var(--gold);
  border-radius:16px; box-shadow:0 20px 70px rgba(0,0,0,0.85); padding:22px 20px;
  text-align:center;
}
.choice-picker h3{
  font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--gold); margin:0 0 16px;
}
.choice-picker-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:16px; }
.choice-picker-btn{
  flex:1 1 auto; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
  color:var(--text-dim); font-family:'Spectral',serif; font-size:11px; font-weight:600; cursor:pointer;
  transition:all .15s ease;
}
.choice-picker-icon{ font-size:22px; line-height:1; }
.choice-picker-btn:hover{
  border-color:var(--gold); color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.choice-picker-cancel{ width:100%; }

/* ---------- mobile battle layout: board becomes the hero, hands become
   horizontal strips above/below it instead of squeezed side columns ---------- */
@media (max-width:640px){
  .wrap{ padding:8px 8px 10px; }

  .masthead.compact{ margin:0 0 5px; }
  .masthead.compact .rune{ width:18px; height:18px; margin:0 auto 2px; font-size:9px; }
  .masthead.compact h1{ font-size:17px; }
  .masthead.compact .sub{ font-size:8px; }
  .masthead.compact .sound-toggle,
  .masthead.compact .music-toggle{ width:18px; height:18px; font-size:9px; }

  .scoreboard{ padding:5px 12px; margin-bottom:5px; }
  .score-num{ font-size:15px; }
  .turn-indicator{ font-size:10px; }
  .score-flame{ width:22px; height:22px; }

  .battle-row{
    flex-direction:column;
    align-items:stretch;
    gap:4px;
  }

  .side-hand.hand-row{
    width:100%;
    flex-direction:row;
    gap:5px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:1px 1px 2px;
  }
  .side-hand.hand-row .card{
    width:44px;
    flex:0 0 auto;
  }
  /* At 44px, the 4 edge-mounted stat badges (each with a 17px floor,
     since clamp()'s cqw term is already tiny here) collide with each
     other and with the corner badges (info button, level stars) — none
     of those have room left to sit at their own normal floor size too.
     Shrink everything that competes for the rim, and drop the star
     rating entirely (same call as .hand-row.enemy already makes for
     .card-role — least essential info goes first when space runs out). */
  .side-hand.hand-row .stat-n{
    width:12px; height:12px; font-size:7.5px; border-width:1px;
  }
  .side-hand.hand-row .stat-n.n-top{ top:1px; }
  .side-hand.hand-row .stat-n.n-bottom{ bottom:1px; }
  .side-hand.hand-row .stat-n.n-left{ left:1px; }
  .side-hand.hand-row .stat-n.n-right{ right:1px; }
  .side-hand.hand-row .info-btn{ width:13px; height:13px; font-size:7px; top:2px; right:2px; }
  .side-hand.hand-row .level-stars{ display:none; }
  .side-hand.hand-row .element-badge{ width:10px; height:10px; font-size:6px; }
  .side-hand.hand-row .card-top{ padding-top:12px; }
  .hand-label.side{
    text-align:left;
    margin:0 0 1px 2px;
    font-size:9px;
  }

  .arena-frame{
    max-width:none;
    width:100%;
    aspect-ratio:1086/1180;
  }
  .board{
    top:9%; left:14%; right:14%; bottom:auto;
    gap:3px;
  }

  .log{ margin:4px 0; font-size:12px; }
  button.ghost{ padding:7px; margin-top:4px; }
}

/* ---------- large desktop: same left / center / right layout, just
   moderately scaled up to use more of the available screen space. Also
   caps .stage to the viewport's own height (instead of just a min-height)
   and makes .wrap the scroll container that fills it, so .battle-row can
   flex to fill whatever's left after the masthead/scoreboard/log/buttons
   and the arena sizes itself to that — the battle screen fits one screen
   instead of the whole page growing past the fold on an ordinary desktop
   browser window (not just true fullscreen). Screens too short for
   everything still scroll, just inside the framed panel. ---------- */
@media (min-width:900px){
  .stage{ max-width:1300px; height:100dvh; overflow:hidden; }
  .wrap{
    padding:22px 26px 30px;
    height:100%;
    display:flex; flex-direction:column;
    overflow-y:auto;
  }

  .battle-row{ gap:16px; flex:1 1 auto; min-height:0; }

  .hand-row{ width:120px; gap:10px; height:100%; overflow-y:auto; }
  .hand-label.side{ font-size:12px; margin-bottom:6px; }

  .board{ gap:11px; }
  .arena-frame{
    max-width:820px;
    height:100%; width:auto;
    flex:0 1 auto;
  }

  .scoreboard{ padding:11px 20px; margin-bottom:16px; }
  .score-num{ font-size:21px; }
  .turn-indicator{ font-size:13px; }
  .score-flame{ width:44px; height:44px; }
}

/* ---------- true browser fullscreen (the ⛶ button): the game fills the
   whole physical screen, so stop capping it at desktop's 1000px and let it
   use the extra width — bigger board, bigger hands, more breathing room.
   The viewport-fit mechanics (.stage bounded to 100dvh, .wrap scrolling,
   .battle-row/.hand-row/.arena-frame flexing to fill it) already come from
   the plain desktop rule above; this block only widens the caps further.
   Only kicks in alongside the desktop breakpoint so a phone in fullscreen
   keeps its normal narrow layout. ---------- */
@media (min-width:900px){
  html:fullscreen .stage,
  html:-webkit-full-screen .stage{
    max-width:1700px;
  }
  html:fullscreen .wrap,
  html:-webkit-full-screen .wrap{
    padding:28px 40px 36px;
  }
  html:fullscreen .battle-row,
  html:-webkit-full-screen .battle-row{
    gap:30px;
  }
  html:fullscreen .hand-row,
  html:-webkit-full-screen .hand-row{
    width:140px; gap:14px;
  }
  html:fullscreen .hand-label.side,
  html:-webkit-full-screen .hand-label.side{
    font-size:14px;
  }
  html:fullscreen .board,
  html:-webkit-full-screen .board{
    gap:16px;
  }
  html:fullscreen .arena-frame,
  html:-webkit-full-screen .arena-frame{
    max-width:860px;
  }
  html:fullscreen .scoreboard,
  html:-webkit-full-screen .scoreboard{
    max-width:860px; margin-left:auto; margin-right:auto;
  }
  html:fullscreen .wins-row,
  html:-webkit-full-screen .wins-row{
    max-width:860px; margin-left:auto; margin-right:auto;
  }
  html:fullscreen .score-num,
  html:-webkit-full-screen .score-num{
    font-size:26px;
  }
  html:fullscreen .turn-indicator,
  html:-webkit-full-screen .turn-indicator{
    font-size:15px;
  }
}

/* ---------------- sound engine ---------------- */
let soundOn = true;
let musicOn = true;
let isFullscreen = false;

/* ---------------- tester counter ---------------- */
let testerCount = null;
function loadTesterCount(){
  fetch('https://abacus.jasoncameron.dev/hit/triadarena.littlejesp/plays', { cache:'no-store' })
    .then(res => res.ok ? res.json() : Promise.reject(res.status))
    .then(data => {
      if(typeof data.value === 'number') testerCount = data.value;
      render();
    })
    .catch(() => { /* counter unreachable — badge just stays hidden */ });
}

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req) req.call(el);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
}

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt=>{
  document.addEventListener(evt, ()=>{
    isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    render();
  });
});
let musicStarted = false;
let actx = null;

function getBgm(){ return document.getElementById('bgm'); }

function tryStartMusic(){
  if(musicStarted || !musicOn) return;
  const bgm = getBgm();
  if(!bgm) return;
  bgm.volume = 0.35;
  bgm.play().then(()=>{ musicStarted = true; }).catch(()=>{ /* wait for a later gesture */ });
}

function toggleMusic(){
  musicOn = !musicOn;
  const bgm = getBgm();
  if(bgm){
    if(musicOn){ musicStarted = false; tryStartMusic(); }
    else { bgm.pause(); }
  }
  render();
}

function getCtx(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}

function tone({freq, start=0, dur=0.2, type='sine', gain=0.18, glideTo=null}){
  if(!soundOn) return;
  const ctx = getCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  const t0 = ctx.currentTime + start;
  osc.frequency.setValueAtTime(freq, t0);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

const SFX = {
  select(){ tone({ freq:720, dur:0.07, type:'triangle', gain:0.10 }); },
  deselect(){ tone({ freq:480, dur:0.07, type:'triangle', gain:0.08 }); },
  begin(){
    [440,660,880].forEach((f,i)=> tone({ freq:f, start:i*0.07, dur:0.22, type:'triangle', gain:0.14 }));
  },
  place(owner){
    const base = owner === 'blue' ? 150 : 120;
    tone({ freq:base, dur:0.16, type:'sine', gain:0.20, glideTo:base*0.7 });
    tone({ freq:base*2.2, start:0.01, dur:0.1, type:'triangle', gain:0.08 });
  },
  flip(n){
    const notes = [1046,1318,1568,1760];
    for(let i=0;i<n;i++){
      tone({ freq:notes[i % notes.length], start:i*0.08, dur:0.18, type:'sine', gain:0.14 });
    }
  },
  win(){
    [523,659,784,1046].forEach((f,i)=> tone({ freq:f, start:i*0.12, dur:0.4, type:'triangle', gain:0.16 }));
  },
  lose(){
    [392,349,294].forEach((f,i)=> tone({ freq:f, start:i*0.16, dur:0.45, type:'sine', gain:0.14 }));
  },
  draw(){
    [440,440].forEach((f,i)=> tone({ freq:f, start:i*0.18, dur:0.2, type:'sine', gain:0.12 }));
  },
  shield(){
    tone({ freq:660, dur:0.22, type:'triangle', gain:0.16 });
    tone({ freq:990, start:0.05, dur:0.28, type:'sine', gain:0.13 });
    tone({ freq:220, start:0, dur:0.3, type:'sine', gain:0.10 });
  },
  bonus(){
    [880,1174,1568].forEach((f,i)=> tone({ freq:f, start:i*0.05, dur:0.16, type:'triangle', gain:0.11 }));
  },
};

function toggleSound(){
  soundOn = !soundOn;
  if(soundOn) getCtx();
  render();
}

/* ---------------- state ---------------- */
let state = {
  phase: 'draft',        // draft | battle | result
  selected: [],           // hero ids chosen by player
  board: Array(9).fill(null), // {card, owner:'blue'|'red'}
  playerHand: [],
  enemyHand: [],
  turn: 'blue',
  pendingCard: null,      // player card id chosen from hand, awaiting cell tap
  log: 'Choose the five champions who will carry your banner.',
  winner: null,
  viewingCard: null,      // card object currently shown in the detail modal
  showRulebook: false,    // true while the 📖 rulebook modal is open
  rulebookPage: 0,        // index into RULEBOOK_PAGES currently shown
  showSisterLore: false,  // true while the Triple Triad Sisters' backstory panel is expanded (Campaign stage 17 only)
  showGraveyard: false,   // true while the Graveyard panel (optional rule) is expanded
  winsPopup: null,        // { owner, amount } — transient "+N Wins!" toast
  conquestPopup: false,   // false, or 'blue'/'red' while that side's "Conquered!" banner is showing
  campaignUnlocked: null, // card ids unlocked by the just-finished campaign stage win, for the result screen
  rules: { same:false, plus:false, combo:false, elemental:false, graveyard:false }, // optional Triple-Triad-style rules
  graveyard: { blue: [], red: [] }, // destroyed cards, recorded here instead of vanishing when rules.graveyard is on — see destroyCard()
  destroyGhosts: [],      // { index, card, owner } — brief fade-out visual for a just-destroyed cell, see destroyCard()
  draftMode: 'random',    // 'random' | 'manual'
  revealing: false,       // true while the drawn-card reveal animation is playing
  wins: { blue: 0, red: 0 },   // accumulated captures — spent to activate special attacks
  specialUsed: {},        // `${owner}:${cardId}` -> true, once a once-per-match special has fired
  specialMode: null,      // { sourceIndex, special } while awaiting a target click for a special attack
  extraTurnPending: null, // owner who gets to act again instead of passing the turn
  placedThisTurn: false,  // true once the active side has placed their one card for this turn
  turnCount: 0,           // increments on every real turn switch (see advanceTurn) — powers "this round" effects
};

function uid(card, owner){ return owner + ':' + card.id; }

function findCardById(id){
  return HEROES.find(h => h.id === id) || FOREST_FOES.find(f => f.id === id) || null;
}

function openCardModal(id){
  const card = findCardById(id);
  if(card){ state.viewingCard = card; state.showRulebook = false; render(); }
}

function closeCardModal(){
  state.viewingCard = null;
  render();
}

function openRulebook(){
  state.showRulebook = true;
  state.viewingCard = null;
  state.rulebookPage = 0;
  render();
}

function closeRulebook(){
  state.showRulebook = false;
  render();
}

function rulebookGo(delta){
  const next = state.rulebookPage + delta;
  if(next < 0 || next >= RULEBOOK_PAGES.length) return;
  state.rulebookPage = next;
  render();
}

/* ---------------- rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  let html = state.phase === 'draft' ? renderDraft() : (state.phase === 'coinflip' ? renderCoinflip() : renderBattle());
  html += renderModal();
  html += renderRulebookModal();
  html += renderGraveyardModal();
  html += renderChoicePicker();
  app.innerHTML = html;
  attachHandlers();
}

function renderChoicePicker(){
  const mode = state.specialMode;
  if(!mode || !mode.choices) return '';
  return `
    <div class="choice-picker-overlay" id="choice-picker-overlay">
      <div class="choice-picker">
        <h3>${mode.choiceTitle}</h3>
        <div class="choice-picker-grid">
          ${mode.choices.map(c => `
            <button class="choice-picker-btn" data-choice="${c.value}">
              <span class="choice-picker-icon">${c.icon}</span>
              <span>${c.label}</span>
            </button>`).join('')}
        </div>
        <button class="ghost choice-picker-cancel" id="choice-picker-cancel">Cancel</button>
      </div>
    </div>`;
}

function renderRulebookModal(){
  if(!state.showRulebook) return '';
  const total = RULEBOOK_PAGES.length;
  const i = state.rulebookPage;
  const dots = RULEBOOK_PAGES.map((_, idx) => `<span class="rulebook-dot ${idx===i ? 'active':''}"></span>`).join('');
  return `
    <div class="modal-overlay" id="rulebook-overlay">
      <div class="modal-poster">
        <button class="modal-close" id="rulebook-close">✕</button>
        <img class="rulebook-pager-img" src="${RULEBOOK_PAGES[i]}" alt="Rulebook page ${i+1} of ${total}">
        <div class="rulebook-nav">
          <button class="rulebook-nav-btn" id="rulebook-prev" ${i===0 ? 'disabled':''}>‹ Prev</button>
          <div class="rulebook-dots">${dots}</div>
          <button class="rulebook-nav-btn" id="rulebook-next" ${i===total-1 ? 'disabled':''}>Next ›</button>
        </div>
      </div>
    </div>`;
}

function renderGraveyardModal(){
  if(!state.showGraveyard) return '';
  const side = (label, cls, cards) => `
    <div class="graveyard-side">
      <div class="graveyard-side-label ${cls}">${label} (${cards.length})</div>
      ${cards.length ? `<div class="graveyard-cards">${cards.map(c => `
        <div class="graveyard-card">
          ${CARD_IMAGES[c.id] ? `<div class="graveyard-card-art" style="background-image:url('${CARD_IMAGES[c.id]}')"></div>` : ''}
          <span>${c.name}</span>
        </div>`).join('')}</div>` : `<div class="graveyard-empty">No cards here yet.</div>`}
    </div>`;
  return `
    <div class="modal-overlay" id="graveyard-overlay">
      <div class="modal-poster graveyard-modal">
        <button class="modal-close" id="graveyard-close">✕</button>
        <h3>💀 Graveyard</h3>
        <p class="graveyard-hint">Cards destroyed by a Special Attack are recorded here instead of vanishing. They're gone for the rest of the match — the graveyard clears when the match ends.</p>
        <div class="graveyard-columns">
          ${side('Forest', 'red', state.graveyard.red)}
          ${side('Your Banner', 'blue', state.graveyard.blue)}
        </div>
      </div>
    </div>`;
}

function renderModal(){
  if(!state.viewingCard) return '';
  const c = state.viewingCard;
  const skillsHtml = (c.skills && c.skills.length)
    ? c.skills.map(s => `
        <div class="poster-skill">
          <div class="poster-skill-icon">✦</div>
          <div>
            <div class="skill-name">${s.name}</div>
            <div class="skill-desc">${s.desc}</div>
          </div>
        </div>`).join('')
    : `<div class="skill-empty">No recorded card skills.</div>`;

  const fullArt = FULL_CARD_IMAGES[c.id];

  const artBlock = fullArt
    ? `<div class="poster-art-full"><img src="${fullArt}" alt="${c.name}"></div>`
    : `
        <div class="poster-art" style="${CARD_IMAGES[c.id] ? `background-image:url('${CARD_IMAGES[c.id]}')` : `background:${c.hue}`}">
          <div class="poster-fade"></div>
          <div class="poster-title-block">
            <div class="poster-name">${c.name}</div>
            <div class="poster-role">${c.role}</div>
            <div class="poster-stars">${'★'.repeat(cardLevel(c))}</div>
          </div>
          <div class="poster-diamond pd-top"><div class="pd-shape">${c.top}</div><div class="pd-label">Top</div></div>
          <div class="poster-diamond pd-left"><div class="pd-shape">${c.left}</div><div class="pd-label">Left</div></div>
          <div class="poster-diamond pd-right"><div class="pd-shape">${c.right}</div><div class="pd-label">Right</div></div>
          <div class="poster-diamond pd-bottom"><div class="pd-shape">${c.bottom}</div><div class="pd-label">Bottom</div></div>
        </div>`;

  const nameBlock = fullArt
    ? `<div class="poster-name-plain">${c.name}</div>
       <div class="poster-role-plain">${c.role}</div>
       <div class="poster-stars-plain">${'★'.repeat(cardLevel(c))}</div>`
    : '';

  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-poster">
        <button class="modal-close" id="modal-close">✕</button>
        ${artBlock}
        <div class="poster-skills">
          ${nameBlock}
          <div class="modal-skills-title">Card Skills</div>
          ${skillsHtml}

      </div>

function cardFace(card, opts={}){
  const ownerClass = opts.owner ? 'owner-' + opts.owner : '';
  const selClass = opts.selected ? 'selected' : '';
  const disClass = opts.disabled ? 'disabled' : '';
  const inplayClass = opts.inplay ? 'inplay' : '';
  const flipClass = opts.flipping ? 'flipping' : '';
  const placeClass = opts.placing ? 'placing' : '';
  const clickable = opts.clickable ? 'selectable' : '';
  const shieldClass = opts.shieldFlash ? 'shield-flash' : '';
  const bonusClass = opts.bonusFlash ? 'bonus-flash' : '';
  const specialActiveClass = opts.specialActive ? 'special-active' : '';
  const specialReadyClass = (opts.specialInfo && opts.specialInfo.ready) ? 'special-ready' : '';
  const destroyedClass = opts.destroyed ? 'destroy-ghost' : '';
  const cardTitle = (opts.specialInfo && opts.specialInfo.ready) ? ` title="${opts.specialInfo.title} — tap to unleash"` : '';
  const fxDelayStyle = opts.fxDelay ? ` style="--fx-delay:${opts.fxDelay}ms"` : '';
  return `
    <div class="card ${ownerClass} ${selClass} ${disClass} ${inplayClass} ${flipClass} ${placeClass} ${clickable} ${shieldClass} ${bonusClass} ${specialActiveClass} ${specialReadyClass} ${destroyedClass}" data-cardid="${card.id}"${cardTitle}${fxDelayStyle} ${opts.dataAttr||''}>
      ${CARD_IMAGES[card.id]
        ? `<div class="card-art" style="background-image:url('${CARD_IMAGES[card.id]}')"></div>`
        : `<div class="card-glow" style="background:${card.hue}">${card.icon ? `<div class="foe-icon">${card.icon}</div>` : ''}</div>`}
      ${opts.owner ? `<div class="owner-tint tint-${opts.owner}"></div>` : ''}
      <div class="level-stars">${'★'.repeat(cardLevel(card))}</div>
      ${card.element ? `<div class="element-badge" title="${card.element}">${ELEMENT_ICONS[card.element]}</div>` : ''}
      ${opts.petrified ? `<div class="petrified-badge" title="Petrified — can't use its Special Attack">🗿</div>` : ''}
      ${opts.noInfo ? '' : `<button class="info-btn" data-info="${card.id}" title="View card skills">i</button>`}
      ${opts.specialInfo ? `<div class="special-diamond ${opts.specialInfo.ready ? 'ready' : 'locked'}" title="${opts.specialInfo.title}${opts.specialInfo.ready ? ' — tap to unleash' : ' (not enough wins yet)'}"></div>` : ''}
      ${opts.shieldFlash ? `<div class="skill-pop shield">🛡 Shield!</div>` : ''}
      ${opts.bonusFlash ? `<div class="skill-pop bonus ${(opts.bonusAmount||0) < 0 ? 'bonus-negative' : ''}">${(opts.bonusAmount||0) >= 0 ? '+' : ''}${opts.bonusAmount||1} Power</div>` : ''}
      ${opts.attackFlash ? `<div class="slash-fx"><div class="slash-line line1"></div><div class="slash-line line2"></div></div>` : ''}
      ${opts.destroyed ? `<div class="skill-pop destroy">💥 Destroyed!</div>` : ''}
      <div class="card-inner">
        <div class="card-top">
          <div>
            <div class="card-name">${card.name}</div>
            <div class="card-role">${card.role}</div>
          </div>
        </div>
      </div>
      <div class="stat-cluster">
        <div class="stat-n n-top">${card.top}</div>
        <div class="stat-n n-left">${card.left}</div>
        <div class="stat-n n-right">${card.right}</div>
        <div class="stat-n n-bottom">${card.bottom}</div>
      </div>
    </div>`;
}

function mysteryCard(){
  return `<div class="card card-back-mini"></div>`;
}

function cardLevel(card){
  const sum = card.top + card.right + card.bottom + card.left;
  return Math.min(5, Math.max(1, Math.round(sum / 8)));
}

function renderCampaignPanel(){
  const stage = currentCampaignStage();
  const poolIds = campaignPool();
  const ngTag = campaignProgress.ngPlus > 0 ? ` (New Game+${campaignProgress.ngPlus})` : '';

  if(!stage){
    return `
      <div class="section-label">The tale is told</div>
      <div class="rules">
        <b>Campaign complete!</b> You've carried your banner through every trial the
        forest had to offer, and every champion has joined your story.${campaignProgress.ngPlus > 0 ? ` You cleared this New Game+${campaignProgress.ngPlus} run — the forest grows stronger with every cycle.` : ''}
      </div>
      <div class="draft-grid">
        ${HEROES.filter(h => poolIds.includes(h.id)).map(h => cardFace(h, { clickable:false, noInfo:false })).join('')}
      </div>
      <button class="cta" id="campaign-ngplus-btn">Start New Game+${campaignProgress.ngPlus + 1}</button>
      <button class="ghost" id="campaign-reset-btn">Reset Campaign</button>
    `;
  }

  const stageNum = campaignProgress.stageIndex + 1;
  const chosen = state.selected.length;

  if(stageNum === 1){
    return `
      <div class="section-label">Stage 1 of ${CAMPAIGN_STAGES.length} — ${stage.name}${ngTag}</div>
      <div class="rules">Your story begins with the five champions who started it all.${campaignProgress.ngPlus > 0 ? ' The forest remembers you — its champions strike harder this time.' : ''}</div>
      <div class="draft-grid">
        ${CAMPAIGN_STARTERS.map(id => HEROES.find(h=>h.id===id)).filter(Boolean).map(h => cardFace(h, { clickable:false })).join('')}
      </div>
      <button class="cta" id="campaign-begin-btn">Begin Stage 1</button>
      <button class="ghost" id="campaign-reset-btn">Reset Campaign</button>
    `;
  }

  const banner = stage.banner ? `<div class="stage-banner"><img src="${stage.banner}" alt="${stage.name}"></div>` : '';
  const loreToggle = stage.lore ? `<button class="ghost" id="sister-lore-toggle">${state.showSisterLore ? 'Hide Their Story' : '📖 Read Their Story'}</button>` : '';
  const lorePanel = (stage.lore && state.showSisterLore) ? `
    <div class="lore-panel">
      ${stage.lore.map(section => `
        <div class="lore-section">
          <div class="lore-title">${section.title}</div>
          ${section.body.map(p => `<p>${p}</p>`).join('')}
        </div>
      `).join('')}
    </div>
  ` : '';

  return `
    <div class="section-label">Stage ${stageNum} of ${CAMPAIGN_STAGES.length} — ${stage.name}${ngTag}</div>
    ${banner}
    ${loreToggle}
    ${lorePanel}
    <div class="rules">Choose five champions to carry this stage.</div>
    <div class="count-row"><span>Champions chosen</span><span><b>${chosen}</b> / 5</span></div>
    <button class="cta" id="campaign-begin-btn" ${chosen === 5 ? '' : 'disabled'}>Begin Stage ${stageNum}</button>
    <div class="section-label">Choose exactly five champions</div>
    <div class="draft-grid">
      ${poolIds.map(id => HEROES.find(h=>h.id===id)).filter(Boolean).map(h => cardFace(h, { selected: state.selected.includes(h.id), clickable:true })).join('')}
    </div>
    <button class="ghost" id="campaign-reset-btn">Reset Campaign</button>
  `;
}

      <div class="coinflip-frame">
        <div class="arena-rosette" aria-hidden="true">

}

function boardCellHtml(cell, i){
  let specialInfo = null;
  if(cell && cell.owner === 'blue' && cell.card.special){
    const key = 'blue:' + cell.card.id;
    if(!(cell.card.special.once && state.specialUsed[key])){
      const ready = state.turn === 'blue' && state.phase === 'battle' && specialUsable(cell.card, 'blue', cell);
      specialInfo = { cellIndex:i, ready, title: `${cell.card.special.name} — costs ${cell.card.special.cost} wins` };
    }
  }
  const placeTargetable = !cell && state.pendingCard && state.turn==='blue' && state.phase==='battle' && !state.placedThisTurn;
  const specialSrcEntry = state.specialMode && state.board[state.specialMode.sourceIndex];
  const specialTargetable = state.specialMode && !state.specialMode.choices && cell && cell.owner === 'red'
    && !(specialSrcEntry && specialSrcEntry.card.id === 'deathblade' && !sharesLine(state.specialMode.sourceIndex, i));
  const cellClass = `${placeTargetable ? 'targetable':''} ${specialTargetable ? 'special-target':''}`;
  const ghost = !cell && state.destroyGhosts.find(g => g.index === i);
  return `
    <div class="cell ${cellClass}" data-cell="${i}">
      ${cell ? cardFace(cell.card, {
          owner:cell.owner, flipping:cell.justFlipped, placing:cell.justPlaced,
          shieldFlash:cell.shieldFlash, bonusFlash:cell.bonusFlash, bonusAmount:cell.bonusAmount,
          attackFlash:cell.attackFlash, fxDelay:cell.fxDelay,
          petrified: cell.petrifiedUntilTurnCount > state.turnCount,
          specialInfo, specialActive: !!(state.specialMode && state.specialMode.sourceIndex === i)
        }) : (ghost ? cardFace(ghost.card, { owner:ghost.owner, destroyed:true, noInfo:true }) : '')}
    </div>
  `;
}

function renderBattle(){
  const blueCount = state.board.filter(c => c && c.owner === 'blue').length;
  const redCount = state.board.filter(c => c && c.owner === 'red').length;

  let turnText;
  if(state.phase === 'result'){
    turnText = '';
  } else {
    turnText = state.turn === 'blue' ? 'Your move — choose a champion, then a square' : "The forest's move...";
  }

  let resultHtml = '';
  if(state.phase === 'result'){
    let title, sub;
    if(state.winner === 'blue'){ title = 'Victory'; sub = 'Your banner holds the field.'; }
    else if(state.winner === 'red'){ title = 'Defeat'; sub = 'The forest claims the board.'; }
    else { title = 'A Standstill'; sub = 'Neither banner could break the other.'; }

    if(state.draftMode === 'campaign' && state.winner === 'blue'){
      const unlockedNames = (state.campaignUnlocked||[]).map(id => (HEROES.find(h=>h.id===id)||{}).name).filter(Boolean);
      const complete = !currentCampaignStage();
      resultHtml = `
        <div class="result-banner">

  return `
    ${masthead(true)}
    <div class="scoreboard">
      <div class="score-side">
        <img class="score-flame red" src="flame-red.png" alt="">

        <div><div class="score-num blue" style="text-align:right">${blueCount}</div><div class="score-label">Your Banner</div></div>
        <img class="score-flame blue" src="flame-blue.png" alt="">
      </div>
    </div>
    <div class="wins-row">
      <span class="wins-chip red">⚡ <b>${state.wins.red}</b> wins</span>
      ${state.rules.graveyard ? `<button class="graveyard-toggle" id="graveyard-toggle" title="View the Graveyard">💀 ${state.graveyard.blue.length + state.graveyard.red.length}</button>` : ''}
      <span class="wins-chip blue">⚡ <b>${state.wins.blue}</b> wins</span>
      ${state.winsPopup ? `<div class="wins-toast ${state.winsPopup.owner}">+${state.winsPopup.amount} Win${state.winsPopup.amount>1?'s':''}!</div>` : ''}
    </div>

    <div class="battle-row">
      <div class="side-hand hand-row enemy">

      </div>

      <div class="arena-frame">
      <div class="arena-rosette" aria-hidden="true">
        <svg viewBox="0 0 200 200" width="100%" height="100%">

          <polygon points="100,42 108,92 158,100 108,108 100,158 92,108 42,100 92,92" fill="none" stroke="rgba(201,162,39,0.32)" stroke-width="1.5"/>
          <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(201,162,39,0.16)" stroke-width="1"/>

    graveyardOverlay.addEventListener('click', (e)=>{
      if(e.target.id === 'graveyard-overlay') { state.showGraveyard = false; render(); }
    });
  }
  const graveyardClose = document.getElementById('graveyard-close');
  if(graveyardClose) graveyardClose.addEventListener('click', ()=>{
    state.showGraveyard = false;
    render();
  });

  const choicePickerOverlay = document.getElementById('choice-picker-overlay');
  if(choicePickerOverlay){
    choicePickerOverlay.addEventListener('click', (e)=>{

    });
  }
  const choicePickerCancel = document.getElementById('choice-picker-cancel');
  if(choicePickerCancel) choicePickerCancel.addEventListener('click', cancelSpecial);
  document.querySelectorAll('.choice-picker-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> resolveSpecialChoice(btn.dataset.choice));
  });

  if(state.phase === 'draft'){
    const modeRandom = document.getElementById('mode-random');
    if(modeRandom) modeRandom.addEventListener('click', ()=>{
      if(state.draftMode === 'random') return;
      state.draftMode = 'random';

      render();
    });
    const modeManual = document.getElementById('mode-manual');
    if(modeManual) modeManual.addEventListener('click', ()=>{
      if(state.draftMode === 'manual') return;
      state.draftMode = 'manual';
      SFX.select();
      render();
    });
    const modeCampaign = document.getElementById('mode-campaign');
    if(modeCampaign) modeCampaign.addEventListener('click', ()=>{
      if(state.draftMode === 'campaign') return;
      state.draftMode = 'campaign';
      state.selected = campaignProgress.stageIndex === 0 ? CAMPAIGN_STARTERS.slice() : [];
      SFX.select();
      render();
    });

    const drawPile = document.getElementById('draw-pile-btn');
    if(drawPile && !drawPile.classList.contains('disabled')){
      drawPile.addEventListener('click', ()=>{
        SFX.begin();
        state.revealing = true;
        render();
        setTimeout(()=>{ drawRandomFive(); }, 450);
      });
    }

    if(state.draftMode === 'manual'){
      document.querySelectorAll('.draft-grid .card').forEach(el=>{
        el.addEventListener('click', ()=>{
          const id = el.dataset.cardid;
          const idx = state.selected.indexOf(id);
          if(idx >= 0){ state.selected.splice(idx,1); SFX.deselect(); }
          else if(state.selected.length < 5){ state.selected.push(id); SFX.select(); }
          render();
        });
      });
      const beginManual = document.getElementById('begin-btn-manual');
      if(beginManual) beginManual.addEventListener('click', ()=>{ SFX.begin(); startBattle(); });
    }

    if(state.draftMode === 'campaign'){

        document.querySelectorAll('.draft-grid .card.selectable').forEach(el=>{

            const idx = state.selected.indexOf(id);
            if(idx >= 0){ state.selected.splice(idx,1); SFX.deselect(); }
            else if(state.selected.length < 5){ state.selected.push(id); SFX.select(); }

          });
        });

        state.selected = CAMPAIGN_STARTERS.slice();
        SFX.begin();
        render();
      });
      const campaignReset = document.getElementById('campaign-reset-btn');
      if(campaignReset) campaignReset.addEventListener('click', ()=>{

        saveCampaignProgress();
        state.selected = CAMPAIGN_STARTERS.slice();
        render();
      });

    const sameBox = document.getElementById('rule-same');
    if(sameBox) sameBox.addEventListener('change', ()=>{

      if(!state.rules.same && !state.rules.plus) state.rules.combo = false;
      render();
    });
    const plusBox = document.getElementById('rule-plus');
    if(plusBox) plusBox.addEventListener('change', ()=>{

      render();
    });
    const comboBox = document.getElementById('rule-combo');
    if(comboBox) comboBox.addEventListener('change', ()=>{
      state.rules.combo = comboBox.checked;
      render();
    });
    const elementalBox = document.getElementById('rule-elemental');
    if(elementalBox) elementalBox.addEventListener('change', ()=>{
      state.rules.elemental = elementalBox.checked;
      render();
    });
    const graveyardBox = document.getElementById('rule-graveyard');
    if(graveyardBox) graveyardBox.addEventListener('change', ()=>{
      state.rules.graveyard = graveyardBox.checked;
      render();
    });
  } else {
    document.querySelectorAll('.hand-row:not(.enemy) .card').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(state.turn!=='blue' || state.phase!=='battle' || state.placedThisTurn) return;
        const id = el.dataset.cardid;
        const opening = state.pendingCard !== id;
        state.pendingCard = opening ? id : null;
        state.specialMode = null;
        opening ? SFX.select() : SFX.deselect();
        render();
      });
    });
    document.querySelectorAll('.cell').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = parseInt(el.dataset.cell,10);
        if(state.specialMode && !state.specialMode.choices){
          resolveSpecialTarget(i);
          return;
        }
        // A pulsing (ready-special) card is a tap target in its own right —
        // tap it to activate, tap it again to cancel while targeting.
        const entry = state.board[i];
        if(entry && entry.owner==='blue' && entry.card.special){
          const ready = state.turn==='blue' && state.phase==='battle' && specialUsable(entry.card, 'blue', entry);
          if(ready){ executeSpecial(i); return; }
        }
        if(state.turn!=='blue' || state.phase!=='battle' || !state.pendingCard || state.placedThisTurn) return;
        if(state.board[i]) return;
        placeCard(i, state.pendingCard, 'blue');
      });
