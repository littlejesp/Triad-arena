  dragon({ srcEntry, owner }){
    const name = srcEntry.card.name;
    const enemyOwner = owner === 'blue' ? 'red' : 'blue';
    const totalConquests = state.wins.blue + state.wins.red;
    const bonus = Math.min(3, Math.floor(totalConquests / 2));
    if(bonus > 0) SpecialVerbs.attackBoost(srcEntry, bonus);
    state.board.forEach(e => { if(e && e.owner === enemyOwner) SpecialVerbs.debuffThisRound(e, 1); });
    return bonus > 0
      ? `${name}'s Conquests Witnessed grants +${bonus} Power, remembering ${totalConquests} conquest${totalConquests !== 1 ? 's' : ''} already claimed!`
      : `${name}'s Conquests Witnessed finds too few conquests yet claimed to grow stronger!`;
  },
  // Little Jesp's Scales of Judgment: compares state.wins.blue vs
  // state.wins.red (same shared resource every Ultimate already gates on,
  // no new counter). Permanent +1 Power per point the gap is under 3 (gap 0
  // = perfectly tied = +3, gap 3+ = +0), applied once as a flat
  // SpecialVerbs.attackBoost — locked in at activation, same snapshot
  // pattern as Conquests Witnessed above. Then whichever side currently
  // holds MORE Wins gets -1 Power this round via debuffThisRound —
  // deliberately NOT enemy-only like every other AOE debuff in the roster:
  // "even if that's your own side" is the entire point of a Balance card.
  // An exact tie skips the debuff step — nothing to correct.
  littlejesp({ srcEntry, owner }){
    const name = srcEntry.card.name;
    const gap = Math.abs(state.wins.blue - state.wins.red);
    const bonus = Math.max(0, 3 - gap);
    if(bonus > 0) SpecialVerbs.attackBoost(srcEntry, bonus);
    const leadingOwner = state.wins.blue === state.wins.red ? null : (state.wins.blue > state.wins.red ? 'blue' : 'red');
    if(leadingOwner) state.board.forEach(e => { if(e && e.owner === leadingOwner) SpecialVerbs.debuffThisRound(e, 1); });
    return leadingOwner
      ? `${name}'s Scales of Judgment grants +${bonus} Power and weighs down the leading side by -1!`
      : `${name}'s Scales of Judgment grants +${bonus} Power — the scales are already perfectly balanced!`;
  },
  // Sylvarion's Herald's Gale: a plain AOE debuff (debuffThisRound on every
  // enemy, same verb Shiva/Leviathan already use) plus a self-buff that
  // scales with how far BEHIND his own side is on board count at the
  // moment of casting — the same live "mine vs theirs" read his own
  // boardUnderdogAttackBonus passive already does, just read once here and
  // locked in via attackBoost instead of live, same snapshot pattern as
  // Conquests Witnessed/Scales of Judgment above. No new card-data
  // primitive; the deficit math lives entirely in this handler.
  sylvarion({ srcEntry, owner }){
    const name = srcEntry.card.name;
    const enemyOwner = owner === 'blue' ? 'red' : 'blue';
    state.board.forEach(e => { if(e && e.owner === enemyOwner) SpecialVerbs.debuffThisRound(e, 2); });
    const mine = state.board.filter(e => e && e.owner === owner).length;
    const theirs = state.board.filter(e => e && e.owner !== owner).length;
    const deficit = Math.min(3, Math.max(0, theirs - mine));
    if(deficit > 0) SpecialVerbs.attackBoost(srcEntry, deficit);
    return deficit > 0
      ? `${name}'s Herald's Gale sweeps the board and grants +${deficit} Power, rallying the outnumbered vanguard!`
      : `${name}'s Herald's Gale sweeps the board!`;
  },
  // Ferea's The Frozen Crown: Frostmarks every enemy (same boolean flag her
  // Frostmark passive sets on a win) and hits them all for -2 this round
  // (debuffThisRound, same verb Shiva/Leviathan use), then a permanent
  // self-buff equal to how many enemies got marked (capped at 3), locked in
  // via attackBoost same as every other snapshot-style Ultimate above.
  ferea({ srcEntry, owner }){
    const name = srcEntry.card.name;
    const enemyOwner = owner === 'blue' ? 'red' : 'blue';
    let marked = 0;
    state.board.forEach(e => {
      if(e && e.owner === enemyOwner){
        e.frostmarked = true;
        SpecialVerbs.debuffThisRound(e, 2);
        marked++;
      }
    });
    const bonus = Math.min(3, marked);
    if(bonus > 0) SpecialVerbs.attackBoost(srcEntry, bonus);
    return `${name}'s The Frozen Crown Frostmarks ${marked} enem${marked !== 1 ? 'ies' : 'y'} and grants +${bonus} Power!`;
  },
  // Elara's Requiem of Light: the board-wide version of her own Frostbloom
  // passive (active.onWinCleanseAlly) — same "zero out negative captureBonus,
  // clear tempEffects" cleanse logic, just applied to every ally instead of
  // one random one, and only the allies that actually had something to
  // clear get the +1 (per the card's own "each one that had negative
  // effects cleared" wording, unlike Frostbloom's unconditional +1).
  elara({ srcEntry, owner }){
    const name = srcEntry.card.name;
    let cleansed = 0;
    state.board.forEach(e => {
      if(e && e.owner === owner){
        const hadNegative = e.captureBonus < 0 || (e.tempEffects && e.tempEffects.length > 0);
        if(e.captureBonus < 0) e.captureBonus = 0;
        e.tempEffects = [];
        if(hadNegative){
          SpecialVerbs.attackBoost(e, 1);
          cleansed++;
        }
      }
    });
    return cleansed > 0
      ? `${name}'s Requiem of Light cleanses ${cleansed} allied card${cleansed !== 1 ? 's' : ''} and grants +1 Power each!`
      : `${name}'s Requiem of Light finds no wounds left to heal!`;
  },
};

function executeSpecial(sourceIndex){
  if(state.phase !== 'battle') return;
  const srcEntry = state.board[sourceIndex];
  if(!srcEntry || srcEntry.owner !== state.turn) return;
  const special = srcEntry.card.special;
  if(!special || !specialUsable(srcEntry.card, srcEntry.owner, srcEntry)) return;

  state.pendingCard = null;

  if(special.targets === 'aoe'){
    runSpecialResolution(sourceIndex, null);
  } else if(special.targets === 'element'){
    state.specialMode = { sourceIndex, choices: ELEMENT_CHOICES, choiceTitle: 'Choose an Element' };
    SFX.select();
    render();
  } else if(special.targets === 'direction'){
    state.specialMode = { sourceIndex, choices: DIRECTION_CHOICES, choiceTitle: 'Choose a Direction' };
    SFX.select();
    render();
  } else {
    state.specialMode = { sourceIndex };
    SFX.select();
    render();
  }
}

// Shared by Deathblade's targeting restriction (both the click-resolution
// guard and the UI highlight) — true if two board indices share a row or column.
function sharesLine(a, b){
  return Math.floor(a / 3) === Math.floor(b / 3) || a % 3 === b % 3;
}

function resolveSpecialTarget(targetIndex){
  const mode = state.specialMode;
  if(!mode) return;
  const srcEntry = state.board[mode.sourceIndex];
  const targetEntry = state.board[targetIndex];
  if(!srcEntry || !targetEntry || targetEntry.owner === srcEntry.owner){
    cancelSpecial();
    return;
  }
  // Shadow Assault only works on a target sharing Deathblade's row or
  // column — an invalid click is just ignored (mode stays active) rather
  // than cancelling, so a mis-tap doesn't waste the targeting attempt.
  if(srcEntry.card.id === 'deathblade' && !sharesLine(mode.sourceIndex, targetIndex)){
    return;
  }
  // Tiamat needs a second choice (which of her five powers to unleash)
  // before resolving — hold the target and swap into the power picker
  // instead of resolving immediately, like every other single-target special.
  if(srcEntry.card.id === 'tiamat'){
    state.specialMode = { sourceIndex: mode.sourceIndex, targetIndex, choices: TIAMAT_POWER_CHOICES, choiceTitle: 'Choose a Power' };
    render();
    return;
  }
  // Vorathos needs a direction choice (which side gets the permanent +1 on
  // a win) after picking a target — same two-step shape as Tiamat above.
  if(srcEntry.card.id === 'vorathos'){
    state.specialMode = { sourceIndex: mode.sourceIndex, targetIndex, choices: DIRECTION_CHOICES, choiceTitle: 'Choose a Direction' };
    render();
    return;
  }
  runSpecialResolution(mode.sourceIndex, targetIndex);
}

// For specials whose targets:'element' (no board target at all, e.g. Pallis)
// or that need an extra choice after their board target (e.g. Tiamat, via
// resolveSpecialTarget above).
function resolveSpecialChoice(value){
  const mode = state.specialMode;
  if(!mode) return;
  const srcEntry = state.board[mode.sourceIndex];
  if(!srcEntry) return;
  if(srcEntry.card.id === 'pallis'){
    runSpecialResolution(mode.sourceIndex, null, { element: value });
  } else if(srcEntry.card.id === 'tiamat'){
    runSpecialResolution(mode.sourceIndex, mode.targetIndex, { power: value });
  } else if(srcEntry.card.id === 'celestialjudgment' || srcEntry.card.id === 'infiniteseraph' || srcEntry.card.id === 'fenrir' || srcEntry.card.id === 'vorgrath'){
    runSpecialResolution(mode.sourceIndex, null, { direction: value });
  } else if(srcEntry.card.id === 'vorathos'){
    runSpecialResolution(mode.sourceIndex, mode.targetIndex, { direction: value });
  }
}

function cancelSpecial(){
  state.specialMode = null;
  render();
}

// Game feel phase 4: Ultimates as "major events" — a brief windup (card
// focus + name banner) BEFORE the effect resolves, then the effect itself,
// then a scaled impact flash/shake, then a smooth return to normal. Built
// once here in the single shared entry point every Ultimate already goes
// through, so every card gets it for free with no per-card work.
//
// Wins deduction/specialUsed-marking/specialMode-clearing stay exactly
// where they were (immediate, synchronous) — only the handler() call
// itself (the actual board mutation) and everything downstream of it is
// deferred. That matters for enemyTurn()'s `while(enemyTryUseSpecial()){}`
// loop: it re-checks affordability/specialUsed synchronously on every
// iteration, so keeping those immediate means the loop still terminates
// correctly even though the VISUAL resolution of each cast is now spread
// out over ~2.7s. If the AI (or, in principle, overlapping player actions)
// triggers a second Ultimate while one is still mid-sequence, it's queued
// here instead of overlapping — ultimateQueue/playUltimateSequence below.
let ultimateBannerToken = 0;
let ultimateQueue = [];
const ULTIMATE_WINDUP_MS = 950;
const ULTIMATE_SHAKE_MS = 500;
const ULTIMATE_CLEANUP_MS = 1300;

// Game feel phase 4c: real generated/recorded voice lines per Ultimate —
// the "actually sounds good" alternative to phase 4b's speechSynthesis
// attempt (tried, sounded broken rather than epic even after tuning, torn
// out — see PROJECT.md). Keyed by card id, the same unique key already
// used everywhere else (CARD_IMAGES, FULL_CARD_IMAGES, etc.): add an entry
// here whenever a real voice line exists for a card; every other card just
// keeps the silent windup it already had, no per-card code needed.
const ULTIMATE_VOICE_LINES = {
  ifrit: 'voices/ifrit.mp3',
  nyxara: 'voices/nyxara.mp3',
  vaelira: 'voices/vaelira.mp3',
  seraphine: 'voices/seraphine.mp3',
  triunedesire: 'voices/triunedesire.mp3',
  bahamut: 'voices/bahamut.mp3',
  tiamat: 'voices/tiamat.mp3',
  threeheaddragon: 'voices/threeheaddragon.mp3',
  omegaweapon: 'voices/omegaweapon.mp3',
  shiva: 'voices/shiva.mp3',
  odin: 'voices/odin.mp3',
};
function playUltimateVoiceLine(cardId){
  if(!soundOn) return;
  const src = ULTIMATE_VOICE_LINES[cardId];
  if(!src) return;
  try{
    const audio = new Audio(src);
    audio.volume = 0.9;
    const p = audio.play();
    // play() returns a promise that can reject on strict autoplay/gesture
    // policies — this is pure flavor layered on top of the windup beat,
    // never allowed to throw or break the actual Ultimate sequence.
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

// Same idea as ULTIMATE_VOICE_LINES above, but a short punchy sound effect
// (fire whoosh, impact crunch, etc.) timed to the impact beat instead of a
// spoken name at the cast beat — it plays alongside SFX.bonus() right when
// the effect actually lands and the visual result is on screen, not during
// the windup. Keyed by card id the same way; add an entry whenever a real
// impact SFX exists for a card.
const ULTIMATE_IMPACT_SFX = {
  ifrit: 'sfx/ifrit.mp3',
  nyxara: 'sfx/nyxara.mp3',
  vaelira: 'sfx/vaelira.mp3',
  seraphine: 'sfx/seraphine.mp3',
  omegaweapon: 'sfx/omegaweapon.mp3',
  shiva: 'sfx/shiva.mp3',
  bahamut: 'sfx/bahamut.mp3',
  odin: 'sfx/odin.mp3',
};
function playUltimateImpactSfx(cardId){
  if(!soundOn) return;
  const src = ULTIMATE_IMPACT_SFX[cardId];
  if(!src) return;
  try{
    const audio = new Audio(src);
    audio.volume = 0.9;
    const p = audio.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

function runSpecialResolution(sourceIndex, targetIndex, extra){
  const srcEntry = state.board[sourceIndex];
  const special = srcEntry.card.special;
  const owner = srcEntry.owner;
  const handler = SPECIAL_HANDLERS[srcEntry.card.id];
  if(!handler) return;

  const free = special.freeIfSistersPresent && sistersPresentCount(srcEntry.card.id, owner) >= special.freeIfSistersPresent;
  if(!free) state.wins[owner] -= special.cost;
  if(special.once) state.specialUsed[owner + ':' + srcEntry.card.id] = true;
  state.specialMode = null;

  const job = { srcEntry, sourceIndex, targetIndex, extra, owner, special, handler };
  if(state.ultimateBanner){
    ultimateQueue.push(job);
    render(); // reflect the wins deduction/specialMode clear immediately even while queued
    return;
  }
  playUltimateSequence(job);
}

function playUltimateSequence(job){
  const { srcEntry, sourceIndex, targetIndex, extra, owner, special, handler } = job;
  const token = ++ultimateBannerToken;

  // AOE identity-VFX cards (Vaelira's Infernal Pact, Seraphine's Silver
  // Judgment, Omega Weapon's Omega Protocol) need to know which cells were
  // enemies AT CAST TIME: Infernal Pact/Silver Judgment destroy/strip via
  // destroyCard (like Nyxara's), so by the time the impact-phase render
  // happens those board slots are already null and can't be re-queried;
  // Omega Protocol only destroys SOME enemies (the weak ones) but debuffs
  // ALL of them, and the brief wants a targeting-marker + hit effect on
  // every enemy regardless of which ones end up destroyed, so it needs the
  // same "who was an enemy at cast time" snapshot for the same reason.
  // Captured once here, carried through this closure into the impact-phase
  // banner below. Presentation only, never read by gameplay logic, and
  // only computed for these specific cards' Ultimates (not a general
  // capability every AOE gets).
  // Shiva's Diamond Storm is added to this list too even though it never
  // destroys/nulls any board slot (it's a plain debuffThisRound AOE,
  // entries stay in place) -- captured here anyway so her shard-rail/hit
  // VFX can reuse the exact same enemyIndices-on-the-banner mechanism as
  // every other AOE identity-VFX card, rather than re-deriving "who is an
  // enemy" live in renderBattle() as a one-off special case.
  let aoeEnemyIndicesAtCast = null;
  if(special.name === 'Infernal Pact' || special.name === 'Silver Judgment' || special.name === 'Omega Protocol' || special.name === 'Diamond Storm' || special.name === 'Megaflare' || special.name === 'Conquests Witnessed'){
    aoeEnemyIndicesAtCast = state.board.map((e,i) => (e && e.owner !== owner) ? i : null).filter(i => i !== null);
  }

  // Phase 1: windup. Board state untouched — this is purely "something big
  // is about to happen", the actual effect hasn't run yet.
  // targetIndex is carried on the banner purely for presentation (e.g.
  // Ifrit's Hellfire VFX needs to know WHICH cell to hit, unlike Nyxara's
  // AOE Void Dominion) -- never read by any gameplay logic.
  state.ultimateBanner = { phase:'cast', owner, name: special.name, sourceIndex, targetIndex, enemyIndices: aoeEnemyIndicesAtCast };
  srcEntry.ultimateCasting = true;
  SFX.select();
  playUltimateVoiceLine(srcEntry.card.id);
  render();

  setTimeout(()=>{
    if(ultimateBannerToken !== token) return; // superseded — shouldn't happen given the queue above, but matches showConquestPopup's own safety pattern
    srcEntry.ultimateCasting = false;

    // Phase 2: the effect actually resolves now (this is the ONLY part of
    // the original synchronous code below this point — unchanged logic,
    // just moved behind the windup delay).
    const targetEntry = targetIndex != null ? state.board[targetIndex] : null;
    if(targetEntry) targetEntry.attackFlash = true; // purely visual — same slash as a normal battle
    // Snapshot which cells were already flagged justFlipped (from an earlier
    // action still mid-animation) so an AOE handler's captures — e.g. Pallis &
    // Pell's Hunter's Wrath, which has no single targetEntry to check — are
    // still detected below without also re-triggering the banner for a stale
    // flip that isn't this special's doing.
    const alreadyFlipped = new Set();
    state.board.forEach((e, i) => { if(e && e.justFlipped) alreadyFlipped.add(i); });
    state.log = handler({ srcEntry, sourceIndex, targetEntry, targetIndex, owner, ...extra });
    const capturedCount = state.board.filter((e, i) => e && e.owner === owner && e.justFlipped && !alreadyFlipped.has(i)).length;
    if(capturedCount > 0){
      showConquestPopup(owner);
    }
    // Same magnitude-gated shake as phase 3's Same/Combo chains (see
    // placeCard) — a big Ultimate sweep feels like a big chain, reuses the
    // same .arena-frame.chain-shake mechanism rather than a new one.
    // Void Dominion is always a DESTROY (destroyCard), never a flip/capture,
    // so it would never set justFlipped and capturedCount would always be 0
    // here — explicitly opted in as part of her one-off VFX test so the
    // "kort impact/screen shake" she asked for actually fires.
    // Ifrit's Hellfire is single-target, so capturedCount is realistically
    // never >= 3 either — same explicit opt-in as Void Dominion above, for
    // the same reason (her one-off VFX test's screen-shake request).
    // Vaelira's Infernal Pact and Seraphine's Silver Judgment are the same
    // destroy-based shape as Void Dominion (destroyCard, never
    // justFlipped) — same opt-in, same reason. Omega Weapon's Omega
    // Protocol also destroys via destroyCard (just conditionally, only the
    // weak enemies) — same opt-in either way.
    // Shiva's Diamond Storm never flips anything either (a plain AOE
    // debuff, not a capture or a destroy) so capturedCount is always 0
    // here too -- same explicit opt-in as every other card in this list,
    // for the same "kort screen shake vid impacten" request in her brief.
    if(capturedCount >= 3 || special.name === 'Void Dominion' || special.name === 'Hellfire' || special.name === 'Infernal Pact' || special.name === 'Silver Judgment' || special.name === 'Omega Protocol' || special.name === 'Diamond Storm' || special.name === 'Megaflare') state.chainShake = true;

    // Phase 3: impact. Banner switches to its "impact" look (see CSS) and
    // starts fading; the board now shows the real result underneath it.
    state.ultimateBanner = { phase:'impact', owner, name: special.name, sourceIndex, targetIndex, enemyIndices: aoeEnemyIndicesAtCast };
    SFX.bonus();
    playUltimateImpactSfx(srcEntry.card.id);
    render();

    setTimeout(()=>{
      if(ultimateBannerToken !== token) return;
      state.chainShake = false;
      render();
    }, ULTIMATE_SHAKE_MS);

    setTimeout(()=>{
      if(ultimateBannerToken !== token) return;
      state.board.forEach(entry=>{
        if(entry){ entry.justFlipped = false; entry.shieldFlash = false; entry.bonusFlash = false; entry.attackFlash = false; entry.fxDelay = 0; entry.fxStep = 0; }
      });
      state.destroyGhosts = [];
      state.ultimateBanner = null;
      render();
      maybeEndTurn(owner);
      if(ultimateQueue.length > 0) playUltimateSequence(ultimateQueue.shift());
    }, ULTIMATE_CLEANUP_MS);
  }, ULTIMATE_WINDUP_MS);
}

const NEIGHBOR_DIRS = [
  { dr:-1, dc:0, myEdge:'top',    theirEdge:'bottom' },
  { dr:1,  dc:0, myEdge:'bottom', theirEdge:'top' },
  { dr:0,  dc:-1,myEdge:'left',   theirEdge:'right' },
  { dr:0,  dc:1, myEdge:'right',  theirEdge:'left' },
];

function getEnemyNeighbors(index, owner){
  const row = Math.floor(index/3), col = index%3;
  const card = state.board[index].card;
  const present = [];
  NEIGHBOR_DIRS.forEach(n=>{
    const r = row+n.dr, c = col+n.dc;
    if(r<0||r>2||c<0||c>2) return;
    const ni = r*3+c;
    const target = state.board[ni];
    if(!target || target.owner === owner) return;
    present.push({ ni, myEdge:n.myEdge, theirEdge:n.theirEdge, myVal:card[n.myEdge], theirVal:target.card[n.theirEdge] });
  });
  return present;
}

function computeSamePlusCaptures(index, owner){
  const present = getEnemyNeighbors(index, owner);
  const captured = new Set();

  if(state.rules.same){
    const matches = present.filter(p => p.myVal === p.theirVal);
    if(matches.length >= 2) matches.forEach(m => captured.add(m.ni));
  }

  if(state.rules.plus){
    for(let i=0; i<present.length; i++){
      for(let j=i+1; j<present.length; j++){
        const sumA = present[i].myVal + present[i].theirVal;
        const sumB = present[j].myVal + present[j].theirVal;
        if(sumA === sumB){
          captured.add(present[i].ni);
          captured.add(present[j].ni);
        }
      }
    }
  }

  return captured;
}

// Live capture preview (user feedback: "man fattar inte hur spelet fungerar",
// confirmed by design review that there was no way to see what a placement
// would do before committing to it) — tells the UI which of a candidate
// empty cell's enemy neighbors the currently-selected hand card would
// actually capture, WITHOUT mutating real game state. Reuses the real
// pure/read-only pieces of the engine (computeSamePlusCaptures,
// fullEffectiveValue, isShielded) rather than re-deriving the comparison
// rules a second time, so this can never silently drift out of sync with
// how a real placement resolves. A temporary stub entry is written to
// state.board[cellIndex] and removed again synchronously (nothing else
// runs in between) so those pure functions see a "freshly placed card"
// exactly like the real engine would, without ever calling the *mutating*
// battleNeighbors/resolveFlips path itself (which also tags historical
// flags, consumes shields/once-per-match bonuses, and can cascade into
// destroyCard/graveyard side effects that must never fire from a mere
// preview). Deliberately does not simulate a Combo chain (the BFS re-battle
// that only exists when Same/Plus AND Combo are all on) -- that stays a
// welcome surprise rather than a fully-spoiled outcome.
function computeCapturePreview(cardId, cellIndex, owner){
  if(state.board[cellIndex]) return { captures:0, indices:[] };
  const card = HEROES.find(h => h.id === cardId) || FOREST_FOES.find(h => h.id === cardId);
  if(!card) return { captures:0, indices:[] };

  state.board[cellIndex] = { card, owner };
  const samePlus = (state.rules.same || state.rules.plus) ? computeSamePlusCaptures(cellIndex, owner) : new Set();
  state.board[cellIndex] = null;

  const capturedIndices = new Set(samePlus);
  const row = Math.floor(cellIndex/3), col = cellIndex%3;
  NEIGHBOR_DIRS.forEach(n=>{
    const r = row+n.dr, c = col+n.dc;
    if(r<0||r>2||c<0||c>2) return;
    const ni = r*3+c;
    if(samePlus.has(ni)) return; // already captured outright by Same/Plus
    const target = state.board[ni];
    if(!target || target.owner === owner) return;

    state.board[cellIndex] = { card, owner, shieldUsed:false, grantedShield:false, captureBonus:0 };
    const attackVal = fullEffectiveValue(card, n.myEdge, target.card, cellIndex, owner, 'attack');
    const defendVal = fullEffectiveValue(target.card, n.theirEdge, card, ni, target.owner, 'defense');
    state.board[cellIndex] = null;

    if(attackVal <= defendVal) return;
    if(isShielded(target, ni)) return;
    const targetActive = target.card.active;
    const staticMarginThreshold = targetActive && targetActive.marginShieldThreshold != null ? targetActive.marginShieldThreshold : 0;
    const weightOfAgesBonus = targetActive && targetActive.weightOfAges ? Math.min(2, Math.floor((target.turnsStanding || 0) / 2)) : 0;
    const marginThreshold = staticMarginThreshold + weightOfAgesBonus;
    if(marginThreshold > 0 && (attackVal - defendVal) <= marginThreshold) return;
    capturedIndices.add(ni);
  });

  return { captures: capturedIndices.size, indices: Array.from(capturedIndices) };
}

// Aggregates computeCapturePreview across every currently-empty, legal cell
// for the selected hand card, so boardCellHtml can mark an enemy card as
// "vulnerable right now" regardless of which specific empty cell it would
// be captured from. Cheap: at most 9 cells x 4 neighbors of real,
// already-optimized engine calls, recomputed once per render.
function getPreviewCaptureTargets(){
  const vulnerable = new Set();
  if(!state.pendingCard || state.turn !== 'blue' || state.phase !== 'battle' || state.placedThisTurn || state.ultimateBanner) return vulnerable;
  state.board.forEach((cell, i)=>{
    if(cell) return;
    const preview = computeCapturePreview(state.pendingCard, i, 'blue');
    preview.indices.forEach(idx => vulnerable.add(idx));
  });
  return vulnerable;
}

/* ---------------- AI lookahead (Fas 2 design review) ----------------
   The old AI (simulateFlips, removed — see git history) only ever scored
   the 4 immediate neighbors of ONE candidate placement, on raw comparison
   alone —
   no Same/Plus/Combo awareness, no idea what the human could do in reply.
   Everything below replaces that with a real adversarial search: minimax
   with alpha-beta pruning, using the human's own already-dealt, already-
   visible-on-screen hand for the "what would they do next" half of the
   search (approved explicitly — this game deals both hands face-up in the
   classic Triple Triad sense, even though this UI happens to only display
   the enemy's OWN hand as face-down "mystery cards" to the human for
   atmosphere; nothing about the search reads hidden/future randomness, only
   the same fixed, already-determined hand contents the human can already
   see for themselves).

   Deliberately scoped: the search's own internal simulation
   (simulatePlacementOutcome below) models the CORE mechanic the entire
   match is decided by -- edge comparisons, Same/Plus/Combo, shields/margin
   blocks, and onCaptureBonus's stacking self-buff -- using the real,
   already-pure fullEffectiveValue/isShielded/computeSamePlusCaptures
   functions so it can never drift from how a real placement resolves. It
   deliberately does NOT model the rarer, more exotic on-win/on-capture
   side effects (destroy, revive, petrify, frostmark, debuff-this-round,
   permanent aura flags, ...) during search -- reproducing all ~20 of those
   inside a cloneable, thousands-of-times-per-turn search function would be
   a much larger and riskier undertaking than this pass. The move the
   search ultimately picks is still PLAYED for real via the normal
   placeCard()/resolveFlips() path (see chooseAIPlacement's caller in
   enemyTurn), so every card's full kit still fires exactly as written the
   moment it actually happens -- only the search's own internal lookahead
   simplifies away from the rarer effects while deciding WHERE to play. */

// A minimal, cloneable board-entry shape carrying only the fields
// fullEffectiveValue/isShielded actually read -- deliberately dropping
// every transient VFX flag a real entry can carry, since those never
// affect the comparison itself.
//
// Fas 6 (design review #2): this used to drop grantedShield/shieldUsed/
// protectiveAuraUntilTurnCount too, which meant isShielded() always saw
// them as absent inside a simulation -- a granted shield or Pallis's
// Protective Aura silently vanished (the AI could rate a placement as a
// sure capture that resolveFlips then actually blocks), AND a one-time
// active.shield that had already been spent earlier in the real match
// reset to "unused" in every simulated node (the AI stayed needlessly
// cautious around a card it had already broken through). Also now carries
// Ancient Wyrmking's turnsStanding trio so weightOfAges's growing margin
// wall (see battleOneNeighbor below) is visible to the search too --
// previously that capture-blocking mechanic wasn't computed in
// simulation at all.
function cloneScratchBoard(board){
  return board.map(e => e ? {
    card: e.card, owner: e.owner,
    captureBonus: e.captureBonus || 0,
    sideBonus: e.sideBonus ? { ...e.sideBonus } : undefined,
    grantedShield: e.grantedShield || false,
    shieldUsed: e.shieldUsed || false,
    protectiveAuraUntilTurnCount: e.protectiveAuraUntilTurnCount,
    turnsStanding: e.turnsStanding || 0,
    turnsStandingOwner: e.turnsStandingOwner,
    turnsStandingCell: e.turnsStandingCell,
  } : null);
}

// Simulates ONE placement (including its Same/Plus captures and, if the
// Combo rule is on, the resulting chain) on a CLONE of the given board,
// returning the new board -- never mutates its input. See the file-level
// comment above for exactly which real-engine pieces this reuses and which
// side effects it deliberately leaves out.
function simulatePlacementOutcome(board, cellIndex, card, owner){
  const scratch = cloneScratchBoard(board);
  const savedBoard = state.board;
  state.board = scratch;
  try {
    scratch[cellIndex] = { card, owner, captureBonus: 0, sideBonus: {} };
    const rules = state.rules;
    const samePlus = (rules.same || rules.plus) ? computeSamePlusCaptures(cellIndex, owner) : new Set();
    const flipped = [];
    samePlus.forEach(ni => {
      const t = scratch[ni];
      if(t && t.owner !== owner){ t.owner = owner; flipped.push(ni); }
    });

    const battleOneNeighbor = (fromIndex, fromCard, fromOwner, dir) => {
      const row = Math.floor(fromIndex/3), col = fromIndex%3;
      const r = row+dir.dr, c = col+dir.dc;
      if(r<0||r>2||c<0||c>2) return null;
      const ni = r*3+c;
      const target = scratch[ni];
      if(!target || target.owner === fromOwner) return null;
      const attackVal = fullEffectiveValue(fromCard, dir.myEdge, target.card, fromIndex, fromOwner, 'attack');
      const defendVal = fullEffectiveValue(target.card, dir.theirEdge, fromCard, ni, target.owner, 'defense');
      if(attackVal <= defendVal) return null;
      if(isShielded(target, ni)) return null;
      const targetActive = target.card.active;
      const staticMarginThreshold = targetActive && targetActive.marginShieldThreshold != null ? targetActive.marginShieldThreshold : 0;
      // Ancient Wyrmking's weightOfAges (see battleNeighbors' own real-game
      // version above) -- was entirely absent from the search, so the AI
      // never accounted for his margin wall growing the longer he's stood.
      const weightOfAgesBonus = targetActive && targetActive.weightOfAges ? Math.min(2, Math.floor((target.turnsStanding || 0) / 2)) : 0;
      const marginThreshold = staticMarginThreshold + weightOfAgesBonus;
      if(marginThreshold > 0 && (attackVal - defendVal) <= marginThreshold) return null;
      return ni;
    };

    NEIGHBOR_DIRS.forEach(dir=>{
      const row = Math.floor(cellIndex/3), col = cellIndex%3;
      const r = row+dir.dr, c = col+dir.dc;
      if(r<0||r>2||c<0||c>2) return;
      const ni = r*3+c;
      if(samePlus.has(ni)) return;
      const captured = battleOneNeighbor(cellIndex, card, owner, dir);
      if(captured == null) return;
      scratch[captured].owner = owner;
      flipped.push(captured);
      if(card.active && card.active.onCaptureBonus) scratch[cellIndex].captureBonus += card.active.onCaptureBonus;
    });

    if(rules.combo && flipped.length){
      const visited = new Set([cellIndex]);
      const queue = flipped.slice();
      while(queue.length){
        const idx = queue.shift();
        if(visited.has(idx)) continue;
        visited.add(idx);
        const chainEntry = scratch[idx];
        NEIGHBOR_DIRS.forEach(dir=>{
          const row = Math.floor(idx/3), col = idx%3;
          const r = row+dir.dr, c = col+dir.dc;
          if(r<0||r>2||c<0||c>2) return;
          const ni = r*3+c;
          if(visited.has(ni)) return;
          const captured = battleOneNeighbor(idx, chainEntry.card, chainEntry.owner, dir);
          if(captured == null) return;
          scratch[captured].owner = chainEntry.owner;
          queue.push(captured);
          if(chainEntry.card.active && chainEntry.card.active.onCaptureBonus) chainEntry.captureBonus += chainEntry.card.active.onCaptureBonus;
        });
      }
    }

    return scratch;
  } finally {
    state.board = savedBoard;
  }
}

// Terminal/leaf heuristic: since the whole match is won purely by final
// square count (see finishGame), "who currently controls more squares" is
// not just A proxy for the eventual winner, it IS the win condition itself
// -- no hand-crafted weighting needed.
function boardControlScore(board, owner){
  let mine = 0, theirs = 0;
  board.forEach(e => { if(!e) return; if(e.owner === owner) mine++; else theirs++; });
  return mine - theirs;
}

// Minimax with alpha-beta pruning over BOTH sides' real remaining hands.
// `aiOwner` is whose final-score perspective we're maximizing throughout the
// whole recursion (the side the AI is playing as this match); `turnOwner`
// alternates every ply. Stops and scores the current position once either
// hand empties, the board fills, or depthRemaining runs out -- the caller
// (chooseAIPlacement) is responsible for picking a depth that reaches the
// true end of the game whenever few enough cells remain (see
// AI_FULL_SEARCH_MAX_EMPTY), so a real "who actually wins" outcome is used
// instead of the heuristic whenever that's cheap enough to compute.
function searchBestPlacement(board, hands, turnOwner, aiOwner, depthRemaining, alpha, beta){
  const emptyCells = board.map((c,i)=>c?null:i).filter(i=>i!==null);
  const hand = hands[turnOwner];
  if(emptyCells.length === 0 || !hand || hand.length === 0 || depthRemaining <= 0){
    return { score: boardControlScore(board, aiOwner), cellIndex:null, card:null };
  }
  const maximizing = turnOwner === aiOwner;
  const nextOwner = turnOwner === 'blue' ? 'red' : 'blue';
  let best = null;
  outer:
  for(const card of hand){
    for(const cellIndex of emptyCells){
      const newBoard = simulatePlacementOutcome(board, cellIndex, card, turnOwner);
      const newHand = hand.filter(c => c !== card);
      const newHands = { blue: turnOwner === 'blue' ? newHand : hands.blue, red: turnOwner === 'red' ? newHand : hands.red };
      const child = searchBestPlacement(newBoard, newHands, nextOwner, aiOwner, depthRemaining - 1, alpha, beta);
      const score = child.score;
      if(best === null || (maximizing ? score > best.score : score < best.score)){
        best = { score, cellIndex, card };
      }
      if(maximizing) alpha = Math.max(alpha, score); else beta = Math.min(beta, score);
      if(beta <= alpha) break outer;
    }
  }
  return best;
}

// Below this many empty cells, an exhaustive search all the way to the end
// of the match is cheap (worst case a few tens of thousands of leaf paths,
// well under alpha-beta-pruned real-time budget) and strictly better than
// any fixed shallow depth.
//
// Fas 6 (design review #2): this used to be one flat 5 for every
// difficulty -- on a 9-cell board that means the exhaustive "play the
// true best move" override kicked in once EITHER side had made ~4 total
// placements, so Easy only ever actually looked shallow for a placement
// or two before quietly playing perfect chess-engine endgame moves same
// as Hard. Tiering it per difficulty keeps Easy genuinely beatable in the
// endgame (matching its own AI_DIFFICULTY_DESC copy below) while leaving
// Hard's exhaustive window exactly as large as before.
const AI_FULL_SEARCH_MAX_EMPTY = { easy: 2, normal: 3, hard: 5 };
const AI_DIFFICULTY_DEPTH = { easy: 1, normal: 2, hard: 3 };
const AI_DIFFICULTY_DESC = {
  easy: 'The Forest plays its best immediate capture, never looking further ahead.',
  normal: 'The Forest thinks two moves ahead, planning around your likely reply.',
  hard: 'The Forest thinks several moves ahead and holds its strongest Ultimates for the best moment.',
};
const AI_DIFFICULTY_SAVE_KEY = 'triadArenaAIDifficulty';

function loadAIDifficulty(){
  try {
    const saved = localStorage.getItem(AI_DIFFICULTY_SAVE_KEY);
    if(saved && AI_DIFFICULTY_DEPTH[saved]) return saved;
  } catch(e){}
  return 'normal';
}
function saveAIDifficulty(difficulty){
  try { localStorage.setItem(AI_DIFFICULTY_SAVE_KEY, difficulty); } catch(e){}
}

const FAST_MODE_SAVE_KEY = 'triadArenaFastMode';
function loadFastMode(){
  try { return localStorage.getItem(FAST_MODE_SAVE_KEY) === '1'; } catch(e){ return false; }
}
function saveFastMode(on){
  try { localStorage.setItem(FAST_MODE_SAVE_KEY, on ? '1' : '0'); } catch(e){}
}

// Fas 4: campaign stages auto-assign the Forest's AI difficulty instead of
// following the player's manual Easy/Normal/Hard choice (which still fully
// applies in Random Draft/Choose Your Five) — stages 1-5 Easy, 6-11 Normal,
// 12-17 Hard, mirroring the campaign's own existing rules/stat escalation
// curve so the late game gets qualitatively sharper play, not just bigger
// numbers. stageIndex is 0-based (campaignProgress.stageIndex, already the
// CURRENT stage being fought — finishGame only advances it after a win).
function campaignStageAIDifficulty(stageIndex){
  if(stageIndex < 5) return 'easy';
  if(stageIndex < 11) return 'normal';
  return 'hard';
}
function effectiveAIDifficulty(){
  if(state.draftMode === 'campaign') return campaignStageAIDifficulty(campaignProgress.stageIndex);
  return state.aiDifficulty;
}

// Top-level entry point called from enemyTurn(). Returns { cellIndex, card }
// for the chosen placement, or null if the AI genuinely has nothing to play
// (empty hand or full board -- enemyTurn already guards both, this is just
// a defensive fallback).
function chooseAIPlacement(){
  const emptyCells = state.board.map((c,i)=>c?null:i).filter(i=>i!==null);
  if(emptyCells.length === 0 || state.enemyHand.length === 0) return null;
  const difficulty = effectiveAIDifficulty();
  const fullSearchMaxEmpty = AI_FULL_SEARCH_MAX_EMPTY[difficulty] || AI_FULL_SEARCH_MAX_EMPTY.normal;
  const depth = emptyCells.length <= fullSearchMaxEmpty
    ? emptyCells.length
    : (AI_DIFFICULTY_DEPTH[difficulty] || AI_DIFFICULTY_DEPTH.normal);
  const hands = { blue: state.playerHand, red: state.enemyHand };
  const result = searchBestPlacement(state.board, hands, 'red', 'red', depth, -Infinity, Infinity);
  if(!result || result.cellIndex == null) return null;
  return { cellIndex: result.cellIndex, card: result.card };
}

// How much to stagger each successive flip within ONE placement's battles
// (Same/Plus + regular battle + Combo chain can all flip several cards at
// once) — capped so a rare huge chain doesn't drag the animation out
// forever. Purely a presentation delay via the --fx-delay CSS custom
// property (see cardFace() and .flipping/.slash-line below); doesn't
// change which cards flip or in what final state, only when their
// animation starts.
const FX_STAGGER_MS = 130;
const FX_STAGGER_CAP = 5;

function battleNeighbors(index, owner, result){
  const present = getEnemyNeighbors(index, owner);
  const placedEntry = state.board[index];
  const placed = placedEntry.card;
  const newlyFlipped = [];
  // Three Head Dragon's Poison's Torment: "the winner gets -2 Power on all
  // sides during its NEXT attack" — consumed here, once, applying to every
  // neighbor battle in this one placement (all the sides used in this one
  // "attack" event), same per-entry live-flag pattern as Ifrit's
  // defeatedByIfrit/Seraphine's/Tilda's marks. Read and cleared BEFORE the
  // loop (not per-iteration) so a placement with several neighbors still
  // only consumes the flag once, not once per neighbor.
  const poisonedTormentActive = !!placedEntry.poisonedTorment;
  if(poisonedTormentActive) placedEntry.poisonedTorment = false;

  present.forEach(p=>{
    const target = state.board[p.ni];
    if(!target || target.owner === owner) return; // may have been captured already by Same/Plus
    target.attackFlash = true; // purely visual — every real battle gets a slash, win or lose
    // Game-feel phase 3: fxStep is the SAME raw counter as fxDelay's input,
    // just kept uncapped (fxDelay caps at FX_STAGGER_CAP for timing so a long
    // chain doesn't drag the stagger out forever, but the impact-intensity
    // scaling below wants the real, ever-growing position in the sequence).
    const fxStep = result.flipSeq++;
    target.fxDelay = fxTime(Math.min(fxStep, FX_STAGGER_CAP) * FX_STAGGER_MS); // stagger simultaneous flips (Same/Plus/Combo) instead of snapping them all at once
    target.fxStep = fxStep;
    // Odin's normal-attack Slash VFX (see the user's brief): every OTHER
    // card just gets the generic slash-fx above, but Odin's own attacks
    // get an additional signature effect layered on top -- a lightning
    // trail traveling from his cell to the target's, a golden impact, and
    // scattering sparks (see .odin-slash-* CSS and renderBattle()).
    // Recorded here (both cell indices + the same fxDelay stagger just
    // computed above) rather than as a boolean flag, since the VFX needs
    // to know WHERE Odin is relative to the target to orient the travel
    // direction -- attackFlash alone only marks the defender. Works
    // identically whether this battle came from Odin's own placement or
    // from a later Combo-chain hop that happens to route back through
    // him, since both paths call this same function with `index` pointing
    // at whichever cell is currently attacking.
    if(placed.id === 'odin'){
      if(!result.odinSlashes) result.odinSlashes = [];
      result.odinSlashes.push({ sourceIndex: index, targetIndex: p.ni, delay: target.fxDelay });
    }

    let placedVal = fullEffectiveValue(placed, p.myEdge, target.card, index, owner, 'attack');
    let targetVal = fullEffectiveValue(target.card, p.theirEdge, placed, p.ni, target.owner, 'defense');
    if(poisonedTormentActive) placedVal -= 2;
    // Seraphine's Celestial Mark: +2 Power when she attacks the SPECIFIC
    // enemy entry her on-place mark landed on. Hardcoded by id (same shape
    // as Triune Desire's Divine Temptation) rather than a generic active
    // flag, because fullEffectiveValue only ever receives the opponent's
    // static card data (target.card above), never the live entry carrying
    // runtime flags like seraphineMarked — this is the one place in the
    // real battle-resolution path that actually has the live target entry.
    if(placed.id === 'seraphine' && target.seraphineMarked) placedVal += 2;
    // Tilda's Marked Target: same hardcoded shape as Seraphine's Celestial
    // Mark above, but NOT gated to a specific attacker id — the card text
    // says "the next time ONE OF YOUR CARDS attacks it", not just Tilda
    // herself, so any allied attacker benefits.
    if(target.tildaMarked) placedVal += 2;
    // Omega Weapon's Anti-Matter Cannon / Yojimbo's Kozuka: fullEffectiveValue
    // above already read these as "not yet used" and folded the bonus into
    // placedVal if eligible — mark them used now that this is a real attack
    // resolution (not a hover preview), so they never apply again this
    // match. Re-derives the same eligibility condition fullEffectiveValue
    // used rather than having that pure function mutate state itself, same
    // "recompute outside, mark as a side effect" split as Medusa's
    // marginBlocked check below.
    if(placed.active && placed.active.oncePerMatchVsStrongerBoost && !placedEntry.vsStrongerBoostUsed){
      const oppTotal = target.card.top + target.card.right + target.card.bottom + target.card.left;
      const ownTotal = placed.top + placed.right + placed.bottom + placed.left;
      if(oppTotal > ownTotal) placedEntry.vsStrongerBoostUsed = true;
    }
    if(placed.active && placed.active.oncePerMatchAttackBoost && !placedEntry.oncePerMatchAttackBoostUsed){
      placedEntry.oncePerMatchAttackBoostUsed = true;
    }
    // Ifrit's Volcanic Armor: "the FIRST TIME Ifrit would lose a battle,
    // the opponent's strength is reduced by -1 in that battle" — the
    // mirror image of Three Head Dragon's Ice's Breath (freezeDefenderPenalty,
    // attacker debuffs defender), but this direction can't live inside
    // fullEffectiveValue the same way: reading it there during the
    // ATTACKER's own 'attack'-role call would need the DEFENDER's live
    // entry to check a Used flag, and fullEffectiveValue only ever gets
    // the opponent's static card data (same limitation Seraphine's/Tilda's
    // marks hit above) — this is the one place with both live entries at
    // once. "Would lose" is approximated via a raw totalPower comparison,
    // same simplification oncePerMatchVsStrongerBoost above already uses
    // for its own conditional trigger, rather than trying to predict the
    // per-side outcome mid-computation.
    if(target.card.active && target.card.active.volcanicArmorPenalty && !target.volcanicArmorUsed){
      const attackerTotal = totalPower(placedEntry);
      const defenderTotal = totalPower(target);
      if(attackerTotal > defenderTotal){
        placedVal -= target.card.active.volcanicArmorPenalty;
        target.volcanicArmorUsed = true;
      }
    }
    // Evil Twist's Inner Harmony: "when Evil Twist defends, it neutralizes
    // the attacker's bonus this round" — reset the attacker's effective
    // value back to its bonus-free baseline. p.myVal is exactly that
    // baseline (fullEffectiveValue's OUTPUT, placedVal, already includes
    // every bonus; p.myVal is the raw pre-bonus comparison value computed
    // earlier — see the bonusFlash diffing below, which already relies on
    // that same distinction). No "each round" gate needed beyond the
    // per-battle placedVal reset itself; unconditional every time Evil
    // Twist defends, same as the card text (no "once" qualifier).
    if(target.card.active && target.card.active.neutralizeAttackerBonus){
      placedVal = p.myVal;
    }
    // Evil Twist's Mind's Balance: "when Evil Twist attacks, swap strength
    // with the opponent's card if theirs is higher" — a straight value
    // swap, applied AFTER Inner Harmony above so a mirror match (Evil
    // Twist attacking Evil Twist) resolves the defender's neutralize
    // first, then the attacker's own conditional swap reacts to that
    // already-adjusted comparison.
    if(placed.active && placed.active.mindsBalanceSwap && targetVal > placedVal){
      const swapTmp = placedVal;
      placedVal = targetVal;
      targetVal = swapTmp;
    }
    const effOutcome = placedVal > targetVal;
    const baseOutcome = p.myVal > p.theirVal;

    if(effOutcome !== baseOutcome){
      result.bonusTriggered = true;
      if(placedVal !== p.myVal){ placedEntry.bonusFlash = true; placedEntry.bonusAmount = placedVal - p.myVal; }
      if(targetVal !== p.theirVal){ target.bonusFlash = true; target.bonusAmount = targetVal - p.theirVal; }
    }

    if(effOutcome){
      const shielded = isShielded(target, p.ni);
      const targetActive = target.card.active;
      // Medusa's Curse of the Gorgon: "if an enemy attacks Medusa and wins
      // by 2 Power or less, the battle becomes a draw and the attacker
      // gets -1 Power this round" — a margin-conditional block distinct
      // from the flat always-blocks-once active.shield above, so it's
      // checked separately here (isShielded has no access to the actual
      // battle values it would need for a margin check) rather than folded
      // into isShielded() itself. Combined here with Ancient Wyrmking's
      // Weight of Ages, a DYNAMIC margin wall that grows the longer he's
      // stood unbroken on this cell (entry.turnsStanding, tracked in
      // sweepExpiredRoundEffects — capped at +2 here). The two thresholds
      // are independent fields (marginShieldThreshold is a static per-card
      // constant, weightOfAges reads a live counter) so they can coexist
      // on different cards without interfering with each other.
      const staticMarginThreshold = targetActive && targetActive.marginShieldThreshold != null ? targetActive.marginShieldThreshold : 0;
      const weightOfAgesBonus = targetActive && targetActive.weightOfAges
        ? Math.min(2, Math.floor((target.turnsStanding || 0) / 2))
        : 0;
      const marginThreshold = staticMarginThreshold + weightOfAgesBonus;
      const marginBlocked = !shielded && marginThreshold > 0 && (placedVal - targetVal) <= marginThreshold;
      if(shielded || marginBlocked){
        // Bug fix (found via Tahabata's Soul Petrification, which uses a
        // purely EXTERNALLY GRANTED shield with no native active.shield of
        // its own): shieldUsed used to only be set inside the
        // targetActive.shield branch below, so a grantedShield-only block
        // (isShielded() checks grantedShield first, see its own comment)
        // never actually got consumed via this normal-battle path -- it
        // would silently block every future battle for the rest of the
        // match instead of just the one, unlike the Ultimate path
        // (specialBlockedByShield already consumes ANY shield source
        // unconditionally). Now mirrors that: any shielded block gets
        // consumed here, regardless of source.
        if(shielded) target.shieldUsed = true;
        if(targetActive && targetActive.shield){
          // Medusa's Living Statue: her own shield trigger also grants a
          // permanent Power bonus, unlike every other shield in the
          // roster — scoped to her own active.shield specifically (not
          // externally granted shields), matching the card's own text.
          if(targetActive.shieldGrantsBonus) SpecialVerbs.attackBoost(target, targetActive.shieldGrantsBonus);
        }
        // The attacker debuff is Curse of the Gorgon's own effect
        // specifically — scoped to marginShieldThreshold (Medusa's static
        // field) so Weight of Ages never triggers it. Weight of Ages only
        // raises the wall; it does nothing else, per its own card text.
        if(marginBlocked && targetActive.marginShieldThreshold != null) SpecialVerbs.debuffThisRound(placedEntry, 1);
        target.shieldFlash = true;
        result.shielded++;
        return;
      }
      target.owner = owner;
      target.justFlipped = true;
      checkSisterFlip(target);
      // Ifrit's Burning Dominion: tag every card he personally flips, read
      // live by the adjacentDefeatedByMeBoost check in fullEffectiveValue.
      // Hardcoded by id (same shape as Seraphine's seraphineMarked/Tilda's
      // tildaMarked) rather than a generic active flag — this is the one
      // place in the real battle-resolution path that has the live
      // just-captured entry to tag.
      if(placed.id === 'ifrit') target.defeatedByIfrit = true;
      // Three Head Dragon's Poison's Torment, defender side: 3HD just lost
      // this battle as the DEFENDER — tag the winner (placedEntry) so its
      // next attack (consumed at the top of this function) takes -2.
      // Respects debuffImmune like every other debuff source, even though
      // this isn't routed through SpecialVerbs.debuff/debuffThisRound
      // (those already guard debuffImmune internally; this hand-rolled
      // per-entry flag needs its own check).
      if(target.card.id === 'threeheaddragon' && !(placed.active && placed.active.debuffImmune)){
        placedEntry.poisonedTorment = true;
      }
      checkOnWinBonuses(placedEntry, p.myEdge, target, p.ni, index, placedVal);
      checkTriuneTeamBoost(owner);
      result.flips++;
      newlyFlipped.push(p.ni);
    } else if(placed.id === 'threeheaddragon' && !(target.card.active && target.card.active.debuffImmune)){
      // Poison's Torment, attacker side: 3HD just lost this battle as the
      // ATTACKER (was just placed, lost to this particular neighbor) —
      // tag the successful defender instead.
      target.poisonedTorment = true;
    }
  });

  return newlyFlipped;
}

function resolveFlips(index, owner){
  const placedEntry = state.board[index];
  const placed = placedEntry.card;
  const result = { flips:0, shielded:0, bonusTriggered:false, sameOrPlus:0, combo:0, flipSeq:0 };

  let samePlusSeeds = [];
  if(state.rules.same || state.rules.plus){
    const captured = computeSamePlusCaptures(index, owner);
    captured.forEach(ni=>{
      const target = state.board[ni];
      target.owner = owner;
      target.justFlipped = true;
      checkSisterFlip(target);
      const fxStep = result.flipSeq++;
      target.fxDelay = fxTime(Math.min(fxStep, FX_STAGGER_CAP) * FX_STAGGER_MS);
      target.fxStep = fxStep;
      result.flips++;
      result.sameOrPlus++;
      samePlusSeeds.push(ni);
    });
  }

  battleNeighbors(index, owner, result);

  if(state.rules.combo && samePlusSeeds.length > 0){
    const visited = new Set([index]);
    let queue = samePlusSeeds.slice();
    while(queue.length){
      const idx = queue.shift();
      if(visited.has(idx)) continue;
      visited.add(idx);
      const chained = battleNeighbors(idx, owner, result);
      const chainedCard = state.board[idx].card;
      if(chained.length > 0 && chainedCard.active && chainedCard.active.onCaptureBonus){
        state.board[idx].captureBonus += chainedCard.active.onCaptureBonus;
      }
      chained.forEach(ni=>{ result.combo++; queue.push(ni); });
    }
  }

  if(result.flips > 0 && placed.active && placed.active.onCaptureBonus){
    placedEntry.captureBonus += placed.active.onCaptureBonus;
  }
  // Leviathan's Call of the Deep: "+N Power on a side THIS ROUND" (not
  // permanent, unlike onCaptureBonus above) whenever he takes control of an
  // enemy card. No on-capture side-choice UI exists (same "no choice UI"
  // simplification as every on-place/on-win 'choose 1' ability), so it's
  // applied to all sides via buffThisRound like every other "this round"
  // grant in the engine.
  if(result.flips > 0 && placed.active && placed.active.onCaptureBuffSelfThisRound){
    SpecialVerbs.buffThisRound(placedEntry, placed.active.onCaptureBuffSelfThisRound);
  }
  // Chocobo King's King's Command: "+1 Power on all sides THIS ROUND to all
  // your ADJACENT allied cards" whenever he takes control of an enemy card —
  // uses the shared adjacentEntries() helper (see its own comment) since
  // this needs actual neighbor entries, not just a count.
  if(result.flips > 0 && placed.active && placed.active.onCaptureBuffAdjacentAlliesThisRound){
    const amt = placed.active.onCaptureBuffAdjacentAlliesThisRound;
    adjacentEntries(index).forEach(({ entry: n }) => { if(n.owner === owner) SpecialVerbs.buffThisRound(n, amt); });
  }
  // Odin's Valhalla's Call: same trigger, but board-wide instead of just
  // adjacent — "all YOUR allied cards", not "adjacent" ones.
  if(result.flips > 0 && placed.active && placed.active.onCaptureBuffAllAlliesThisRound){
    const amt = placed.active.onCaptureBuffAllAlliesThisRound;
    state.board.forEach(e => { if(e && e.owner === owner) SpecialVerbs.buffThisRound(e, amt); });
  }

  return result;
}

function boardFull(){
  return state.board.every(c => c !== null);
}

// Lets the Forest AI spend a turn on an affordable, unused special attack
// instead of placing a card, whenever it can identify a target it would
// actually win against (or, for AoE specials, whenever there's any enemy
// on the board to hit). Mirrors the human flow (executeSpecial then
// resolveSpecialTarget) so it goes through the exact same resolution and
// turn-advance code — no separate AI-only path. Returns true if it acted.
function enemyTryUseSpecial(){
  if(state.turn !== 'red' || state.phase !== 'battle') return false;
  const candidates = [];
  state.board.forEach((entry, i) => {
    if(!entry || entry.owner !== 'red' || !specialUsable(entry.card, 'red', entry)) return;
    candidates.push({ sourceIndex:i, entry, special: entry.card.special });
  });

  for(const c of candidates){
    if(c.special.targets === 'aoe'){
      const enemyCount = state.board.filter(e => e && e.owner === 'blue').length;
      if(enemyCount === 0) continue;
      // Fas 2 (Hard difficulty only): a once-per-match AOE hits every enemy
      // card at once, so firing it into a single lonely target wastes most
      // of its value -- Easy/Normal keep the original "fire the instant it's
      // affordable" behavior (still correct, just not tactically patient).
      // Not gated on remaining hand/turns left, deliberately simple: a
      // one-line "is this worth it yet" check rather than its own search.
      if(effectiveAIDifficulty() === 'hard' && enemyCount < 2){
        const emptyCells = state.board.filter(e => !e).length;
        if(emptyCells > 0) continue; // more enemies may still appear -- wait
      }
      executeSpecial(c.sourceIndex);
      return true;
    }

    // Oblivion's Call doesn't attack or compare power at all — it debuffs
    // whichever blue cards are adjacent to the chosen target, so the
    // generic "pick a target I'd win against" heuristic below is the wrong
    // fit and can waste the once-per-match special on an isolated card
    // with nothing nearby to wither. Target whichever blue card has the
    // most blue neighbors instead.
    if(c.entry.card.id === 'voidqueen'){
      let bestTarget = null, bestNeighbors = 0;
      state.board.forEach((target, ti) => {
        if(!target || target.owner !== 'blue') return;
        const row = Math.floor(ti/3), col = ti%3;
        const neighborCount = [[-1,0],[1,0],[0,-1],[0,1]].filter(([dr,dc])=>{
          const r = row+dr, cc = col+dc;
          if(r<0||r>2||cc<0||cc>2) return false;
          const n = state.board[r*3+cc];
          return n && n.owner === 'blue';
        }).length;
        if(neighborCount > bestNeighbors){ bestNeighbors = neighborCount; bestTarget = ti; }
      });
      if(bestTarget != null){
        executeSpecial(c.sourceIndex);
        resolveSpecialTarget(bestTarget);
        return true;
      }
      continue;
    }

    // Tiamat still opens a choice picker after a target click (see
    // resolveSpecialTarget) — the AI has no picker UI to drive, so it
    // bypasses that flow entirely, using the same "would I win this fight"
    // heuristic as every other attack-and-flip special below. Now that the
    // five powers actually differ, the AI always picks 'fire': the
    // straightforward highest-raw-power/permanent-scaling option, matching
    // its existing greedy heuristic (which also doesn't account for any of
    // the five powers' own bonus when prefiltering targets — same known
    // gap documented in section 5 for Astrael/Darum/Daron/Maximus/etc).
    if(c.entry.card.id === 'tiamat'){
      let bestTarget = null, bestPower = -1;
      state.board.forEach((target, ti) => {
        if(!target || target.owner !== 'blue') return;
        if(isShielded(target, ti)) return;
        if(totalPower(c.entry) > totalPower(target) && totalPower(target) > bestPower){
          bestPower = totalPower(target);
          bestTarget = ti;
        }
      });
      if(bestTarget != null){
        runSpecialResolution(c.sourceIndex, bestTarget, { power: 'fire' });
        return true;
      }
      continue;
    }

    // Vorathos needs a direction choice after picking a target (see
    // resolveSpecialTarget) — the AI bypasses the picker like Tiamat and
    // always reinforces 'top' (arbitrary, matches Tiamat's fixed 'dominance').
    if(c.entry.card.id === 'vorathos'){
      let bestTarget = null, bestPower = -1;
      state.board.forEach((target, ti) => {
        if(!target || target.owner !== 'blue') return;
        if(isShielded(target, ti)) return;
        if(totalPower(c.entry) + 4 > totalPower(target) && totalPower(target) > bestPower){
          bestPower = totalPower(target);
          bestTarget = ti;
        }
      });
      if(bestTarget != null){
        runSpecialResolution(c.sourceIndex, bestTarget, { direction: 'up' });
        return true;
      }
      continue;
    }

    // The generic loop below assumes a plain single-board-target special
    // (executeSpecial → resolveSpecialTarget → runSpecialResolution with no
    // extra choice). 'element' (Pallis) needs an extra choice-picker answer
    // the AI can't drive without its own branch (like Voidqueen/Tiamat
    // above) — falling through here crashes (SPECIAL_HANDLERS.pallis reads
    // `element` as undefined). Skip it until it gets a dedicated branch.
    if(c.special.targets === 'element') continue;

    // Generic fallback for 'direction' specials with no bespoke branch above
    // (Naline, The Celestial Judgment, The Infinite Seraph, The Eclipse
    // Fenrir, and now Vorgrath): picks whichever of the four directions has
    // the most enemy cards in it, same "biggest bang for the once-per-match
    // special" heuristic as the plain single-target loop below. Previously
    // these five cards' Ultimates were silently unusable by the AI (this
    // branch didn't exist) — worth fixing now that Vorgrath's whole kit
    // hinges on it, and it costs nothing for the other four.
    if(c.special.targets === 'direction'){
      let bestDir = null, bestCount = 0;
      ['up','down','left','right'].forEach(d => {
        const count = enemiesInDirection(c.sourceIndex, d, 'red').length;
        if(count > bestCount){ bestCount = count; bestDir = d; }
      });
      if(bestDir){
        runSpecialResolution(c.sourceIndex, null, { direction: bestDir });
        return true;
      }
      continue;
    }

    // Shadow Assault isn't a power-comparison capture — it's an unconditional
    // swap+debuff restricted to a target sharing Deathblade's row/column, so
    // it needs its own target search (line-restricted, no "would I win"
    // check, no shield check — matches SPECIAL_HANDLERS.deathblade).
    if(c.entry.card.id === 'deathblade'){
      let bestTarget = null, bestPower = -1;
      state.board.forEach((target, ti) => {
        if(!target || target.owner !== 'blue') return;
        if(!sharesLine(c.sourceIndex, ti)) return;
        if(totalPower(target) > bestPower){ bestPower = totalPower(target); bestTarget = ti; }
      });
      if(bestTarget != null){
        executeSpecial(c.sourceIndex);
        resolveSpecialTarget(bestTarget);
        return true;
      }
      continue;
    }

    let bestTarget = null, bestPower = -1;
    state.board.forEach((target, ti) => {
      if(!target || target.owner !== 'blue') return;
      if(isShielded(target, ti)) return; // don't waste a once-per-match special on a known block
      if(totalPower(c.entry) > totalPower(target) && totalPower(target) > bestPower){
        bestPower = totalPower(target);
        bestTarget = ti;
      }
    });
    if(bestTarget != null){
      // Fas 7 (design review #2): generalizes the AOE branch's own
      // "is this worth it yet" wait above to single-target specials too --
      // previously every difficulty fired the instant ANY winnable target
      // existed, fully deterministic and learnable by a sharp player
      // (starve the target, or feed a throwaway card to bait it early).
      // Hard-only, same shape as the AOE check: skip a target worth less
      // than half this card's own power while emptyCells > 1 still leaves
      // room for a juicier one to show up later.
      if(effectiveAIDifficulty() === 'hard'){
        const emptyCells = state.board.filter(e => !e).length;
        if(emptyCells > 1 && bestPower < totalPower(c.entry) / 2) continue;
      }
      executeSpecial(c.sourceIndex);
      resolveSpecialTarget(bestTarget);
      return true;
    }
  }
  return false;
}

function enemyTurn(){
  if(state.phase !== 'battle' || state.turn !== 'red') return;

  // Fire off anything it can before placing (mirrors a human choosing to
  // special first), then place its best card, then mop up anything that
  // just became affordable/available (e.g. the newly-placed card's own
  // special). Every enemyTryUseSpecial() call already runs the placement
  // through the same maybeEndTurn() logic as the player, so this loop
  // naturally stops the moment red's turn actually ends.
  while(enemyTryUseSpecial()){}

  if(state.turn === 'red' && !state.placedThisTurn){
    const hand = state.enemyHand;
    const emptyCells = state.board.map((c,i)=>c?null:i).filter(i=>i!==null);
    if(hand.length > 0 && emptyCells.length > 0){
      const choice = chooseAIPlacement();
      if(choice){
        placeCard(choice.cellIndex, choice.card.id, 'red');
        while(enemyTryUseSpecial()){}
      }
    }
  }

  // Safety net: if the AI has genuinely run out of anything to do (or chose
  // not to place), make sure its turn actually concludes rather than
  // leaving state.turn stuck on 'red' with nothing left to trigger it.
  if(state.turn === 'red') advanceTurn('red');
}

function finishGame(){
  const blueCount = state.board.filter(c => c && c.owner === 'blue').length;
  const redCount = state.board.filter(c => c && c.owner === 'red').length;
  state.winner = blueCount > redCount ? 'blue' : redCount > blueCount ? 'red' : 'draw';
  state.phase = 'result';
  state.campaignUnlocked = null;
  // A draw doesn't clear the stage — only a clean win advances campaign
  // progress. Unlocking + persisting happens right here (not deferred to
  // the result screen's button) so progress is saved the instant the
  // stage is won, before the player even clicks anything.
  if(state.draftMode === 'campaign' && state.winner === 'blue'){
    const stage = currentCampaignStage();
    if(stage){
      const newly = stage.unlockIds.filter(id => !campaignProgress.unlocked.includes(id));
      campaignProgress = { stageIndex: campaignProgress.stageIndex + 1, unlocked: campaignProgress.unlocked.concat(newly), ngPlus: campaignProgress.ngPlus };
      saveCampaignProgress();
      state.campaignUnlocked = newly;
    }
  }
  recordMatchResult(state.winner);
  state.newAchievements = checkAchievements(state.winner, blueCount);
  if(state.winner === 'blue') SFX.win();
  else if(state.winner === 'red') SFX.lose();
  else SFX.draw();
  render();
}

function resetGame(){
  const keepRules = state.rules;
  const keepMode = state.draftMode || 'random';
  const keepAiDifficulty = state.aiDifficulty || 'normal';
  const keepFastMode = !!state.fastMode;
  // Campaign retry/next/retreat all funnel through here — keep whichever
  // five the player just fielded pre-checked on the way back to the picker
  // (Stage 1 forces the fixed starters regardless, see startCampaignBattle,
  // and Reset Campaign/New Game+ set their own fresh selection directly, so
  // neither is affected by this) instead of forcing a full reselect every
  // single retry. Random/Choose Your Five keep clearing, unchanged — a
  // fresh rematch there is still expected to redraft/redraw.
  const keepSelected = keepMode === 'campaign' ? state.selected.slice() : [];
  state = {
    phase:'draft', selected:keepSelected, board: Array(9).fill(null),
    playerHand:[], enemyHand:[], turn:'blue', pendingCard:null,
    log:'Choose the five champions who will carry your banner.', winner:null,
    viewingCard:null, showRulebook:false, rulebookPage:0, showSisterLore:false, showGraveyard:false, winsPopup:null, conquestPopup:false, chainShake:false, ultimateBanner:null, campaignUnlocked:null, newAchievements:[], rules: keepRules, draftMode: keepMode, revealing: false,
    wins: { blue: 0, red: 0 }, specialUsed: {}, specialMode: null, extraTurnPending: null, placedThisTurn: false,
    turnCount: 0, graveyard: { blue: [], red: [] }, destroyGhosts: [], odinSlashes: [],
    tutorialActive: false, tutorialStep: 0, aiDifficulty: keepAiDifficulty, fastMode: keepFastMode,
  };
  render();
}

state.aiDifficulty = loadAIDifficulty();
state.fastMode = loadFastMode();
render();
loadTesterCount();

document.addEventListener('click', tryStartMusic, { once: true });
document.addEventListener('touchstart', tryStartMusic, { once: true });
</script>
</body>
