/* ---------------- Last Stand Scaling ---------------- */
// The fewer champions left in your hand, the fiercer the ones still fighting.
function lastStandBonus(owner){
  const hand = owner === 'blue' ? state.playerHand : state.enemyHand;
  const remaining = hand.length;
  if(remaining === 0) return 2;
  if(remaining === 1) return 1;
  return 0;
}

function fullEffectiveValue(card, edgeKey, opponentCard, cellIndex, owner, role){
  let v = effectiveValue(card, edgeKey, opponentCard);
  v += rivalryBonusAt(card.id, cellIndex, owner);
  v += lastStandBonus(owner);
  const entry = state.board[cellIndex];
  if(entry && entry.captureBonus) v += entry.captureBonus;
  if(entry && entry.sideBonus && entry.sideBonus[edgeKey]) v += entry.sideBonus[edgeKey];
  // Tilda's Umbral Step, set in checkOnWinBonuses — live and self-expiring
  // (see the comment there), so nothing needs to reverse it once the
  // round-clock window passes.
  if(entry && entry.umbralStepSide === edgeKey && entry.umbralStepUntilTurnCount > state.turnCount && card.active && card.active.onWinRandomDirectionalBoost){
    v += card.active.onWinRandomDirectionalBoost;
  }
  // Tahabata's Wrath Eruption, set in checkOnWinBonuses on the VICTIM's own
  // entry — read unconditionally here (not gated by this card's own
  // active.*, since the flag was placed by an opponent's win), same as
  // entry.sideBonus above. Live and self-expiring, nothing to reverse.
  if(entry && entry.wrathEruptionSide === edgeKey && entry.wrathEruptionUntilTurnCount > state.turnCount){
    v -= 1;
  }
  // Pallis's Wolf Paw's Grip, set in ON_PLACE_HANDLERS.pallis on the
  // VICTIM's own entry — same unconditional live-read shape as Wrath
  // Eruption above, just a -2 amount instead of -1.
  if(entry && entry.wolfPawSide === edgeKey && entry.wolfPawUntilTurnCount > state.turnCount){
    v -= 2;
  }
  if(card.active && card.active.pairPresence){
    const pp = card.active.pairPresence;
    const present = state.board.some(e => e && e.owner === owner && e.card.id === pp.partner);
    if(present){
      if(typeof pp.amount === 'number') v += pp.amount;
      else if(role === 'attack' && typeof pp.attack === 'number') v += pp.attack;
      else if(role === 'defense' && typeof pp.defense === 'number') v += pp.defense;
    }
  }
  if(card.active && card.active.sisterAura){
    const sa = card.active.sisterAura;
    const count = sistersPresentCount(card.id, owner);
    if(sa.bonusByCount[count]) v += sa.bonusByCount[count];
  }
  // Live board-count comparisons — recomputed on every call, nothing stored,
  // same "no state needed" shape as pairPresence/sisterAura above. Used by
  // Tiamat's Apocalyptic Retribution / The Celestial Judgment's Balance
  // (owner ahead or tied on squares controlled → flat bonus) and The Eclipse
  // Fenrir's Nordic Wrath (owner BEHIND on squares, while attacking → bonus).
  if(card.active && card.active.boardLeadBonus){
    const bl = card.active.boardLeadBonus;
    const mine = state.board.filter(e => e && e.owner === owner).length;
    const theirs = state.board.filter(e => e && e.owner !== owner).length;
    // Little Jesp's Even Ground: the tie-only mirror of the lead/orEqual
    // checks above (mine === theirs instead of ahead-or-equal) — same field,
    // same live "no state needed" read, one more branch.
    const meetsThreshold = bl.tieOnly ? mine === theirs : (bl.orEqual ? mine >= theirs : mine > theirs);
    if(meetsThreshold) v += bl.amount;
  }
  if(card.active && card.active.boardUnderdogAttackBonus && role === 'attack'){
    const mine = state.board.filter(e => e && e.owner === owner).length;
    const theirs = state.board.filter(e => e && e.owner !== owner).length;
    if(mine < theirs) v += card.active.boardUnderdogAttackBonus;
  }
  // Tiamat's Five Heads, One Will: "+1 on the direction used in her next
  // attack" while she has 2+ adjacent enemies — read live at comparison
  // time instead of tracking a deferred "next attack" flag, so it's really
  // just "whenever the condition holds during one of her attacks".
  if(card.active && card.active.adjacentEnemiesBoost && role === 'attack'){
    const ab = card.active.adjacentEnemiesBoost;
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let enemyNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== owner) enemyNeighbors++;
    });
    if(enemyNeighbors >= ab.minCount) v += ab.amount;
  }
  // Tahabata's Pyrelord's Awakening: the enemy-counting mirror of
  // adjacentEnemiesBoost above, but per the user's explicit choice
  // (variant "a"), NOT gated to role==='attack' — his card text has no
  // "while attacking" qualifier, unlike Tiamat's. Same shape as Medusa's
  // adjacentAlliesBoost below, just counting enemy neighbors instead of
  // allied ones.
  if(card.active && card.active.adjacentEnemiesBoostAnyRole){
    const ab = card.active.adjacentEnemiesBoostAnyRole;
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let enemyNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== owner) enemyNeighbors++;
    });
    if(enemyNeighbors >= ab.minCount) v += ab.amount;
  }
  // Medusa's Throne of Stone: the mirror image of adjacentEnemiesBoost
  // above (own-side neighbors instead of enemy ones), and applies on both
  // attack and defense — her text says "this round", not "her next
  // attack" like Tiamat's, so it isn't gated to role==='attack'.
  if(card.active && card.active.adjacentAlliesBoost){
    const ab = card.active.adjacentAlliesBoost;
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let allyNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner === owner) allyNeighbors++;
    });
    if(allyNeighbors >= ab.minCount) v += ab.amount;
  }
  // Ifrit's Burning Dominion: "controls at least 2 adjacent cards HE HAS
  // DEFEATED" — a stricter version of adjacentAlliesBoost above, filtered
  // to only count neighbors carrying entry.defeatedByIfrit (set in
  // battleNeighbors whenever Ifrit personally flips a card, see the
  // comment there). Both conditions (currently owned AND previously
  // defeated by him) are checked live every call, same "no state to
  // reverse" shape as every other adjacency-count aura — the flag itself
  // persists forever once set (a historical fact, not a status effect),
  // it's the ownership half of the check that can naturally become false
  // again if the card gets recaptured.
  if(card.active && card.active.adjacentDefeatedByMeBoost){
    const ab = card.active.adjacentDefeatedByMeBoost;
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let defeatedNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner === owner && n.defeatedByIfrit) defeatedNeighbors++;
    });
    if(defeatedNeighbors >= ab.minCount) v += ab.amount;
  }
  // Nexzoth's Reality Consume, rebuilt per the approved art into a
  // permanent adjacent-enemy aura (was an on-place one-time debuff) --
  // the mirror image of adjacentEnemiesBoost/adjacentAlliesBoost above,
  // but debuffing the NEIGHBOR instead of buffing the card carrying the
  // flag. Applies on both attack and defense (no "this round"/"her next
  // attack" framing in the art's text), always live off the board so it
  // needs no separate on-place handler or entry-side status flag.
  if(cellIndex != null){
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== owner && n.card.active && n.card.active.auraDebuffAdjacentEnemies && !(card.active && card.active.debuffImmune)){
        v -= n.card.active.auraDebuffAdjacentEnemies;
      }
    });
  }
  // Medusa's Serpent Queen: +N Power per Petrified enemy on the board,
  // capped — a live board-count check, same "no state needed" shape as
  // boardLeadBonus/pairPresence above.
  if(card.active && card.active.auraPerPetrifiedEnemy){
    const cfg = card.active.auraPerPetrifiedEnemy;
    const petrifiedEnemies = state.board.filter(e => e && e.owner !== owner && e.petrifiedUntilTurnCount > state.turnCount).length;
    v += Math.min(petrifiedEnemies, cfg.max) * cfg.amount;
  }
  // Ferea's Queen's Blessing: the Frostmarked mirror of Serpent Queen above
  // (permanent boolean flag instead of a turn-count expiry), same capped
  // per-enemy-count aura shape.
  if(card.active && card.active.auraPerFrostmarkedEnemy){
    const cfg = card.active.auraPerFrostmarkedEnemy;
    const frostmarkedEnemies = state.board.filter(e => e && e.owner !== owner && e.frostmarked).length;
    v += Math.min(frostmarkedEnemies, cfg.max) * cfg.amount;
  }
  // Shiva's Ice Touch / Chocobo King's Choco Dash / Odin's Gungnir Strike:
  // "gets +N Power on the attacking side" — a plain, unconditional
  // attack-role bonus, unlike every adjacency/board-state-gated attack bonus
  // above. Didn't exist as its own primitive yet because nothing this
  // simple had shipped before.
  if(card.active && card.active.flatAttackBonus && role === 'attack'){
    v += card.active.flatAttackBonus;
  }
  // Aurelian's Skyward Reach: the same shape as flatAttackBonus above, but
  // restricted to specific sides instead of all four — a natural
  // generalization of the older single-direction active.bonus field
  // (bonus.dir/bonus.amount, used by Ragnar/Zaevir/Harpy) to a list of
  // directions, since nothing needed more than one side until now.
  if(card.active && card.active.axisBonus && role === 'attack' && card.active.axisBonus.dirs.includes(edgeKey)){
    v += card.active.axisBonus.amount;
  }
  // Shiva's Eternal Winter / Leviathan's Maelstrom: "+N Power on all sides
  // THIS ROUND while 2+ enemy cards are adjacent" — the enemy-counting
  // mirror of Medusa's adjacentAlliesBoost (not role-gated, since both say
  // "this round" rather than Tiamat's attack-only "her next attack"), but
  // counting enemies like Tiamat's adjacentEnemiesBoost instead of allies.
  // Kept as its own flag rather than reusing Tiamat's (role==='attack' only)
  // since Shiva/Leviathan's text covers defense too.
  if(card.active && card.active.adjacentEnemyAuraThisRound){
    const cfg = card.active.adjacentEnemyAuraThisRound;
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let enemyNeighbors = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner !== owner) enemyNeighbors++;
    });
    if(enemyNeighbors >= cfg.minCount) v += cfg.amount;
  }
  // Yojimbo's Price of Death: "if attacking a card with higher total Power
  // than his own, +N Power on the attacking side" — every attack, uncapped,
  // read off the two cards' PRINTED totals (no captureBonus/sideBonus
  // available here for the opponent side — opponentCard is raw card data,
  // not a live entry — same simplification every other opponent-comparison
  // primitive above already makes).
  if(card.active && card.active.vsStrongerTotalPowerBoost && role === 'attack' && opponentCard){
    const ownTotal = card.top + card.right + card.bottom + card.left;
    const oppTotal = opponentCard.top + opponentCard.right + opponentCard.bottom + opponentCard.left;
    if(oppTotal > ownTotal) v += card.active.vsStrongerTotalPowerBoost.amount;
  }
  // Omega Weapon's Anti-Matter Cannon: the same "vs a stronger total Power"
  // check as Yojimbo's Price of Death above, but ONCE PER MATCH — consumed
  // in battleNeighbors right after this value is used for a real attack
  // (see the comment there), the same recompute-and-mark pattern already
  // used for Medusa's marginBlocked check.
  if(card.active && card.active.oncePerMatchVsStrongerBoost && role === 'attack' && opponentCard && cellIndex != null){
    const liveEntry = state.board[cellIndex];
    if(liveEntry && !liveEntry.vsStrongerBoostUsed){
      const ownTotal = card.top + card.right + card.bottom + card.left;
      const oppTotal = opponentCard.top + opponentCard.right + opponentCard.bottom + opponentCard.left;
      if(oppTotal > ownTotal) v += card.active.oncePerMatchVsStrongerBoost.amount;
    }
  }
  // Yojimbo's Kozuka: "once per match, +N Power on all sides during an
  // attack" — no condition beyond "an attack happens", consumed the same
  // once-per-match way as Anti-Matter Cannon above (see battleNeighbors).
  if(card.active && card.active.oncePerMatchAttackBoost && role === 'attack' && cellIndex != null){
    const liveEntry = state.board[cellIndex];
    if(liveEntry && !liveEntry.oncePerMatchAttackBoostUsed) v += card.active.oncePerMatchAttackBoost.amount;
  }
  // Three Head Dragon's Ice's Breath: "the enemy's opposing side is frozen,
  // -2 Power during this attack" — read off the ATTACKER's active (not this
  // card's own), only on the defense-role call, so it only ever lowers the
  // card it's attacking. Still respects that card's own debuffImmune (e.g.
  // The Eclipse Fenrir), same as every other debuff in the engine.
  if(role === 'defense' && opponentCard && opponentCard.active && opponentCard.active.freezeDefenderPenalty){
    if(!isDebuffImmuneNow(card)) v -= opponentCard.active.freezeDefenderPenalty;
  }
  // Kaeldryx's Dragon Hunter: +N Power whenever the opponent carries a given
  // tag (currently only isDragon, but written generically in case a future
  // card wants "vs Undead"/"vs Beast" etc.) — same shape as underdogBonus
  // above, just keyed off an arbitrary boolean card field instead of a
  // stat comparison.
  if(card.active && card.active.vsTagBonus && opponentCard && opponentCard[card.active.vsTagBonus.tag]){
    v += card.active.vsTagBonus.amount;
  }
  // The bosses' "Weakness" clauses (-N Power vs a specific-element card): a
  // plain elemental vulnerability printed on the card itself, not an
  // opponent's active ability — so unlike every debuff() call above, this
  // is NOT gated by debuffImmune/debuffImmuneFirstRound (Nexzoth and
  // Morvath are still immune to enemy abilities that lower their Power,
  // but their own printed elemental weakness still applies). The 'magic'
  // -element clause (Kaeldryx) stays dormant — no such card exists — but
  // 'light' (Naline) and 'dark' (Umbrael) are both live as of the session
  // that added those two, so Nexzoth/Morvath/Vorgrath/Zalazar/Umbrael's
  // Light weaknesses and Naline's Dark weakness now actually fire.
  if(card.active && card.active.weakVsElement && opponentCard && opponentCard.element === card.active.weakVsElement.element){
    v -= card.active.weakVsElement.amount;
  }
  // Umbrael's Reality Fracture: "if the opponent has higher Power on the
  // chosen side, Umbrael gets +2 Power on that side this round" — read as a
  // live per-battle underdog check (opponent's FACING side beats this
  // card's own printed side), unlike the existing whole-card-sum
  // active.underdogBonus (Void Empress/Wendigo) above.
  if(card.active && card.active.underdogSideBonus && opponentCard){
    const opposite = { top:'bottom', bottom:'top', left:'right', right:'left' };
    if(opponentCard[opposite[edgeKey]] > card[edgeKey]) v += card.active.underdogSideBonus;
  }
  // Triune Desire's Divine Temptation: an aura affecting every OTHER card
  // on the board, not just itself — unlike every other passive above,
  // which only ever modifies the card carrying it. Hardcoded to her id
  // (like protectedByInfiniteSeraph) rather than a generic active flag,
  // since nothing else needs this shape yet.
  if(card.id !== 'triunedesire'){
    if(state.board.some(e => e && e.owner === owner && e.card.id === 'triunedesire')) v += 1;
    const enemyTriune = state.board.some(e => e && e.owner !== owner && e.card.id === 'triunedesire');
    if(enemyTriune && !(card.active && card.active.debuffImmune)) v -= 1;
  }
  return v;
}

function isShielded(targetEntry, targetIndex){
  if(targetEntry.grantedShield && !targetEntry.shieldUsed) return true;
  // Pallis's Protective Aura: "can't be lost THIS ROUND" — a time-gated
  // window (entry.protectiveAuraUntilTurnCount, same xUntilTurnCount idiom
  // as Umbral Step/Wrath Eruption), not a one-time-use shield. Blocks
  // EVERY attempt within the window rather than just the first, so unlike
  // grantedShield/active.shield above it never sets shieldUsed — there's
  // nothing to consume, it just expires on its own.
  if(targetEntry.protectiveAuraUntilTurnCount > state.turnCount) return true;
  const a = targetEntry.card.active;
  if(!a) return false;
  if(a.shield && !targetEntry.shieldUsed) return true;
  if(a.conditionalShield === 'adjacentAllies2'){
    const row = Math.floor(targetIndex/3), col = targetIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let count = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner === targetEntry.owner) count++;
    });
    if(count >= 2) return true;
  }
  return false;
}

// "Conquered!" banner — one piece of art per side (conquered-badge.png for
// the player, conquered-badge-red.png for the AI), each written from that
// side's own perspective, so both captures get the flourish now. Uses a
// token instead of a bare setTimeout so that a second capture landing
// while the first banner is still up (e.g. a placement capture immediately
// followed by a special) restarts the window instead of the earlier timer
// clearing it out from under the newer one. Duration must match
// .conquest-banner's `conquestPop` animation length in the CSS below —
// bumped from an original 1s to 1.4s after playtester feedback that
// captures (this banner included) flew by too fast to actually see.
const CONQUEST_BANNER_MS = 1400;

// Fast Mode (see toggleFastMode()): scales the ROUTINE per-move waits a
// repeat player sits through every match -- flip stagger, conquest banner,
// short between-turn pauses -- down to a snappier pace. Deliberately NOT
// applied to ULTIMATE_WINDUP_MS/SHAKE_MS/CLEANUP_MS below: those gate the
// rare Special-cast spectacle sequences, which are the payoff a player is
// watching FOR, not friction to cut. Keep this numerically in sync with
// .arena-frame.fast-mode's --fx-speed in the CSS above -- both scale the
// same on-screen moment (the flip/banner animation is CSS-timed; this is
// how long JS then waits before the next render/turn).
const FAST_MODE_SCALE = 0.4;
function fxTime(ms){
  return state.fastMode ? Math.round(ms * FAST_MODE_SCALE) : ms;
}

let conquestPopupToken = 0;
function showConquestPopup(owner){
  const token = ++conquestPopupToken;
  state.conquestPopup = owner;
  setTimeout(()=>{
    if(conquestPopupToken === token){
      state.conquestPopup = false;
      render();
    }
  }, fxTime(CONQUEST_BANNER_MS));
}

// On-placement effects for the Triple Triad Sisters (Void Touch/Undying
// Flame) — a small id-keyed dispatch mirroring SPECIAL_HANDLERS below, but
// fired automatically from placeCard instead of spent from `state.wins`.
const ON_PLACE_HANDLERS = {
  nyxara(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    SpecialVerbs.debuff(target, 2);
  },
  vaelira(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner && !e.vaeliraBurned);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    SpecialVerbs.debuff(target, 2);
    target.vaeliraBurned = true;
  },
  // The Eclipse Fenrir's Hunt of the Eclipse: the source text lets the
  // player choose the direction; simplified to random, same call as
  // Tiamat's Fivefold Catastrophe (active.onPlaceBoost) — no on-placement
  // direction-choice UI exists.
  fenrir(entry, owner, cellIndex){
    const dirs = ['up','right','down','left'];
    const direction = dirs[Math.floor(Math.random()*dirs.length)];
    enemiesInDirection(cellIndex, direction, owner).forEach(p => SpecialVerbs.debuff(p.entry, 1));
  },
  // Three Souls, One Fury: every enemy on the board, not just adjacent
  // ones (the source text says "all enemy cards", no line-of-sight
  // wording like Naline/Fenrir's directional effects) — permanent -1 on
  // each one's own weakest side (raw card stat, same "read the printed
  // number" simplification as The Celestial Judgment's facing-side check).
  threeheaddragon(entry, owner){
    const sides = ['top','right','bottom','left'];
    state.board.forEach(e => {
      if(!e || e.owner === owner) return;
      let weakest = sides[0];
      sides.forEach(s => { if(e.card[s] < e.card[weakest]) weakest = s; });
      SpecialVerbs.directionalBoost(e, [weakest], -1);
    });
  },
  // Crimson Allure: locks a random enemy's Special Attack for "next round"
  // — same round-clock window as SpecialVerbs.debuffThisRound (through the
  // target's own next turn), just gating specialUsable() instead of a
  // captureBonus. See specialUsable()'s entry.specialLockedUntilTurnCount
  // check.
  triunedesire(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    target.specialLockedUntilTurnCount = state.turnCount + 4;
  },
  // Seraphine's Celestial Mark: marks a random enemy on placement.
  // entry.seraphineMarked is a plain runtime flag (same shape as
  // entry.vaeliraBurned/entry.frostmarked) — the actual +2 bonus is read via
  // two small, hardcoded-by-id checks in battleNeighbors and simulateFlips
  // (fullEffectiveValue has no access to the live opponent entry, only its
  // static card data, so it can't read this flag itself — see the comment
  // at each check site).
  seraphine(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    target.seraphineMarked = true;
  },
  // Kaeldryx's Scalebreaker, rebuilt per the approved art (was "choose 1
  // enemy card — it can't get Power bonuses this round", now a permanent
  // -2 debuff instead) — random target, same simplification as every other
  // on-place "choose 1 enemy" ability above with no picker UI.
  kaeldryx(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    SpecialVerbs.debuff(target, 2);
  },
  // Morvath's Tidal Crush.
  morvath(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    SpecialVerbs.debuffThisRound(target, 2);
  },
  // Vorgrath bundles two on-place abilities into one placement (he's only
  // ever placed once, so "once per match" and "on placement" coincide for
  // World Denial the same way they do for every other card's on-place hook):
  // Ashfall (a plain -2-this-round debuff on a random enemy) AND World
  // Denial ("destroy all abilities on a card this round" — approximated as
  // locking that card's Special Attack, the exact same mechanism Crimson
  // Allure already uses, plus a flat -2 Power standing in for its passives
  // being suppressed; a genuine "silence every active.* bonus" gate would
  // need touching every single one of fullEffectiveValue's bonus checks for
  // one card's worth of benefit). The two picks are independent and may
  // land on the same or different enemies.
  vorgrath(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const ashfallTarget = enemies[Math.floor(Math.random()*enemies.length)];
    SpecialVerbs.debuffThisRound(ashfallTarget, 2);
    const denialTarget = enemies[Math.floor(Math.random()*enemies.length)];
    denialTarget.specialLockedUntilTurnCount = state.turnCount + 4;
    SpecialVerbs.debuffThisRound(denialTarget, 2);
  },
  // Zalazar bundles Infernal Reach (random enemy, -2 this round) and Tyrant
  // Aura (random direction, every enemy in that line permanently -1 — same
  // "no on-place direction-choice UI" simplification as Fenrir's Hunt of
  // the Eclipse / Three Head Dragon's Three Souls, One Fury above).
  zalazar(entry, owner, cellIndex){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length > 0){
      const target = enemies[Math.floor(Math.random()*enemies.length)];
      SpecialVerbs.debuffThisRound(target, 2);
    }
    const dirs = ['up','right','down','left'];
    const direction = dirs[Math.floor(Math.random()*dirs.length)];
    enemiesInDirection(cellIndex, direction, owner).forEach(p => SpecialVerbs.debuff(p.entry, 1));
  },
  // Naline bundles Divine Touch (random ally, herself included, +2 this
  // round) and Soul Revive (one card back from her OWN Graveyard at 1
  // Power) into her single placement — same "no secondary-activation
  // system, so it fires on-place instead" reasoning as Vorgrath/Zalazar's
  // bundled pairs above.
  naline(entry, owner){
    const allies = state.board.filter(e => e && e.owner === owner);
    if(allies.length > 0){
      const target = allies[Math.floor(Math.random()*allies.length)];
      SpecialVerbs.buffThisRound(target, 2);
    }
    reviveFromOwnGraveyardAtFixedPower(owner, 1, 1, 0);
  },
  // Umbrael's Void Touch.
  umbrael(entry, owner){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length === 0) return;
    const target = enemies[Math.floor(Math.random()*enemies.length)];
    SpecialVerbs.debuffThisRound(target, 2);
  },
  // Zlaizer bundles Divine Balance (random ally, +2 this round) and
  // Redemption Touch (a second independent random ally, +2 this round PLUS
  // temporarily can't-be-removed) into his one placement — same "no
  // secondary-activation system" reasoning as Vorgrath/Zalazar/Naline above.
  zlaizer(entry, owner){
    const allies = state.board.filter(e => e && e.owner === owner);
    if(allies.length === 0) return;
    const balanceTarget = allies[Math.floor(Math.random()*allies.length)];
    SpecialVerbs.buffThisRound(balanceTarget, 2);
    const redemptionTarget = allies[Math.floor(Math.random()*allies.length)];
    SpecialVerbs.buffThisRound(redemptionTarget, 2);
    redemptionTarget.destroyImmuneUntilTurnCount = state.turnCount + 4;
  },
  // Shiva's Frost Aura / Leviathan's Abyssal Presence: identical text on
  // both cards — "every ADJACENT enemy card gets -1 Power on all sides this
  // round" — the first on-place hooks that need real adjacency (every
  // earlier on-place ability above targets either a random enemy anywhere
  // on the board, or everyone), so both use the shared adjacentEntries()
  // helper instead of the "pick 1 random enemy" pattern.
  shiva(entry, owner, cellIndex){
    adjacentEntries(cellIndex).forEach(({ entry: n }) => { if(n.owner !== owner) SpecialVerbs.debuffThisRound(n, 1); });
  },
  leviathan(entry, owner, cellIndex){
    adjacentEntries(cellIndex).forEach(({ entry: n }) => { if(n.owner !== owner) SpecialVerbs.debuffThisRound(n, 1); });
  },
  // Odin's Allfather's Gaze: "you see a random enemy card's sides, and all
  // enemy cards get -1 Power this round." The reveal half is flavor only —
  // every card's stats are already shown openly on both sides in this game
  // (no hidden-hand/fog-of-war system exists), so there's nothing to wire
  // up there. The debuff half hits EVERY enemy on the board (not just
  // adjacent ones, unlike Shiva/Leviathan above), so it's the same
  // "loop every enemy" shape Nexzoth/Morvath/Zalazar's single-random-target
  // on-place abilities use, just applied to all of them instead of one.
  odin(entry, owner){
    state.board.forEach(e => { if(e && e.owner !== owner) SpecialVerbs.debuffThisRound(e, 1); });
  },
  // Yojimbo's Mercenary's Code: "+1 Power on all sides if the opponent
  // controls more cards than you" — checked once, at the moment of
  // placement (unlike every live board-count check in fullEffectiveValue
  // above), since the text describes a placement-time condition ("when
  // Yojimbo is placed"), not a recomputed-every-battle aura.
  yojimbo(entry, owner){
    const mine = state.board.filter(e => e && e.owner === owner).length;
    const theirs = state.board.filter(e => e && e.owner !== owner).length;
    if(theirs > mine) SpecialVerbs.attackBoost(entry, 1);
  },
  // Chocobo King's Golden Feathers: "+1 Power on all sides this round" to
  // himself, and if placed next to an allied Beast-type card, that card
  // gets the same +1 too. isBeast is a new, generic tag (same shape as
  // Kaeldryx's isDragon) — nothing else in the roster carries it yet, so
  // the ally half stays dormant until a future Beast card exists, same
  // "dormant until relevant content exists" pattern as several
  // weakVsElement clauses before their matching element shipped.
  chocoboking(entry, owner, cellIndex){
    SpecialVerbs.buffThisRound(entry, 1);
    adjacentEntries(cellIndex).forEach(({ entry: n }) => { if(n.owner === owner && n.card.isBeast) SpecialVerbs.buffThisRound(n, 1); });
  },
  // Templaren's Holy Aura: "+1 Power in the direction facing Templaren" on
  // every adjacent allied card, permanent (no "this round" wording on the
  // card, unlike Shiva/Leviathan/Chocobo King above). The side that "faces"
  // Templaren from an ally's position is simply the opposite of the
  // direction Templaren is offset from that ally (an ally above him gets a
  // bonus on ITS bottom side, etc.) — computed inline since adjacentEntries()
  // only returns index+entry, not which side touches the source.
  templaren(entry, owner, cellIndex){
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0,'bottom'],[1,0,'top'],[0,-1,'right'],[0,1,'left']];
    dirs.forEach(([dr,dc,side])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner === owner) SpecialVerbs.directionalBoost(n, [side], 1);
    });
  },
  // Tilda bundles two independent, untriggered "Choose an enemy card"
  // abilities into her one placement — same "no secondary-activation
  // system, so both fire on-place instead" reasoning as Vorgrath/Zalazar/
  // Naline/Zlaizer above.
  tilda(entry, owner, cellIndex){
    // Piercing Shot: no line-target-choice UI exists, so a random
    // direction is picked first (same shape as Fenrir/Zalazar's own
    // on-place directional picks), then one random enemy along that line.
    const dirs = ['up','right','down','left'];
    const direction = dirs[Math.floor(Math.random()*dirs.length)];
    const lineTargets = enemiesInDirection(cellIndex, direction, owner);
    if(lineTargets.length > 0){
      const shot = lineTargets[Math.floor(Math.random()*lineTargets.length)].entry;
      SpecialVerbs.debuffThisRound(shot, 2);
    }
    // Marked Target: random enemy anywhere on the board (same "pick 1
    // random enemy" shape as Nyxara/Vaelira/Kaeldryx/Morvath/Umbrael
    // above). entry.tildaMarked is read by two hardcoded-by-id checks in
    // battleNeighbors and simulateFlips — same reasoning as Seraphine's
    // own seraphineMarked flag (fullEffectiveValue only ever sees the
    // opponent's static card data, never the live entry the flag lives
    // on) — except NOT gated to a specific attacker id, since the card
    // text says "one of YOUR cards", not just Tilda herself.
    const enemies = state.board.filter(e => e && e.owner !== owner);
    if(enemies.length > 0){
      const marked = enemies[Math.floor(Math.random()*enemies.length)];
      marked.tildaMarked = true;
    }
  },
  // Pallis bundles two independent, untriggered "Choose X" abilities into
  // her one placement — same "no secondary-activation system, so both
  // fire on-place instead" reasoning as Vorgrath/Zalazar/Naline/Zlaizer/
  // Tilda above.
  pallis(entry, owner, cellIndex){
    // Protective Aura: no ally-choice UI exists, so a random ADJACENT
    // ally is picked (adjacentEntries(), same helper Shiva/Leviathan/
    // Chocobo King/Templaren already use — the text specifically says
    // "adjacent", unlike Tilda's whole-board Marked Target). "Can't be
    // lost this round" is a new temporary capture-immunity status
    // (entry.protectiveAuraUntilTurnCount), checked inside the shared
    // isShielded() alongside grantedShield/active.shield/conditionalShield
    // — same xUntilTurnCount idiom as Umbral Step/Wrath Eruption, just
    // read from isShielded() since this blocks a capture outright rather
    // than changing a Power number.
    const adjacentAllies = adjacentEntries(cellIndex).filter(({ entry: n }) => n.owner === owner);
    if(adjacentAllies.length > 0){
      const pick = adjacentAllies[Math.floor(Math.random()*adjacentAllies.length)].entry;
      pick.protectiveAuraUntilTurnCount = state.turnCount + 4;
    }
    // Wolf Paw's Grip: no side-choice UI either, so a random side is
    // picked (same shape as Fenrir/Zalazar's own on-place directional
    // picks). Only one enemy can ever occupy a given side of a cell in a
    // 3x3 grid, so "all enemy cards...on that side" is naturally just the
    // one cell there, if any. Same directional xUntilTurnCount idiom as
    // Tahabata's Wrath Eruption, but a single random side instead of all
    // four neighbors.
    const row = Math.floor(cellIndex/3), col = cellIndex%3;
    const dirs = [[-1,0,'bottom'],[1,0,'top'],[0,-1,'right'],[0,1,'left']];
    const [dr,dc,side] = dirs[Math.floor(Math.random()*dirs.length)];
    const r = row+dr, c = col+dc;
    if(r>=0 && r<=2 && c>=0 && c<=2){
      const n = state.board[r*3+c];
      if(n && n.owner !== owner && !isDebuffImmuneNow(n.card)){
        n.wolfPawSide = side;
        n.wolfPawUntilTurnCount = state.turnCount + 4;
      }
    }
  },
};

function placeCard(cellIndex, cardId, owner){
  const hand = owner === 'blue' ? state.playerHand : state.enemyHand;
  const cardIdx = hand.findIndex(c => c.id === cardId);
  if(cardIdx === -1) return;
  const card = hand[cardIdx];

  // turnsStanding/turnsStandingOwner/turnsStandingCell only matter for
  // Ancient Wyrmking's Weight of Ages (see sweepExpiredRoundEffects) — set
  // unconditionally here anyway, same as shieldUsed/grantedShield above,
  // so the very first tick after placement counts as "1 full turn
  // survived" instead of sweepExpiredRoundEffects treating an undefined
  // owner/cell as a mismatch and burning that first tick on a no-op reset.
  state.board[cellIndex] = { card, owner, shieldUsed:false, grantedShield:false, captureBonus:0, justPlaced:true, turnsStanding:0, turnsStandingOwner:owner, turnsStandingCell:cellIndex };
  // Starborn (Astrael): a random side gets a permanent boost the moment
  // she lands, before flips are resolved — so it counts toward this very
  // placement's battles, not just future ones.
  if(card.active && card.active.onPlaceBoost){
    const sides = ['top','right','bottom','left'];
    const side = sides[Math.floor(Math.random()*sides.length)];
    SpecialVerbs.directionalBoost(state.board[cellIndex], [side], card.active.onPlaceBoost);
  }
  // Triple Triad Sisters: tag her home owner so checkSisterFlip (in
  // battleNeighbors/resolveFlips) can later tell "just captured" apart from
  // "recaptured back", then run her on-place ability if she has one.
  if(SISTER_IDS.includes(card.id)){
    state.board[cellIndex].sisterHomeOwner = owner;
    state.board[cellIndex].sisterWasCaptured = false;
  }
  if(ON_PLACE_HANDLERS[card.id]) ON_PLACE_HANDLERS[card.id](state.board[cellIndex], owner, cellIndex);
  hand.splice(cardIdx,1);
  state.pendingCard = null;

  SFX.place(owner);
  const result = resolveFlips(cellIndex, owner);
  const flips = result.flips, shielded = result.shielded, bonusTriggered = result.bonusTriggered;
  const sameOrPlus = result.sameOrPlus, combo = result.combo;
  // Game-feel phase 3: a brief screen shake for a genuinely large Same/Plus/
  // Combo chain -- gated on sameOrPlus+combo specifically (not raw flips),
  // so an ordinary placement that happens to beat all 4 adjacent enemies via
  // plain battles never shakes; only real chain-reaction captures do. Cleared
  // in the existing 500ms justPlaced timeout below (not the later 1300ms
  // one) so the ~420ms shake animation finishes on its own before that
  // render() would otherwise restart it from frame 0.
  if(sameOrPlus + combo >= 4) state.chainShake = true;
  // Odin's normal-attack Slash VFX: a brief moderate shake on every one of
  // his ordinary attacks (win or lose, same "every real battle" scope as
  // the underlying slash), reusing this exact same chainShake mechanism
  // rather than a new one -- its ~420ms keyframe already finishes safely
  // before the 500ms justPlaced timeout below re-renders, same reasoning
  // as the Same/Plus/Combo case above. See battleNeighbors for where
  // result.odinSlashes is populated and renderBattle() for the VFX itself.
  if(result.odinSlashes && result.odinSlashes.length){
    state.chainShake = true;
    state.odinSlashes = result.odinSlashes;
  }
  if(flips > 0) state.wins[owner] += flips;
  if(flips > 0) state.winsPopup = { owner, amount: flips };
  if(flips > 0) showConquestPopup(owner);
  if(flips > 0) setTimeout(()=> SFX.flip(flips), fxTime(120));
  if(shielded > 0) setTimeout(()=> SFX.shield(), fxTime(90));
  if(bonusTriggered) setTimeout(()=> SFX.bonus(), fxTime(shielded > 0 ? 260 : 90));

  let ruleTag = '';
  if(sameOrPlus > 0 && combo > 0) ruleTag = ` (Same/Plus + Combo x${combo}!)`;
  else if(sameOrPlus > 0) ruleTag = ' (Same/Plus!)';

  if(flips > 0 && shielded > 0){
    state.log = `${card.name} claims ${flips} square${flips>1?'s':''} — ${shielded} shield${shielded>1?'s':''} held!${ruleTag}`;
  } else if(flips > 0){
    state.log = `${card.name} claims ${flips} enemy square${flips>1?'s':''}!${ruleTag}`;
  } else if(shielded > 0){
    state.log = `${card.name} attacks, but ${shielded} shield${shielded>1?'s':''} held firm!`;
  } else {
    state.log = `${card.name} takes the field.`;
  }

  render();

  setTimeout(()=>{
    const placed = state.board[cellIndex];
    if(placed) placed.justPlaced = false;
    state.chainShake = false;
    render();
  }, fxTime(500));

  setTimeout(()=>{
    state.board.forEach(entry=>{
      if(entry){ entry.justFlipped = false; entry.shieldFlash = false; entry.bonusFlash = false; entry.attackFlash = false; entry.fxDelay = 0; entry.fxStep = 0; }
    });
    state.destroyGhosts = [];
    state.odinSlashes = [];
    render();
  }, fxTime(1300));

  if(flips > 0){
    setTimeout(()=>{
      state.winsPopup = null;
      render();
    }, fxTime(1600));
  }

  state.placedThisTurn = true;
  maybeEndTurn(owner);
}

// Passes the turn to the other side — unless a special attack just granted
// an extra turn to `owner`, in which case they act again (with a fresh
// placement too) instead.
function advanceTurn(owner){
  // Normally the board fills up exactly when both hands are spent. But
  // Lyrith's crit can destroy a card and re-open a cell — if that leaves a
  // hole neither side can fill any more (both hands empty), end the match
  // instead of passing an unplayable turn back and forth forever.
  if(boardFull() || (state.playerHand.length === 0 && state.enemyHand.length === 0)){
    setTimeout(finishGame, fxTime(500));
    return;
  }
  // A capture just happened (conquest banner still up) → give the player
  // a beat to actually see it before the AI's own flip/slash/banner pile
  // on top. No capture → keep the old snappy pace, nothing to catch up on.
  const nextTurnDelay = state.conquestPopup ? fxTime(CONQUEST_BANNER_MS + 200) : fxTime(700);
  if(state.extraTurnPending === owner){
    state.extraTurnPending = null;
    state.placedThisTurn = false;
    render();
    if(owner === 'red'){ setTimeout(enemyTurn, nextTurnDelay); }
    return;
  }
  state.placedThisTurn = false;
  state.turn = owner === 'blue' ? 'red' : 'blue';
  state.turnCount++;
  sweepExpiredRoundEffects();
  render();

  if(state.turn === 'red'){
    setTimeout(enemyTurn, nextTurnDelay);
  }
}

// A side's turn only truly ends once they have nothing left they could still
// do: they've already placed (or have no hand card to place) AND none of
// their in-play cards has an affordable, unused special ready. This is what
// lets a special be used before OR after that turn's placement — e.g. place
// Graff, then immediately fire Shadow Assault, all in the same turn — while
// still auto-advancing the turn the instant there's truly nothing left,
// exactly like before, for the common case where no special is in play.
function hasFurtherAction(owner){
  const hand = owner === 'blue' ? state.playerHand : state.enemyHand;
  if(!state.placedThisTurn && hand.length > 0) return true;
  return state.board.some(e => e && e.owner === owner && specialUsable(e.card, owner, e));
}

function maybeEndTurn(owner){
  if(hasFurtherAction(owner)){
    render();
    return;
  }
  advanceTurn(owner);
}

// Explicit escape hatch for the human player: pass even though a special
// is still ready (they'd rather save it) or even before placing at all.
function endPlayerTurn(){
  if(state.turn !== 'blue' || state.phase !== 'battle') return;
  // Blocked mid-Ultimate: playUltimateSequence's own maybeEndTurn(owner)
  // call at the end of its sequence closes over 'blue' from when the cast
  // started — ending the turn early here (advancing state.turn to 'red')
  // would leave that later call racing against whatever red's turn is
  // doing by then. Same interaction-lock as the click handlers below.
  if(state.ultimateBanner) return;
  state.specialMode = null;
  state.pendingCard = null;
  advanceTurn('blue');
}

/* ---------------- special attacks (additive layer) ----------------
   Deliberately kept separate from the base flip engine above: activating
   a special never runs through placeCard/resolveFlips/battleNeighbors,
   it only reads/writes a handful of extra state fields (wins, captureBonus,
   grantedShield, board occupancy) that the base engine already understands.
   Most future ultimates should fit the small verb library below; only a
   signature few need a fully bespoke handler. */
// Vorgrath's Unchained Hatred ("can't be affected by effects that lower his
// Power during the first round") generalizes the existing permanent
// active.debuffImmune (Fenrir, Nexzoth, Morvath) into a time-boxed variant
// instead of a one-off id check — "the first round" is read the same way
// every other round-clock window is: before the opponent has even had their
// first turn, i.e. state.turnCount < 2.
function isDebuffImmuneNow(card){
  if(!card.active) return false;
  if(card.active.debuffImmune) return true;
  if(card.active.debuffImmuneFirstRound && state.turnCount < 2) return true;
  return false;
}

// Every SpecialVerbs.* call below that actually changes a card's Power now
// marks it with the same bonusFlash/bonusAmount popup the base battle
// engine already uses for "effective value differed from printed value"
// (see battleNeighbors) — previously only ever set for a SINGLE targeted
// card via runSpecialResolution, so AOE/direction effects (multi-target
// destroys and debuffs) gave no per-card visual feedback at all, just a
// summary line in state.log. Centralized here rather than added to each
// of the dozen-plus handlers that call these verbs, since every stat
// change in the engine already funnels through this one small set of
// functions (same reasoning as isDebuffImmuneNow/buffLockedUntilTurnCount
// above) — so this one change retroactively covers the entire roster, not
// just the newest cards. Skipped when amount is 0 (nothing to show), and
// naturally skipped whenever a verb returns early (immune/locked) since
// this only runs after the captureBonus change actually happens.
function flashStatChange(entry, amount){
  if(!amount) return;
  entry.bonusFlash = true;
  entry.bonusAmount = amount;
}

const SpecialVerbs = {
  // Kaeldryx's Hunter's Focus ("that card can't get Power bonuses this
  // round") is the first effect that blocks POSITIVE modification rather
  // than applying a negative one — guarded here (and in directionalBoost
  // below) rather than as a new check scattered across every bonus source,
  // since every bonus in the engine is already funneled through these two
  // verbs. entry.buffLockedUntilTurnCount uses the same "+2" one-round
  // window as entry.specialLockedUntilTurnCount (Crimson Allure) below.
  attackBoost(entry, amount){
    if(amount > 0 && entry.buffLockedUntilTurnCount > state.turnCount) return;
    entry.captureBonus += amount;
    flashStatChange(entry, amount);
  },
  grantShield(entry){ entry.grantedShield = true; },
  stealPower(sourceEntry, targetEntry, amount){
    targetEntry.captureBonus -= amount;
    sourceEntry.captureBonus += amount;
    flashStatChange(targetEntry, -amount);
    flashStatChange(sourceEntry, amount);
  },
  extraTurn(owner){ state.extraTurnPending = owner; },
  // Weakens a card with nothing gained in return — for area effects like
  // Oblivion's Call / Yang Resonance that punish without capturing anyone.
  // The Eclipse Fenrir's Eternal Loyalty ("can't have his Power values
  // lowered by enemy card skills") is checked here rather than at every
  // call site — debuff()/debuffThisRound() are only ever called on an
  // ENEMY target by convention, never on the caster's own card, so a single
  // guard here is equivalent to guarding all of them.
  debuff(entry, amount){
    if(isDebuffImmuneNow(entry.card)) return;
    entry.captureBonus -= amount;
    flashStatChange(entry, -amount);
  },
  // Boosts only the listed sides (e.g. ['top','bottom']) instead of all four —
  // for ultimates like Skybreaker/WorldCleaver that favor one axis of the card.
  // Every existing caller only ever applies a positive amount to its own
  // card; a negative amount is a debuff (e.g. Three Head Dragon's Three
  // Souls, One Fury), so it respects debuffImmune same as debuff() above.
  directionalBoost(entry, sides, amount){
    if(amount < 0 && isDebuffImmuneNow(entry.card)) return;
    if(amount > 0 && entry.buffLockedUntilTurnCount > state.turnCount) return;
    if(!entry.sideBonus) entry.sideBonus = { top:0, right:0, bottom:0, left:0 };
    sides.forEach(s => { entry.sideBonus[s] = (entry.sideBonus[s] || 0) + amount; });
    flashStatChange(entry, amount);
  },
  // Same as debuff(), but reversed automatically once the round it was cast
  // in has passed — for source text that explicitly says "this round"
  // (e.g. Tiamat's Weakening) instead of a permanent penalty. Backed by
  // `entry.tempEffects` + `sweepExpiredRoundEffects()` below; see the
  // comment there for what "a round" means here (roundTicks defaults to 4,
  // the window every "this round"/"this turn"-style effect in the game now
  // uses — see that comment for why it was widened from the original 2).
  debuffThisRound(entry, amount, roundTicks = 4){
    if(isDebuffImmuneNow(entry.card)) return;
    entry.captureBonus -= amount;
    entry.tempEffects = entry.tempEffects || [];
    entry.tempEffects.push({ captureDelta: -amount, expiresAtTurnCount: state.turnCount + roundTicks });
    flashStatChange(entry, -amount);
  },
  // Naline's Divine Touch ("+2 Power this round", not permanent) — the
  // positive-and-temporary counterpart to debuffThisRound above.
  // sweepExpiredRoundEffects() below already reverses a captureDelta of
  // either sign, so this just needed the mirrored apply step; respects
  // buffLockedUntilTurnCount same as attackBoost/directionalBoost.
  buffThisRound(entry, amount, roundTicks = 4){
    if(entry.buffLockedUntilTurnCount > state.turnCount) return;
    entry.captureBonus += amount;
    entry.tempEffects = entry.tempEffects || [];
    entry.tempEffects.push({ captureDelta: amount, expiresAtTurnCount: state.turnCount + roundTicks });
    flashStatChange(entry, amount);
  },
};

// Reverses any SpecialVerbs.*ThisRound effect (and every other
// `...UntilTurnCount = state.turnCount + 4` grant in the engine — Petrify,
// specialLocked, buffLocked, destroyImmune, the Ultimate-only "this round"
// flags, etc.) whose window has closed. "A round" = two full back-and-
// forths: the effect survives the rest of the caster's own turn, the
// opponent's reply, the caster's OWN NEXT TURN, and the opponent's reply to
// THAT, only reverting right as it becomes the caster's turn again after
// all of that (`state.turnCount` ticks once per turn switch in
// advanceTurn, so +4 turns = "through my own next turn too", not just the
// opponent's immediate reply).
//
// BALANCE (a deliberate widening, not a text-fidelity default): this used
// to be +2 (opponent's reply only) — reported as a bug ("Shiva's Diamond
// Storm debuffs enemies but attacking them still doesn't flip the cards")
// because a caster who couldn't immediately capitalize on a "this round"
// grant in the SAME turn they cast it would find it already expired by
// their very next turn, before they ever got a real chance to use it —
// especially painful for a 3-Wins Ultimate like Diamond Storm. Widened
// globally (not just for Shiva) at the user's explicit request, so every
// card sharing this convention (Naline, Tiamat, Vorgrath, Medusa, Triune
// Desire, the six newest cards, etc.) gets a genuinely usable window on
// the caster's own next turn, not just an opponent-facing one.
//
// Deliberately symmetric for either side casting it. Call this at every
// turn switch, not just once per round, so it never runs stale by more than
// one turn regardless of which side started the clock.
function sweepExpiredRoundEffects(){
  state.board.forEach((entry, i) => {
    if(!entry) return;
    // Omega Weapon's Absolute Defense: "the FIRST time he'd lose a battle
    // EACH ROUND, ignore it" — unlike every other card's active.shield
    // (which is a single one-time-per-match use, consumed via shieldUsed
    // and never reset), his explicitly says "each round", so it needs to
    // reset here — this function already runs on every turn switch, the
    // same round-clock granularity every other "this round" effect uses.
    // A genuinely stronger defensive primitive than the rest of the
    // roster's shields; flagged here in case future balancing wants it
    // capped further.
    if(entry.card.active && entry.card.active.shieldResetsEachRound) entry.shieldUsed = false;
    // Ifrit's Hellfire Claw: "once per ROUND" (not once per match like
    // every other oncePerMatchAttackBoost user), so it needs the exact
    // same reset treatment as Omega Weapon's shield above -- just applied
    // to oncePerMatchAttackBoostUsed instead of shieldUsed.
    if(entry.card.active && entry.card.active.attackBoostResetsEachRound) entry.oncePerMatchAttackBoostUsed = false;
    // Ancient Wyrmking's Weight of Ages: "+1 to the Power margin needed to
    // flip him for every 2 full turns he's stood unbroken on this exact
    // cell under the same owner" (read in battleNeighbors, capped there
    // at +2). Tracked here since this function already visits every board
    // entry on every turn switch — no separate hook needed. Resets the
    // instant his owner OR his cell differs from what was last recorded
    // (a capture, a position-swap like Deathblade's, or a fresh placement
    // after being destroyed) by comparing against a small snapshot
    // (turnsStandingOwner/turnsStandingCell) rather than needing an
    // explicit reset call at every one of the ~20 "entry.owner = owner"
    // sites elsewhere in the engine — the same wide-reaching pattern
    // checkSisterFlip needed for the Sisters, avoided here entirely.
    // entry.turnsStanding is read as `|| 0` wherever it matters, so a
    // freshly placed card (all three fields still undefined) is handled
    // by the same mismatch branch below without any extra initialization
    // in placeCard() or the various revive-from-graveyard helpers.
    if(entry.card.active && entry.card.active.weightOfAges){
      if(entry.turnsStandingOwner !== entry.owner || entry.turnsStandingCell !== i){
        entry.turnsStanding = 0;
        entry.turnsStandingOwner = entry.owner;
        entry.turnsStandingCell = i;
      } else {
        entry.turnsStanding += 1;
      }
    }
    // Nexzoth's Endless Void, rebuilt per the approved art into "at the
    // start of each round, all enemy cards lose 1 Power" (was a
    // self-protection debuffImmune) — temporary and non-stacking (reuses
    // debuffThisRound's own tempEffects expiry, the same "this round"
    // window every other such effect in the game uses), applied to
    // whichever enemies are on the board at this exact turn switch. A
    // card placed later in the same round isn't retroactively hit.
    // Deliberately non-stacking rather than permanent: paired with his
    // own Devourer/World Shatter, an uncapped permanent version would
    // snowball with no counterplay, the same concern already on record
    // for Nexzoth/Morvath's onWinLineDestroy cap above.
    if(entry.card.active && entry.card.active.onRoundStartDebuffEnemies){
      const amount = entry.card.active.onRoundStartDebuffEnemies;
      state.board.forEach(e => { if(e && e.owner !== entry.owner) SpecialVerbs.debuffThisRound(e, amount); });
    }
    if(!entry.tempEffects || entry.tempEffects.length === 0) return;
    entry.tempEffects = entry.tempEffects.filter(effect => {
      if(effect.expiresAtTurnCount > state.turnCount) return true;
      entry.captureBonus -= effect.captureDelta;
      return false;
    });
  });
}

function totalPower(entry){
  const c = entry.card;
  const sb = entry.sideBonus || {};
  return c.top + c.right + c.bottom + c.left
    + (entry.captureBonus || 0) * 4
    + (sb.top||0) + (sb.right||0) + (sb.bottom||0) + (sb.left||0);
}

function rollCrit(chance){ return Math.random() < chance; }

// Shared "can this card's special actually be activated right now" check —
// used by the UI (diamond badge/ready state), executeSpecial, and the AI.
// A once-per-match special that's already fired is never usable again;
// `requiresPartner` (e.g. Evil Twist Yang needs Yin on the board) gates a
// few bonded-pair ultimates the same way pairPresence already gates
// passive bonuses.
function specialUsable(card, owner, entry){
  const special = card.special;
  if(!special) return false;
  // Triune Desire's Crimson Allure/Forbidden Harmony: a locked card can't
  // use its own Special Attack until the lock's round has passed (see
  // entry.specialLockedUntilTurnCount, set in ON_PLACE_HANDLERS.triunedesire
  // and SPECIAL_HANDLERS.triunedesire).
  if(entry && entry.specialLockedUntilTurnCount > state.turnCount) return false;
  // Medusa's Stone Gaze: a Petrified card can't use its Special Attack
  // either — see checkOnWinBonuses' onWinPetrify hook.
  if(entry && entry.petrifiedUntilTurnCount > state.turnCount) return false;
  const key = owner + ':' + card.id;
  if(special.once && state.specialUsed[key]) return false;
  // Sister's Command (Nyxara, threshold 2) / Sister's Will (Triune Desire,
  // threshold 1): the Ultimate needs no Wins once that many OTHER sisters
  // are on the board — everyone else still pays the normal cost.
  // freeIfSistersPresent is a threshold count, not a boolean.
  const free = special.freeIfSistersPresent && sistersPresentCount(card.id, owner) >= special.freeIfSistersPresent;
  if(!free && state.wins[owner] < special.cost) return false;
  if(special.requiresPartner){
    const present = state.board.some(e => e && e.owner === owner && e.card.id === special.requiresPartner);
    if(!present) return false;
  }
  return true;
}

// One handler per signature ultimate, keyed by card id. Each returns the
// battle-log line to show. Handlers receive { srcEntry, sourceIndex,
// targetEntry, targetIndex, owner } — targetEntry/targetIndex are null
// for area-effect specials (targets:'aoe').
// Shared shield check for specials that DON'T explicitly pierce defenses:
// blocks the flip and consumes the shield, same as a normal battle would.
function specialBlockedByShield(targetEntry, targetIndex){
  if(!isShielded(targetEntry, targetIndex)) return false;
  targetEntry.shieldUsed = true;
  targetEntry.shieldFlash = true;
  return true;
}

const SPECIAL_HANDLERS = {
  // Whirlwind Assault merges the two things the approved card art and the
  // original single-target capture design each wanted: a guaranteed AOE
  // splash (debuffThisRound, same verb Shiva/Leviathan/Torn use) hits every
  // OTHER enemy unconditionally, while the chosen target keeps the original
  // capture-on-win behavior untouched (threshold check, shield check, flip,
  // permanent +3 via attackBoost).
  graff({ srcEntry, targetEntry, targetIndex, owner }){
    const name = srcEntry.card.name;
    const enemyOwner = owner === 'blue' ? 'red' : 'blue';
    state.board.forEach(e => { if(e && e.owner === enemyOwner && e !== targetEntry) SpecialVerbs.debuffThisRound(e, 2); });
    if(totalPower(srcEntry) <= totalPower(targetEntry)){
      return `${name}'s Whirlwind Assault tears through the enemy line, but ${targetEntry.card.name} holds firm!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Whirlwind Assault!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.attackBoost(srcEntry, 3);
    return `${name}'s Whirlwind Assault tears through the enemy line and flips ${targetEntry.card.name}!`;
  },
  lyrith({ srcEntry, targetEntry, targetIndex, owner }){
    // Serpent's Wrath explicitly ignores the enemy's defensive skills — no shield check here.
    if(totalPower(srcEntry) <= totalPower(targetEntry)){
      return `${srcEntry.card.name}'s Serpent's Wrath fails to pierce the enemy's guard!`;
    }
    if(rollCrit(0.25)){
      destroyCard(targetIndex);
      return `${srcEntry.card.name} lands a critical strike — ${targetEntry.card.name} is destroyed!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.attackBoost(srcEntry, 4);
    return `${srcEntry.card.name}'s Serpent's Wrath flips ${targetEntry.card.name}, ignoring its defenses!`;
  },
  aurelia({ srcEntry, targetEntry, targetIndex, owner }){
    if(totalPower(srcEntry) <= totalPower(targetEntry)){
      return `${srcEntry.card.name}'s Dawn's Reckoning is turned aside!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Dawn's Reckoning!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    if(rollCrit(0.25)){
      targetEntry.captureBonus -= 20; // wipes the card's sides to effectively nothing
      return `${srcEntry.card.name} lands a critical strike — ${targetEntry.card.name}'s power is wiped out!`;
    }
    SpecialVerbs.attackBoost(srcEntry, 4);
    return `${srcEntry.card.name}'s Dawn's Reckoning flips ${targetEntry.card.name}!`;
  },
  // Gorgon's Dominion: petrify every enemy (respects protectedByInfiniteSeraph
  // — Petrified is a status effect on an enemy card, the same category
  // Eternal Presence already blocks for Vaelira/Nyxara/Triune Desire),
  // -2 Power this round to all of them, +3 Power this round to Medusa
  // herself, and an extra turn if you control more cards afterward (no
  // capture/destroy happens here, so "afterward" and "right now" are the
  // same board state — checked once).
  medusa({ srcEntry, owner }){
    const name = srcEntry.card.name;
    const enemyOwner = owner === 'blue' ? 'red' : 'blue';
    const protectedSide = protectedByInfiniteSeraph(enemyOwner);
    let petrified = 0;
    state.board.forEach(e => {
      if(!e || e.owner !== enemyOwner || protectedSide) return;
      e.petrifiedUntilTurnCount = state.turnCount + 4;
      SpecialVerbs.debuffThisRound(e, 2);
      petrified++;
    });
    SpecialVerbs.buffThisRound(srcEntry, 3);
    const mine = state.board.filter(e => e && e.owner === owner).length;
    const theirs = state.board.filter(e => e && e.owner === enemyOwner).length;
    if(mine > theirs) SpecialVerbs.extraTurn(owner);
    return petrified > 0
      ? `${name}'s Gorgon's Dominion turns ${petrified} enem${petrified>1?'ies':'y'} to stone!`
      : `${name}'s Gorgon's Dominion finds no one left to petrify!`;
  },
  maximus({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4 <= targetPower){
      return `${srcEntry.card.name}'s Axe of Dominion is blocked!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Axe of Dominion!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.attackBoost(srcEntry, 2);
    if(targetPower > basePower) SpecialVerbs.extraTurn(owner);
    return `${srcEntry.card.name}'s Axe of Dominion crushes ${targetEntry.card.name}!`;
  },
  twistedgipsy({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 3 <= targetPower){
      return `${srcEntry.card.name}'s House of Shadows finds no opening!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against House of Shadows!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.stealPower(srcEntry, targetEntry, 2);
    SpecialVerbs.attackBoost(srcEntry, 1);
    return `${srcEntry.card.name}'s House of Shadows steals ${targetEntry.card.name}'s fortune!`;
  },
  darum({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4 <= targetPower){
      return `${srcEntry.card.name}'s Gate of Dominion is thrown back!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Gate of Dominion!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.attackBoost(srcEntry, 2);
    return `${srcEntry.card.name}'s Gate of Dominion crushes ${targetEntry.card.name}!`;
  },
  daron({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4 <= targetPower){
      return `${srcEntry.card.name}'s Shattered Crown fails to break through!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Shattered Crown!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.stealPower(srcEntry, targetEntry, 2);
    return `${srcEntry.card.name}'s Shattered Crown steals ${targetEntry.card.name}'s power!`;
  },
  ifrit({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 3 <= targetPower){
      return `${srcEntry.card.name}'s Hellfire fizzles out!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Hellfire!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.attackBoost(srcEntry, 1);
    return `${srcEntry.card.name}'s Hellfire engulfs ${targetEntry.card.name}!`;
  },
  // Megaflare, rebuilt per the approved art: from a single-target attack
  // into a full AOE destroy-all-enemies (same shape as Vaelira's Infernal
  // Pact / Nexzoth's The Ending), destroyed cards cannot be revived, and
  // Bahamut permanently gains +1 Power per card destroyed instead of a
  // flat +1 on a win.
  bahamut({ srcEntry, owner }){
    const name = srcEntry.card.name;
    let destroyed = 0;
    state.board.forEach((e, i) => {
      if(!e || e.owner === owner) return;
      if(isDestroyImmune(e)) return;
      destroyCard(i, { noRevive: true });
      destroyed++;
    });
    if(destroyed === 0){
      return `${name}'s Megaflare finds no enemies left to consume!`;
    }
    SpecialVerbs.attackBoost(srcEntry, destroyed);
    return `${name}'s Megaflare annihilates ${destroyed} enem${destroyed>1?'ies':'y'}!`;
  },
  // Rebuilt to match the approved card art's generic wording ("+3 this
  // attack only, +1 all sides permanent on a win") instead of the original
  // axis-specific Up/Down version — same shape as Vayra's Eclipse and
  // Ysara's Eternal Eclipse (total-power threshold check + attackBoost),
  // reused directly rather than inventing a third pattern. His axis
  // identity still lives on in the separate Skyward Reach passive above.
  // Aurelian, "Skybreaker": the permanent gain lands ONLY on his top/bottom
  // sides (but at double the amount, +2 instead of +1) instead of all four
  // -- matches his existing axisBonus passive's own vertical-spear
  // identity (a Sky Warrior's thrust is vertical, not omnidirectional).
  aurelian({ srcEntry, targetEntry, targetIndex, owner }){
    const name = srcEntry.card.name;
    if(totalPower(srcEntry) + 3 <= totalPower(targetEntry)){
      return `${name}'s Skybreaker crashes down without effect!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Skybreaker!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    checkSisterFlip(targetEntry);
    SpecialVerbs.directionalBoost(srcEntry, ['top','bottom'], 2);
    return `${name}'s Skybreaker splits the sky over ${targetEntry.card.name}, permanently sharpening his vertical strike!`;
  },
  vorlix({ srcEntry, targetEntry, targetIndex, owner }){
    const sides = ['left', 'right'];
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4*sides.length <= targetPower){
      return `${srcEntry.card.name}'s WorldCleaver finds nothing to cleave!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against WorldCleaver!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
