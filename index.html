<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Triad Arena — Aetherion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --void:        #0a0812;
  --void-2:      #12101f;
  --panel:       #17142a;
  --line:        #2c2645;
  --gold:        #c9a227;
  --gold-bright: #f0d879;
  --ember:       #d9622b;
  --frost:       #5ec8f2;
  --arcane:      #8b6ef2;
  --text:        #ece7f7;
  --text-dim:    #9c93b8;
  --blue-side:   #3f6fd1;
  --red-side:    #b8452e;
  --earth:       #6fae4a;
  --stone:       #211d24;
  --stone-2:     #2b2530;
  --silver:      #b9b5c2;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  background:#050409;
  color:var(--text);
  font-family:'Spectral', serif;
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex; align-items:flex-start; justify-content:center;
  min-height:100vh; min-height:100dvh;
}
.stage{
  position:relative;
  width:100%;
  max-width:640px;
  min-height:100vh; min-height:100dvh;
  margin:0 auto;
  background:
    radial-gradient(ellipse 480px 420px at 0% 0%, rgba(217,98,43,0.16), transparent 60%),
    radial-gradient(ellipse 480px 420px at 100% 0%, rgba(139,110,242,0.14), transparent 60%),
    radial-gradient(ellipse 480px 420px at 0% 100%, rgba(111,174,74,0.14), transparent 60%),
    radial-gradient(ellipse 480px 420px at 100% 100%, rgba(94,200,242,0.16), transparent 60%),
    var(--void);
  border-radius:16px;
  box-shadow:0 24px 70px rgba(0,0,0,0.75), 0 0 0 1px var(--line);
}
/* Game-feel phase 1, page-level layer: unlike .stage's own children below
   (rendered fresh into #app by every render() call — see the note by
   .arena-ambient), this sits as a sibling of #app, OUTSIDE it, written once
   into the static page shell and never touched by render() again. Its drift
   animation therefore never restarts, giving one layer of guaranteed-smooth
   continuous motion regardless of how often the game state re-renders. */
.stage-ambient{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; border-radius:inherit; }
.stage-mote{
  position:absolute; bottom:0; width:2px; height:2px; border-radius:50%;
  background:currentColor; box-shadow:0 0 6px 2px currentColor;
  opacity:0; animation:stageMoteDrift ease-in-out infinite;
}
.stage-mote:nth-child(1){ left:6%;  color:var(--ember);  animation-duration:22s; animation-delay:0s; }
.stage-mote:nth-child(2){ left:18%; color:var(--frost);  animation-duration:26s; animation-delay:7s; }
.stage-mote:nth-child(3){ left:80%; color:var(--arcane); animation-duration:24s; animation-delay:12s; }
.stage-mote:nth-child(4){ left:92%; color:var(--earth);  animation-duration:28s; animation-delay:4s; }
/* Doubled from 4 to 8 (user feedback: "bakgrund mer levande... själar som
   flyger upp") -- same drifting-ember technique, just more of them and a
   wider spread of left% positions so the whole background reads livelier
   rather than four isolated points. */
.stage-mote:nth-child(5){ left:34%; color:var(--gold);       animation-duration:20s; animation-delay:9s;  }
.stage-mote:nth-child(6){ left:50%; color:var(--gold-bright); animation-duration:30s; animation-delay:2s;  }
.stage-mote:nth-child(7){ left:64%; color:var(--frost);       animation-duration:25s; animation-delay:15s; }
.stage-mote:nth-child(8){ left:12%; color:var(--arcane);      animation-duration:23s; animation-delay:18s; }
@keyframes stageMoteDrift{
  0%{ transform:translateY(0) scale(0.5); opacity:0; }
  12%{ opacity:0.4; }
  60%{ transform:translateY(-60vh) scale(1); opacity:0.28; }
  100%{ transform:translateY(-100vh) scale(0.3); opacity:0; }
}
.wrap{ padding:16px 14px 24px; position:relative; z-index:1; }

h1,h2,.display{ font-family:'Cinzel', serif; letter-spacing:0.04em; }

.masthead{ text-align:center; margin:6px 0 20px; position:relative; }
.masthead.compact{ margin:2px 0 14px; }
.masthead.compact .rune{ width:26px; height:26px; margin:0 auto 5px; font-size:12px; }
.masthead.compact h1{ font-size:22px; }
.masthead.compact .sub{ font-size:10px; }
.corner-flame{
  position:absolute; top:-6px; width:46px; height:46px; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.corner-flame.left{ left:-10px; }
.corner-flame.right{ right:-10px; }
.corner-flame .flame-icon{
  font-size:38px; line-height:1; display:block;
  animation:flameFlicker 2.6s ease-in-out infinite;
}
.corner-flame.left .flame-icon{
  filter:saturate(1.3) drop-shadow(0 0 12px var(--red-side)) drop-shadow(0 0 22px rgba(184,69,46,0.55));
}
.corner-flame.right .flame-icon{
  filter:hue-rotate(190deg) saturate(1.5) drop-shadow(0 0 12px var(--blue-side)) drop-shadow(0 0 22px rgba(63,111,209,0.55));
}
.masthead.compact .corner-flame{ width:30px; height:30px; top:-3px; }
.masthead.compact .corner-flame.left{ left:-4px; }
.masthead.compact .corner-flame.right{ right:-4px; }
.masthead.compact .corner-flame .flame-icon{ font-size:24px; }
@keyframes flameFlicker{
  0%,100%{ transform:scale(1) rotate(-1deg); opacity:0.92; }
  35%{ transform:scale(1.08) rotate(1deg); opacity:1; }
  60%{ transform:scale(0.97) rotate(-2deg); opacity:0.88; }
}
.sound-toggle{
  position:absolute; top:0; right:0; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .sound-toggle{ width:24px; height:24px; font-size:11px; }
.sound-toggle.on{ color:var(--gold); border-color:var(--gold); }

.fullscreen-toggle{
  position:absolute; top:0; right:40px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer;
}
.masthead.compact .fullscreen-toggle{ width:24px; height:24px; font-size:10px; right:28px; }
.fullscreen-toggle.on{ color:var(--gold); border-color:var(--gold); }

/* Fas 6 (design review #2, "cheapest + highest impact" list): a repeat
   player sits through the same flip stagger + conquest banner + turn-wait
   timing every single match with no way to speed it up. Placed as a third
   masthead icon rather than another draft-screen settings panel (the
   review's own UI/UX finding already flagged that screen as overcrowded)
   -- see toggleFastMode()/fxTime() for what it actually scales. */
.fast-toggle{
  position:absolute; top:0; right:80px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer;
}
.masthead.compact .fast-toggle{ width:24px; height:24px; font-size:10px; right:56px; }
.fast-toggle.on{ color:var(--gold); border-color:var(--gold); }

.book-toggle{
  position:absolute; top:0; left:40px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .book-toggle{ width:24px; height:24px; font-size:11px; left:28px; }
.book-toggle:hover{ color:var(--gold); border-color:var(--gold); }

.music-toggle{
  position:absolute; top:0; left:0; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .music-toggle{ width:24px; height:24px; font-size:11px; }
.music-toggle.on{ color:var(--gold); border-color:var(--gold); }
.masthead .rune{
  width:34px; height:34px; margin:0 auto 8px;
  border:1px solid var(--gold); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold); font-size:15px; opacity:0.85;
  box-shadow:0 0 14px rgba(201,162,39,0.35);
}
.masthead h1{
  font-size:26px; font-weight:900; margin:0;
  background:linear-gradient(180deg,#f7ecc8, var(--gold) 60%, #8a6d1a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(201,162,39,0.25);
}
.masthead .sub{ font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-dim); margin-top:6px; }
.tester-badge{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:12px; padding:5px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel);
  color:var(--text-dim); font-size:11px; letter-spacing:0.03em;
}
.tester-badge .tester-icon{ font-size:12px; }
.tester-badge b{ color:var(--gold-bright); font-weight:700; }

/* ---------- rules ---------- */
.rules{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:20px; font-size:14px; line-height:1.55; color:var(--text-dim);
}
.rules b{ color:var(--text); }

.stage-banner{
  width:100%; max-width:420px; margin:0 auto 20px;
  border:1px solid var(--gold); box-shadow:0 12px 40px rgba(0,0,0,0.65); line-height:0;
}
.stage-banner img{ width:100%; display:block; border-radius:13px; }

.lore-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; margin:0 0 20px; max-height:420px; overflow-y:auto;
}
.lore-section{ margin-bottom:18px; }
.lore-section:last-child{ margin-bottom:0; }
.lore-title{
  font-family:'Cinzel',serif; font-weight:700; font-size:14px; letter-spacing:0.03em;
  color:var(--gold-bright); margin-bottom:8px;
}
.lore-section p{
  font-size:13px; line-height:1.6; color:var(--text-dim); margin:0 0 8px;
}
.lore-section p:last-child{ margin-bottom:0; }

.rules-toggle-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:12px 16px 14px; margin-bottom:20px;
}
.rules-toggle-panel .section-label{ margin-bottom:10px; }
/* Fas 7 (design review #2): internal sub-headers for the merged "Match
   settings" panel (Optional rules / Forest AI difficulty / Your record),
   replacing three separately-bordered .rules-toggle-panel boxes that
   repeated the same style without adding clarity. */
.settings-section-label{
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--gold); margin:16px 0 10px; padding-top:14px; border-top:1px solid var(--line);
}
.match-settings-panel .settings-section-label:first-of-type{ margin-top:2px; padding-top:0; border-top:none; }
.rule-toggle{
  display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; cursor:pointer;
  font-size:13px; line-height:1.5; color:var(--text-dim);
}
.rule-toggle:last-child{ margin-bottom:0; }
.rule-toggle input{ margin-top:3px; flex:0 0 auto; accent-color: var(--gold); width:16px; height:16px; cursor:pointer; }
.rule-toggle b{ color:var(--text); }
.rule-toggle.rule-disabled{ opacity:0.45; }
.rule-toggle.rule-disabled input{ cursor:not-allowed; }

.mode-toggle{ display:flex; gap:8px; margin-bottom:20px; }
.mode-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:12px 8px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-family:'Spectral',serif;
  font-size:12px; font-weight:600; cursor:pointer; transition:all .15s ease;
}
.mode-btn .mode-icon{ font-size:20px; line-height:1; }
.mode-btn.active{
  border-color:var(--gold); color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.mode-btn:disabled{ opacity:0.4; cursor:default; }

/* ---------- Fas 2: AI difficulty selector (draft screen) ---------- */
.difficulty-toggle{ display:flex; gap:8px; margin-bottom:8px; }
.difficulty-btn{
  flex:1; padding:9px 8px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-family:'Cinzel',serif;
  font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
  cursor:pointer; transition:all .15s ease;
}
.difficulty-btn.active{
  border-color:var(--gold); color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.difficulty-desc{ font-size:12px; color:var(--text-dim); line-height:1.4; }

/* ---------- Fas 4: match record panel (Random Draft/Choose Your Five) ---------- */
.match-stats-row{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:6px; }
.match-stats-row:last-child{ margin-bottom:0; }
.match-stat{ font-size:12px; color:var(--text-dim); }
.match-stat b{ color:var(--gold-bright); }

/* Fas 7 (design review #2, "meta layer" tier) -- see ACHIEVEMENTS. */
.achievement-list{ display:flex; flex-wrap:wrap; gap:8px; }
.achievement-badge{
  font-size:11px; color:var(--gold-bright);
  padding:4px 10px; border-radius:999px; border:1px solid rgba(201,162,39,0.4); background:rgba(201,162,39,0.08);
  cursor:default;
}

.draw-pile-wrap{ display:flex; justify-content:center; padding:10px 0 6px; }
.card-back{
  width:220px; cursor:pointer; transition:transform .15s ease;
}
/* Idle "alive" animation (user feedback: "kortet man trycker på för
   random draft kan vi få det mer levande") -- previously completely
   static until the moment you actually tapped it (only .drawing's
   one-shot pulse below). A gentle float (translateY bob) so the card
   itself feels like it's hovering rather than pinned flat, combined
   with the breathing border-glow below and the shimmer sweep on
   .card-back-face::before. Paused while .disabled (no champions to
   draw) or .drawing (mid-tap) so it doesn't visually compete with
   drawPulse's own one-shot burst. */
.card-back:not(.disabled):not(.drawing){ animation: cardBackFloat 3.4s ease-in-out infinite; }
@keyframes cardBackFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}
.card-back:active{ transform:scale(0.97); }
.card-back.disabled{ cursor:default; opacity:0.5; }
.card-back-face{
  position:absolute; inset:0; border-radius:inherit; overflow:hidden;
  background-size:cover; background-position:center;
  border:2px solid var(--gold);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding:14px;
}
/* Breathing gold glow -- same visual language as .card.special-ready's
   specialReadyPulse, just in gold. Rewritten after a mobile lag report:
   the original version directly animated box-shadow's blur/spread
   values (a hefty repaint every frame, on top of drop-shadow filters
   elsewhere on the same screen) plus a filter:brightness on the whole
   face. This version keeps the box-shadow VALUE completely static on a
   ::after layer and only animates its opacity -- opacity is compositor-
   only, so the browser blends an already-painted layer instead of
   recomputing the shadow's blur each frame. Same breathing look, far
   cheaper to run. */
.card-back-face::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 2px rgba(240,216,121,0.6), 0 0 30px rgba(240,216,121,0.55), 0 0 50px rgba(201,162,39,0.25);
  opacity:0;
}
.card-back:not(.disabled):not(.drawing) .card-back-face::after{
  animation: cardBackGlow 2.8s ease-in-out infinite;
}
@keyframes cardBackGlow{
  0%,100%{ opacity:0; }
  50%{ opacity:1; }
}
/* Diagonal shimmer sweep across the artwork -- a classic "magic card
   glint", reads as light catching the card's own gilding rather than a
   flat printed image. A wide, softly-edged band translated across the
   full width+height on a loop; ::before rather than a real element
   since it needs no content, just a moving gradient layer on top of the
   background-image already set inline on this same element. */
.card-back:not(.disabled):not(.drawing) .card-back-face::before{
  content:''; position:absolute; inset:-40% -60%; pointer-events:none;
  background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.22) 50%, transparent 58%);
  animation: cardBackShimmer 3.6s ease-in-out infinite;
}
@keyframes cardBackShimmer{
  0%{ transform:translateX(-60%); }
  45%,100%{ transform:translateX(60%); }
}
.card-back-hint{
  font-size:10px; color:var(--gold-bright); text-transform:uppercase; letter-spacing:0.1em;
  background:rgba(6,5,12,0.72); border:1px solid var(--gold); border-radius:6px;
  padding:4px 10px; text-shadow:0 1px 3px rgba(0,0,0,0.9);
  position:relative; z-index:1;
}
.card-back.drawing .card-back-face{ animation: drawPulse 0.6s ease; }
@keyframes drawPulse{
  0%{ box-shadow:0 0 0 0 rgba(201,162,39,0.8); }
  100%{ box-shadow:0 0 0 40px rgba(201,162,39,0); }
}

/* ---------- draft screen ---------- */
.section-label{
  font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--gold); margin:0 0 10px 2px;
}
.draft-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
  gap:10px; margin-bottom:16px;
}
.card{
  position:relative; border-radius:10px; overflow:hidden; cursor:pointer;
  aspect-ratio:5/7; background:linear-gradient(160deg,#1c1832,#0d0b18);
  border:1.5px solid var(--line); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.card:active{ transform:scale(0.97); }
.card.selectable:hover{ border-color:var(--gold); }
/* Game-feel phase 2: a stronger, more alive "this card is armed and ready
   to place" state. Deliberately scale-only, no translateY -- at mobile
   widths the hand row becomes .side-hand.hand-row with overflow-x:auto
   (which per the CSS overflow spec also makes overflow-y compute to auto,
   not visible, since only one axis may stay visible), and its padding
   there is just 1-2px, so a vertical lift would get clipped at the top
   edge. A center-anchored scale has no such risk -- transform doesn't
   affect layout/the box's overflow, only compositing. */
.card.selected{
  border-color:var(--gold-bright);
  transform:scale(1.06);
}
/* Performance fix (Fas 1 design review): this used to animate box-shadow's
   blur/spread VALUES directly, every frame, for as long as any hand card is
   selected -- i.e. during ordinary, frequent gameplay (every turn spent
   deciding where to place), not a rare event. Same fix pattern already used
   for .card-back-face::after/cardBackGlow: the shadow value is now static,
   carried by a dedicated ::after layer, and only its opacity animates
   (compositor-only, no per-frame shadow recompute). */
.card.selected::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 2px rgba(240,216,121,0.5), 0 0 24px rgba(240,216,121,0.55);
  opacity:0;
  animation:selectedGlow 1.3s ease-in-out infinite;
}
@keyframes selectedGlow{
  0%,100%{ opacity:0.55; }
  50%{ opacity:1; }
}
.card.disabled{ opacity:0.35; cursor:default; }
.card.inplay{ opacity:0.3; cursor:default; }
/* Fas 4: cosmetic-only ring for a champion unlocked through the campaign
   story (see cardFace's unlockedClass) — static value, no animation, so it
   layers cleanly under .selected's own pulsing ::after glow when a card is
   both unlocked and currently selected. */
.card.champion-unlocked{
  box-shadow:0 0 0 2px rgba(240,216,121,0.55), 0 0 10px rgba(240,216,121,0.35);
}

.card-glow{ position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.card-glow::before{ content:''; position:absolute; inset:0; background:inherit; opacity:0.55; }
.foe-icon{
  position:relative; z-index:1;
  font-size:clamp(28px, 46cqw, 64px); line-height:1;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.8));
}
.card-art{ position:absolute; inset:0; background-size:cover; background-position:center 15%; }
.card-art::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(6,5,12,0.75) 0%, rgba(6,5,12,0.05) 30%, rgba(6,5,12,0.05) 55%, rgba(6,5,12,0.85) 100%);
}
.card-inner{ position:absolute; inset:0; display:flex; flex-direction:column; }
.card-top{ flex:1; display:flex; align-items:flex-start; padding:clamp(24px,32cqw,38px) 7px 3px; }
.card-name{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(9px,13cqw,12px); line-height:1.2; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7); }
.card-role{ font-size:clamp(7px,9cqw,8.5px); color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,0.9); }
.hand-row.enemy .card-role{ display:none; }
/* In-play board cells are the smallest, most-often-seen card size, and the
   newer signature cards' longer roles ("Legendary Card — The Last Dragon
   Hunter") wrap to 2-3 lines there — past the card-art gradient's darkened
   zone (sized for name+role at the OLD, shorter role lengths) and straight
   onto bare character art, badly hurting legibility of both. Same "drop
   the least essential info first" call as .hand-row.enemy above: the full
   role is always one tap away via the info button, so it isn't needed
   here at all. */
.board .card-role{ display:none; }

.card{ container-type: inline-size; }

.level-stars{
  position:absolute; top:5px; left:6px; z-index:4;
  display:flex; gap:1px;
  font-size:clamp(6px, 7.5cqw, 9px); color:var(--gold-bright);
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}

.element-badge{
  position:absolute; bottom:4px; left:4px; z-index:6;
  width:clamp(14px,18cqw,20px); height:clamp(14px,18cqw,20px);
  border-radius:50%; background:rgba(4,3,9,0.75); border:1px solid rgba(255,255,255,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,11cqw,12px); line-height:1;
}

/* Medusa's Stone Gaze: a persistent badge (unlike the transient skill-pop
   flashes) for as long as entry.petrifiedUntilTurnCount hasn't expired —
   mirrors .element-badge's shape but sits bottom-right so the two never
   collide on a card that's both elemental and Petrified. */
.petrified-badge{
  position:absolute; bottom:4px; right:4px; z-index:6;
  width:clamp(14px,18cqw,20px); height:clamp(14px,18cqw,20px);
  border-radius:50%; background:rgba(4,3,9,0.75); border:1px solid #a568f2;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,11cqw,12px); line-height:1;
  box-shadow:0 0 6px rgba(165,104,242,0.5);
}

.info-btn{
  position:absolute; top:4px; right:4px; z-index:6;
  width:clamp(18px,22cqw,24px); height:clamp(18px,22cqw,24px);
  border-radius:50%; background:rgba(4,3,9,0.78); border:1px solid rgba(255,255,255,0.4);
  color:#fff; font-family:'Cinzel',serif; font-weight:700; font-style:italic;
  font-size:clamp(9px,12cqw,12px); display:flex; align-items:center; justify-content:center;
  cursor:pointer; line-height:1; padding:0; touch-action:manipulation;
}
.info-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

/* Special badge: shown on every card that has an unused ultimate, using the
   Triad Arena crest artwork. Pulses gently (dim, desaturated) while locked
   (can't afford it yet) and pulses hard through blue/violet/gold once it's
   affordable — the stronger, colorful pulse is the "go" signal. Purely a
   visual indicator (no click handler) — the whole card is the tap target
   once ready, handled by the .cell click logic. */
.special-diamond{
  position:absolute; bottom:4px; right:4px; z-index:6;
  width:clamp(18px,22cqw,26px); height:clamp(18px,22cqw,26px);
  background-image:url('special-badge.png');
  background-size:contain; background-repeat:no-repeat; background-position:center;
  pointer-events:none;
}
/* Fas 6 (design review #2): a Petrified card with an unused Special used to
   render both badges in the exact same bottom-right slot, one hiding the
   other -- .petrified-badge's own comment above claims a collision-free
   corner but only accounts for .element-badge (bottom-left), not this one.
   Stacks the diamond above the petrified badge instead of a 5th corner
   (both already occupied ones are taken by level-stars/info-btn/
   element-badge). Relies on petrified-badge being emitted first in
   cardFace() so the sibling selector matches. */
.petrified-badge ~ .special-diamond{ bottom:27px; }
/* Performance fix (Fas 1 design review): both states used to animate
   `filter` (saturate/brightness/drop-shadow) directly every frame, and this
   badge sits on EVERY on-board card with an unused special at once -- for
   most of an ordinary match, not a rare event, so several of these could be
   recomputing filters in parallel. filter is now a single static value per
   state (no interpolation needed -- the "pulse" comes entirely from
   transform:scale + opacity, both compositor-only). */
.special-diamond.locked{
  filter:saturate(0.5) brightness(0.9) drop-shadow(0 0 3px rgba(139,110,242,0.4));
  animation:badgePulseLocked 3.2s ease-in-out infinite;
}
.special-diamond.ready{
  filter:saturate(1.1) brightness(1.1) drop-shadow(0 0 6px rgba(139,110,242,0.85));
  animation:badgePulseReady 1.4s ease-in-out infinite;
}
@keyframes badgePulseLocked{
  0%, 100%{ opacity:0.55; transform:scale(0.9); }
  50%{ opacity:0.85; transform:scale(1); }
}
@keyframes badgePulseReady{
  0%, 100%{ opacity:0.85; transform:scale(0.95); }
  50%{ opacity:1; transform:scale(1.18); }
}
.card.special-active{
  border-color:var(--arcane) !important;
  box-shadow:0 0 0 2px rgba(139,110,242,0.35), 0 0 18px rgba(139,110,242,0.55) !important;
}
/* Game feel phase 4: the Ultimate windup glow (see playUltimateSequence) —
   distinct from special-active above (targeting phase only, already over
   by the time this fires) and more dramatic since this IS the "something
   big is happening" beat. Clipped tight to the cell edge by .cell's own
   overflow:hidden, same as captureRingBlue/Red's expanding rings already
   are — reads as a bright pulsing rim rather than a full outside bloom,
   consistent with every other in-cell effect in this file. */
.card.ultimate-casting{
  animation: ultimateCastGlow 0.5s ease-in-out infinite;
  z-index:6;
}
@keyframes ultimateCastGlow{
  0%,100%{
    box-shadow:0 0 0 2px rgba(139,110,242,0.6), 0 0 22px rgba(139,110,242,0.7), 0 0 40px rgba(240,216,121,0.35);
    filter:brightness(1.1) saturate(1.15);
  }
  50%{
    box-shadow:0 0 0 3px rgba(196,72,220,0.85), 0 0 34px rgba(139,110,242,0.9), 0 0 60px rgba(240,216,121,0.55);
    filter:brightness(1.3) saturate(1.3);
  }
}
/* One-off test of a card/element-specific Ultimate identity (see the
   user's Void Dominion VFX request): same z-index/slot as
   .card.ultimate-casting above, but a darker void-purple pulse instead of
   the generic violet one. Both classes are present together (this is added
   alongside ultimate-casting, never instead of it — see cardFace), and
   since they share the same `animation` shorthand property, this later
   rule simply wins the cascade and replaces the generic glow for Nyxara's
   card specifically while she's casting Void Dominion — no !important,
   no JS branching beyond the class list itself. */
.card.void-dominion-casting{
  animation: voidDominionCardAura 0.5s ease-in-out infinite;
  z-index:6;
}
@keyframes voidDominionCardAura{
  0%,100%{
    box-shadow:0 0 0 2px rgba(139,60,206,0.75), 0 0 24px rgba(139,60,206,0.6), inset 0 0 22px rgba(60,10,90,0.55);
    filter:brightness(0.92) saturate(1.25);
  }
  50%{
    box-shadow:0 0 0 3px rgba(196,110,240,0.95), 0 0 42px rgba(139,60,206,0.8), inset 0 0 32px rgba(60,10,90,0.75);
    filter:brightness(1.05) saturate(1.4);
  }
}
/* Same one-off-identity-VFX pattern as void-dominion-casting above, this
   time for Ifrit's Hellfire (see the user's Hellfire VFX request) — lava
   orange/red instead of void purple, and a ONE-SHOT ramp (not `infinite`)
   since "en kort kraftig vibration/rumble byggs upp" reads as an
   intensifying build rather than a steady pulse: it runs once across the
   whole 0.95s windup (ULTIMATE_WINDUP_MS), climbing from a low ember glow
   to a full blaze right as impact hits, `forwards` so it holds that peak
   for the single frame before the impact-phase render replaces it. */
.card.hellfire-casting{
  animation: hellfireCardAura 0.95s ease-in forwards;
  z-index:6;
}
@keyframes hellfireCardAura{
  0%{
    box-shadow:0 0 0 2px rgba(224,80,30,0.5), 0 0 14px rgba(224,80,30,0.45), inset 0 0 12px rgba(120,20,10,0.4);
    filter:brightness(0.98) saturate(1.1);
  }
  60%{
    box-shadow:0 0 0 2px rgba(240,110,20,0.75), 0 0 30px rgba(240,110,20,0.65), inset 0 0 22px rgba(160,30,10,0.55);
    filter:brightness(1.1) saturate(1.3);
  }
  100%{
    box-shadow:0 0 0 3px rgba(255,180,40,0.95), 0 0 50px rgba(255,120,20,0.85), inset 0 0 34px rgba(180,40,10,0.7);
    filter:brightness(1.25) saturate(1.5);
  }
}
/* Same one-off-identity-VFX pattern as void-dominion-casting/hellfire-
   casting above, this time for Vaelira's Infernal Pact (see the user's
   Infernal Pact VFX request) — crimson/black instead of void purple or
   lava orange, and a steady `infinite` pulse (not a one-shot ramp like
   Hellfire's) since the brief just asks for the card to "pulsera" evenly.
   The rotating ::before ring is the "mörkt magiskt sigill/cirkel öppnas
   runt hennes kort" — stays INSET within the card (same clipping .card's
   own overflow:hidden already imposes on every other in-card effect, e.g.
   ultimateCastGlow/captureRingBlue/Red), sized to 78% of the card so it
   reads as a circle opening around her portrait rather than an outside
   bloom, which this architecture doesn't support without loosening a
   shared clip every other effect in the file relies on. */
.card.infernal-pact-casting{
  animation: infernalPactCardAura 0.6s ease-in-out infinite;
  z-index:6;
}
@keyframes infernalPactCardAura{
  0%,100%{
    box-shadow:0 0 0 2px rgba(139,20,30,0.65), 0 0 20px rgba(139,20,30,0.55), inset 0 0 20px rgba(20,5,10,0.6);
    filter:brightness(0.95) saturate(1.2);
  }
  50%{
    box-shadow:0 0 0 3px rgba(224,40,50,0.9), 0 0 38px rgba(180,20,30,0.75), inset 0 0 32px rgba(10,3,6,0.8);
    filter:brightness(1.1) saturate(1.4);
  }
}
.card.infernal-pact-casting::before{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:78%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) rotate(0deg);
  border-radius:50%;
  border:2px dashed rgba(196,40,60,0.75);
  box-shadow:0 0 16px rgba(139,10,25,0.5) inset;
  animation: infernalPactSigilSpin 3s linear infinite;
}
@keyframes infernalPactSigilSpin{
  0%{ transform:translate(-50%,-50%) rotate(0deg); opacity:0.6; }
  50%{ opacity:0.9; }
  100%{ transform:translate(-50%,-50%) rotate(360deg); opacity:0.6; }
}
/* Same one-off-identity-VFX pattern as the others above, this time for
   Seraphine's Silver Judgment (see the user's Silver Judgment VFX
   request) — warm gold/white instead of crimson/void/lava, and a
   ONE-SHOT smooth build (not a pulse or an escalating rumble like
   Hellfire's) since the brief explicitly asks for "helig, vacker,
   kraftfull och elegant, inte explosiv" — a steady reveal reads calmer
   than an oscillating or jittery buildup. Two rings instead of one (a
   larger outer ring fading in via opacity/scale, plus an inner rotating
   dashed sigil) for "ett stort cirkulärt heligt ljus/sigill" — still
   INSET within the card (.card's own overflow:hidden), same constraint
   as every other in-card ring effect in this file. */
.card.silver-judgment-casting{
  animation: silverJudgmentCardAura 0.95s ease-out forwards;
  z-index:6;
}
@keyframes silverJudgmentCardAura{
  0%{
    box-shadow:0 0 0 2px rgba(224,192,96,0.5), 0 0 14px rgba(224,192,96,0.4), inset 0 0 10px rgba(255,250,230,0.3);
    filter:brightness(1) saturate(1.05);
  }
  100%{
    box-shadow:0 0 0 3px rgba(255,236,170,0.95), 0 0 46px rgba(255,220,140,0.85), inset 0 0 30px rgba(255,255,240,0.6);
    filter:brightness(1.2) saturate(1.15);
  }
}
.card.silver-judgment-casting::before{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:92%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(0.5); border-radius:50%;
  border:1.5px solid rgba(255,236,170,0.55);
  box-shadow:0 0 22px rgba(255,220,140,0.4) inset;
  opacity:0;
  animation: silverJudgmentOuterRing 0.95s ease-out forwards;
}
@keyframes silverJudgmentOuterRing{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0.5); }
  100%{ opacity:0.85; transform:translate(-50%,-50%) scale(1); }
}
.card.silver-judgment-casting::after{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:60%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) rotate(0deg); border-radius:50%;
  border:2px dashed rgba(255,246,210,0.85);
  box-shadow:0 0 14px rgba(255,220,140,0.5) inset;
  animation: silverJudgmentSigilSpin 4s linear infinite;
}
@keyframes silverJudgmentSigilSpin{
  0%{ transform:translate(-50%,-50%) rotate(0deg); opacity:0.55; }
  50%{ opacity:0.85; }
  100%{ transform:translate(-50%,-50%) rotate(-360deg); opacity:0.55; }
}
/* Same one-off-identity-VFX pattern as the others above, this time for
   Omega Weapon's Omega Protocol (see the user's Omega Protocol VFX
   request) — orange/white "mechanical energy" instead of the others'
   organic/elemental themes. Unlike every other card's rings (which stay
   fixed size or grow), these two CONTRACT inward (scale down, staggered)
   to read as "mekaniska energiringar och partiklar dras in mot kärnan"
   rather than an opening portal — the visual language this card's brief
   explicitly asked for is inward collapse, not outward bloom. */
.card.omega-protocol-casting{
  animation: omegaProtocolCardAura 0.95s ease-in forwards;
  z-index:6;
}
@keyframes omegaProtocolCardAura{
  0%{
    box-shadow:0 0 0 2px rgba(255,140,40,0.5), 0 0 14px rgba(255,140,40,0.4), inset 0 0 10px rgba(255,255,255,0.25);
    filter:brightness(0.98) saturate(1.05);
  }
  100%{
    box-shadow:0 0 0 3px rgba(255,255,255,0.95), 0 0 55px rgba(255,150,40,0.9), inset 0 0 34px rgba(255,220,180,0.7);
    filter:brightness(1.3) saturate(1.2);
  }
}
.card.omega-protocol-casting::before{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:95%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(1.3); border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.6);
  opacity:0;
  animation: omegaProtocolRingContract 0.95s ease-in forwards;
}
@keyframes omegaProtocolRingContract{
  0%{ opacity:0.7; transform:translate(-50%,-50%) scale(1.3); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(0.55); }
}
.card.omega-protocol-casting::after{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:70%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(1.15) rotate(0deg); border-radius:50%;
  border:2px dashed rgba(255,180,90,0.85);
  opacity:0;
  animation: omegaProtocolRingContract2 0.95s ease-in 0.15s forwards;
}
@keyframes omegaProtocolRingContract2{
  0%{ opacity:0.75; transform:translate(-50%,-50%) scale(1.15) rotate(0deg); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(180deg); }
}
/* Same one-off-identity-VFX pattern as the others above, this time for
   Shiva's Diamond Storm (see the user's Diamond Storm VFX request) —
   icy white/blue/silver instead of any previous card's palette. The
   brief's "kristallfragment som snurrar runt kortet, allt snabbare" (crystal
   fragments spinning around the card, faster and faster) is a genuinely
   new shape: every other card's rotating ring spins at a CONSTANT rate
   (see infernalPactSigilSpin/silverJudgmentSigilSpin above, plain
   `linear` timing) — this one's keyframe stops are deliberately spaced
   UNEVENLY (60deg in the first 40% of the cast, then 620deg total by
   100%) so the same 0.95s window reads as a storm visibly accelerating,
   without needing JS-driven animation-duration changes mid-flight. Two
   rings turning opposite directions (::before/::after) for "storm"
   density rather than a single sigil. */
.card.diamond-storm-casting{
  animation: diamondStormCardAura 0.95s ease-in forwards;
  z-index:6;
}
@keyframes diamondStormCardAura{
  0%{
    box-shadow:0 0 0 2px rgba(126,200,242,0.5), 0 0 14px rgba(126,200,242,0.4), inset 0 0 10px rgba(220,245,255,0.3);
    filter:brightness(1) saturate(1.05);
  }
  100%{
    box-shadow:0 0 0 3px rgba(230,250,255,0.95), 0 0 50px rgba(140,210,255,0.85), inset 0 0 32px rgba(255,255,255,0.65);
    filter:brightness(1.25) saturate(1.1);
  }
}
.card.diamond-storm-casting::before{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:88%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) rotate(0deg); border-radius:50%;
  border:2px dashed rgba(220,245,255,0.8);
  box-shadow:0 0 18px rgba(140,210,255,0.5) inset;
  animation: diamondStormSpinAccelerate 0.95s ease-in forwards;
}
@keyframes diamondStormSpinAccelerate{
  0%{ transform:translate(-50%,-50%) rotate(0deg); opacity:0.5; }
  40%{ transform:translate(-50%,-50%) rotate(60deg); opacity:0.75; }
  65%{ transform:translate(-50%,-50%) rotate(160deg); opacity:0.9; }
  82%{ transform:translate(-50%,-50%) rotate(320deg); opacity:1; }
  100%{ transform:translate(-50%,-50%) rotate(620deg); opacity:1; }
}
.card.diamond-storm-casting::after{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:62%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) rotate(0deg); border-radius:50%;
  border:1.5px dashed rgba(126,200,242,0.85);
  box-shadow:0 0 12px rgba(220,245,255,0.5) inset;
  animation: diamondStormSpinAccelerateRev 0.95s ease-in forwards;
}
@keyframes diamondStormSpinAccelerateRev{
  0%{ transform:translate(-50%,-50%) rotate(0deg); opacity:0.5; }
  40%{ transform:translate(-50%,-50%) rotate(-90deg); opacity:0.75; }
  65%{ transform:translate(-50%,-50%) rotate(-220deg); opacity:0.9; }
  82%{ transform:translate(-50%,-50%) rotate(-420deg); opacity:1; }
  100%{ transform:translate(-50%,-50%) rotate(-780deg); opacity:1; }
}
/* Same one-off-identity-VFX pattern as the others above, this time for
   Bahamut's Megaflare (see the user's Megaflare VFX request) — blue/
   white/gold astral light, meant to read as "gudomlig, majestätisk och
   enorm, inte som en vanlig laser". A single steady outer ring (cosmic
   energy gathering, constant slow spin like Infernal Pact's sigil, not
   an accelerating storm like Diamond Storm's) plus a bright inner core
   that swells (energy concentrating heavily in front of him before the
   beam fires) rather than a second ring, since the brief describes
   ENERGY BUILDING UP, not more orbiting shapes. */
.card.megaflare-casting{
  animation: megaflareCardAura 0.95s ease-in forwards;
  z-index:6;
}
@keyframes megaflareCardAura{
  0%{
    box-shadow:0 0 0 2px rgba(110,168,242,0.5), 0 0 14px rgba(110,168,242,0.4), inset 0 0 10px rgba(240,225,180,0.25);
    filter:brightness(1) saturate(1.05);
  }
  100%{
    box-shadow:0 0 0 3px rgba(255,250,235,0.95), 0 0 55px rgba(130,180,255,0.9), inset 0 0 34px rgba(255,235,180,0.65);
    filter:brightness(1.3) saturate(1.15);
  }
}
.card.megaflare-casting::before{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:90%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) rotate(0deg); border-radius:50%;
  border:2px dashed rgba(240,225,180,0.8);
  box-shadow:0 0 18px rgba(110,168,242,0.5) inset;
  animation: megaflareRingSpin 3.5s linear infinite;
}
@keyframes megaflareRingSpin{
  0%{ transform:translate(-50%,-50%) rotate(0deg); opacity:0.6; }
  50%{ opacity:0.9; }
  100%{ transform:translate(-50%,-50%) rotate(360deg); opacity:0.6; }
}
.card.megaflare-casting::after{
  content:''; position:absolute; z-index:1; pointer-events:none;
  left:50%; top:50%; width:20%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(0.6); border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(130,180,255,0.7) 55%, transparent 78%);
  opacity:0;
  animation: megaflareCoreSwell 0.95s ease-in forwards;
}
@keyframes megaflareCoreSwell{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  100%{ opacity:1; transform:translate(-50%,-50%) scale(1.5); }
}
/* Performance fix (Fas 1 design review): used to animate border-color,
   box-shadow VALUES and filter:brightness all together, every frame, on
   every on-board card with an unused special -- often several at once, for
   most of a normal match. border-color/filter are now static (set once,
   no interpolation); the box-shadow glow moved to a ::after layer with a
   static value, animating only opacity -- same fix pattern as
   .card.selected::after above. */
.card.special-ready{
  border-color:var(--arcane);
  filter:brightness(1.05);
}
.card.special-ready::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 2px rgba(139,110,242,0.7), 0 0 26px rgba(139,110,242,0.7), 0 0 46px rgba(240,216,121,0.3);
  opacity:0;
  animation:specialReadyPulse 2.6s ease-in-out infinite;
}
@keyframes specialReadyPulse{
  0%, 100%{ opacity:0.35; }
  50%{ opacity:1; }
}
.cell.special-target{
  cursor:pointer; border-color:rgba(196,72,46,0.65);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(196,72,46,0.6),
    0 0 8px rgba(196,72,46,0.5);
}
.cell.special-target::before{
  background:radial-gradient(circle at 50% 50%, rgba(196,72,46,0.45), transparent 65%);
  animation:cellPulseGold 1.2s ease-in-out infinite;
}

.wins-row{
  position:relative;
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:2px 0 10px; font-size:11px; color:var(--text-dim); letter-spacing:0.03em;
}
.wins-chip{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
  font-size:12px; transition:box-shadow .15s ease, transform .15s ease;
}
.wins-chip.blue{ color:var(--blue-side); border-color:rgba(63,111,209,0.5); }
.wins-chip.red{ color:var(--red-side); border-color:rgba(184,69,46,0.5); }
.wins-chip b{ color:inherit; }
/* Fas 7 (design review #2): Wins is the currency that gates every Special
   Attack -- it matters every single turn, unlike the final square count
   (.score-num, only decisive at the very end), yet it used to render
   smaller/quieter than that count. A static glow on whichever side's turn
   it actually is gives an at-a-glance "this number is live right now" cue
   without any new DOM/JS -- just reads state.turn where the chip already
   knows its own side. */
.wins-chip.active-turn{ box-shadow:0 0 0 1px currentColor, 0 0 10px currentColor; transform:scale(1.08); }

.wins-toast{
  position:absolute; top:100%; left:50%; z-index:9;
  transform:translate(-50%,4px);
  font-family:'Cinzel',serif; font-weight:700; font-size:13px;
  letter-spacing:0.04em; white-space:nowrap; padding:6px 14px; border-radius:8px;
  pointer-events:none; opacity:0;
  animation: winsToastFade 1.6s ease forwards;
}
.wins-toast.blue{
  background:rgba(8,10,18,0.92); border:1px solid var(--blue-side); color:#bcd4ff;
  box-shadow:0 0 18px rgba(63,111,209,0.5);
}
.wins-toast.red{
  background:rgba(18,8,8,0.92); border:1px solid var(--red-side); color:#ffd0c0;
  box-shadow:0 0 18px rgba(184,69,46,0.5);
}
@keyframes winsToastFade{
  0%{ opacity:0; transform:translate(-50%,-4px) scale(0.85); }
  15%{ opacity:1; transform:translate(-50%,8px) scale(1.05); }
  25%{ transform:translate(-50%,8px) scale(1); }
  75%{ opacity:1; }
  100%{ opacity:0; transform:translate(-50%,-6px) scale(0.92); }
}

.graveyard-toggle{

/* Stat numbers sit right on the edge of the card they belong to — top
   number at the top edge, right number at the right edge, etc. — instead
   of a central cluster, so you can read "which side is strong" at the
   spot that actually matters without having to parse a cramped 4-in-one
   plus-shape first. .stat-cluster is just a full-card, click-through
   positioning layer; each .stat-n is its own small badge (same visual
   language as .info-btn/.element-badge) for contrast against the art. */
.stat-cluster{ position:absolute; inset:0; z-index:4; pointer-events:none; }
.stat-n{
  position:absolute;
  width:clamp(17px, 22cqw, 27px); height:clamp(17px, 22cqw, 27px);
  border-radius:50%;
  background:rgba(4,3,9,0.82); border:1px solid rgba(255,255,255,0.4);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-weight:700; color:#fff; line-height:1;
  font-size:clamp(10px, 13.5cqw, 16px);
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}
.stat-n.n-top{ top:3px; left:50%; transform:translateX(-50%); }
.stat-n.n-bottom{ bottom:4px; left:50%; transform:translateX(-50%); }
.stat-n.n-left{ left:3px; top:50%; transform:translateY(-50%); }
.stat-n.n-right{ right:3px; top:50%; transform:translateY(-50%); }
.card.owner-blue .stat-n{ border-color:var(--blue-side); }
.card.owner-red .stat-n{ border-color:var(--red-side); }
/* Persistent counterpart to the transient .skill-pop.bonus/.bonus-negative
   flash above: once a stored captureBonus/sideBonus modifier lands on a
   card (see effectiveStatFor/statNumHtml), the affected number itself
   stays colored for as long as the modifier lasts, instead of only
   flashing for ~1.3s and then reverting to looking untouched. Same
   green/red palette as the flash popups, just as a text color + glow
   instead of a whole badge. Owner border-color above is left alone —
   that's ownership, not the buff/debuff state. */
.stat-n.buffed{ color:#c8f2a0; text-shadow:0 0 5px rgba(143,209,90,0.9), 0 1px 2px rgba(0,0,0,0.9); }
.stat-n.debuffed{ color:#ffb8a0; text-shadow:0 0 5px rgba(255,90,90,0.85), 0 1px 2px rgba(0,0,0,0.9); }

.card-badge{

.card.owner-blue .stat-cluster::before{ background:radial-gradient(circle, rgba(20,32,64,0.75) 50%, transparent 78%); }
.card.owner-red .stat-cluster::before{ background:radial-gradient(circle, rgba(64,24,16,0.75) 50%, transparent 78%); }

.card-back-mini{

  background-image:url('card-back.jpg');

.count-row{ display:flex; align-items:center; justify-content:space-between; margin:4px 2px 18px; }

/* ---------- battle screen ---------- */
.scoreboard{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:10px 16px; margin-bottom:14px;
}
.score-side{ display:flex; align-items:center; gap:6px; }
.score-flame{ width:30px; height:30px; object-fit:contain; display:block; animation:flameFlicker 2.6s ease-in-out infinite; }
.score-flame.blue{ filter:drop-shadow(0 0 6px var(--blue-side)) drop-shadow(0 0 12px rgba(63,111,209,0.5)); }
.score-flame.red{ filter:drop-shadow(0 0 6px var(--red-side)) drop-shadow(0 0 12px rgba(184,69,46,0.5)); }
.score-num{ font-family:'Cinzel',serif; font-size:20px; font-weight:700; }
.score-num.blue{ color:var(--blue-side); text-shadow:0 0 10px rgba(63,111,209,0.6); }
.score-num.red{ color:var(--red-side); text-shadow:0 0 10px rgba(184,69,46,0.6); }
.score-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }
/* Fas 7 (design review #2): used to render smaller than .score-num (the
   final square count, which only matters at the very end) even though
   whose turn it is matters every single move -- bumped weight/size and
   given a real background pill instead of bare text so it reads as the
   primary live-state readout it actually is. */
.turn-indicator{
  font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--gold-bright); text-align:center;
  padding:4px 12px; border-radius:999px; border:1px solid rgba(240,216,121,0.4);
  background:rgba(240,216,121,0.08);
}

.battle-row{ display:flex; gap:6px; align-items:flex-start; justify-content:center; }

.hand-row{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; width:64px; }
.hand-row .card{ width:100%; }
.hand-row.enemy .card{ width:100%; }
.hand-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin:0 0 8px 2px; }
.hand-label.side{ text-align:center; margin:0 0 4px; }

.hand-row.bottom{
  flex-direction:row; width:100%; flex:0 0 auto;
  gap:8px; margin-top:10px; padding:2px 2px 6px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.hand-row.bottom .card{ width:68px; flex:0 0 auto; }
.hand-row.bottom .hand-label{ display:none; }

/* Positioned with inset percentages (against .arena-frame's own box, the
   nearest positioned ancestor) rather than padding percentages (which
   would resolve against .battle-row's width instead — a flex item's
   padding always resolves against its containing block, not its own
   resolved size, so at wide layouts .battle-row is far wider than
   .arena-frame's capped max-width and the padding used to balloon far
   past what the artwork's frame actually needs, crushing the board down
   to a sliver). This is the same technique .arena-rosette already uses.
   Deliberately no `bottom` inset: the frame artwork's inner area is
   roughly square, but a 3x3 grid of 5:7 cards is much taller than wide,
   so pinning both top AND bottom would force a height shorter than the
   grid actually needs — grid's default align-content (stretch, for grid
   containers "normal" computes to stretch) would then compress the row
   tracks to fit, while each .cell still renders at its full aspect-ratio
   height regardless, making rows visually overlap. Giving .board its own
   aspect-ratio (matching a single 5:7 cell, which a 3x3 grid of them
   also has) lets height derive correctly from the definite width instead. */
.board{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  position:absolute; z-index:1;
  top:26.7%; left:17%; right:17%;
  aspect-ratio:5/7;
  align-content:start;
}
.arena-frame{
  position:relative; flex:1 1 auto; max-width:520px;
  aspect-ratio:1086/1448;
  border-radius:4px;
  background-image:url('arena-bg.jpg');
  background-size:cover;
  background-position:center;
  box-shadow:
    -20px 0 36px -16px rgba(184,69,46,0.4),
    20px 0 36px -16px rgba(63,111,209,0.4);
  --fx-speed:1;
}
/* Fast Mode (see toggleFastMode()) -- only speeds up the ROUTINE per-move
   feedback a repeat player sits through every single flip/turn (this
   variable, read by .cell .card.flipping/captureRing*/.conquest-banner
   below), not the rare Ultimate cast sequences: those are the spectacle
   payoff, not friction, so they keep their full designed length even with
   Fast Mode on. */
.arena-frame.fast-mode{ --fx-speed:0.4; }
/* Game-feel phase 3: a brief shake for a genuinely large Same/Plus/Combo
   chain (see placeCard's sameOrPlus+combo>=4 gate). transform-only (no
   layout properties touched), decaying amplitude so it reads as a settling
   impact rather than a constant wobble. .chain-shake is added/removed by
   render() based on state.chainShake, cleared ~500ms after the triggering
   placement -- see that setTimeout for why 500ms and not the later 1300ms
   cleanup. */
.arena-frame.chain-shake{ animation: chainShake 0.42s ease; }
@keyframes chainShake{
  0%{ transform:translate(0,0); }
  15%{ transform:translate(-6px,3px); }
  30%{ transform:translate(5px,-3px); }
  45%{ transform:translate(-4px,2px); }
  60%{ transform:translate(3px,-2px); }
  75%{ transform:translate(-2px,1px); }
  90%{ transform:translate(1px,0); }
  100%{ transform:translate(0,0); }
}
.arena-rosette{ position:absolute; inset:12%; z-index:0; pointer-events:none; opacity:0.85; }

/* Game-feel phase 1: ambient arena life (drifting energy motes + a slow
   rosette breathe). Purely decorative (pointer-events:none, aria-hidden) and
   additive on top of the existing arena-frame/board markup — no gameplay
   logic touched. NOTE: .arena-frame's whole subtree (including this) is
   rebuilt on every render() call (see render()'s `app.innerHTML = html`,
   there's no virtual-DOM diffing here), so these animations restart their
   cycle on every real game action. That's an already-accepted trade-off in
   this codebase (.cell::before's cellPulse below does the same) — render()
   is event-driven, not a continuous loop, so during normal "deciding what to
   play" idle time (the vast majority of a match) nothing re-renders and the
   drift plays out smoothly uninterrupted. */
.arena-rosette{ animation: rosetteBreathe 9s ease-in-out infinite; transform-origin:50% 50%; }
@keyframes rosetteBreathe{
  0%,100%{ opacity:0.7; transform:scale(1); }
  50%{ opacity:0.95; transform:scale(1.035); }
}
.arena-ambient{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; border-radius:inherit; }
.arena-mote{
  position:absolute; bottom:4%; width:3px; height:3px; border-radius:50%;
  background:currentColor; box-shadow:0 0 7px 2px currentColor;
  opacity:0; animation:moteDrift ease-in-out infinite;
}
/* Four theme colors already used by .stage's own corner glows, plus gold —
   staggered left position/duration/delay per mote so they read as organic
   independent sparks rather than one synchronized pulse. */
.arena-mote:nth-child(1){ left:10%; color:var(--ember);       animation-duration:12s; animation-delay:0s;   }
.arena-mote:nth-child(2){ left:26%; color:var(--gold-bright); animation-duration:15s; animation-delay:2s;   }
.arena-mote:nth-child(3){ left:46%; color:var(--frost);       animation-duration:13s; animation-delay:4.5s; }
.arena-mote:nth-child(4){ left:62%; color:var(--arcane);      animation-duration:16s; animation-delay:1.2s; }
.arena-mote:nth-child(5){ left:80%; color:var(--earth);       animation-duration:14s; animation-delay:3.4s; }
.arena-mote:nth-child(6){ left:92%; color:var(--gold-bright); animation-duration:17s; animation-delay:6s;   }
/* Increased from 6 to 10 (user feedback: "bakgrund mer levande... själar
   som flyger upp") -- same theme colors cycled again with fresh
   position/duration/delay combinations. */
.arena-mote:nth-child(7){ left:4%;  color:var(--gold);   animation-duration:18s; animation-delay:8s;   }
.arena-mote:nth-child(8){ left:36%; color:var(--ember);  animation-duration:19s; animation-delay:5.6s; }
.arena-mote:nth-child(9){ left:54%; color:var(--earth);  animation-duration:16s; animation-delay:9.8s; }
.arena-mote:nth-child(10){ left:70%; color:var(--arcane); animation-duration:20s; animation-delay:1.8s; }
@keyframes moteDrift{
  0%{ transform:translateY(0) scale(0.6); opacity:0; }
  15%{ opacity:0.65; }
  55%{ transform:translateY(-150px) scale(1); opacity:0.5; }
  100%{ transform:translateY(-280px) scale(0.4); opacity:0; }
}

/* "Soul stream" — a second ambient layer added ALONGSIDE the rising
   motes above (never replacing them), per the user's own reference
   images (Final Fantasy Lifestream/pyreflies art). Lives ONLY in
   .stage-ambient now, NOT .arena-ambient (see the markup near
   renderBattle() -- there is no .soul-stream there any more): a mobile
   lag report traced back to .arena-ambient being rebuilt on every single
   render() call during battle (which fires very often -- every flip,
   Ultimate phase change, cleanup timeout), so re-parsing a dozen SVG
   nodes on every one of those was real, avoidable cost during exactly
   the moments the game is already busiest. .stage-ambient sits outside
   #app and is written once into the static page shell, so it pays that
   cost exactly once regardless of how much the battle re-renders.
   Genuinely new technique for this file: inline SVG with a `viewBox`
   (not raw CSS keyframes on plain <span> dots) is the only practical way
   to get particles that travel along an actual curved guide path and
   scale cleanly with the container regardless of aspect ratio --
   `preserveAspectRatio: xMidYMid slice` keeps everything undistorted
   (crops rather than stretches/warps it) whether the wrapper is a tall
   phone screen or a wide desktop one.
   No SVG blur filter (a mobile-lag fix, alongside dropping the arena
   copy of this whole layer -- see below) -- feGaussianBlur/drop-shadow
   on a continuously animating element forces a per-frame filter
   recompute, so softness comes from thin strokes + fading gradients
   instead of blur, both here and on the wisp fragments further down. */
.soul-stream{ position:absolute; inset:0; width:100%; height:100%; z-index:0; opacity:0.85; }
/* REDESIGNED (user feedback: the earlier dashed-line-on-an-S-curve
   version "ser ut som maskar" / "looks like small worms" -- a uniform
   segmented dash following a sinuous snake-like curve). Replaced with a
   handful of short, individually tapered .soul-wisp-fragment lines (see
   the markup) drifting slowly upward, each fading to transparent at
   both ends via the shared soulFragGrad-stage gradient rather than a
   hard-edged dasharray. No two fragments share the same length/width/
   opacity/duration, so nothing reads as a uniform repeating body
   segment, and several are faint enough to "almost disappear into the
   background" per the brief. Kept in .stage-ambient only, no SVG blur
   filter -- both still off-limits per the mobile lag fix (see the
   comment above). The particles (below) are meant to be the most
   recognizable element now, with these fragments as quiet texture
   behind them. */
.soul-wisp-fragment{ stroke:url(#soulFragGrad-stage); stroke-linecap:round; }
/* A very gentle shared sway across all fragments, on top of each one's
   own independent upward drift -- enough for "gentle organic movement"
   without adding any curve/shape to the fragments themselves (which
   stay plain short straight lines). */
.soul-wisp-fragment-group{ transform-origin:50% 50%; animation:soulSwirl 22s ease-in-out infinite; }
@keyframes soulSwirl{
  0%,100%{ transform:translate(0,0) rotate(0deg); }
  50%{ transform:translate(-0.4%,0.3%) rotate(0.3deg); }
}
/* No drop-shadow filter (mobile lag report -- a per-frame filter
   recompute on a continuously-animating element adds up even for a
   handful of stars); plain fill + opacity twinkle is nearly free to
   run since opacity is compositor-only. */
.soul-star{ fill:#f2fff8; animation:soulStarTwinkle ease-in-out infinite; }
@keyframes soulStarTwinkle{ 0%,100%{ opacity:0.25; } 50%{ opacity:1; } }

/* "Conquered!" banner — a bigger, one-off flourish on top of the routine
   attack slash. state.conquestPopup holds the owner ('blue'/'red') whose
   capture triggered it, and the <img>'s src picks the matching artwork —
   conquered-badge.png for the player, conquered-badge-red.png for the AI
   (see showConquestPopup()) — since each piece is written from that
   side's own perspective, not a generic "someone won" graphic. Centered
   on .arena-frame rather than anchored to the captured cell: Same/Plus/
   Combo can flip several cells in one placement, so a single
   card-anchored popup wouldn't have one obvious home anyway. */
.conquest-banner{
  position:absolute; z-index:20; top:50%; left:50%;
  /* Shrunk from 62%/340px (user feedback: "syns för mkt och förstör" --
     it covered too much of the board and obscured the actual result). */
  width:40%; max-width:210px;
  transform:translate(-50%,-50%) scale(0.55);
  opacity:0; pointer-events:none;
  filter:drop-shadow(0 6px 22px rgba(0,0,0,0.65));
  animation: conquestPop calc(1.4s * var(--fx-speed,1)) cubic-bezier(.2,.9,.25,1) forwards;
}
@keyframes conquestPop{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0.55) rotate(-4deg); }
  14%{ opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(1deg); }
  24%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  78%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(0.92) rotate(0deg); }
}

/* Game feel phase 4: Ultimate name banner (see playUltimateSequence /
   state.ultimateBanner). Two DIFFERENT DOM elements over the sequence, not
   one continuously-animated one — render() rebuilds #app wholesale on every
   call (same restart-on-render fact documented for .arena-ambient etc.),
   so the 'cast' phase's banner and the 'impact' phase's banner are each a
   fresh element with their own animation. They're designed to LOOK
   continuous anyway: 'cast' ends held at full visibility (animation-fill-
   mode via `both`), and 'impact' STARTS at that exact same visible state
   (its own 0% keyframe) before popping and fading — the handoff between
   the two renders lands on matching frames, so the seam doesn't show. */
.ultimate-banner{
  position:absolute; z-index:25; top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center; pointer-events:none; white-space:nowrap;
  padding:14px 28px; border-radius:10px;
  background:linear-gradient(180deg, rgba(10,8,18,0.92), rgba(10,8,18,0.78));
  border:1px solid rgba(240,216,121,0.5);
  box-shadow:0 0 30px rgba(139,110,242,0.4), 0 8px 24px rgba(0,0,0,0.6);
}
.ultimate-banner.owner-blue{ border-color:rgba(63,111,209,0.65); box-shadow:0 0 30px rgba(63,111,209,0.45), 0 8px 24px rgba(0,0,0,0.6); }
.ultimate-banner.owner-red{ border-color:rgba(184,69,46,0.65); box-shadow:0 0 30px rgba(184,69,46,0.45), 0 8px 24px rgba(0,0,0,0.6); }
.ultimate-banner-label{
  font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--text-dim); margin-bottom:2px;
}
.ultimate-banner-name{
  font-family:'Cinzel',serif; font-weight:900; font-size:22px;
  color:var(--gold-bright);
  text-shadow:0 0 16px rgba(240,216,121,0.7), 0 2px 6px rgba(0,0,0,0.8);
}
.ultimate-banner-cast{ animation: ultimateBannerIn 0.4s cubic-bezier(.2,.9,.25,1) both; }
@keyframes ultimateBannerIn{

/* Nyxara's Void Dominion — a one-off test of a card/element-specific
   Ultimate VFX identity (on top of the generic banner/casting-glow every
   Ultimate already gets), gated purely by state.ultimateBanner.name in
   renderBattle() so it rides the EXACT SAME cast/impact/cleanup timing as
   every other Ultimate (see playUltimateSequence) -- no new timers, no
   gameplay state, purely presentational. Two pieces:
   .void-dominion-dark: a subtle whole-frame darken, positioned BEHIND
   .board (z-index:0, board itself is z-index:1) so it never dims the
   cards' own art/text -- only the frame around/between them.
   .void-dominion-fx: positioned to match .board's own box exactly (same
   top/left/right/aspect-ratio) so its --void-x/--void-y percentages (set
   inline from Nyxara's cell index) land precisely on her cell; sits ABOVE
   the board (z-index:8) since the crack/particles are meant to visibly

.void-dominion-dark{

.void-dominion-dark.phase-cast{ animation: voidDarkIn 0.95s ease forwards; }
.void-dominion-dark.phase-impact{ animation: voidDarkOut 1.1s ease forwards; }
@keyframes voidDarkIn{ 0%{ opacity:0; } 100%{ opacity:1; } }
@keyframes voidDarkOut{ 0%{ opacity:1; } 55%{ opacity:0.88; } 100%{ opacity:0; } }

.void-dominion-fx{
  position:absolute; z-index:8; pointer-events:none;
  top:26.7%; left:17%; right:17%; aspect-ratio:5/7;
}
/* The "reality crack" -- a ring that bursts outward from Nyxara's cell

   board's own edges so it genuinely reads as "spreads over the whole

.void-crack{

@keyframes voidCrackExpand{

  100%{ opacity:0; transform:scale(13); }

/* 8 particles pulled inward toward Nyxara's cell during the cast/windup

.void-particle-0{ --px:-70px; --py:-30px; animation-delay:0s;   }
.void-particle-1{ --px:60px;  --py:-45px; animation-delay:.04s; }
.void-particle-2{ --px:80px;  --py:20px;  animation-delay:.08s; }
.void-particle-3{ --px:40px;  --py:60px;  animation-delay:.12s; }
.void-particle-4{ --px:-50px; --py:55px;  animation-delay:.02s; }
.void-particle-5{ --px:-80px; --py:10px;  animation-delay:.06s; }

.void-particle-7{ --px:10px;  --py:70px;  animation-delay:.14s; }

/* Ifrit's Hellfire — a second one-off identity VFX (see the user's

   above: gated purely by state.ultimateBanner.name in renderBattle(),

  40%{ transform:translate(2px,-1px); }
  50%{ transform:translate(-2px,1px); }
  60%{ transform:translate(3px,-2px); }

.hellfire-fx{

/* The target-hit flash lands a beat AFTER the blast starts expanding

  35%{ opacity:1; transform:scale(1.6); }

/* Seraphine's Silver Judgment — a fourth one-off identity VFX (see the
   user's Silver Judgment VFX request), gold/white. Same .board-matching
   wrapper as the others, but the "flera smala gyllene ljusstrålar skjuter

   would visually point the wrong way). Rotation is a STATIC inline style
   on the outer element; the inner .silver-judgment-beam-inner handles the
   "shoot out" scaleX animation, because one element can't have both an

.silver-judgment-fx{

.silver-judgment-fx.phase-impact .silver-judgment-beam-inner{ animation: silverJudgmentBeamShoot 0.35s ease-out both; }

  100%{ opacity:0; left:100%; }

  100%{ opacity:0; transform:scale(2); }

.silver-judgment-wave{

  100%{ opacity:0; transform:scale(13); }

/* The "flash" half of "kort screen shake/flash vid den slutliga impacten,
   men betydligt mjukare än Ifrit" -- Seraphine gets no pre-impact rumble
   (unlike Hellfire) and this is a soft full-frame wash, not a hard pulse,

.silver-judgment-flash{

  100%{ opacity:0; }
