<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Triad Arena — Aetherion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --void:        #0a0812;
  --void-2:      #12101f;
  --panel:       #17142a;
  --line:        #2c2645;
  --gold:        #c9a227;
  --gold-bright: #f0d879;
  --ember:       #d9622b;
  --frost:       #5ec8f2;
  --arcane:      #8b6ef2;
  --text:        #ece7f7;
  --text-dim:    #9c93b8;
  --blue-side:   #3f6fd1;
  --red-side:    #b8452e;
  --earth:       #6fae4a;
  --stone:       #211d24;
  --stone-2:     #2b2530;
  --silver:      #b9b5c2;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  background:#050409;
  color:var(--text);
  font-family:'Spectral', serif;
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex; align-items:flex-start; justify-content:center;
  min-height:100vh; min-height:100dvh;
}
.stage{
  position:relative;
  width:100%;
  max-width:640px;
  min-height:100vh; min-height:100dvh;
  margin:0 auto;
  background:
    radial-gradient(ellipse 480px 420px at 0% 0%, rgba(217,98,43,0.16), transparent 60%),
    radial-gradient(ellipse 480px 420px at 100% 0%, rgba(139,110,242,0.14), transparent 60%),
    radial-gradient(ellipse 480px 420px at 0% 100%, rgba(111,174,74,0.14), transparent 60%),
    radial-gradient(ellipse 480px 420px at 100% 100%, rgba(94,200,242,0.16), transparent 60%),
    var(--void);
  border-radius:16px;
  box-shadow:0 24px 70px rgba(0,0,0,0.75), 0 0 0 1px var(--line);
}
.wrap{ padding:16px 14px 24px; }

h1,h2,.display{ font-family:'Cinzel', serif; letter-spacing:0.04em; }

.masthead{ text-align:center; margin:6px 0 20px; position:relative; }
.masthead.compact{ margin:2px 0 14px; }
.masthead.compact .rune{ width:26px; height:26px; margin:0 auto 5px; font-size:12px; }
.masthead.compact h1{ font-size:22px; }
.masthead.compact .sub{ font-size:10px; }
.corner-flame{
  position:absolute; top:-6px; width:46px; height:46px; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.corner-flame.left{ left:-10px; }
.corner-flame.right{ right:-10px; }
.corner-flame .flame-icon{
  font-size:38px; line-height:1; display:block;
  animation:flameFlicker 2.6s ease-in-out infinite;
}
.corner-flame.left .flame-icon{
  filter:saturate(1.3) drop-shadow(0 0 12px var(--red-side)) drop-shadow(0 0 22px rgba(184,69,46,0.55));
}
.corner-flame.right .flame-icon{
  filter:hue-rotate(190deg) saturate(1.5) drop-shadow(0 0 12px var(--blue-side)) drop-shadow(0 0 22px rgba(63,111,209,0.55));
}
.masthead.compact .corner-flame{ width:30px; height:30px; top:-3px; }
.masthead.compact .corner-flame.left{ left:-4px; }
.masthead.compact .corner-flame.right{ right:-4px; }
.masthead.compact .corner-flame .flame-icon{ font-size:24px; }
@keyframes flameFlicker{
  0%,100%{ transform:scale(1) rotate(-1deg); opacity:0.92; }
  35%{ transform:scale(1.08) rotate(1deg); opacity:1; }
  60%{ transform:scale(0.97) rotate(-2deg); opacity:0.88; }
}
.sound-toggle{
  position:absolute; top:0; right:0; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .sound-toggle{ width:24px; height:24px; font-size:11px; }
.sound-toggle.on{ color:var(--gold); border-color:var(--gold); }

.fullscreen-toggle{
  position:absolute; top:0; right:40px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer;
}
.masthead.compact .fullscreen-toggle{ width:24px; height:24px; font-size:10px; right:28px; }
.fullscreen-toggle.on{ color:var(--gold); border-color:var(--gold); }

.music-toggle{
  position:absolute; top:0; left:0; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
}
.masthead.compact .music-toggle{ width:24px; height:24px; font-size:11px; }
.music-toggle.on{ color:var(--gold); border-color:var(--gold); }
.masthead .rune{
  width:34px; height:34px; margin:0 auto 8px;
  border:1px solid var(--gold); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold); font-size:15px; opacity:0.85;
  box-shadow:0 0 14px rgba(201,162,39,0.35);
}
.masthead h1{
  font-size:26px; font-weight:900; margin:0;
  background:linear-gradient(180deg,#f7ecc8, var(--gold) 60%, #8a6d1a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(201,162,39,0.25);
}
.masthead .sub{ font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-dim); margin-top:6px; }
.tester-badge{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:12px; padding:5px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel);
  color:var(--text-dim); font-size:11px; letter-spacing:0.03em;
}
.tester-badge .tester-icon{ font-size:12px; }
.tester-badge b{ color:var(--gold-bright); font-weight:700; }

/* ---------- rules ---------- */
.rules{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:20px; font-size:14px; line-height:1.55; color:var(--text-dim);
}
.rules b{ color:var(--text); }

.rules-toggle-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:12px 16px 14px; margin-bottom:20px;
}
.rules-toggle-panel .section-label{ margin-bottom:10px; }
.rule-toggle{
  display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; cursor:pointer;
  font-size:13px; line-height:1.5; color:var(--text-dim);
}
.rule-toggle:last-child{ margin-bottom:0; }
.rule-toggle input{ margin-top:3px; flex:0 0 auto; accent-color: var(--gold); width:16px; height:16px; cursor:pointer; }
.rule-toggle b{ color:var(--text); }
.rule-toggle.rule-disabled{ opacity:0.45; }
.rule-toggle.rule-disabled input{ cursor:not-allowed; }

.mode-toggle{ display:flex; gap:8px; margin-bottom:20px; }
.mode-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:12px 8px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-family:'Spectral',serif;
  font-size:12px; font-weight:600; cursor:pointer; transition:all .15s ease;
}
.mode-btn .mode-icon{ font-size:20px; line-height:1; }
.mode-btn.active{
  border-color:var(--gold); color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
  box-shadow:0 0 14px rgba(201,162,39,0.25);
}
.mode-btn:disabled{ opacity:0.4; cursor:default; }

.draw-pile-wrap{ display:flex; justify-content:center; padding:10px 0 6px; }
.card-back{
  width:220px; cursor:pointer; transition:transform .15s ease;
}
.card-back:active{ transform:scale(0.97); }
.card-back.disabled{ cursor:default; opacity:0.5; }
.card-back-face{
  position:absolute; inset:0; border-radius:inherit; overflow:hidden;
  background-size:cover; background-position:center;
  border:2px solid var(--gold);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding:14px;
}
.card-back-hint{
  font-size:10px; color:var(--gold-bright); text-transform:uppercase; letter-spacing:0.1em;
  background:rgba(6,5,12,0.72); border:1px solid var(--gold); border-radius:6px;
  padding:4px 10px; text-shadow:0 1px 3px rgba(0,0,0,0.9);
}
.card-back.drawing .card-back-face{ animation: drawPulse 0.6s ease; }
@keyframes drawPulse{
  0%{ box-shadow:0 0 0 0 rgba(201,162,39,0.8); }
  100%{ box-shadow:0 0 0 40px rgba(201,162,39,0); }
}

/* ---------- draft screen ---------- */
.section-label{
  font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--gold); margin:0 0 10px 2px;
}
.draft-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
  gap:10px; margin-bottom:16px;
}

.card{
  position:relative; border-radius:10px; overflow:hidden; cursor:pointer;
  aspect-ratio:5/7; background:linear-gradient(160deg,#1c1832,#0d0b18);
  border:1.5px solid var(--line); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.card:active{ transform:scale(0.97); }
.card.selectable:hover{ border-color:var(--gold); }
.card.selected{
  border-color:var(--gold-bright);
  box-shadow:0 0 0 2px rgba(240,216,121,0.25), 0 0 18px rgba(240,216,121,0.35);
}
.card.disabled{ opacity:0.35; cursor:default; }
.card.inplay{ opacity:0.3; cursor:default; }

.card-glow{ position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.card-glow::before{ content:''; position:absolute; inset:0; background:inherit; opacity:0.55; }
.foe-icon{
  position:relative; z-index:1;
  font-size:clamp(28px, 46cqw, 64px); line-height:1;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.8));
}
.card-art{ position:absolute; inset:0; background-size:cover; background-position:center 15%; }
.card-art::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(6,5,12,0.75) 0%, rgba(6,5,12,0.05) 30%, rgba(6,5,12,0.05) 55%, rgba(6,5,12,0.85) 100%);
}
.card-inner{ position:absolute; inset:0; display:flex; flex-direction:column; }
.card-top{ flex:1; display:flex; align-items:flex-start; padding:clamp(8px,18cqw,16px) 7px 3px; }
.card-name{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(9px,13cqw,12px); line-height:1.2; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7); }
.card-role{ font-size:clamp(7px,9cqw,8.5px); color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,0.9); }
.hand-row.enemy .card-role{ display:none; }
.hand-row.enemy .stat-cluster{ width:clamp(32px,50cqw,52px); height:clamp(32px,50cqw,52px); }

.card{ container-type: inline-size; }

.level-stars{
  position:absolute; top:5px; left:6px; z-index:4;
  display:flex; gap:1px;
  font-size:clamp(6px, 7.5cqw, 9px); color:var(--gold-bright);
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}

.element-badge{
  position:absolute; bottom:4px; left:4px; z-index:6;
  width:clamp(14px,18cqw,20px); height:clamp(14px,18cqw,20px);
  border-radius:50%; background:rgba(4,3,9,0.75); border:1px solid rgba(255,255,255,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,11cqw,12px); line-height:1;
}

.info-btn{
  position:absolute; top:4px; right:4px; z-index:6;
  width:clamp(18px,22cqw,24px); height:clamp(18px,22cqw,24px);
  border-radius:50%; background:rgba(4,3,9,0.78); border:1px solid rgba(255,255,255,0.4);
  color:#fff; font-family:'Cinzel',serif; font-weight:700; font-style:italic;
  font-size:clamp(9px,12cqw,12px); display:flex; align-items:center; justify-content:center;
  cursor:pointer; line-height:1; padding:0; touch-action:manipulation;
}
.info-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

.special-btn{
  position:absolute; bottom:4px; right:4px; z-index:6;
  width:clamp(18px,22cqw,24px); height:clamp(18px,22cqw,24px);
  border-radius:50%; background:rgba(4,3,9,0.78); border:1px solid var(--arcane);
  color:var(--arcane); font-size:clamp(9px,12cqw,13px); display:flex; align-items:center; justify-content:center;
  cursor:pointer; line-height:1; padding:0; touch-action:manipulation;
  box-shadow:0 0 8px rgba(139,110,242,0.4);
}
.special-btn.locked{ opacity:0.35; border-color:rgba(255,255,255,0.3); color:var(--text-dim); box-shadow:none; cursor:default; }
.card.special-active{
  border-color:var(--arcane) !important;
  box-shadow:0 0 0 2px rgba(139,110,242,0.35), 0 0 18px rgba(139,110,242,0.55) !important;
}
.card.special-ready{
  animation:specialReadyPulse 2.6s ease-in-out infinite;
}
@keyframes specialReadyPulse{
  0%, 100%{
    border-color:rgba(139,110,242,0.55);
    box-shadow:0 0 0 1px rgba(139,110,242,0.22), 0 0 10px rgba(139,110,242,0.24);
    filter:brightness(1);
  }
  50%{
    border-color:var(--arcane);
    box-shadow:0 0 0 2px rgba(139,110,242,0.7), 0 0 26px rgba(139,110,242,0.7), 0 0 46px rgba(240,216,121,0.3);
    filter:brightness(1.14);
  }
}
.cell.special-target{
  cursor:pointer; border-color:rgba(196,72,46,0.65);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(196,72,46,0.6),
    0 0 20px rgba(196,72,46,0.55);
}
.cell.special-target::before{
  background:radial-gradient(circle at 50% 50%, rgba(196,72,46,0.45), transparent 65%);
  animation:cellPulseGold 1.2s ease-in-out infinite;
}

.wins-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:2px 0 10px; font-size:11px; color:var(--text-dim); letter-spacing:0.03em;
}
.wins-chip{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
}
.wins-chip.blue{ color:var(--blue-side); border-color:rgba(63,111,209,0.5); }
.wins-chip.red{ color:var(--red-side); border-color:rgba(184,69,46,0.5); }
.wins-chip b{ color:inherit; }

.stat-cluster{
  position:absolute; z-index:4; bottom:5px; left:50%; transform:translateX(-50%);
  width:clamp(38px, 50cqw, 62px); height:clamp(38px, 50cqw, 62px);
}
.stat-cluster::before{
  content:''; position:absolute; inset:-6%;
  background:radial-gradient(circle, rgba(4,3,9,0.72) 50%, transparent 78%);
}
.stat-n{
  position:absolute; width:34%; height:34%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-weight:700; color:#fff; line-height:1;
  font-size:clamp(11px, 15cqw, 19px);
  text-shadow:-1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 0 5px rgba(0,0,0,0.6);
}
.stat-n.n-top{ top:0; left:33%; }
.stat-n.n-left{ top:33%; left:0; }
.stat-n.n-right{ top:33%; right:0; }
.stat-n.n-bottom{ bottom:0; left:33%; }

.card-badge{
  position:absolute; top:5px; right:5px; font-family:'Cinzel',serif; font-size:9px;
  padding:2px 5px; border-radius:4px; border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.4); letter-spacing:0.06em;
}

.card.owner-blue{
  box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 14px rgba(63,111,209,0.65);
  border-color: var(--blue-side);
}
.card.owner-red{
  box-shadow:0 0 0 3px var(--red-side) inset, 0 0 14px rgba(184,69,46,0.65);
  border-color: var(--red-side);
}
.card.owner-blue .stat-cluster::before{ background:radial-gradient(circle, rgba(20,32,64,0.75) 50%, transparent 78%); }
.card.owner-red .stat-cluster::before{ background:radial-gradient(circle, rgba(64,24,16,0.75) 50%, transparent 78%); }

.card-back-mini{
  position:relative; width:100%; aspect-ratio:5/7; border-radius:9px; cursor:default;
  background-image:url('card-back.png');
  background-size:cover; background-position:center;
  border:1.5px solid rgba(201,162,39,0.45);
  box-shadow:inset 0 0 0 1px rgba(139,110,242,0.2), inset 0 2px 6px rgba(0,0,0,0.5);
  overflow:hidden;
}
.owner-tint{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:normal; }
.owner-tint.tint-blue{ background:rgba(58,104,204,0.22); }
.owner-tint.tint-red{ background:rgba(196,72,46,0.22); }

.count-row{ display:flex; align-items:center; justify-content:space-between; margin:4px 2px 18px; }
.count-row span{ font-size:13px; color:var(--text-dim); }
.count-row b{ color:var(--gold-bright); }

button.cta{
  width:100%; padding:13px; border-radius:9px; border:1px solid var(--gold);
  background:linear-gradient(180deg, rgba(201,162,39,0.22), rgba(201,162,39,0.06));
  color:var(--gold-bright); font-family:'Cinzel',serif; font-weight:700; font-size:13px;
  letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; transition:all .15s ease;
}
button.cta:disabled{ opacity:0.35; cursor:default; }
button.cta:not(:disabled):hover{ background:linear-gradient(180deg, rgba(201,162,39,0.32), rgba(201,162,39,0.1)); }

button.ghost{
  width:100%; padding:11px; margin-top:12px; border-radius:9px; border:1px solid var(--line);
  background:transparent; color:var(--text-dim); font-family:'Spectral',serif; font-size:13px; cursor:pointer;
}
button.ghost:hover{ border-color:var(--text-dim); color:var(--text); }

button.end-turn{
  width:100%; padding:11px; margin-top:10px; border-radius:9px; border:1px solid var(--arcane);
  background:linear-gradient(180deg, rgba(139,110,242,0.18), rgba(139,110,242,0.05));
  color:var(--arcane); font-family:'Cinzel',serif; font-weight:700; font-size:12px;
  letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:all .15s ease;
}
button.end-turn:hover{ background:linear-gradient(180deg, rgba(139,110,242,0.3), rgba(139,110,242,0.1)); color:#c3b3ff; }

/* ---------- battle screen ---------- */
.scoreboard{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:10px 16px; margin-bottom:14px;
}
.score-side{ display:flex; align-items:center; gap:6px; }
.score-flame{ width:30px; height:30px; object-fit:contain; display:block; animation:flameFlicker 2.6s ease-in-out infinite; }
.score-flame.blue{ filter:drop-shadow(0 0 6px var(--blue-side)) drop-shadow(0 0 12px rgba(63,111,209,0.5)); }
.score-flame.red{ filter:drop-shadow(0 0 6px var(--red-side)) drop-shadow(0 0 12px rgba(184,69,46,0.5)); }
.score-num{ font-family:'Cinzel',serif; font-size:20px; font-weight:700; }
.score-num.blue{ color:var(--blue-side); text-shadow:0 0 10px rgba(63,111,209,0.6); }
.score-num.red{ color:var(--red-side); text-shadow:0 0 10px rgba(184,69,46,0.6); }
.score-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }
.turn-indicator{ font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); text-align:center; }

.battle-row{ display:flex; gap:6px; align-items:flex-start; justify-content:center; }

.hand-row{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; width:64px; }
.hand-row .card{ width:100%; }
.hand-row.enemy .card{ width:100%; }
.hand-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin:0 0 8px 2px; }
.hand-label.side{ text-align:center; margin:0 0 4px; }

.hand-row.bottom{
  flex-direction:row; width:100%; flex:0 0 auto;
  gap:8px; margin-top:10px; padding:2px 2px 6px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.hand-row.bottom .card{ width:68px; flex:0 0 auto; }
.hand-row.bottom .hand-label{ display:none; }

.board{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  position:relative; z-index:1;
  flex:1 1 auto; max-width:520px;
}
.arena-frame{
  position:relative; flex:1 1 auto; max-width:520px;
  aspect-ratio:1086/1448;
  padding:26.7% 17% 24%;
  border-radius:4px;
  background-image:url('arena-bg.png');
  background-size:cover;

}

    linear-gradient(160deg, #2c2722, #16130f 72%);

    inset 0 2px 3px rgba(255,255,255,0.06),
    inset 0 -4px 8px rgba(0,0,0,0.6),

  transition:box-shadow .2s ease, border-color .2s ease;
}
.cell::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(94,200,242,0.14), transparent 65%);

}

.cell.targetable{
  cursor:pointer; border-color:rgba(201,162,39,0.6);

    inset 0 2px 3px rgba(255,255,255,0.08),
    inset 0 -4px 8px rgba(0,0,0,0.5),

.cell .card{ position:absolute; inset:0; width:100%; height:100%; cursor:default; }
.cell .card.placing{ animation: cardLand .48s cubic-bezier(.22,1.6,.4,1); }

.cell .card.flipping{ animation:flip .55s ease; }
.cell .card.owner-blue.flipping{ animation:flip .55s ease, captureRingBlue .55s ease; }

@keyframes flip{
  0%{ transform:rotateY(0deg) scale(1); filter:brightness(1);}
  45%{ transform:rotateY(90deg) scale(1.07); filter:brightness(1.7);}
  55%{ transform:rotateY(90deg) scale(1.07); filter:brightness(1.7);}
  100%{ transform:rotateY(0deg) scale(1); filter:brightness(1);}
}
@keyframes captureRingBlue{
  0%{ box-shadow:0 0 0 3px var(--blue-side) inset, 0 0 0 rgba(63,111,209,0); }

  100%{ box-shadow:0 0 0 3px var(--red-side) inset, 0 0 26px rgba(184,69,46,0); }

.card.shield-flash{ animation: shieldRing 0.9s ease; }

  0%{ box-shadow:0 0 0 0 rgba(201,162,39,0.9); }
  60%{ box-shadow:0 0 0 16px rgba(201,162,39,0); }
  100%{ box-shadow:0 0 0 0 rgba(201,162,39,0); }
}

@keyframes bonusRing{
  0%{ box-shadow:0 0 0 0 rgba(143,209,90,0.85); }
  60%{ box-shadow:0 0 0 14px rgba(143,209,90,0); }

.skill-pop{

.poster-name-plain{ font-family:'Cinzel',serif; font-weight:700; font-size:22px; color:var(--gold-bright); }

@media (max-width:640px){
  .wrap{ padding:8px 8px 10px; }

  .masthead.compact .sub{ font-size:8px; }
  .masthead.compact .sound-toggle,
  .masthead.compact .music-toggle{ width:18px; height:18px; font-size:9px; }

  .scoreboard{ padding:5px 12px; margin-bottom:5px; }
  .score-num{ font-size:15px; }
  .turn-indicator{ font-size:10px; }
  .score-flame{ width:22px; height:22px; }

  .battle-row{
    flex-direction:column;
    align-items:stretch;
    gap:4px;
  }

  .side-hand.hand-row{
    width:100%;
    flex-direction:row;
    gap:5px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:1px 1px 2px;
  }
  .side-hand.hand-row .card{
    width:44px;
    flex:0 0 auto;
  }
  .hand-label.side{
    text-align:left;
    margin:0 0 1px 2px;
    font-size:9px;
  }

  .arena-frame{
    max-width:none;
    width:100%;
    aspect-ratio:1086/1180;
    padding:9% 14% 11%;
  }
  .board{
    max-width:none;
    gap:3px;
  }

  .log{ margin:4px 0; font-size:12px; }
  button.ghost{ padding:7px; margin-top:4px; }
}

/* ---------- large desktop: same left / center / right layout, just
   moderately scaled up to use more of the available screen space. ---------- */
@media (min-width:900px){
  .stage{ max-width:1000px; }
  .wrap{ padding:22px 26px 30px; }

  .battle-row{ gap:16px; }

  .hand-row{ width:100px; gap:10px; }
  .hand-label.side{ font-size:12px; margin-bottom:6px; }

  .score-num{ font-size:21px; }
  .turn-indicator{ font-size:13px; }
  .score-flame{ width:44px; height:44px; }
}

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req) req.call(el);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
}

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt=>{
  document.addEventListener(evt, ()=>{
    isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    render();
  });
});
let musicStarted = false;
let actx = null;

function getBgm(){ return document.getElementById('bgm'); }

function tryStartMusic(){
  if(musicStarted || !musicOn) return;
  const bgm = getBgm();
  if(!bgm) return;
  bgm.volume = 0.35;
  bgm.play().then(()=>{ musicStarted = true; }).catch(()=>{ /* wait for a later gesture */ });
}

function toggleMusic(){
  musicOn = !musicOn;
  const bgm = getBgm();
  if(bgm){
    if(musicOn){ musicStarted = false; tryStartMusic(); }
    else { bgm.pause(); }
  }
  render();
}

function getCtx(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}

function tone({freq, start=0, dur=0.2, type='sine', gain=0.18, glideTo=null}){
  if(!soundOn) return;
  const ctx = getCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  const t0 = ctx.currentTime + start;
  osc.frequency.setValueAtTime(freq, t0);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

const SFX = {
  select(){ tone({ freq:720, dur:0.07, type:'triangle', gain:0.10 }); },
  deselect(){ tone({ freq:480, dur:0.07, type:'triangle', gain:0.08 }); },
  begin(){
    [440,660,880].forEach((f,i)=> tone({ freq:f, start:i*0.07, dur:0.22, type:'triangle', gain:0.14 }));
  },
  place(owner){
    const base = owner === 'blue' ? 150 : 120;
    tone({ freq:base, dur:0.16, type:'sine', gain:0.20, glideTo:base*0.7 });
    tone({ freq:base*2.2, start:0.01, dur:0.1, type:'triangle', gain:0.08 });
  },
  flip(n){
    const notes = [1046,1318,1568,1760];
    for(let i=0;i<n;i++){
      tone({ freq:notes[i % notes.length], start:i*0.08, dur:0.18, type:'sine', gain:0.14 });
    }
  },
  win(){
    [523,659,784,1046].forEach((f,i)=> tone({ freq:f, start:i*0.12, dur:0.4, type:'triangle', gain:0.16 }));
  },
  lose(){
    [392,349,294].forEach((f,i)=> tone({ freq:f, start:i*0.16, dur:0.45, type:'sine', gain:0.14 }));
  },
  draw(){
    [440,440].forEach((f,i)=> tone({ freq:f, start:i*0.18, dur:0.2, type:'sine', gain:0.12 }));
  },
  shield(){
    tone({ freq:660, dur:0.22, type:'triangle', gain:0.16 });
    tone({ freq:990, start:0.05, dur:0.28, type:'sine', gain:0.13 });
    tone({ freq:220, start:0, dur:0.3, type:'sine', gain:0.10 });
  },
  bonus(){
    [880,1174,1568].forEach((f,i)=> tone({ freq:f, start:i*0.05, dur:0.16, type:'triangle', gain:0.11 }));
  },
};

      <div class="card-inner">

        <div class="stat-n n-bottom">${num(card.bottom)}</div>
      </div>
    </div>`;
}

/* ---------------- interaction ---------------- */
function attachHandlers(){
  const soundBtn = document.getElementById('sound-toggle');
  if(soundBtn) soundBtn.addEventListener('click', toggleSound);
  const musicBtn = document.getElementById('music-toggle');
  if(musicBtn) musicBtn.addEventListener('click', toggleMusic);
  const fsBtn = document.getElementById('fullscreen-toggle');
  if(fsBtn) fsBtn.addEventListener('click', toggleFullscreen);

  document.querySelectorAll('.info-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openCardModal(btn.dataset.info);
    });
  });

  // The ⚡ badge only ever renders locked (not enough wins yet) — once a
  // special is affordable, the whole card pulses and becomes the tap
  // target instead (see the .cell handler below), so this is just a
  // non-interactive tooltip anchor.
  document.querySelectorAll('.special-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=> e.stopPropagation());
  });

  const overlay = document.getElementById('modal-overlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{
      if(e.target.id === 'modal-overlay') closeCardModal();
    });
  }
  const modalClose = document.getElementById('modal-close');
  if(modalClose) modalClose.addEventListener('click', closeCardModal);

  if(state.phase === 'draft'){
    const modeRandom = document.getElementById('mode-random');
    if(modeRandom) modeRandom.addEventListener('click', ()=>{
      if(state.draftMode === 'random') return;
      state.draftMode = 'random';
      SFX.select();
      render();
    });
    const modeManual = document.getElementById('mode-manual');
    if(modeManual) modeManual.addEventListener('click', ()=>{
      if(state.draftMode === 'manual') return;
      state.draftMode = 'manual';
      SFX.select();
      render();
    });

    const drawPile = document.getElementById('draw-pile-btn');
    if(drawPile && !drawPile.classList.contains('disabled')){
      drawPile.addEventListener('click', ()=>{
        SFX.begin();
        state.revealing = true;
        render();
        setTimeout(()=>{ drawRandomFive(); }, 450);
      });
    }

    if(state.draftMode === 'manual'){
      document.querySelectorAll('.draft-grid .card').forEach(el=>{
        el.addEventListener('click', ()=>{
          const id = el.dataset.cardid;
          const idx = state.selected.indexOf(id);
          if(idx >= 0){ state.selected.splice(idx,1); SFX.deselect(); }
          else if(state.selected.length < 5){ state.selected.push(id); SFX.select(); }
          render();
        });
      });
      const beginManual = document.getElementById('begin-btn-manual');
      if(beginManual) beginManual.addEventListener('click', ()=>{ SFX.begin(); startBattle(); });
    }

    const sameBox = document.getElementById('rule-same');
    if(sameBox) sameBox.addEventListener('change', ()=>{
      state.rules.same = sameBox.checked;
      if(!state.rules.same && !state.rules.plus) state.rules.combo = false;
      render();
    });
    const plusBox = document.getElementById('rule-plus');
    if(plusBox) plusBox.addEventListener('change', ()=>{
      state.rules.plus = plusBox.checked;
      if(!state.rules.same && !state.rules.plus) state.rules.combo = false;
      render();
    });
    const comboBox = document.getElementById('rule-combo');
    if(comboBox) comboBox.addEventListener('change', ()=>{
      state.rules.combo = comboBox.checked;
      render();
    });
    const elementalBox = document.getElementById('rule-elemental');
    if(elementalBox) elementalBox.addEventListener('change', ()=>{
      state.rules.elemental = elementalBox.checked;
      render();
    });
  } else {
    document.querySelectorAll('.hand-row:not(.enemy) .card').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(state.turn!=='blue' || state.phase!=='battle' || state.placedThisTurn) return;
        const id = el.dataset.cardid;
        const opening = state.pendingCard !== id;
        state.pendingCard = opening ? id : null;
        state.specialMode = null;
        opening ? SFX.select() : SFX.deselect();
        render();
      });
    });
    document.querySelectorAll('.cell').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = parseInt(el.dataset.cell,10);
        if(state.specialMode){
          resolveSpecialTarget(i);
          return;
        }
        // A pulsing (ready-special) card is a tap target in its own right —
        // tap it to activate, tap it again to cancel while targeting.
        const entry = state.board[i];
        if(entry && entry.owner==='blue' && entry.card.special){
          const key = 'blue:' + entry.card.id;
          const used = entry.card.special.once && state.specialUsed[key];
          const ready = !used && state.turn==='blue' && state.phase==='battle' && state.wins.blue >= entry.card.special.cost;
          if(ready){ executeSpecial(i); return; }
        }
        if(state.turn!=='blue' || state.phase!=='battle' || !state.pendingCard || state.placedThisTurn) return;
        if(state.board[i]) return;
        placeCard(i, state.pendingCard, 'blue');
      });
    });
    const endTurnBtn = document.getElementById('end-turn-btn');
    if(endTurnBtn) endTurnBtn.addEventListener('click', endPlayerTurn);
    const rematch = document.getElementById('rematch-btn');
    if(rematch) rematch.addEventListener('click', resetGame);
    const concede = document.getElementById('concede-btn');
    if(concede) concede.addEventListener('click', resetGame);
  }
}

function drawRandomFive(){
  if(HEROES.length === 0) return;
  const pool = shuffle(HEROES.slice());
  state.selected = pool.slice(0, Math.min(5, pool.length)).map(h => h.id);
  startBattle();
}

function startBattle(){
  const chosenHeroes = HEROES.filter(h => state.selected.includes(h.id));
  state.playerHand = shuffle(chosenHeroes.slice());
  state.enemyHand = drawEnemyHand();
  state.board = Array(9).fill(null);
  state.pendingCard = null;
  state.log = 'Place a champion to claim the first square.';

  const startingTurn = Math.random() < 0.5 ? 'blue' : 'red';
  state.turn = startingTurn;
  state.coinTurn = startingTurn;
  state.placedThisTurn = false;
  state.phase = 'coinflip';
  render();

  setTimeout(()=>{
    state.phase = 'battle';
    render();
    if(state.turn === 'red'){ setTimeout(enemyTurn, 700); }
  }, 2700);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const ELEMENT_BEATS = { fire:'wind', wind:'earth', earth:'water', water:'fire' };
const ELEMENT_ICONS = { fire:'🔥', wind:'🌪️', earth:'🌍', water:'💧' };
function elementBeats(a, b){ return a && b && ELEMENT_BEATS[a] === b; }

function effectiveValue(card, edgeKey, opponentCard){
  let v = card[edgeKey];
  const a = card.active;
  if(a){
    if(a.bonus && a.bonus.dir === edgeKey) v += a.bonus.amount;
    if(a.underdogBonus && opponentCard){
      const mySum = card.top + card.right + card.bottom + card.left;
      const oppSum = opponentCard.top + opponentCard.right + opponentCard.bottom + opponentCard.left;
      if(mySum < oppSum) v += a.underdogBonus;
    }
  }
  if(state.rules.elemental && opponentCard && elementBeats(card.element, opponentCard.element)){
    v += 1;
  }
  return v;
}

/* ---------------- Rivalry Pairs ---------------- */
// Lore-linked champions that reward standing side by side.
const RIVALRY_PAIRS = [
  ['darien', 'elara'],       // The Shadowarden & the Light's Grace
  ['ragnar', 'naline'],      // Order of the Radiance
  ['naline', 'deathblade'],  // Order of the Radiance
  ['pallis', 'pallispell'],  // Reunited with Pell's pack
];

function isRivalryPair(idA, idB){
  return RIVALRY_PAIRS.some(([a,b]) => (a===idA && b===idB) || (a===idB && b===idA));
}

function rivalryBonusAt(cardId, cellIndex, owner){
  const row = Math.floor(cellIndex/3), col = cellIndex%3;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  let bonus = 0;
  dirs.forEach(([dr,dc])=>{
    const r = row+dr, c = col+dc;
    if(r<0||r>2||c<0||c>2) return;
    const n = state.board[r*3+c];
    if(n && n.owner === owner && isRivalryPair(cardId, n.card.id)) bonus += 1;
  });
  return bonus;
}

/* ---------------- Last Stand Scaling ---------------- */
// The fewer champions left in your hand, the fiercer the ones still fighting.
function lastStandBonus(owner){
  const hand = owner === 'blue' ? state.playerHand : state.enemyHand;
  const remaining = hand.length;
  if(remaining === 0) return 2;
  if(remaining === 1) return 1;
  return 0;
}

function fullEffectiveValue(card, edgeKey, opponentCard, cellIndex, owner, role){
  let v = effectiveValue(card, edgeKey, opponentCard);
  v += rivalryBonusAt(card.id, cellIndex, owner);
  v += lastStandBonus(owner);
  const entry = state.board[cellIndex];
  if(entry && entry.captureBonus) v += entry.captureBonus;
  if(card.active && card.active.pairPresence){
    const pp = card.active.pairPresence;
    const present = state.board.some(e => e && e.owner === owner && e.card.id === pp.partner);
    if(present){
      if(typeof pp.amount === 'number') v += pp.amount;
      else if(role === 'attack' && typeof pp.attack === 'number') v += pp.attack;
      else if(role === 'defense' && typeof pp.defense === 'number') v += pp.defense;
    }
  }
  return v;
}

function isShielded(targetEntry, targetIndex){
  if(targetEntry.grantedShield && !targetEntry.shieldUsed) return true;
  const a = targetEntry.card.active;
  if(!a) return false;
  if(a.shield && !targetEntry.shieldUsed) return true;
  if(a.conditionalShield === 'adjacentAllies2'){
    const row = Math.floor(targetIndex/3), col = targetIndex%3;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let count = 0;
    dirs.forEach(([dr,dc])=>{
      const r = row+dr, c = col+dc;
      if(r<0||r>2||c<0||c>2) return;
      const n = state.board[r*3+c];
      if(n && n.owner === targetEntry.owner) count++;
    });
    if(count >= 2) return true;
  }
  return false;
}

function placeCard(cellIndex, cardId, owner){
  const hand = owner === 'blue' ? state.playerHand : state.enemyHand;
  const cardIdx = hand.findIndex(c => c.id === cardId);
  if(cardIdx === -1) return;
  const card = hand[cardIdx];

  state.board[cellIndex] = { card, owner, shieldUsed:false, grantedShield:false, captureBonus:0, justPlaced:true };
  hand.splice(cardIdx,1);
  state.pendingCard = null;

  SFX.place(owner);
  const result = resolveFlips(cellIndex, owner);
  const flips = result.flips, shielded = result.shielded, bonusTriggered = result.bonusTriggered;
  const sameOrPlus = result.sameOrPlus, combo = result.combo;
  if(flips > 0) state.wins[owner] += flips;
  if(flips > 0) setTimeout(()=> SFX.flip(flips), 120);
  if(shielded > 0) setTimeout(()=> SFX.shield(), 90);
  if(bonusTriggered) setTimeout(()=> SFX.bonus(), shielded > 0 ? 260 : 90);

  let ruleTag = '';
  if(sameOrPlus > 0 && combo > 0) ruleTag = ` (Same/Plus + Combo x${combo}!)`;
  else if(sameOrPlus > 0) ruleTag = ' (Same/Plus!)';

  if(flips > 0 && shielded > 0){
    state.log = `${card.name} claims ${flips} square${flips>1?'s':''} — ${shielded} shield${shielded>1?'s':''} held!${ruleTag}`;
  } else if(flips > 0){
    state.log = `${card.name} claims ${flips} enemy square${flips>1?'s':''}!${ruleTag}`;
  } else if(shielded > 0){
    state.log = `${card.name} attacks, but ${shielded} shield${shielded>1?'s':''} held firm!`;
  } else {
    state.log = `${card.name} takes the field.`;
  }

  render();

  setTimeout(()=>{
    const placed = state.board[cellIndex];
    if(placed){ placed.justPlaced = false; render(); }
  }, 500);

  if(shielded > 0 || bonusTriggered){
    setTimeout(()=>{
      state.board.forEach(entry=>{
        if(entry){ entry.shieldFlash = false; entry.bonusFlash = false; }
      });
      render();
    }, 950);
  }

  state.placedThisTurn = true;
  maybeEndTurn(owner);
}

// Passes the turn to the other side — unless a special attack just granted
// an extra turn to `owner`, in which case they act again (with a fresh
// placement too) instead.
function advanceTurn(owner){
  // Normally the board fills up exactly when both hands are spent. But
  // Lyrith's crit can destroy a card and re-open a cell — if that leaves a
  // hole neither side can fill any more (both hands empty), end the match
  // instead of passing an unplayable turn back and forth forever.
  if(boardFull() || (state.playerHand.length === 0 && state.enemyHand.length === 0)){
    setTimeout(finishGame, 500);
    return;
  }
  if(state.extraTurnPending === owner){
    state.extraTurnPending = null;
    state.placedThisTurn = false;
    render();
    if(owner === 'red'){ setTimeout(enemyTurn, 700); }
    return;
  }
  state.placedThisTurn = false;
  state.turn = owner === 'blue' ? 'red' : 'blue';
  render();

  if(state.turn === 'red'){
    setTimeout(enemyTurn, 700);
  }
}

// A side's turn only truly ends once they have nothing left they could still
// do: they've already placed (or have no hand card to place) AND none of
// their in-play cards has an affordable, unused special ready. This is what
// lets a special be used before OR after that turn's placement — e.g. place
// Graff, then immediately fire Shadow Assault, all in the same turn — while
// still auto-advancing the turn the instant there's truly nothing left,
// exactly like before, for the common case where no special is in play.
function hasFurtherAction(owner){
  const hand = owner === 'blue' ? state.playerHand : state.enemyHand;
  if(!state.placedThisTurn && hand.length > 0) return true;
  return state.board.some(e => {
    if(!e || e.owner !== owner || !e.card.special) return false;
    const key = owner + ':' + e.card.id;
    if(e.card.special.once && state.specialUsed[key]) return false;
    return state.wins[owner] >= e.card.special.cost;
  });
}

function maybeEndTurn(owner){
  if(hasFurtherAction(owner)){
    render();
    return;
  }
  advanceTurn(owner);
}

// Explicit escape hatch for the human player: pass even though a special
// is still ready (they'd rather save it) or even before placing at all.
function endPlayerTurn(){
  if(state.turn !== 'blue' || state.phase !== 'battle') return;
  state.specialMode = null;
  state.pendingCard = null;
  advanceTurn('blue');
}

/* ---------------- special attacks (additive layer) ----------------
   Deliberately kept separate from the base flip engine above: activating
   a special never runs through placeCard/resolveFlips/battleNeighbors,
   it only reads/writes a handful of extra state fields (wins, captureBonus,
   grantedShield, board occupancy) that the base engine already understands.
   Most future ultimates should fit the small verb library below; only a
   signature few need a fully bespoke handler. */
const SpecialVerbs = {
  attackBoost(entry, amount){ entry.captureBonus += amount; },
  grantShield(entry){ entry.grantedShield = true; },
  stealPower(sourceEntry, targetEntry, amount){
    targetEntry.captureBonus -= amount;
    sourceEntry.captureBonus += amount;
  },
  extraTurn(owner){ state.extraTurnPending = owner; },
};

function totalPower(entry){
  const c = entry.card;
  return c.top + c.right + c.bottom + c.left + (entry.captureBonus || 0) * 4;
}

function rollCrit(chance){ return Math.random() < chance; }

// One handler per signature ultimate, keyed by card id. Each returns the
// battle-log line to show. Handlers receive { srcEntry, sourceIndex,
// targetEntry, targetIndex, owner } — targetEntry/targetIndex are null
// for area-effect specials (targets:'aoe').
// Shared shield check for specials that DON'T explicitly pierce defenses:
// blocks the flip and consumes the shield, same as a normal battle would.
function specialBlockedByShield(targetEntry, targetIndex){
  if(!isShielded(targetEntry, targetIndex)) return false;
  targetEntry.shieldUsed = true;
  targetEntry.shieldFlash = true;
  return true;
}

const SPECIAL_HANDLERS = {
  graff({ srcEntry, targetEntry, targetIndex, owner }){
    if(totalPower(srcEntry) <= totalPower(targetEntry)){
      return `${srcEntry.card.name}'s Shadow Assault is repelled!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Shadow Assault!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.attackBoost(srcEntry, 3);
    return `${srcEntry.card.name}'s Shadow Assault flips ${targetEntry.card.name} and surges with power!`;
  },
  lyrith({ srcEntry, targetEntry, targetIndex, owner }){
    // Serpent's Wrath explicitly ignores the enemy's defensive skills — no shield check here.
    if(totalPower(srcEntry) <= totalPower(targetEntry)){
      return `${srcEntry.card.name}'s Serpent's Wrath fails to pierce the enemy's guard!`;
    }
    if(rollCrit(0.25)){
      state.board[targetIndex] = null;
      return `${srcEntry.card.name} lands a critical strike — ${targetEntry.card.name} is destroyed!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.attackBoost(srcEntry, 4);
    return `${srcEntry.card.name}'s Serpent's Wrath flips ${targetEntry.card.name}, ignoring its defenses!`;
  },
  aurelia({ srcEntry, targetEntry, targetIndex, owner }){
    if(totalPower(srcEntry) <= totalPower(targetEntry)){
      return `${srcEntry.card.name}'s Dawn's Reckoning is turned aside!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Dawn's Reckoning!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    if(rollCrit(0.25)){
      targetEntry.captureBonus -= 20; // wipes the card's sides to effectively nothing
      return `${srcEntry.card.name} lands a critical strike — ${targetEntry.card.name}'s power is wiped out!`;
    }
    SpecialVerbs.attackBoost(srcEntry, 4);
    return `${srcEntry.card.name}'s Dawn's Reckoning flips ${targetEntry.card.name}!`;
  },
  medusa({ srcEntry, owner }){
    const enemies = state.board.filter(e => e && e.owner !== owner);
    enemies.forEach(e => SpecialVerbs.stealPower(srcEntry, e, 1));
    SpecialVerbs.attackBoost(srcEntry, 2);
    const mine = state.board.filter(e => e && e.owner === owner).length;
    if(mine > enemies.length) SpecialVerbs.extraTurn(owner);
    return `${srcEntry.card.name}'s Gaze of Medusa withers every foe on the board!`;
  },
  maximus({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4 <= targetPower){
      return `${srcEntry.card.name}'s Axe of Dominion is blocked!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Axe of Dominion!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.attackBoost(srcEntry, 2);
    if(targetPower > basePower) SpecialVerbs.extraTurn(owner);
    return `${srcEntry.card.name}'s Axe of Dominion crushes ${targetEntry.card.name}!`;
  },
  twistedgipsy({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 3 <= targetPower){
      return `${srcEntry.card.name}'s House of Shadows finds no opening!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against House of Shadows!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.stealPower(srcEntry, targetEntry, 2);
    SpecialVerbs.attackBoost(srcEntry, 1);
    return `${srcEntry.card.name}'s House of Shadows steals ${targetEntry.card.name}'s fortune!`;
  },
  darum({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4 <= targetPower){
      return `${srcEntry.card.name}'s Gate of Dominion is thrown back!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Gate of Dominion!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.attackBoost(srcEntry, 2);
    return `${srcEntry.card.name}'s Gate of Dominion crushes ${targetEntry.card.name}!`;
  },
  daron({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 4 <= targetPower){
      return `${srcEntry.card.name}'s Shattered Crown fails to break through!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Shattered Crown!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.stealPower(srcEntry, targetEntry, 2);
    return `${srcEntry.card.name}'s Shattered Crown steals ${targetEntry.card.name}'s power!`;
  },
  ifrit({ srcEntry, targetEntry, targetIndex, owner }){
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 3 <= targetPower){
      return `${srcEntry.card.name}'s Hellfire fizzles out!`;
    }
    if(specialBlockedByShield(targetEntry, targetIndex)){
      return `${targetEntry.card.name}'s shield holds against Hellfire!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.attackBoost(srcEntry, 1);
    return `${srcEntry.card.name}'s Hellfire engulfs ${targetEntry.card.name}!`;
  },
  bahamut({ srcEntry, targetEntry, owner }){
    // Megaflare explicitly overrides the enemy's defensive skills — no shield check.
    const basePower = totalPower(srcEntry);
    const targetPower = totalPower(targetEntry);
    if(basePower + 3 <= targetPower){
      return `${srcEntry.card.name}'s Megaflare dissipates harmlessly!`;
    }
    targetEntry.owner = owner;
    targetEntry.justFlipped = true;
    SpecialVerbs.attackBoost(srcEntry, 1);
    return `${srcEntry.card.name}'s Megaflare overwhelms ${targetEntry.card.name}, defenses and all!`;
  },
};

function executeSpecial(sourceIndex){
  if(state.phase !== 'battle') return;
  const srcEntry = state.board[sourceIndex];
  if(!srcEntry || srcEntry.owner !== state.turn) return;
  const special = srcEntry.card.special;
  if(!special) return;
  const key = srcEntry.owner + ':' + srcEntry.card.id;
  if(special.once && state.specialUsed[key]) return;
  if(state.wins[srcEntry.owner] < special.cost) return;

  state.pendingCard = null;

  if(special.targets === 'aoe'){
    runSpecialResolution(sourceIndex, null);
  } else {
    state.specialMode = { sourceIndex };
    SFX.select();
    render();
  }
}

function resolveSpecialTarget(targetIndex){
  const mode = state.specialMode;
  if(!mode) return;
  const srcEntry = state.board[mode.sourceIndex];
  const targetEntry = state.board[targetIndex];
  if(!srcEntry || !targetEntry || targetEntry.owner === srcEntry.owner){
    cancelSpecial();
    return;
  }
  runSpecialResolution(mode.sourceIndex, targetIndex);
}

function cancelSpecial(){
  state.specialMode = null;
  render();
}

function runSpecialResolution(sourceIndex, targetIndex){
  const srcEntry = state.board[sourceIndex];
  const special = srcEntry.card.special;
  const owner = srcEntry.owner;
  const handler = SPECIAL_HANDLERS[srcEntry.card.id];
  if(!handler) return;

  state.wins[owner] -= special.cost;
  if(special.once) state.specialUsed[owner + ':' + srcEntry.card.id] = true;
  state.specialMode = null;

  const targetEntry = targetIndex != null ? state.board[targetIndex] : null;
  state.log = handler({ srcEntry, sourceIndex, targetEntry, targetIndex, owner });

  SFX.bonus();
  render();

  maybeEndTurn(owner);
}

const NEIGHBOR_DIRS = [
  { dr:-1, dc:0, myEdge:'top',    theirEdge:'bottom' },
  { dr:1,  dc:0, myEdge:'bottom', theirEdge:'top' },
  { dr:0,  dc:-1,myEdge:'left',   theirEdge:'right' },
  { dr:0,  dc:1, myEdge:'right',  theirEdge:'left' },
];

function getEnemyNeighbors(index, owner){
  const row = Math.floor(index/3), col = index%3;
  const card = state.board[index].card;
  const present = [];
  NEIGHBOR_DIRS.forEach(n=>{
    const r = row+n.dr, c = col+n.dc;
    if(r<0||r>2||c<0||c>2) return;
    const ni = r*3+c;
    const target = state.board[ni];
    if(!target || target.owner === owner) return;
    present.push({ ni, myEdge:n.myEdge, theirEdge:n.theirEdge, myVal:card[n.myEdge], theirVal:target.card[n.theirEdge] });
  });
  return present;
}

function computeSamePlusCaptures(index, owner){
  const present = getEnemyNeighbors(index, owner);
  const captured = new Set();

  if(state.rules.same){
    const matches = present.filter(p => p.myVal === p.theirVal);
    if(matches.length >= 2) matches.forEach(m => captured.add(m.ni));
  }

  if(state.rules.plus){
    for(let i=0; i<present.length; i++){
      for(let j=i+1; j<present.length; j++){
        const sumA = present[i].myVal + present[i].theirVal;
        const sumB = present[j].myVal + present[j].theirVal;
        if(sumA === sumB){
          captured.add(present[i].ni);
          captured.add(present[j].ni);
        }
      }
    }
  }

  return captured;
}

function battleNeighbors(index, owner, result){
  const present = getEnemyNeighbors(index, owner);
  const placedEntry = state.board[index];
  const placed = placedEntry.card;
  const newlyFlipped = [];

  present.forEach(p=>{
    const target = state.board[p.ni];
    if(!target || target.owner === owner) return; // may have been captured already by Same/Plus

    const placedVal = fullEffectiveValue(placed, p.myEdge, target.card, index, owner, 'attack');
    const targetVal = fullEffectiveValue(target.card, p.theirEdge, placed, p.ni, target.owner, 'defense');
    const effOutcome = placedVal > targetVal;
    const baseOutcome = p.myVal > p.theirVal;

    if(effOutcome !== baseOutcome){
      result.bonusTriggered = true;
      if(placedVal !== p.myVal){ placedEntry.bonusFlash = true; placedEntry.bonusAmount = placedVal - p.myVal; }
      if(targetVal !== p.theirVal){ target.bonusFlash = true; target.bonusAmount = targetVal - p.theirVal; }
    }

    if(effOutcome){
      if(isShielded(target, p.ni)){
        if(target.card.active && target.card.active.shield) target.shieldUsed = true;
        target.shieldFlash = true;
        result.shielded++;
        return;
      }
      target.owner = owner;
      target.justFlipped = true;
      result.flips++;
      newlyFlipped.push(p.ni);
    }
  });

  return newlyFlipped;
}

function resolveFlips(index, owner){
  const placedEntry = state.board[index];
  const placed = placedEntry.card;
  const result = { flips:0, shielded:0, bonusTriggered:false, sameOrPlus:0, combo:0 };

  let samePlusSeeds = [];
  if(state.rules.same || state.rules.plus){
    const captured = computeSamePlusCaptures(index, owner);
    captured.forEach(ni=>{
      const target = state.board[ni];
      target.owner = owner;
      target.justFlipped = true;
      result.flips++;
      result.sameOrPlus++;
      samePlusSeeds.push(ni);
    });
  }

  battleNeighbors(index, owner, result);

  if(state.rules.combo && samePlusSeeds.length > 0){
    const visited = new Set([index]);
    let queue = samePlusSeeds.slice();
    while(queue.length){
      const idx = queue.shift();
      if(visited.has(idx)) continue;
      visited.add(idx);
      const chained = battleNeighbors(idx, owner, result);
      const chainedCard = state.board[idx].card;
      if(chained.length > 0 && chainedCard.active && chainedCard.active.onCaptureBonus){
        state.board[idx].captureBonus += chainedCard.active.onCaptureBonus;
      }
      chained.forEach(ni=>{ result.combo++; queue.push(ni); });
    }
  }

  if(result.flips > 0 && placed.active && placed.active.onCaptureBonus){
    placedEntry.captureBonus += placed.active.onCaptureBonus;
  }

  return result;
}

function boardFull(){
  return state.board.every(c => c !== null);
}

// Lets the Forest AI spend a turn on an affordable, unused special attack
// instead of placing a card, whenever it can identify a target it would
// actually win against (or, for AoE specials, whenever there's any enemy
// on the board to hit). Mirrors the human flow (executeSpecial then
// resolveSpecialTarget) so it goes through the exact same resolution and
// turn-advance code — no separate AI-only path. Returns true if it acted.
function enemyTryUseSpecial(){
  if(state.turn !== 'red' || state.phase !== 'battle') return false;
  const candidates = [];
  state.board.forEach((entry, i) => {
    if(!entry || entry.owner !== 'red') return;
    const special = entry.card.special;
    if(!special) return;
    const key = 'red:' + entry.card.id;
    if(special.once && state.specialUsed[key]) return;
    if(state.wins.red < special.cost) return;
    candidates.push({ sourceIndex:i, entry, special });
  });

  for(const c of candidates){
    if(c.special.targets === 'aoe'){
      const hasEnemy = state.board.some(e => e && e.owner === 'blue');
      if(!hasEnemy) continue;
      executeSpecial(c.sourceIndex);
      return true;
    }

    let bestTarget = null, bestPower = -1;
    state.board.forEach((target, ti) => {
      if(!target || target.owner !== 'blue') return;
      if(isShielded(target, ti)) return; // don't waste a once-per-match special on a known block
      if(totalPower(c.entry) > totalPower(target) && totalPower(target) > bestPower){
        bestPower = totalPower(target);
        bestTarget = ti;
      }
    });
    if(bestTarget != null){
      executeSpecial(c.sourceIndex);
      resolveSpecialTarget(bestTarget);
      return true;
    }
  }
  return false;
}

function enemyTurn(){
  if(state.phase !== 'battle' || state.turn !== 'red') return;

  // Fire off anything it can before placing (mirrors a human choosing to
  // special first), then place its best card, then mop up anything that
  // just became affordable/available (e.g. the newly-placed card's own
  // special). Every enemyTryUseSpecial() call already runs the placement
  // through the same maybeEndTurn() logic as the player, so this loop
  // naturally stops the moment red's turn actually ends.
  while(enemyTryUseSpecial()){}

  if(state.turn === 'red' && !state.placedThisTurn){
    const hand = state.enemyHand;
    const emptyCells = state.board.map((c,i)=>c?null:i).filter(i=>i!==null);
    if(hand.length > 0 && emptyCells.length > 0){
      let best = { score:-1, cellIndex: emptyCells[0], cardIdx:0 };
      hand.forEach((card, ci)=>{
        emptyCells.forEach(cellIndex=>{
          const score = simulateFlips(cellIndex, card, 'red');
          if(score > best.score) best = { score, cellIndex, cardIdx: ci };
        });
      });
      const card = hand[best.cardIdx];
      placeCard(best.cellIndex, card.id, 'red');
      while(enemyTryUseSpecial()){}
    }
  }

  // Safety net: if the AI has genuinely run out of anything to do (or chose
  // not to place), make sure its turn actually concludes rather than
  // leaving state.turn stuck on 'red' with nothing left to trigger it.
  if(state.turn === 'red') advanceTurn('red');
}

function simulateFlips(index, card, owner){
  const row = Math.floor(index/3), col = index%3;
  let score = 0;
  const neighbors = [
    { dr:-1, dc:0, myEdge:'top',    theirEdge:'bottom' },
    { dr:1,  dc:0, myEdge:'bottom', theirEdge:'top' },
    { dr:0,  dc:-1,myEdge:'left',   theirEdge:'right' },
    { dr:0,  dc:1, myEdge:'right',  theirEdge:'left' },
  ];
  neighbors.forEach(n=>{
    const r = row+n.dr, c = col+n.dc;
    if(r<0||r>2||c<0||c>2) return;
    const ni = r*3+c;
    const target = state.board[ni];
    if(!target || target.owner === owner) return;
    const myVal = fullEffectiveValue(card, n.myEdge, target.card, index, owner, 'attack');
    const theirVal = fullEffectiveValue(target.card, n.theirEdge, card, ni, target.owner, 'defense');
    if(myVal > theirVal){
      score += isShielded(target, ni) ? 0.25 : 1;
    }
  });
  return score;
}

function finishGame(){
  const blueCount = state.board.filter(c => c && c.owner === 'blue').length;
  const redCount = state.board.filter(c => c && c.owner === 'red').length;
  state.winner = blueCount > redCount ? 'blue' : redCount > blueCount ? 'red' : 'draw';
  state.phase = 'result';
  if(state.winner === 'blue') SFX.win();
  else if(state.winner === 'red') SFX.lose();
  else SFX.draw();
  render();
}

function resetGame(){
  const keepRules = state.rules;
  const keepMode = state.draftMode || 'random';
  state = {
    phase:'draft', selected:[], board: Array(9).fill(null),
    playerHand:[], enemyHand:[], turn:'blue', pendingCard:null,
    log:'Choose the five champions who will carry your banner.', winner:null,
    viewingCard:null, rules: keepRules, draftMode: keepMode, revealing: false,
    wins: { blue: 0, red: 0 }, specialUsed: {}, specialMode: null, extraTurnPending: null, placedThisTurn: false,
  };
  render();
}

render();
loadTesterCount();

document.addEventListener('click', tryStartMusic, { once: true });
document.addEventListener('touchstart', tryStartMusic, { once: true });
</script>
</body>
